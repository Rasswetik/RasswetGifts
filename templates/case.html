<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Кейс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/static/js/telegram-auth.js"></script>
<style>
:root{--bg:#171c25;--panel:#1d2430;--panel2:#222b38;--text:#fff;--muted:#8994a7;--blue:#3e91f4;--line:rgba(255,255,255,.07)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent}body{padding-bottom:92px}.page{width:min(100%,520px);margin:auto;padding:0 14px 28px}.top{height:62px;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px}.back{width:40px;height:40px;border:0;border-radius:14px;background:#252d39;color:#fff;display:grid;place-items:center}.back svg{width:21px}.brand{text-align:center;font-size:16px;font-weight:900}.balance{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:900}.balance img{width:18px;height:18px}.hero{text-align:center;padding:10px 0 8px}.case-img{width:min(82vw,350px);height:min(70vw,300px);object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}.title{font-size:25px;font-weight:950;margin-top:2px}.price{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:950}.price img{width:20px;height:20px}.desc{margin:8px auto 0;color:var(--muted);font-size:12px;line-height:1.45;max-width:400px}.roulette{position:relative;overflow:hidden;margin:16px -14px 14px;padding:12px 0;background:#141922;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:128px}.track{display:flex;gap:8px;width:max-content;transform:translateX(0)}.roulette:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--blue);box-shadow:0 0 15px rgba(62,145,244,.7);z-index:3}.ri{width:108px;height:104px;flex:0 0 108px;border-radius:15px;background:#202735;border:1px solid var(--line);position:relative;display:grid;place-items:center}.ri img{width:76px;height:76px;object-fit:contain}.ri .rprice{position:absolute;top:5px;left:6px;right:6px;font-size:10px;font-weight:800;color:#cbd5e1;text-align:center}.controls{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}.qty{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.qty button{height:42px;border:0;border-radius:12px;background:#283240;color:#aeb8c8;font-weight:900}.qty button.active{background:rgba(62,145,244,.18);color:#63a6ff;box-shadow:inset 0 0 0 1px rgba(62,145,244,.2)}.open{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#3e91f4,#2c79d6);color:#fff;font-size:16px;font-weight:950;box-shadow:0 10px 25px rgba(62,145,244,.22)}.open:disabled{opacity:.55}.contents-title{font-size:15px;font-weight:950;margin:22px 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.gift{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:8px;text-align:center;min-width:0}.gift .gn{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift img{width:76px;height:76px;object-fit:contain}.gift .gp{font-size:11px;font-weight:900}.win{display:none;text-align:center;padding:18px 10px;background:var(--panel);border-radius:18px;border:1px solid rgba(62,145,244,.25);margin:12px 0}.win.show{display:block}.win img{width:130px;height:130px;object-fit:contain}.win-name{font-size:17px;font-weight:950}.bottom-nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;width:min(calc(100% - 24px),444px);height:66px;padding:6px;background:rgba(25,29,34,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.055);border-radius:27px;box-shadow:0 12px 36px rgba(0,0,0,.34);display:flex}.bnav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:25%;height:54px;border-radius:23px;color:rgba(255,255,255,.42);font-weight:700;text-decoration:none}.bnav-item svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.bnav-item span{font-size:9px}.bnav-item.active{background:rgba(54,142,238,.18);color:#3e91f4;box-shadow:inset 0 0 0 1px rgba(62,145,244,.08)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#242b36;color:#fff;font-size:12px;font-weight:800;display:none;z-index:80}.toast.show{display:block}
@media(min-width:700px){.page{padding-top:10px}.case-img{height:330px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div class="page"><header class="top"><button class="back" onclick="location.href='/cases'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="brand">Кейс</div><div class="balance"><img src="/static/img/gram.png" onerror="this.src='/static/img/ton.png'"><span id="balance">0.00</span></div></header>
<section class="hero"><img id="caseImage" class="case-img" src="/static/img/gift.png"><div id="caseTitle" class="title">Загрузка…</div><div class="price"><img src="/static/img/gram.png" onerror="this.src='/static/img/ton.png'"><span id="casePrice">0.00</span> грамм</div><div id="caseDesc" class="desc"></div></section>
<section class="roulette"><div id="track" class="track"></div></section>
<section class="controls"><div class="qty"><button class="active" onclick="setQty(1)">1</button><button onclick="setQty(2)">2</button><button onclick="setQty(3)">3</button></div><button id="openBtn" class="open" onclick="openCase()">Открыть кейс</button></section>
<section id="win" class="win"><img id="winImg"><div class="win-name" id="winName"></div><div class="price"><img src="/static/img/gram.png" onerror="this.src='/static/img/ton.png'"><span id="winPrice">0.00</span> грамм</div><button class="open" style="margin-top:12px" onclick="resetCase()">Ещё раз</button></section>
<div class="contents-title">Что в кейсе?</div><div id="contents" class="grid"></div></div>
<nav class="bottom-nav"><a class="bnav-item active" href="/cases"><svg viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="m4 8.5 8 4.5 8-4.5"/><path d="M12 13v7"/></svg><span>Кейсы</span></a><a class="bnav-item" href="/upgrade"><svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg><span>Апгрейды</span></a><a class="bnav-item" href="/games"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="M7 12h5M9.5 9.5v5"/><circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"/></svg><span>Игры</span></a><a class="bnav-item" href="/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Профиль</span></a></nav><div id="toast" class="toast"></div>
<script>
const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let current=null,qty=1,userId=null,balance=0,opening=false;
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toFixed(2).replace('.',',');
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function price(g){return g.type==='ton_balance'?Number(g.ton_amount||0):Number(g.value||0)/100}
function image(g){return g.image||'/static/img/gift.png'}
async function auth(){try{const a=await telegramAuth();if(a&&a.id)userId=a.id}catch(e){}if(!userId&&window.Telegram?.WebApp?.initDataUnsafe?.user)userId=Telegram.WebApp.initDataUnsafe.user.id}
async function load(){await auth();if(userId){try{const r=await fetch('/api/user/'+userId);const d=await r.json();if(d.success){balance=Number(d.user.balance_stars||0);$('balance').textContent=fmt(balance/100)}}catch(e){}}
try{let r=await fetch('/api/cases/by-slug/'+encodeURIComponent(slug));let d=await r.json();if(!d.success)throw Error();current=d.case;$('caseTitle').textContent=current.name||'Кейс';$('caseDesc').textContent=current.description||'';$('casePrice').textContent=fmt(current.cost_type==='ton'?current.cost:Number(current.cost||0)/100);$('caseImage').src=current.image||'/static/img/gift.png';render();}catch(e){$('caseTitle').textContent='Кейс не найден';toast('Кейс не найден')}}
function render(){const gs=current.gifts_details||[];$('contents').innerHTML=gs.map(g=>'<div class="gift"><div class="gn">'+esc(g.name||'Подарок')+'</div><img src="'+esc(image(g))+'" onerror="this.src=\'/static/img/gift.png\'"><div class="gp">'+fmt(price(g))+' грамм</div></div>').join('');let arr=[];for(let i=0;i<28;i++)arr.push(gs[i%Math.max(gs.length,1)]);$('track').innerHTML=arr.map(g=>g?'<div class="ri"><div class="rprice">'+fmt(price(g))+' грамм</div><img src="'+esc(image(g))+'"></div>':'').join('')}
function setQty(n){qty=n;document.querySelectorAll('.qty button').forEach((b,i)=>b.classList.toggle('active',i===n-1))}
async function openCase(){if(opening||!current)return;if(!userId){toast('Откройте через Telegram');return}opening=true;$('openBtn').disabled=true;$('openBtn').textContent='Открываем…';try{const r=await fetch('/api/cases/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,case_id:current.id,quantity:qty})});const d=await r.json();if(!d.success)throw Error(d.error||'Ошибка');const won=(d.won_gifts||[d.won_gift]).filter(Boolean);balance=Number(d.new_balance?.stars??balance);$('balance').textContent=fmt(balance/100);spin(won)}catch(e){toast(e.message||'Ошибка открытия');opening=false;$('openBtn').disabled=false;$('openBtn').textContent='Открыть кейс'}}
function spin(won){const g=won[0];const track=$('track');track.style.transition='transform 5.8s cubic-bezier(.08,.82,.16,1)';const target=24;track.style.transform='translateX(calc(50% - '+(target*116+54)+'px))';setTimeout(()=>{ $('winImg').src=image(g);$('winName').textContent=g.name||'Подарок';$('winPrice').textContent=fmt(price(g));$('win').classList.add('show');$('openBtn').style.display='none';toast('Подарок получен');},6100)}
function resetCase(){opening=false;$('win').classList.remove('show');$('openBtn').style.display='block';$('openBtn').disabled=false;$('openBtn').textContent='Открыть кейс';$('track').style.transition='none';$('track').style.transform='translateX(0)';render()}
load();
</script></body></html>
