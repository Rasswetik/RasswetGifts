<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Кейс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
:root{
  --line:rgba(120,155,200,.16);--text:#f4f7fc;--muted:#8394ae;
  --accent:#2f93da;--accent-2:#1d6fae;--gold:#e9c063;--glow:rgba(78,140,220,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;min-height:100dvh;background:radial-gradient(circle at 50% -10%,var(--glow),transparent 38%),linear-gradient(180deg,#070b16,#060910 60%,#05080f);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:calc(14px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));overflow-x:hidden;position:relative}
.wrap{width:min(100%,1180px);margin:0 auto;position:relative;z-index:2}

/* ── Halloween-тема при активном ивенте ────────────── */
body.halloween{--accent:#8b5cf6;--accent-2:#6d28d9;--glow:rgba(157,77,255,.2);--line:rgba(160,120,220,.2)}
body.halloween:before,body.halloween:after{content:"";position:fixed;z-index:0;pointer-events:none;background-repeat:no-repeat;background-size:contain;opacity:.4;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
body.halloween:before{left:-8px;top:64px;width:150px;height:150px;background-image:url('/static/img/halloween-web.svg')}
body.halloween:after{right:6px;bottom:14px;width:96px;height:145px;background-image:url('/static/img/halloween-lantern.svg');opacity:.28}
body.halloween .stage-card{border-color:rgba(179,108,255,.26);box-shadow:0 22px 70px rgba(83,30,113,.22)}
body.halloween .case-title{text-shadow:0 0 22px rgba(179,108,255,.45)}
body.halloween .case-hero{filter:drop-shadow(0 26px 46px rgba(88,30,140,.55))}

/* ── Шапка ─────────────────────────────────────────── */
.head{position:relative;display:flex;align-items:center;height:52px;margin-bottom:14px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid rgba(128,164,203,.18);background:rgba(16,26,43,.9);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s}
.back:hover{background:#16233a;transform:translateX(-2px)}
.case-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:950;letter-spacing:2.4px;text-transform:uppercase;white-space:nowrap}
.balance{margin-left:auto;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:rgba(16,26,43,.85);border:1px solid var(--line);font-size:13px;font-weight:900}
.balance img{width:16px;height:16px;object-fit:contain}

/* ── Сцена ─────────────────────────────────────────── */
.stage-card{border-radius:22px;background:linear-gradient(180deg,rgba(17,26,43,.9),rgba(11,17,29,.9));border:1px solid var(--line);overflow:hidden}
.stage{position:relative;height:380px;display:flex;align-items:center;justify-content:center;padding:18px}
.stage.win-mode{height:auto;min-height:230px;padding:24px 20px}
.stage-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,var(--glow),transparent 55%)}
.case-hero{max-width:280px;max-height:300px;object-fit:contain;filter:drop-shadow(0 26px 46px rgba(0,0,0,.55));animation:heroIn .45s ease both,float 5.5s ease-in-out infinite .5s}
@keyframes heroIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ── Кнопки ────────────────────────────────────────── */
.controls{padding:16px 18px 18px;border-top:1px solid rgba(255,255,255,.05)}
.btn-main-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{height:50px;border:0;border-radius:13px;font:inherit;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.16s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-open{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 26px rgba(31,111,174,.26)}
.btn-open:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(180deg,#f3ca6d,#d6ac4f);color:#2a1e03;box-shadow:0 10px 26px rgba(201,162,74,.24)}
.btn-gold:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.price-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:9px;background:rgba(0,0,0,.24);font-size:13px;font-weight:950}
.price-chip img{width:14px;height:14px;object-fit:contain}
.qty-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:11px}
.qty{height:40px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.028);color:#8fa2bd;font:inherit;font-weight:900;font-size:13px;cursor:pointer;transition:.15s}
.qty:hover:not(:disabled){color:#fff;border-color:rgba(120,170,230,.35)}
.qty.active{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(35,130,200,.28)}

/* ── Содержимое ────────────────────────────────────── */
.contents-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}
.contents-title{font-size:19px;font-weight:950;letter-spacing:-.3px}
.contents-count{min-width:34px;padding:5px 11px;border-radius:11px;background:rgba(201,162,74,.16);border:1px solid rgba(201,162,74,.3);color:var(--gold);font-size:12px;font-weight:950;text-align:center}
.items-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.item{padding:16px 12px 14px;border-radius:17px;background:linear-gradient(180deg,rgba(18,27,44,.85),rgba(12,19,32,.85));border:1px solid var(--line);text-align:center;transition:.18s;animation:up .4s ease both}
.item:hover{transform:translateY(-3px);border-color:rgba(120,170,230,.3)}
.item-img{width:100%;height:118px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.item-name{margin-top:11px;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-price{margin:9px auto 0;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);font-size:12px;font-weight:900}
.item-price img{width:13px;height:13px;object-fit:contain}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── Рулетка ───────────────────────────────────────── */
.roulette{position:absolute;inset:0;display:none;padding:14px}
.roulette.on{display:block}
.reels{display:flex;gap:10px;width:100%;height:100%}
.reel{position:relative;flex:1;border-radius:16px;overflow:hidden;background:rgba(6,10,18,.55);border:1px solid rgba(255,255,255,.05)}
.strip{position:absolute;left:0;top:0;width:100%;will-change:transform;backface-visibility:hidden}
.cell{display:flex;align-items:center;justify-content:center}
.cell img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.reel.horizontal .strip{display:flex;height:100%}
.reel-fade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(7,11,22,.9),transparent 22%,transparent 78%,rgba(7,11,22,.9))}
.reel.horizontal .reel-fade{background:linear-gradient(90deg,rgba(7,11,22,.9),transparent 18%,transparent 82%,rgba(7,11,22,.9))}
.marker-line{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);background:linear-gradient(90deg,transparent,var(--gold) 12%,var(--gold) 88%,transparent);z-index:4;pointer-events:none;box-shadow:0 0 14px rgba(233,192,99,.45)}
.marker-tip{position:absolute;top:50%;width:0;height:0;transform:translateY(-7px);border-top:7px solid transparent;border-bottom:7px solid transparent;z-index:5;pointer-events:none}
.marker-tip.left{left:0;border-left:9px solid var(--gold)}
.marker-tip.right{right:0;border-right:9px solid var(--gold)}
.reel.horizontal .marker-line{left:50%;right:auto;top:0;bottom:0;width:2px;height:100%;transform:translateX(-1px);background:linear-gradient(180deg,transparent,var(--gold) 12%,var(--gold) 88%,transparent)}
.reel.horizontal .marker-tip{top:0;left:50%;transform:translateX(-7px);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--gold);border-bottom:0}
.reel.horizontal .marker-tip.right{top:auto;bottom:0;border-top:0;border-bottom:9px solid var(--gold)}
.reel.landed{animation:landPulse .5s ease}
@keyframes landPulse{0%{box-shadow:inset 0 0 0 0 rgba(233,192,99,0)}35%{box-shadow:inset 0 0 0 2px rgba(233,192,99,.65)}100%{box-shadow:inset 0 0 0 0 rgba(233,192,99,0)}}

/* ── Экран победы внутри карточки ──────────────────── */
.win-panel{position:relative;z-index:2;display:none;width:100%;text-align:center;animation:winIn .42s cubic-bezier(.16,1,.3,1) both}
.win-panel.on{display:block}
@keyframes winIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.win-head{font-size:20px;font-weight:1000;color:var(--gold);letter-spacing:-.2px}
.win-value{margin-top:7px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:850;color:var(--muted)}
.win-value .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:#fff;font-weight:950}
.win-value .chip img{width:13px;height:13px;object-fit:contain}
.win-items{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.win-card{width:150px;padding:14px 12px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(20,30,48,.95),rgba(13,20,33,.95));border:1px solid rgba(255,255,255,.08);animation:winCard .45s cubic-bezier(.16,1,.3,1) both}
@keyframes winCard{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
.win-card img.wi{width:100%;height:92px;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(0,0,0,.45))}
.win-card b{display:block;margin-top:9px;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sell-btn{margin-top:10px;width:100%;height:30px;border:0;border-radius:9px;background:linear-gradient(180deg,#f3ca6d,#d6ac4f);color:#2a1e03;font:inherit;font-size:11px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.sell-btn:hover:not(:disabled){filter:brightness(1.07)}
.sell-btn:disabled{opacity:.45;cursor:default}
.sell-btn img{width:12px;height:12px;object-fit:contain}
.win-card.sold{opacity:.5}
.win-note{margin-top:10px;font-size:11px;font-weight:900;color:#8394ae}

.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,18px);z-index:1200;padding:13px 20px;border-radius:14px;background:rgba(18,26,40,.97);border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:850;opacity:0;visibility:hidden;transition:.22s;box-shadow:0 18px 48px rgba(0,0,0,.45)}

@media(max-width:900px){
  .items-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage{height:300px}.case-hero{max-width:210px}
  .case-title{font-size:15px;letter-spacing:1.6px}
}
@media(max-width:620px){
  body{padding-left:12px;padding-right:12px}
  .items-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .btn-main-row{grid-template-columns:1fr}
  .qty-row{gap:7px}.qty{height:36px;font-size:12px}
  .stage{height:250px;padding:10px}
  .win-card{width:calc(50% - 6px)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <button class="back" onclick="goBack()" aria-label="Назад">‹</button>
    <div class="case-title" id="caseTitle">Кейс</div>
    <div class="balance" id="balanceBox" style="visibility:hidden"><img src="/static/img/ton.png" alt=""><span id="balanceValue">0.00</span></div>
  </header>

  <div class="stage-card">
    <div class="stage" id="stage">
      <div class="stage-glow"></div>
      <img class="case-hero" id="caseHero" src="/static/img/gift.png" alt="">
      <div class="roulette" id="roulette"><div class="reels" id="reels"></div></div>
      <div class="win-panel" id="winPanel">
        <div class="win-head" id="winHead">Поздравляем, всё ваше!</div>
        <div class="win-value">Стоимость: <span class="chip"><img src="/static/img/ton.png" alt=""><span id="winValue">0.00</span></span></div>
        <div class="win-items" id="winItems"></div>
      </div>
    </div>
    <div class="controls">
      <div class="btn-main-row" id="mainRow">
        <button class="btn btn-open" id="openBtn" onclick="startOpen(false)">
          <span id="openLabel">Открыть</span>
          <span class="price-chip"><img src="/static/img/ton.png" alt=""><span id="openPrice">0.00</span></span>
        </button>
        <button class="btn btn-gold" id="fastBtn" onclick="startOpen(true)">Быстрое открытие</button>
      </div>
      <div class="btn-main-row" id="winRow" style="display:none">
        <button class="btn btn-open" onclick="openAgain()">Открыть ещё</button>
        <button class="btn btn-gold" id="sellAllBtn" onclick="sellAll()">Продать всё</button>
      </div>
      <div class="qty-row" id="qtyRow"></div>
    </div>
  </div>

  <div class="contents-head">
    <div class="contents-title">Содержимое</div>
    <div class="contents-count" id="itemsCount">0</div>
  </div>
  <div class="items-grid" id="itemsGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var $=function(id){return document.getElementById(id)};
var CASE=null,USER=null,QTY=1,BUSY=false,MAX_QTY=5,LAST_WON=[];

function toast(msg,type){
  var t=$('toast');t.textContent=msg;
  t.style.borderColor=type==='err'?'rgba(255,80,110,.45)':(type==='ok'?'rgba(36,195,142,.45)':'rgba(255,255,255,.1)');
  t.style.color=type==='err'?'#ffc4cf':(type==='ok'?'#b8f2dc':'#fff');
  t.style.opacity='1';t.style.visibility='visible';t.style.transform='translate(-50%,0)';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0';t.style.visibility='hidden';t.style.transform='translate(-50%,18px)'},2600);
}
function imgSrc(v){return v||'/static/img/gift.png'}
function money(v){return Number(v||0).toFixed(2)}
function goBack(){if(history.length>1)history.back();else location.href='/cases'}
function casePrice(c){var raw=Number((c&&c.cost)||0);if(c&&c.seasonal)return raw;return (c&&c.cost_type==='ton')?raw:raw/100}
function isBalanceGift(g){return !!g&&(g.type==='gram_balance'||g.type==='ton_balance')}
function giftPrice(g){
  if(!g)return 0;
  if(isBalanceGift(g))return Number(g.ton_amount||g.gram_amount||0)||Number(g.value||0)/100;
  return Number(g.value||0)/100;
}
function jsonFetch(url){return fetch(url,{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return null})}

/* ── Загрузка кейса: четыре независимых пути ───────── */
function caseRefFromUrl(){
  var parts=location.pathname.split('/').filter(Boolean);
  var ref=parts.length?decodeURIComponent(parts[parts.length-1]):'';
  var qs=new URLSearchParams(location.search);
  return qs.get('case')||qs.get('id')||(ref&&ref!=='case'?ref:'');
}
async function fetchCase(ref){
  if(!ref)return null;
  var d=await jsonFetch('/api/cases/'+encodeURIComponent(ref)+'?ts='+Date.now());
  if(d&&d.success&&d.case)return d.case;
  d=await jsonFetch('/api/cases/by-slug/'+encodeURIComponent(ref)+'?ts='+Date.now());
  if(d&&d.success&&d.case)return d.case;
  d=await jsonFetch('/api/cases/batch?ids='+encodeURIComponent(ref)+'&ts='+Date.now());
  if(d&&d.success&&(d.cases||[]).length)return d.cases[0];
  var all=await jsonFetch('/api/cases?ts='+Date.now());
  var list=(all&&all.cases)||[];var t=String(ref).toLowerCase();
  return list.find(function(c){
    return String(c.id).toLowerCase()===t||String(c.slug||'').toLowerCase()===t
      ||String(c.name||'').toLowerCase().replace(/\s+/g,'-')===t;
  })||null;
}
function renderCase(){
  document.title=CASE.name||'Кейс';
  $('caseTitle').textContent=CASE.name||'Кейс';
  var hero=$('caseHero');hero.src=imgSrc(CASE.image||CASE.png);
  hero.onerror=function(){this.onerror=null;this.src='/static/img/gift.png'};
  renderQty();renderPrice();renderItems();
}
function renderQty(){
  var row=$('qtyRow');row.innerHTML='';
  if(CASE&&CASE.free){row.style.display='none';QTY=1;return}
  row.style.display='';
  for(var i=1;i<=MAX_QTY;i++){(function(n){
    var b=document.createElement('button');b.className='qty'+(n===QTY?' active':'');b.type='button';b.textContent='×'+n;b.disabled=BUSY;
    b.onclick=function(){if(BUSY)return;QTY=n;renderQty();renderPrice()};
    row.appendChild(b);
  })(i)}
}
function renderPrice(){
  $('openPrice').textContent=money(casePrice(CASE)*QTY);
  $('openLabel').textContent=QTY>1?('Открыть ×'+QTY):'Открыть';
}
function renderItems(){
  var grid=$('itemsGrid');
  var gifts=(CASE.gifts_details||[]).slice();
  gifts.sort(function(a,b){return giftPrice(b)-giftPrice(a)});
  $('itemsCount').textContent=gifts.length;
  if(!gifts.length){grid.innerHTML='<div class="item" style="grid-column:1/-1;color:#8394ae">В кейсе пока нет предметов</div>';return}
  grid.innerHTML='';
  gifts.forEach(function(g,i){
    var el=document.createElement('div');el.className='item';el.style.animationDelay=Math.min(i*26,400)+'ms';
    el.innerHTML='<img class="item-img" loading="lazy"><div class="item-name"></div><div class="item-price"><img src="/static/img/ton.png" alt=""><span></span></div>';
    var im=el.querySelector('.item-img');im.src=imgSrc(g.image);im.onerror=function(){this.onerror=null;this.src='/static/img/gift.png'};
    el.querySelector('.item-name').textContent=g.name||'Подарок';
    el.querySelector('.item-price span').textContent=money(giftPrice(g));
    grid.appendChild(el);
  });
}

/* ── Пользователь ──────────────────────────────────── */
function tgUser(){try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user)return Telegram.WebApp.initDataUnsafe.user}catch(e){}return null}
async function ensureUser(){
  if(USER&&USER.id)return USER;
  USER=tgUser();
  if(!USER){try{USER=await telegramAuth()}catch(e){}}
  return USER;
}
async function refreshBalance(){
  try{
    var u=await ensureUser();if(!u||!u.id)return;
    var d=await jsonFetch('/api/user/'+u.id+'?ts='+Date.now());
    var stars=(d&&d.user&&(d.user.balance_stars!==undefined?d.user.balance_stars:d.user.stars))||0;
    $('balanceValue').textContent=money(Number(stars)/100);
    $('balanceBox').style.visibility='visible';
  }catch(e){}
}

/* ── Открытие ──────────────────────────────────────── */
function setBusy(on){
  BUSY=on;
  $('openBtn').disabled=on;$('fastBtn').disabled=on;
  document.querySelectorAll('.qty').forEach(function(b){b.disabled=on});
}
function showOpenControls(){$('mainRow').style.display='';$('winRow').style.display='none'}
function showWinControls(){$('mainRow').style.display='none';$('winRow').style.display=''}
async function startOpen(fast){
  if(BUSY||!CASE)return;
  var u=await ensureUser();
  if(!u||!u.id){toast('Не удалось определить пользователя Telegram','err');return}
  hideWin();setBusy(true);
  try{
    var r=await fetch('/api/cases/open',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:u.id,case_id:CASE.id,quantity:QTY})});
    var d=await r.json();
    if(!d||!d.success)throw new Error((d&&d.error)||'Не удалось открыть кейс');
    var won=d.won_gifts||[];
    if(!won.length)throw new Error('Кейс вернул пустой результат');
    if(!fast)await spin(won);
    stopRoulette();showWin(won);refreshBalance();
  }catch(e){
    stopRoulette();hideWin();
    toast(e.message||'Ошибка открытия','err');
  }
  setBusy(false);renderQty();
}
function openAgain(){hideWin();startOpen(false)}

/* Рулетка: ×1 — одна большая горизонтальная лента, ×N — N вертикальных.
   Длинная прокрутка (~6–7 с): быстрый разгон с лёгким блюром, затем
   долгое плавное торможение и точная доводка к выпавшему предмету. */
var WIN_INDEX=72;
function poolItems(){
  var g=(CASE.gifts_details||[]).slice();
  if(!g.length)g=[{name:'Подарок',image:'/static/img/gift.png',value:0}];
  return g;
}
function cellHtml(g,w,h){
  var src=imgSrc(g.image).replace(/"/g,'&quot;');
  return '<div class="cell" style="width:'+w+';height:'+h+'"><img src="'+src+'" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'" alt=""></div>';
}
function spin(won){
  return new Promise(function(resolve){
    var stage=$('stage'),rouletteEl=$('roulette'),reelsEl=$('reels');
    var pool=poolItems(),horizontal=won.length===1;
    $('caseHero').style.display='none';
    stage.classList.remove('win-mode');
    rouletteEl.classList.add('on');
    reelsEl.innerHTML='';
    var box=stage.getBoundingClientRect();
    var innerH=Math.max(190,box.height-28),innerW=Math.max(260,box.width-28);
    var reels=[];
    won.forEach(function(w){
      var reel=document.createElement('div');reel.className='reel'+(horizontal?' horizontal':'');
      var strip=document.createElement('div');strip.className='strip';
      var cellSize=horizontal?Math.round(Math.min(230,innerW/4)):Math.round(Math.min(200,innerH/2.4));
      var cells=[];
      for(var i=0;i<WIN_INDEX+18;i++)cells.push(i===WIN_INDEX?w:pool[Math.floor(Math.random()*pool.length)]);
      strip.innerHTML=cells.map(function(g){return horizontal?cellHtml(g,cellSize+'px','100%'):cellHtml(g,'100%',cellSize+'px')}).join('');
      if(horizontal)strip.style.width=(cellSize*cells.length)+'px';
      reel.appendChild(strip);
      reel.insertAdjacentHTML('beforeend','<div class="reel-fade"></div><div class="marker-line"></div><div class="marker-tip left"></div><div class="marker-tip right"></div>');
      reelsEl.appendChild(reel);
      reels.push({reel:reel,strip:strip,cell:cellSize,horizontal:horizontal});
    });
    reels.forEach(function(x){
      x.strip.style.transition='none';
      x.strip.style.transform='translate3d(0,0,0)';
      x.strip.style.filter='blur(9px)';
    });
    void reelsEl.offsetWidth;
    var base=5800;
    reels.forEach(function(x,i){
      var viewport=x.horizontal?x.reel.clientWidth:x.reel.clientHeight;
      var jitter=(Math.random()*0.44-0.22)*x.cell;
      var target=WIN_INDEX*x.cell-(viewport/2-x.cell/2)+jitter;
      var d=base+i*340;
      x.strip.style.transition='transform '+d+'ms cubic-bezier(.05,.68,.1,1), filter '+Math.round(d*0.5)+'ms ease-out';
      x.strip.style.transform=x.horizontal?('translate3d('+(-target)+'px,0,0)'):('translate3d(0,'+(-target)+'px,0)');
      x.strip.style.filter='blur(0px)';
      x.total=d;x.target=target;x.jitter=jitter;
    });
    var longest=Math.max.apply(null,reels.map(function(x){return x.total}));
    reels.forEach(function(x){
      setTimeout(function(){
        var snap=x.target-x.jitter;
        x.strip.style.transition='transform 480ms cubic-bezier(.2,.9,.25,1)';
        x.strip.style.transform=x.horizontal?('translate3d('+(-snap)+'px,0,0)'):('translate3d(0,'+(-snap)+'px,0)');
        x.reel.classList.add('landed');
        try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.impactOccurred('light')}catch(e){}
      },x.total+15);
    });
    setTimeout(resolve,longest+760);
  });
}
function stopRoulette(){$('roulette').classList.remove('on');$('reels').innerHTML=''}

/* ── Экран победы ──────────────────────────────────── */
function showWin(won){
  LAST_WON=won.slice();
  $('caseHero').style.display='none';
  $('stage').classList.add('win-mode');
  var box=$('winItems');box.innerHTML='';
  won.forEach(function(g,i){
    var card=document.createElement('div');card.className='win-card';card.style.animationDelay=(i*80)+'ms';
    card.innerHTML='<img class="wi" alt=""><b></b>';
    var im=card.querySelector('img.wi');im.src=imgSrc(g.image);im.onerror=function(){this.onerror=null;this.src='/static/img/gift.png'};
    card.querySelector('b').textContent=g.name||'Подарок';
    if(isBalanceGift(g)||!g.inventory_id){
      var note=document.createElement('div');note.className='win-note';
      note.textContent=isBalanceGift(g)?'Зачислено на баланс':(money(giftPrice(g))+' GRAM');
      card.appendChild(note);
    }else{
      var btn=document.createElement('button');btn.className='sell-btn';
      btn.innerHTML='Продать <img src="/static/img/ton.png" alt=""> '+money(giftPrice(g));
      btn.onclick=function(){sellOne(g,card,btn)};
      card.appendChild(btn);
    }
    box.appendChild(card);
  });
  var total=won.reduce(function(a,g){return a+giftPrice(g)},0);
  $('winValue').textContent=money(total);
  $('winHead').textContent=won.length>1?'Поздравляем, всё ваше!':'Поздравляем!';
  $('winPanel').classList.add('on');
  showWinControls();updateSellAll();
  try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}
}
function hideWin(){
  $('winPanel').classList.remove('on');
  $('stage').classList.remove('win-mode');
  $('caseHero').style.display='';
  showOpenControls();
}
function updateSellAll(){
  var left=LAST_WON.filter(function(g){return g.inventory_id&&!g._sold});
  var btn=$('sellAllBtn');
  if(!left.length){btn.disabled=true;btn.textContent='Всё продано'}
  else{btn.disabled=false;btn.textContent='Продать всё · '+money(left.reduce(function(a,g){return a+giftPrice(g)},0))}
}
async function sellOne(g,card,btn){
  var u=await ensureUser();if(!u||!u.id){toast('Нужна авторизация Telegram','err');return}
  btn.disabled=true;btn.textContent='Продажа…';
  try{
    var r=await fetch('/api/sell-gift',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:u.id,gift_id:g.inventory_id})});
    var d=await r.json();
    if(!d||!d.success)throw new Error((d&&d.error)||'Не удалось продать');
    g._sold=true;card.classList.add('sold');btn.textContent='Продано';
    toast('Продано за '+money(giftPrice(g))+' GRAM','ok');
    updateSellAll();refreshBalance();
  }catch(e){
    btn.disabled=false;btn.innerHTML='Продать <img src="/static/img/ton.png" alt=""> '+money(giftPrice(g));
    toast(e.message||'Ошибка продажи','err');
  }
}
async function sellAll(){
  var u=await ensureUser();if(!u||!u.id){toast('Нужна авторизация Telegram','err');return}
  var left=LAST_WON.filter(function(g){return g.inventory_id&&!g._sold});
  if(!left.length)return;
  var btn=$('sellAllBtn');btn.disabled=true;btn.textContent='Продажа…';
  try{
    var r=await fetch('/api/sell-gifts-batch',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:u.id,item_ids:left.map(function(g){return g.inventory_id})})});
    var d=await r.json();
    if(!d||!d.success)throw new Error((d&&d.error)||'Не удалось продать');
    var sum=left.reduce(function(a,g){return a+giftPrice(g)},0);
    left.forEach(function(g){g._sold=true});
    document.querySelectorAll('.win-card').forEach(function(c){if(c.querySelector('.sell-btn'))c.classList.add('sold')});
    document.querySelectorAll('.sell-btn').forEach(function(b){b.disabled=true;b.textContent='Продано'});
    toast('Продано на '+money(sum)+' GRAM','ok');
    updateSellAll();refreshBalance();
  }catch(e){btn.disabled=false;updateSellAll();toast(e.message||'Ошибка продажи','err')}
}

/* ── Halloween-оформление от активного ивента ──────── */
async function applyEventTheme(){
  var d=await jsonFetch('/api/events/witch-hat-party?ts='+Date.now());
  var ev=(d&&d.event)||{};
  if(ev.active&&ev.halloween_mode!==false)document.body.classList.add('halloween');
}

/* ── Старт ─────────────────────────────────────────── */
(async function init(){
  try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{if(typeof Telegram.WebApp.requestFullscreen==='function')Telegram.WebApp.requestFullscreen()}catch(e){}}}catch(e){}
  applyEventTheme();
  var grid=$('itemsGrid');
  grid.innerHTML=new Array(5).fill('<div class="item" style="height:210px"></div>').join('');
  var ref=caseRefFromUrl();
  var c=await fetchCase(ref);
  if(!c)c=await fetchCase(ref);
  if(!c){
    $('caseTitle').textContent='Кейс не найден';
    grid.innerHTML='<div class="item" style="grid-column:1/-1;color:#8394ae">Не удалось загрузить кейс. Обновите страницу.</div>';
    $('openBtn').disabled=true;$('fastBtn').disabled=true;
    return;
  }
  CASE=c;renderCase();refreshBalance();
})();
</script>
