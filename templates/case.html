<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Кейс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
:root{
  --bg:#070b16;--panel:#0e1524;--panel-2:#111a2b;--line:rgba(120,155,200,.16);
  --text:#f4f7fc;--muted:#8394ae;--blue:#2b8fd6;--blue-2:#1f6fae;
}
:root{--gold:#c9a24a;--gold-2:#e0bb63}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(60,110,190,.16),transparent 38%),linear-gradient(180deg,#070b16,#060910 60%,#05080f);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:calc(14px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
.wrap{width:min(100%,1180px);margin:0 auto}

/* ── Header ───────────────────────────────────────────── */
.head{position:relative;display:flex;align-items:center;height:52px;margin-bottom:14px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid rgba(128,164,203,.18);background:rgba(16,26,43,.9);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s}
.back:hover{background:#16233a;transform:translateX(-2px)}
.case-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:950;letter-spacing:2.4px;text-transform:uppercase;white-space:nowrap}
.balance{margin-left:auto;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:rgba(16,26,43,.85);border:1px solid var(--line);font-size:13px;font-weight:900}
.balance img{width:16px;height:16px;object-fit:contain}

/* ── Stage ────────────────────────────────────────────── */
.stage-card{border-radius:22px;background:linear-gradient(180deg,rgba(17,26,43,.9),rgba(11,17,29,.9));border:1px solid var(--line);overflow:hidden}
.stage{position:relative;height:380px;display:flex;align-items:center;justify-content:center;padding:18px}
.case-hero{max-width:280px;max-height:300px;object-fit:contain;filter:drop-shadow(0 26px 46px rgba(0,0,0,.55));animation:heroIn .5s ease both,float 5.5s ease-in-out infinite 0.5s}
@keyframes heroIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.stage-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(78,140,220,.16),transparent 55%)}

/* ── Controls ─────────────────────────────────────────── */
.controls{padding:16px 18px 18px;border-top:1px solid rgba(255,255,255,.05)}
.btn-main-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{height:50px;border:0;border-radius:13px;font:inherit;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.16s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-open{background:linear-gradient(180deg,#2f93da,#1d6fae);color:#fff;box-shadow:0 10px 26px rgba(31,111,174,.28)}
.btn-open:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn-fast{background:linear-gradient(180deg,#d4ab54,#b58f38);color:#241a05;box-shadow:0 10px 26px rgba(181,143,56,.22)}
.btn-fast:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.price-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:9px;background:rgba(0,0,0,.24);font-size:13px;font-weight:950}
.price-chip img{width:14px;height:14px;object-fit:contain}
.qty-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:11px}
.qty{height:40px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.028);color:#8fa2bd;font:inherit;font-weight:900;font-size:13px;cursor:pointer;transition:.15s}
.qty:hover{color:#fff;border-color:rgba(120,170,230,.35)}
.qty.active{background:linear-gradient(180deg,#38a3ea,#2382c8);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(35,130,200,.3)}

/* ── Contents ─────────────────────────────────────────── */
.contents-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}
.contents-title{font-size:19px;font-weight:950;letter-spacing:-.3px}
.contents-count{min-width:34px;padding:5px 11px;border-radius:11px;background:rgba(201,162,74,.16);border:1px solid rgba(201,162,74,.3);color:var(--gold-2);font-size:12px;font-weight:950;text-align:center}
.items-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.item{padding:16px 12px 14px;border-radius:17px;background:linear-gradient(180deg,rgba(18,27,44,.85),rgba(12,19,32,.85));border:1px solid var(--line);text-align:center;transition:.18s;animation:up .4s ease both}
.item:hover{transform:translateY(-3px);border-color:rgba(120,170,230,.3)}
.item-img{width:100%;height:118px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.item-name{margin-top:11px;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-price{margin:9px auto 0;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);font-size:12px;font-weight:900}
.item-price img{width:13px;height:13px;object-fit:contain}
.item-chance{margin-top:7px;font-size:10px;font-weight:850;color:#6f809a}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── Roulette ─────────────────────────────────────────── */
.roulette{position:absolute;inset:0;display:none;padding:14px}
.roulette.on{display:block}
.reels{display:flex;gap:10px;width:100%;height:100%}
.reel{position:relative;flex:1;border-radius:16px;overflow:hidden;background:rgba(6,10,18,.55);border:1px solid rgba(255,255,255,.05)}
.strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.cell{display:flex;align-items:center;justify-content:center}
.cell img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.reel.horizontal .strip{display:flex;height:100%;top:0}
.marker{position:absolute;z-index:4;pointer-events:none}
.marker-line{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);background:linear-gradient(90deg,transparent,rgba(224,187,99,.95) 12%,rgba(224,187,99,.95) 88%,transparent);z-index:4;pointer-events:none;box-shadow:0 0 14px rgba(224,187,99,.45)}
.marker-tip{position:absolute;top:50%;width:0;height:0;transform:translateY(-7px);border-top:7px solid transparent;border-bottom:7px solid transparent;z-index:5;pointer-events:none}
.marker-tip.left{left:0;border-left:9px solid var(--gold-2)}
.marker-tip.right{right:0;border-right:9px solid var(--gold-2)}
.reel.horizontal .marker-line{left:50%;right:auto;top:0;bottom:0;width:2px;height:100%;background:linear-gradient(180deg,transparent,rgba(224,187,99,.95) 12%,rgba(224,187,99,.95) 88%,transparent);transform:translateX(-1px)}
.reel.horizontal .marker-tip{top:0;left:50%;transform:translateX(-7px);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--gold-2);border-bottom:0}
.reel.horizontal .marker-tip.right{top:auto;bottom:0;border-top:0;border-bottom:9px solid var(--gold-2)}
.reel-fade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(7,11,22,.92),transparent 22%,transparent 78%,rgba(7,11,22,.92))}
.reel.horizontal .reel-fade{background:linear-gradient(90deg,rgba(7,11,22,.92),transparent 18%,transparent 82%,rgba(7,11,22,.92))}
.reel.landed{animation:landPulse .45s ease}
@keyframes landPulse{0%{box-shadow:0 0 0 0 rgba(224,187,99,0)}40%{box-shadow:0 0 0 3px rgba(224,187,99,.5)}100%{box-shadow:0 0 0 0 rgba(224,187,99,0)}}

/* ── Win overlay ──────────────────────────────────────── */
.win{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,13,.82);backdrop-filter:blur(12px)}
.win.on{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.win-sheet{width:min(720px,100%);padding:30px;border-radius:24px;background:linear-gradient(180deg,#152033,#0f1728);border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 90px rgba(0,0,0,.55);text-align:center;animation:winIn .4s cubic-bezier(.16,1,.3,1) both}
@keyframes winIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.win-kicker{font-size:11px;font-weight:950;letter-spacing:2px;text-transform:uppercase;color:var(--gold-2)}
.win-title{margin-top:8px;font-size:26px;font-weight:1000;letter-spacing:-.6px}
.win-items{margin-top:20px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.win-item{width:150px;padding:16px 12px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);animation:winItem .45s cubic-bezier(.16,1,.3,1) both}
.win-item img{width:100%;height:96px;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(0,0,0,.45))}
.win-item b{display:block;margin-top:10px;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-item span{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:900;color:var(--gold-2)}
.win-item span img{width:13px;height:13px}
@keyframes winItem{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.win-total{margin-top:18px;font-size:13px;font-weight:850;color:var(--muted)}
.win-actions{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.win-rays{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:24px}
.win-sheet{position:relative;overflow:hidden}
.win-rays:before{content:"";position:absolute;left:50%;top:-40%;width:160%;height:180%;transform:translateX(-50%);background:conic-gradient(from 0deg,rgba(224,187,99,.14) 0 6deg,transparent 6deg 24deg);animation:spinRays 16s linear infinite;opacity:.55}
@keyframes spinRays{to{transform:translateX(-50%) rotate(360deg)}}

/* ── Toast ────────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);z-index:1200;padding:13px 20px;border-radius:14px;background:rgba(18,26,40,.97);border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:850;opacity:0;visibility:hidden;transition:.22s;box-shadow:0 18px 48px rgba(0,0,0,.45)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,80,110,.4);color:#ffc4cf}
.toast.ok{border-color:rgba(36,195,142,.4);color:#b8f2dc}
.empty{padding:30px;border-radius:18px;text-align:center;background:rgba(255,255,255,.025);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:800}
.skeleton{border-radius:17px;background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 70%);background-size:220% 100%;animation:sk 1.2s linear infinite;height:210px}
@keyframes sk{to{background-position:-220% 0}}

@media(max-width:900px){
  .items-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage{height:300px}.case-hero{max-width:210px}
  .case-title{font-size:15px;letter-spacing:1.6px}
}
@media(max-width:620px){
  body{padding-left:12px;padding-right:12px}
  .items-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .btn-main-row{grid-template-columns:1fr}
  .qty-row{gap:7px}.qty{height:36px;font-size:12px}
  .stage{height:250px;padding:10px}
  .win-item{width:132px}
  .win-actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <button class="back" onclick="goBack()" aria-label="Назад">‹</button>
    <div class="case-title" id="caseTitle">Кейс</div>
    <div class="balance" id="balanceBox" style="visibility:hidden"><img src="/static/img/ton.png" alt=""><span id="balanceValue">0.00</span></div>
  </header>

  <div class="stage-card">
    <div class="stage" id="stage">
      <div class="stage-glow"></div>
      <img class="case-hero" id="caseHero" src="/static/img/gift.png" alt="">
      <div class="roulette" id="roulette"><div class="reels" id="reels"></div></div>
    </div>
    <div class="controls">
      <div class="btn-main-row">
        <button class="btn btn-open" id="openBtn" onclick="startOpen(false)">
          <span id="openLabel">Открыть</span>
          <span class="price-chip"><img src="/static/img/ton.png" alt=""><span id="openPrice">0</span></span>
        </button>
        <button class="btn btn-fast" id="fastBtn" onclick="startOpen(true)">Быстрое открытие</button>
      </div>
      <div class="qty-row" id="qtyRow"></div>
    </div>
  </div>

  <div class="contents-head">
    <div class="contents-title">Содержимое</div>
    <div class="contents-count" id="itemsCount">0</div>
  </div>
  <div class="items-grid" id="itemsGrid"></div>
</div>

<div class="win" id="winOverlay">
  <div class="win-sheet">
    <div class="win-rays"></div>
    <div style="position:relative;z-index:2">
      <div class="win-kicker" id="winKicker">Поздравляем</div>
      <div class="win-title" id="winTitle">Ваш выигрыш</div>
      <div class="win-items" id="winItems"></div>
      <div class="win-total" id="winTotal"></div>
      <div class="win-actions">
        <button class="btn btn-fast" onclick="closeWin(true)">Открыть ещё</button>
        <button class="btn btn-open" onclick="closeWin(false)"><span>Забрать</span></button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var $=function(id){return document.getElementById(id)};
var CASE=null, USER=null, QTY=1, BUSY=false, MAX_QTY=5;

function toast(msg,type){var t=$('toast');t.textContent=msg;t.className='toast on '+(type||'');clearTimeout(t._h);t._h=setTimeout(function(){t.className='toast'},2600)}
function imgSrc(v){return v||'/static/img/gift.png'}
function money(v){return Number(v||0).toFixed(2)}
function goBack(){if(history.length>1)history.back();else location.href='/cases'}

/* Цена кейса: обычные кейсы хранят стоимость во внутренних единицах (1 GRAM = 100). */
function casePrice(c){
  var raw=Number((c&&c.cost)||0);
  if(c&&c.seasonal)return raw;
  return (c&&c.cost_type==='ton')?raw:raw/100;
}
function giftPrice(g){
  if(!g)return 0;
  if(g.type==='gram_balance'||g.type==='ton_balance')return Number(g.ton_amount||g.gram_amount||g.value||0);
  return Number(g.value||0)/100;
}
function chanceText(g,total){
  var c=Number(g&&g.chance||0);
  if(!c||!total)return '';
  var pct=c/total*100;
  return (pct>=1?pct.toFixed(1):pct.toFixed(2))+'%';
}

/* ── Загрузка кейса ──────────────────────────────────── */
function caseRefFromUrl(){
  var parts=location.pathname.split('/').filter(Boolean);
  var ref=parts.length?decodeURIComponent(parts[parts.length-1]):'';
  var qs=new URLSearchParams(location.search);
  return qs.get('case')||qs.get('id')||(ref&&ref!=='case'?ref:'');
}
async function fetchCase(ref){
  var urls=['/api/cases/'+encodeURIComponent(ref)+'?ts='+Date.now(),
            '/api/cases/by-slug/'+encodeURIComponent(ref)+'?ts='+Date.now()];
  for(var i=0;i<urls.length;i++){
    try{
      var r=await fetch(urls[i],{cache:'no-store'});
      var d=await r.json();
      if(d&&d.success&&d.case)return d.case;
    }catch(e){}
  }
  /* Последний запасной путь — общий список кейсов. */
  try{
    var r2=await fetch('/api/cases?ts='+Date.now(),{cache:'no-store'});
    var d2=await r2.json();
    var list=(d2&&d2.cases)||[];
    var t=String(ref).toLowerCase();
    var hit=list.find(function(c){return String(c.id).toLowerCase()===t||String(c.slug||'').toLowerCase()===t});
    if(hit)return hit;
  }catch(e){}
  return null;
}
function renderCase(){
  document.title=CASE.name||'Кейс';
  $('caseTitle').textContent=CASE.name||'Кейс';
  var hero=$('caseHero');hero.src=imgSrc(CASE.image||CASE.png);
  hero.onerror=function(){this.onerror=null;this.src='/static/img/gift.png'};
  renderQty();renderPrice();renderItems();
}
function renderQty(){
  var row=$('qtyRow');row.innerHTML='';
  for(var i=1;i<=MAX_QTY;i++){
    (function(n){
      var b=document.createElement('button');b.className='qty'+(n===QTY?' active':'');b.type='button';b.textContent='×'+n;
      b.onclick=function(){if(BUSY)return;QTY=n;renderQty();renderPrice()};
      row.appendChild(b);
    })(i);
  }
  if(CASE&&CASE.free){row.style.display='none';QTY=1}
}
function renderPrice(){
  var total=casePrice(CASE)*QTY;
  $('openPrice').textContent=money(total);
  $('openLabel').textContent=QTY>1?('Открыть ×'+QTY):'Открыть';
}
function renderItems(){
  var grid=$('itemsGrid');
  var gifts=(CASE.gifts_details||[]).slice();
  var total=gifts.reduce(function(a,g){return a+Number(g.chance||0)},0);
  gifts.sort(function(a,b){return giftPrice(b)-giftPrice(a)});
  $('itemsCount').textContent=gifts.length;
  if(!gifts.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">В кейсе пока нет предметов</div>';return}
  grid.innerHTML='';
  gifts.forEach(function(g,i){
    var el=document.createElement('div');el.className='item';el.style.animationDelay=Math.min(i*28,420)+'ms';
    el.innerHTML='<img class="item-img" loading="lazy"><div class="item-name"></div><div class="item-price"><img src="/static/img/ton.png" alt=""><span></span></div><div class="item-chance"></div>';
    var im=el.querySelector('.item-img');im.src=imgSrc(g.image);im.onerror=function(){this.onerror=null;this.src='/static/img/gift.png'};
    el.querySelector('.item-name').textContent=g.name||'Подарок';
    el.querySelector('.item-price span').textContent=money(giftPrice(g));
    el.querySelector('.item-chance').textContent=chanceText(g,total);
    grid.appendChild(el);
  });
}

/* ── Пользователь ───────────────────────────────────── */
function tgUser(){
  try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user)return Telegram.WebApp.initDataUnsafe.user}catch(e){}
  return null;
}
async function ensureUser(){
  if(USER&&USER.id)return USER;
  USER=tgUser();
  if(!USER){try{USER=await telegramAuth()}catch(e){}}
  return USER;
}
async function refreshBalance(){
  try{
    var u=await ensureUser();if(!u||!u.id)return;
    var r=await fetch('/api/user/'+u.id+'?ts='+Date.now(),{cache:'no-store'});
    var d=await r.json();
    var stars=(d&&d.user&&(d.user.balance_stars!==undefined?d.user.balance_stars:d.user.stars))||0;
    $('balanceValue').textContent=money(Number(stars)/100);
    $('balanceBox').style.visibility='visible';
  }catch(e){}
}

/* ── Открытие кейса ─────────────────────────────────── */
async function startOpen(fast){
  if(BUSY||!CASE)return;
  var u=await ensureUser();
  if(!u||!u.id){toast('Не удалось определить пользователя Telegram','err');return}
  BUSY=true;setButtons(false);
  try{
    var r=await fetch('/api/cases/open',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:u.id,case_id:CASE.id,quantity:QTY})});
    var d=await r.json();
    if(!d||!d.success)throw new Error((d&&d.error)||'Не удалось открыть кейс');
    var won=d.won_gifts||[];
    if(!won.length)throw new Error('Кейс вернул пустой результат');
    if(fast){finishOpen(won)}
    else{await spin(won);finishOpen(won)}
  }catch(e){
    toast(e.message||'Ошибка открытия','err');
    stopRoulette();
    BUSY=false;setButtons(true);
  }
}
function setButtons(on){
  $('openBtn').disabled=!on;$('fastBtn').disabled=!on;
  document.querySelectorAll('.qty').forEach(function(b){b.disabled=!on});
}
function finishOpen(won){
  stopRoulette();
  showWin(won);
  refreshBalance();
  BUSY=false;setButtons(true);
}

/* Рулетка: одна горизонтальная лента для ×1 и N вертикальных для ×N. */
var WIN_INDEX=48;
function poolItems(){
  var g=(CASE.gifts_details||[]).slice();
  if(!g.length)g=[{name:'Подарок',image:'/static/img/gift.png',value:0}];
  return g;
}
function cellHtml(g,w,h){
  return '<div class="cell" style="width:'+w+';height:'+h+'"><img src="'+imgSrc(g.image).replace(/"/g,'&quot;')+'" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'" alt=""></div>';
}
function spin(won){
  return new Promise(function(resolve){
    var stage=$('stage'),rouletteEl=$('roulette'),reelsEl=$('reels');
    var pool=poolItems();
    var horizontal=won.length===1;
    $('caseHero').style.display='none';
    rouletteEl.classList.add('on');
    reelsEl.innerHTML='';
    var box=stage.getBoundingClientRect();
    var innerH=Math.max(180,box.height-28), innerW=Math.max(240,box.width-28);
    var reels=[];
    won.forEach(function(w,ri){
      var reel=document.createElement('div');reel.className='reel'+(horizontal?' horizontal':'');
      var strip=document.createElement('div');strip.className='strip';
      var cellSize=horizontal?Math.round(Math.min(210,innerW/4.2)):Math.round(Math.min(190,innerH/2.6));
      var cells=[];
      for(var i=0;i<WIN_INDEX+14;i++){
        cells.push(i===WIN_INDEX?w:pool[Math.floor(Math.random()*pool.length)]);
      }
      strip.innerHTML=cells.map(function(g){
        return horizontal?cellHtml(g,cellSize+'px','100%'):cellHtml(g,'100%',cellSize+'px');
      }).join('');
      if(horizontal)strip.style.width=(cellSize*cells.length)+'px';
      reel.appendChild(strip);
      reel.insertAdjacentHTML('beforeend','<div class="reel-fade"></div><div class="marker-line"></div><div class="marker-tip left"></div><div class="marker-tip right"></div>');
      reelsEl.appendChild(reel);
      reels.push({reel:reel,strip:strip,cell:cellSize,horizontal:horizontal});
    });
    /* стартовое положение */
    reels.forEach(function(x){
      x.strip.style.transition='none';
      x.strip.style.transform=x.horizontal?'translateX(0px)':'translateY(0px)';
    });
    void reelsEl.offsetWidth;
    var duration=4600+Math.random()*400;
    reels.forEach(function(x,i){
      var viewport=x.horizontal?x.reel.clientWidth:x.reel.clientHeight;
      var jitter=(Math.random()*0.5-0.25)*x.cell*0.5;
      var target=WIN_INDEX*x.cell-(viewport/2-x.cell/2)+jitter;
      var d=duration+i*260;
      x.strip.style.transition='transform '+d+'ms cubic-bezier(.08,.72,.12,1)';
      x.strip.style.transform=x.horizontal?('translateX('+(-target)+'px)'):('translateY('+(-target)+'px)');
      x.total=d;x.target=target;x.jitter=jitter;
    });
    var longest=Math.max.apply(null,reels.map(function(x){return x.total}));
    /* лёгкое доводочное движение к центру предмета */
    reels.forEach(function(x){
      setTimeout(function(){
        x.strip.style.transition='transform 420ms cubic-bezier(.2,.9,.25,1)';
        var snap=x.target-x.jitter;
        x.strip.style.transform=x.horizontal?('translateX('+(-snap)+'px)'):('translateY('+(-snap)+'px)');
        x.reel.classList.add('landed');
      },x.total+20);
    });
    setTimeout(function(){resolve()},longest+700);
  });
}
function stopRoulette(){
  $('roulette').classList.remove('on');
  $('reels').innerHTML='';
  $('caseHero').style.display='';
}

/* ── Экран выигрыша ─────────────────────────────────── */
function showWin(won){
  var box=$('winItems');box.innerHTML='';
  won.forEach(function(g,i){
    var el=document.createElement('div');el.className='win-item';el.style.animationDelay=(i*90)+'ms';
    el.innerHTML='<img alt=""><b></b><span><img src="/static/img/ton.png" alt=""><i style="font-style:normal"></i></span>';
    var im=el.querySelector('img');im.src=imgSrc(g.image);im.onerror=function(){this.onerror=null;this.src='/static/img/gift.png'};
    el.querySelector('b').textContent=g.name||'Подарок';
    el.querySelector('i').textContent=money(giftPrice(g));
    box.appendChild(el);
  });
  var total=won.reduce(function(a,g){return a+giftPrice(g)},0);
  $('winTitle').textContent=won.length>1?('Выпало '+won.length+' предмета'):(won[0].name||'Ваш выигрыш');
  $('winTotal').textContent='Общая стоимость: '+money(total)+' GRAM';
  $('winOverlay').classList.add('on');
  try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}
}
function closeWin(again){
  $('winOverlay').classList.remove('on');
  if(again)setTimeout(function(){startOpen(false)},220);
}

/* ── Старт ──────────────────────────────────────────── */
(async function init(){
  try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{if(typeof Telegram.WebApp.requestFullscreen==='function')Telegram.WebApp.requestFullscreen()}catch(e){}}}catch(e){}
  var grid=$('itemsGrid');
  grid.innerHTML=new Array(5).fill('<div class="skeleton"></div>').join('');
  var ref=caseRefFromUrl();
  var c=await fetchCase(ref);
  if(!c){
    $('caseTitle').textContent='Кейс не найден';
    grid.innerHTML='<div class="empty" style="grid-column:1/-1">Не удалось загрузить кейс. Попробуйте обновить страницу.</div>';
    $('openBtn').disabled=true;$('fastBtn').disabled=true;
    return;
  }
  CASE=c;renderCase();refreshBalance();
})();
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('winOverlay').classList.contains('on'))closeWin(false)});
</script>
