<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Кейс</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/static/js/telegram-auth.js"></script><style>
:root{--bg:#0b1019;--panel:#151d2a;--panel2:#1b2534;--text:#fff;--muted:#8c9bb0;--accent:#4d9cff;--line:rgba(255,255,255,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 50% -10%,rgba(45,110,190,.18),transparent 65%),linear-gradient(180deg,#0b1019,#090e16);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:100px}.page{width:min(100%,620px);margin:auto;padding:10px 14px 30px}.top{height:58px;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.055);color:#fff;display:grid;place-items:center;cursor:pointer}.back svg{width:21px}.brand{text-align:center;font-size:16px;font-weight:950}.balance{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:900}.balance img{width:18px;height:18px}.hero{margin-top:4px;padding:18px 16px 16px;text-align:center;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,rgba(28,39,56,.92),rgba(15,22,32,.98));box-shadow:0 20px 55px rgba(0,0,0,.25)}.case-img{width:min(86vw,420px);height:min(68vw,330px);object-fit:contain;margin:0 auto;filter:drop-shadow(0 22px 34px rgba(0,0,0,.45));animation:float 3.2s ease-in-out infinite}.title{font-size:28px;line-height:1.05;font-weight:1000;margin-top:4px}.price{margin-top:10px;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:13px;background:rgba(77,156,255,.11);border:1px solid rgba(77,156,255,.2);font-size:15px;font-weight:950;color:#b9d7ff}.price img{width:18px;height:18px}.desc{margin:10px auto 0;color:var(--muted);font-size:12px;line-height:1.45;max-width:470px}.roulette{position:relative;overflow:hidden;margin:16px 0;padding:13px 0;background:#080d15;border:1px solid var(--line);border-radius:20px;min-height:126px}.track{display:flex;gap:8px;width:max-content;will-change:transform}.roulette:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:var(--accent);box-shadow:0 0 18px rgba(77,156,255,.8);z-index:3}.ri{width:108px;height:100px;flex:0 0 108px;border-radius:15px;background:linear-gradient(180deg,#202c3c,#151d29);border:1px solid rgba(255,255,255,.07);position:relative;display:grid;place-items:center}.ri img{width:72px;height:72px;object-fit:contain}.rprice{position:absolute;left:6px;right:6px;top:6px;font-size:9px;font-weight:800;color:#b9c7d9;text-align:center}.controls{padding:10px;border:1px solid var(--line);border-radius:20px;background:rgba(21,29,42,.9)}.qty{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.qty button{height:43px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:#202b3a;color:#9dacbf;font-weight:950;cursor:pointer}.qty button.active{background:linear-gradient(135deg,rgba(77,156,255,.3),rgba(45,112,200,.2));border-color:rgba(77,156,255,.4);color:#fff}.open{width:100%;height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,#4d9cff,#2777d4);color:#fff;font-size:16px;font-weight:950;box-shadow:0 12px 28px rgba(45,119,212,.24);cursor:pointer}.open:disabled{opacity:.55}.contents-title{font-size:15px;font-weight:950;margin:23px 2px 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.gift{background:linear-gradient(180deg,#182231,#121a26);border:1px solid var(--line);border-radius:16px;padding:9px;text-align:center}.gift .gn{font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift img{width:76px;height:76px;object-fit:contain;margin:4px auto}.gift .gp{font-size:10px;font-weight:900;color:#b8c7d8}.win{display:none;text-align:center;padding:20px 12px;background:linear-gradient(180deg,#182231,#111924);border-radius:20px;border:1px solid rgba(77,156,255,.25);margin:12px 0}.win.show{display:block;animation:winIn .35s ease}.win img{width:135px;height:135px;object-fit:contain;margin:auto}.win-name{font-size:18px;font-weight:950}.bottom-nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;width:min(calc(100% - 24px),480px);height:66px;padding:6px;background:rgba(18,24,32,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.07);border-radius:25px;box-shadow:0 15px 40px rgba(0,0,0,.4);display:flex}.bnav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:25%;height:54px;border-radius:20px;color:rgba(255,255,255,.42);font-weight:700;text-decoration:none}.bnav-item svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.bnav-item span{font-size:9px}.bnav-item.active{background:rgba(77,156,255,.15);color:#65aaff}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);padding:10px 15px;border-radius:13px;background:#242f3e;color:#fff;font-size:12px;font-weight:850;display:none;z-index:80}.toast.show{display:block;animation:toast .2s ease}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes winIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}@media(min-width:700px){.page{padding-top:18px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="page"><header class="top"><button class="back" onclick="location.href='/cases'" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="brand">Кейс</div><div class="balance"><img src="/static/img/gram.png" onerror="this.src='/static/img/ton.png'"><span id="balance">0,00</span></div></header><section class="hero"><img id="caseImage" class="case-img" src="/static/img/gift.png"><div id="caseTitle" class="title">Загрузка…</div><div class="price"><img src="/static/img/gram.png" onerror="this.src='/static/img/ton.png'"><span id="casePrice">0,00</span> грамм</div><div id="caseDesc" class="desc"></div></section><section class="roulette"><div id="track" class="track"></div></section><section class="controls"><div class="qty"><button class="active" onclick="setQty(1)">1</button><button onclick="setQty(2)">2</button><button onclick="setQty(3)">3</button></div><button id="openBtn" class="open" onclick="openCase()">Открыть кейс</button></section><section id="win" class="win"><img id="winImg"><div class="win-name" id="winName"></div><div class="price"><img src="/static/img/gram.png" onerror="this.src='/static/img/ton.png'"><span id="winPrice">0,00</span> грамм</div><button class="open" style="margin-top:12px" onclick="resetCase()">Ещё раз</button></section><div class="contents-title">Что в кейсе?</div><div id="contents" class="grid"></div></div><nav class="bottom-nav"><a class="bnav-item active" href="/cases"><svg viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="m4 8.5 8 4.5 8-4.5"/><path d="M12 13v7"/></svg><span>Кейсы</span></a><a class="bnav-item" href="/upgrade"><svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg><span>Апгрейды</span></a><a class="bnav-item" href="/games"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="M7 12h5M9.5 9.5v5"/><circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"/></svg><span>Игры</span></a><a class="bnav-item" href="/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Профиль</span></a></nav><div id="toast" class="toast"></div><script>
const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let current=null,qty=1,userId=null,balance=0,opening=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toFixed(2).replace('.',',');function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.remove('show'),1900)}function price(g){return g&&g.type==='ton_balance'?Number(g.ton_amount||0):Number(g?.value||0)/100}function image(g){return (g&&g.image)||'/static/img/gift.png'}async function auth(){try{const a=await telegramAuth();if(a?.id)userId=a.id}catch(e){}if(!userId&&window.Telegram?.WebApp?.initDataUnsafe?.user)userId=Telegram.WebApp.initDataUnsafe.user.id}async function load(){await auth();if(userId)try{const r=await fetch('/api/user/'+userId);const d=await r.json();if(d.success){balance=Number(d.user.balance_stars||0);$('balance').textContent=fmt(balance/100)}}catch(e){}try{const r=await fetch('/api/cases/by-slug/'+encodeURIComponent(slug));const d=await r.json();if(!d.success)throw Error(d.error||'Кейс не найден');current=d.case;$('caseTitle').textContent=current.name||'Кейс';$('caseDesc').textContent=current.description||'';$('casePrice').textContent=fmt(current.cost_type==='ton'?current.cost:Number(current.cost||0)/100);$('caseImage').src=current.image||'/static/img/gift.png';render()}catch(e){$('caseTitle').textContent='Кейс не найден';toast(e.message||'Кейс не найден')}}function render(){const gs=current?.gifts_details||[];$('contents').innerHTML=gs.map(g=>'<div class="gift"><div class="gn">'+esc(g.name||'Подарок')+'</div><img src="'+esc(image(g))+'"><div class="gp">'+fmt(price(g))+' грамм</div></div>').join('');let arr=[];for(let i=0;i<36;i++)if(gs.length)arr.push(gs[i%gs.length]);$('track').innerHTML=arr.map(g=>'<div class="ri"><div class="rprice">'+fmt(price(g))+'</div><img src="'+esc(image(g))+'"></div>').join('')}function setQty(n){qty=n;document.querySelectorAll('.qty button').forEach((b,i)=>b.classList.toggle('active',i===n-1))}async function openCase(){if(opening||!current)return;if(!userId){toast('Откройте через Telegram');return}opening=true;$('openBtn').disabled=true;$('openBtn').textContent='Открываем…';try{const r=await fetch('/api/cases/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,case_id:Number(current.id),quantity:qty})});const d=await r.json();if(!d.success)throw Error(d.error||'Ошибка открытия');balance=Number(d.new_balance?.stars??balance);$('balance').textContent=fmt(balance/100);spin(d.won_gifts||[d.won_gift].filter(Boolean))}catch(e){toast(e.message||'Ошибка открытия');opening=false;$('openBtn').disabled=false;$('openBtn').textContent='Открыть кейс'}}function spin(won){won=(won||[]).filter(Boolean);if(!won.length){toast('Подарок не найден');opening=false;$('openBtn').disabled=false;$('openBtn').textContent='Открыть кейс';return}const g=won[0],track=$('track'),target=28;track.style.transition='transform 5.6s cubic-bezier(.08,.82,.16,1)';track.style.transform='translateX(calc(50% - '+(target*116+54)+'px))';setTimeout(()=>{ $('winImg').src=image(g);$('winName').textContent=g.name||'Подарок';$('winPrice').textContent=fmt(price(g));$('win').classList.add('show');$('openBtn').style.display='none';opening=false;toast('Подарок получен')},5700)}function resetCase(){opening=false;$('win').classList.remove('show');$('openBtn').style.display='block';$('openBtn').disabled=false;$('openBtn').textContent='Открыть кейс';$('track').style.transition='none';$('track').style.transform='translateX(0)';render()}load();</script></body></html>
