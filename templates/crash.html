<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" href="/static/img/logo.png">
<link rel="stylesheet" href="/static/css/global.css">
<link rel="stylesheet" href="/static/css/crash-backgrounds.css">
<title>CRASH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{font-family:'Inter Variable','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1C2233;color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:none;z-index:-1}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:none}

@keyframes coeffShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}

/* CONTAINER */
.container{
    max-width:480px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;position:relative;
    padding-bottom:80px;
    padding-top:calc(env(safe-area-inset-top,20px) + 50px + 5vh);
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    z-index:4000;width:100%;max-width:480px;
    height:72px;padding:0 8px calc(env(safe-area-inset-bottom,0) + 8px);
    background:rgba(28,34,51,.92);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-top:1px solid rgba(59,130,246,.08);
    display:flex;align-items:center;justify-content:space-around;
}
.bottom-nav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:8px 16px;border-radius:12px;background:transparent;border:none;
    color:rgba(255,255,255,.4);font-family:inherit;font-weight:600;
    cursor:pointer;transition:all .3s;text-decoration:none;position:relative;
}
.bottom-nav-item svg{width:24px;height:24px;flex-shrink:0;stroke:currentColor;fill:none}
.bottom-nav-item span{font-size:10px;font-weight:600}
.bottom-nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.bottom-nav-item:active{transform:scale(.9)}

/* LOADING */
.ld-screen{position:fixed;inset:0;background:#1C2233;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s,visibility .5s;overflow:hidden}
.ld-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.ld-panels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:260px;margin-bottom:32px}
.ld-panel{width:76px;height:76px;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;animation:ldPanelPulse 2s ease-in-out infinite alternate}
.ld-panel:nth-child(1){background:#FF3333;animation-delay:0s}
.ld-panel:nth-child(2){background:#6E44E1;animation-delay:.12s}
.ld-panel:nth-child(3){background:#33CC55;animation-delay:.24s}
.ld-panel:nth-child(4){background:#FF1A75;animation-delay:.08s}
.ld-panel:nth-child(5){background:#FF8800;animation-delay:.2s}
.ld-panel:nth-child(6){background:#0088FF;animation-delay:.04s}
.ld-panel:nth-child(7){background:#AA33FF;animation-delay:.16s}
.ld-panel:nth-child(8){background:#33CCFF;animation-delay:.28s}
.ld-panel:nth-child(9){background:#FFCC00;animation-delay:.1s}
@keyframes ldPanelPulse{0%{transform:scale(1)}100%{transform:scale(1.04);box-shadow:0 0 25px rgba(255,255,255,.06)}}
.ld-panel img{width:54px;height:54px;object-fit:contain;opacity:0;transform:scale(.7)}
.ld-panel img.show{opacity:1;transform:scale(1);transition:opacity .4s,transform .4s}
.ld-txt{font-family:inherit;font-weight:700;font-size:13px;color:rgba(255,255,255,.5);letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
.ld-progress{width:240px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.ld-progress-bar{height:100%;background:linear-gradient(90deg,#fff,rgba(255,255,255,.7));width:0%;transition:width .3s;border-radius:3px}

/* TOP BAR */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;position:relative;z-index:10}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1.5px solid rgba(30,228,76,.45);background:rgba(30,228,76,.12);font-family:inherit;font-weight:700;font-size:13px;color:#1EE44C;backdrop-filter:blur(5px)}
.settings-btn-sm{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:all .2s;border:1px solid rgba(255,255,255,.12)}
.settings-btn-sm:active{transform:scale(.9)}
.bal-pill-crash{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:rgba(120,135,160,.1);border:1px solid rgba(120,135,160,.25);font-family:inherit;font-weight:700;font-size:13px;color:#fff;backdrop-filter:blur(5px)}
.bal-plus-crash{width:28px;height:28px;border-radius:50%;border:none;background:rgba(120,135,160,.3);color:#A0B0C4;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;border:1px solid rgba(120,135,160,.45)}
.bal-plus-crash:active{transform:scale(.9)}
.top-right-btns{display:flex;gap:8px;align-items:center}

/* GAME FIELD */
.game-field{
    margin:0 12px;border-radius:20px;
    background:#0B1120;
    border:1px solid rgba(59,130,246,.12);
    position:relative;overflow:hidden;
    min-height:320px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    z-index:1;
}
.game-field::before{
    content:'';position:absolute;inset:0;
    background:
        linear-gradient(rgba(99,160,255,.28) 1px,transparent 1px),
        linear-gradient(90deg,rgba(99,160,255,.28) 1px,transparent 1px);
    background-size:48px 48px;
    pointer-events:none;z-index:1;
}
.game-field.flying{box-shadow:inset 0 0 80px rgba(59,130,246,.06),0 0 30px rgba(59,130,246,.08)}

.countdown-display{
    font-family:inherit;font-weight:900;
    font-size:min(220px,45vw);
    color:rgba(255,255,255,.85);
    position:absolute;z-index:4;
    user-select:none;line-height:1;
    text-shadow:0 0 60px rgba(255,255,255,.15),0 0 30px rgba(160,175,200,.2);
    opacity:0;pointer-events:none;
}
.countdown-display.active{opacity:1;animation:cdPop .3s cubic-bezier(.22,.9,.2,1)}
@keyframes cdPop{0%{transform:scale(2);opacity:0}60%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}

/* ROCKET */
.rocket-wrap{
    position:absolute;top:52%;left:50%;
    transform:translate(-50%,-50%);
    z-index:2;transition:opacity .3s;
    opacity:1;
    will-change:transform,opacity;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}
.rocket-wrap img{
    width:180px;height:180px;
    object-fit:contain;
    border-radius:0;
    border:none;
    background:transparent;
    transition:transform .2s ease;
    will-change:transform;
    image-rendering:auto;
    transform:translateZ(0);
}
.rocket-wrap.showing-gift img{
    width:180px;
    height:180px;
    object-fit:contain;
    border-radius:20px;
    border:1.5px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.25);
    padding:8px;
    box-shadow:0 8px 32px rgba(0,0,0,.5), 0 0 40px rgba(59,130,246,.15);
    image-rendering:high-quality;
    filter:drop-shadow(0 4px 20px rgba(0,0,0,.4));
}
.rocket-wrap.hide{opacity:0;pointer-events:none}
.rocket-wrap.flying img{transform:rotate(18deg) translateZ(0)}
.rocket-wrap.flying.showing-gift img{transform:scale(1.05) translateZ(0) !important}
.rocket-wrap.cashed-out img{filter:grayscale(100%) brightness(.7)}

.boom-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;z-index:10;pointer-events:none;display:flex;align-items:center;justify-content:center}
.boom-wrap img{width:180px;height:180px;object-fit:contain}
.boom-wrap.show{opacity:1;animation:boomPop .4s ease-out forwards}
@keyframes boomPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.wait-label{font-size:13px;color:rgba(255,255,255,.25);font-weight:600;letter-spacing:1px;text-transform:uppercase;z-index:2;margin-top:8px;display:none}

/* BET AREA */
.bet-area{padding:8px 12px;position:relative;z-index:100}
.place-bet-btn{
    width:100%;padding:16px;border-radius:16px;border:none;
    font-family:inherit;font-weight:800;font-size:15px;
    cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#06B6D4,#3B82F6);color:#fff;
    box-shadow:0 8px 25px rgba(6,182,212,.25),inset 0 1px 1px rgba(255,255,255,.15);
    letter-spacing:.5px;text-transform:uppercase;
    border:2px solid rgba(6,182,212,.3);
    transition:transform .15s,box-shadow .15s;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;z-index:101;
}
.place-bet-btn:disabled{opacity:.35;cursor:default;transform:none !important}
.place-bet-btn:not(:disabled):active{transform:scale(.98)}
.place-bet-btn .btn-text{display:inline-block;pointer-events:none}

.cashout-btn{
    width:100%;padding:18px;border-radius:20px;border:none;
    font-family:inherit;font-weight:800;font-size:16px;
    cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(30,228,76,.9),rgba(24,184,62,.9));color:#061510;
    box-shadow:0 12px 35px rgba(30,228,76,.25),inset 0 1px 1px rgba(255,255,255,.15);
    display:none;letter-spacing:1px;text-transform:uppercase;
    border:2px solid rgba(255,255,255,.1);
    transition:transform .15s,box-shadow .15s;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;z-index:101;
}
.cashout-btn:not(:disabled):active{transform:scale(.98)}
.cashout-btn.crash-state{background:linear-gradient(135deg,rgba(220,60,80,.9),rgba(180,40,60,.9));color:#fff;cursor:default;pointer-events:none}

/* HISTORY */
.history-section{padding:8px 12px}
.history-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:0;scrollbar-width:none;-ms-overflow-style:none}
.history-scroll::-webkit-scrollbar{display:none}
.h-pill{padding:5px 12px;border-radius:20px;font-family:inherit;font-weight:700;font-size:12px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1.2}
.h-pill.low{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.08)}
.h-pill.mid{background:rgba(30,228,76,.12);color:#1EE44C;border:1px solid rgba(30,228,76,.2)}
.h-pill.high{background:rgba(255,200,0,.12);color:#FFC800;border:1px solid rgba(255,200,0,.2)}
.h-pill.mega{background:rgba(255,200,0,.18);color:#FFD700;border:1px solid rgba(255,200,0,.3);font-weight:800}

.coeff-box{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(30,228,76,.15);border:1px solid rgba(30,228,76,.3);
    border-radius:20px;padding:5px 12px;
    font-family:inherit;font-weight:800;font-size:13px;
    color:#1EE44C;margin-right:4px;flex-shrink:0;
}
.coeff-box.live{color:#1EE44C;border-color:rgba(30,228,76,.3)}
.coeff-box.crashed{background:rgba(220,60,80,.2);color:#F96999;border-color:rgba(249,105,153,.3);animation:coeffShake .5s ease}
.coeff-box.waiting{background:rgba(30,228,76,.15);color:#1EE44C}

/* BETS LIST */
.bets-section{padding:10px 12px 24px}
.bets-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bets-title{font-family:inherit;font-weight:800;font-size:14px;color:#fff}
.bets-count{font-size:12px;color:rgba(140,160,190,.8);font-weight:700;background:rgba(107,122,141,.15);padding:3px 10px;border-radius:10px}
.bets-list{display:flex;flex-direction:column;gap:6px;max-height:350px;overflow-y:auto}
.bet-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:rgba(28,34,51,.85);gap:10px}
.bet-row.won{background:rgba(30,228,76,.06)}
.bet-row.lost{background:rgba(249,105,153,.04)}
.bet-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.bet-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2a3040,#3a4558);display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:800;font-size:14px;color:rgba(255,255,255,.6);overflow:hidden;flex-shrink:0}
.bet-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.bet-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.bet-name{font-weight:700;font-size:13px;color:#fff;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-amt{font-size:12px;color:rgba(140,160,190,.7);font-weight:600;display:flex;align-items:center;gap:4px}
.bet-amt img{width:13px;height:13px;object-fit:contain;flex-shrink:0}
.bet-gift-stack{display:flex;align-items:center;flex-shrink:0}
.bet-gift-stack img{width:18px;height:18px;object-fit:cover;border-radius:4px;background:rgba(0,0,0,.3);margin-left:-6px}
.bet-gift-stack img:first-child{margin-left:0}
.bet-gift-stack .bet-gift-more{width:18px;height:18px;border-radius:50%;background:rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;margin-left:-4px;flex-shrink:0}
.bet-status{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 10px;border-radius:10px;font-family:inherit;font-weight:700;font-size:12px}
.bet-status svg{width:14px;height:14px;flex-shrink:0}
.bet-status.active{background:rgba(107,122,141,.12);color:rgba(160,180,200,.8)}
.bet-status.won{background:rgba(30,228,76,.12);color:#1EE44C}
.bet-status.lost{background:rgba(249,105,153,.1);color:#F96999}
.no-bets{text-align:center;padding:40px;color:rgba(255,255,255,.2);font-size:14px}

/* BET MODAL */
.modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5000;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;backdrop-filter:blur(3px);
    transition:opacity .25s,visibility .25s;
}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-sheet{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px 24px 0 0;
    width:100%;max-width:480px;max-height:85vh;overflow-y:auto;overflow-x:hidden;
    padding:20px 16px 30px;transform:translateY(100%);
    border-top:1px solid rgba(59,130,246,.2);
    transition:transform .3s cubic-bezier(.34,.69,.7,1);
    box-shadow:0 -8px 40px rgba(0,0,0,.6);
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:rgba(120,135,160,.2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:inherit;font-weight:900;font-size:17px;margin-bottom:18px;text-align:center;color:#fff}
.modal-tabs{display:flex;gap:3px;margin-bottom:16px;background:rgba(255,255,255,.02);border-radius:12px;padding:4px}
.modal-tab{flex:1;padding:10px;border-radius:9px;border:none;background:transparent;color:rgba(255,255,255,.35);font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;outline:none;display:flex;align-items:center;justify-content:center;gap:4px}
.modal-tab.active{background:rgba(59,130,246,.12);color:#3B82F6;border:1px solid rgba(59,130,246,.3)}
.modal-tab img{width:14px;height:14px;vertical-align:middle}

.bet-input-wrap{display:flex;gap:8px;margin-bottom:14px}
.bet-input-wrap input{flex:1;padding:14px 18px;border-radius:14px;border:1px solid rgba(59,130,246,.15);background:rgba(59,130,246,.05);color:#fff;font-size:17px;font-family:inherit;font-weight:700;outline:none;transition:border-color .1s;text-align:center;caret-color:#3B82F6}
.bet-input-wrap input:focus{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.08)}
.bet-input-wrap input::placeholder{color:rgba(255,255,255,.25);font-weight:600}

.confirm-bet-btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:all .1s;box-shadow:0 4px 16px rgba(59,130,246,.3);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.confirm-bet-btn:active:not(:disabled){transform:scale(.96)}
.confirm-bet-btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important}

.auto-cashout-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px;border-radius:12px;background:rgba(30,228,76,.08);border:1px solid rgba(30,228,76,.15)}
.auto-cashout-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-family:inherit;font-weight:700;font-size:11px;color:rgba(255,255,255,.5)}
.auto-cashout-toggle input[type="checkbox"]{display:none}
.auto-cashout-check{width:20px;height:20px;border-radius:6px;border:2px solid rgba(30,228,76,.3);background:rgba(30,228,76,.04);display:flex;align-items:center;justify-content:center;transition:all .1s;flex-shrink:0}
.auto-cashout-check svg{width:12px;height:12px;opacity:0;transition:opacity .1s}
.auto-cashout-toggle input:checked ~ .auto-cashout-check{background:rgba(30,228,76,.15);border-color:rgba(30,228,76,.6)}
.auto-cashout-toggle input:checked ~ .auto-cashout-check svg{opacity:1}
.auto-cashout-input{width:65px;padding:8px;border-radius:9px;border:1.5px solid rgba(30,228,76,.25);background:rgba(30,228,76,.04);color:#1EE44C;font-size:13px;font-family:inherit;font-weight:700;outline:none;text-align:center;caret-color:#1EE44C}
.auto-cashout-input:focus{border-color:rgba(30,228,76,.5);background:rgba(30,228,76,.08)}

/* INVENTORY BETS */
.selected-summary{display:none;background:rgba(59,130,246,.08);border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(59,130,246,.15)}
.selected-summary.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
.selected-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.selected-count{font-family:inherit;font-weight:700;font-size:12px;color:rgba(255,255,255,.6)}
.selected-total{font-family:inherit;font-weight:800;font-size:15px;color:#3B82F6;display:flex;align-items:center;gap:4px}
.selected-total img{width:15px;height:15px}
.clear-selected{padding:8px 12px;border-radius:9px;border:none;background:rgba(249,105,153,.15);color:#E8527A;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer;flex-shrink:0}

.inv-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    max-height:420px;
    overflow-y:auto;
    overflow-x:hidden;
    padding:4px;
    box-sizing:border-box;
}
.inv-grid::-webkit-scrollbar{width:3px}
.inv-grid::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}

.inv-card{
    background:linear-gradient(160deg,rgba(59,130,246,.06),rgba(59,130,246,.02));
    border:1.5px solid rgba(59,130,246,.15);
    border-radius:14px;
    padding:6px;
    text-align:center;
    cursor:pointer;
    transition:all .15s;
    position:relative;
    min-width:0;
    max-width:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-sizing:border-box;
}
.inv-card:hover{border-color:rgba(59,130,246,.4);background:linear-gradient(160deg,rgba(59,130,246,.12),rgba(59,130,246,.04));transform:translateY(-2px)}
.inv-card:active{transform:scale(.96)}
.inv-card.selected{border-color:#3B82F6;background:rgba(59,130,246,.18);box-shadow:0 0 0 2px rgba(59,130,246,.4), 0 0 20px rgba(59,130,246,.25)}
.inv-card.selected::after{content:'✓';position:absolute;top:6px;right:6px;width:22px;height:22px;background:linear-gradient(135deg,#3B82F6,#2563EB);border-radius:50%;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:800;z-index:2;box-shadow:0 2px 8px rgba(59,130,246,.5)}
.inv-card img{width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;margin:0 0 4px 0;display:block;flex-shrink:0;border-radius:8px;background:rgba(0,0,0,.2);padding:4px;box-sizing:border-box;image-rendering:-webkit-optimize-contrast}
.inv-card .inv-name{font-family:inherit;font-weight:700;font-size:10px;color:rgba(255,255,255,.85);padding:2px 2px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;min-height:0}
.inv-card .inv-val{font-family:inherit;font-weight:800;font-size:11px;color:#8CA0BE;padding:3px 4px 4px;display:flex;align-items:center;justify-content:center;gap:3px;flex-shrink:0;line-height:1;background:rgba(59,130,246,.08);border-radius:6px;margin-top:2px}
.inv-card .inv-val img{width:12px;height:12px;aspect-ratio:auto;border-radius:0;object-fit:contain;background:none;padding:0;margin:0}
.inv-card.selected .inv-val{color:#fff;background:rgba(59,130,246,.2)}
.inv-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:rgba(255,255,255,.3);font-size:13px}

.confirm-gifts-btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:all .1s;box-shadow:0 4px 16px rgba(59,130,246,.3);margin-top:12px;display:none}
.confirm-gifts-btn.show{display:block}
.confirm-gifts-btn:active:not(:disabled){transform:scale(.96)}
.confirm-gifts-btn:disabled{opacity:.45;cursor:default}

/* WIN SHEET */
.win-overlay{position:fixed;bottom:0;left:0;right:0;z-index:6000;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s,transform .4s cubic-bezier(.16,1,.3,1);transform:translateY(100%);pointer-events:none}
.win-overlay.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.win-sheet{background:linear-gradient(180deg,#1e2433 0%,#151920 100%);border-radius:20px 20px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0));border-top:2px solid rgba(59,130,246,.25);box-shadow:0 -8px 40px rgba(0,0,0,.5);max-width:480px;margin:0 auto}
.win-sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto 14px}

/* WIN GIFT HERO — улучшено со свечением */
.win-gift-hero{
    display:flex;align-items:center;justify-content:center;
    padding:14px 0 16px;
    position:relative;
}
.win-gift-hero::before{
    content:'';
    position:absolute;
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(59,130,246,.25) 0%,transparent 70%);
    animation:winGlow 2s ease-in-out infinite alternate;
    pointer-events:none;
}
@keyframes winGlow{
    0%{opacity:.5;transform:scale(.9)}
    100%{opacity:1;transform:scale(1.1)}
}
.win-gift-hero img{
    position:relative;
    z-index:1;
    width:130px;height:130px;
    object-fit:contain;
    border-radius:24px;
    background:linear-gradient(160deg,rgba(59,130,246,.12),rgba(59,130,246,.02));
    padding:12px;
    border:2px solid rgba(59,130,246,.3);
    box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 60px rgba(59,130,246,.2);
    image-rendering:-webkit-optimize-contrast;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));
    animation:winGiftPop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes winGiftPop{
    0%{transform:scale(.5) rotate(-15deg);opacity:0}
    60%{transform:scale(1.15) rotate(5deg)}
    100%{transform:scale(1) rotate(0);opacity:1}
}

.win-mult-badge{display:flex;align-items:center;justify-content:center;padding:6px 0 4px}
.win-mult-badge span{font-family:inherit;font-weight:900;font-size:28px;background:linear-gradient(135deg,#c471f5,#fa71cd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.win-title{text-align:center;font-family:inherit;font-weight:900;font-size:24px;color:#fff;padding:2px 0 8px}
.win-summary{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0}
.win-summary-item{display:flex;align-items:center;gap:4px;font-family:inherit;font-weight:700;font-size:13px;color:rgba(255,255,255,.5)}
.win-summary-item img{width:14px;height:14px}
.win-summary-arrow{font-size:14px;color:rgba(255,255,255,.2)}
.win-summary-win{color:#1EE44C}
.win-breakdown{text-align:center;padding:4px 0 12px;font-family:inherit;font-weight:600;font-size:12px;color:rgba(255,255,255,.4)}
.win-collect-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:all .2s;margin-top:4px}
.win-collect-btn:active{transform:scale(.97);opacity:.85}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.95);backdrop-filter:blur(4px);padding:10px 20px;border-radius:14px;border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:7000;color:#fff;font-family:inherit;font-weight:700;font-size:13px;animation:toastUp .3s ease;max-width:90%;text-align:center}
.toast.ok{border-color:rgba(30,228,76,.2)}
.toast.err{border-color:rgba(249,105,153,.2)}
@keyframes toastUp{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%);opacity:1}}

/* DEPOSIT */
.deposit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5650;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;backdrop-filter:blur(8px);transition:opacity .3s,visibility .3s}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{background:linear-gradient(180deg,#1E2538,#151B2D);border-radius:24px;width:90%;max-width:360px;padding:24px 20px;transform:scale(.9);transition:transform .3s cubic-bezier(.175,.885,.32,1.275);border:1px solid rgba(255,255,255,.1)}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.deposit-title{font-family:inherit;font-weight:800;font-size:18px;color:#fff}
.deposit-close{width:32px;height:32px;border-radius:10px;border:none;background:rgba(249,105,153,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#F96999;font-size:18px;font-weight:700}
.deposit-methods{display:flex;gap:12px}
.deposit-method-btn{position:relative;flex:1;padding:20px 14px;border-radius:16px;border:none;background:rgba(255,255,255,.04);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;transition:all .2s;border:2px solid rgba(255,255,255,.06)}
.deposit-method-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);transform:translateY(-2px)}
.deposit-method-btn:active{transform:scale(.97)}
.deposit-method-btn img{width:48px;height:48px;object-fit:contain}
.deposit-method-btn span{font-family:inherit;font-weight:700;font-size:13px;color:#fff}
.deposit-method-btn.disabled{opacity:.35;pointer-events:none;filter:grayscale(1)}

/* STARS DEPOSIT */
.stars-deposit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5750;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;backdrop-filter:blur(8px);transition:opacity .3s,visibility .3s}
.stars-deposit-overlay.show{opacity:1;visibility:visible}
.stars-deposit-modal{background:linear-gradient(180deg,#1E2538,#151B2D);border-radius:24px;width:92%;max-width:380px;overflow:hidden;transform:scale(.9);transition:transform .3s cubic-bezier(.175,.885,.32,1.275);border:1px solid rgba(255,255,255,.1)}
.stars-deposit-overlay.show .stars-deposit-modal{transform:scale(1)}
.stars-deposit-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.stars-deposit-title{font-family:inherit;font-weight:800;font-size:16px;color:#fff}
.stars-deposit-close{width:32px;height:32px;border-radius:50%;border:none;background:rgba(249,105,153,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#F96999;font-size:18px;font-weight:700}
.stars-deposit-body{padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:18px}
.stars-deposit-icon{width:64px;height:64px;object-fit:contain}
.stars-deposit-label{font-family:inherit;font-size:13px;color:rgba(255,255,255,.5);text-align:center}
.stars-deposit-input-wrap{width:100%;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 16px;border:2px solid rgba(255,255,255,.08);transition:border-color .2s}
.stars-deposit-input-wrap:focus-within{border-color:rgba(255,193,7,.4)}
.stars-deposit-input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:20px;font-weight:700;text-align:center}
.stars-deposit-input::placeholder{color:rgba(255,255,255,.2)}
.stars-deposit-pay-btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#FFC107,#FF9800);color:#000;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.stars-deposit-pay-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,193,7,.3)}
.stars-deposit-pay-btn:disabled{opacity:.5;pointer-events:none}
.stars-deposit-pay-btn img{width:18px;height:18px}

/* SETTINGS */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5600;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;backdrop-filter:blur(6px);transition:opacity .3s,visibility .3s}
.settings-overlay.show{opacity:1;visibility:visible}
.settings-modal{background:linear-gradient(180deg,#1E2538,#151B2D);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:82vh;overflow:hidden;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,.9,.2,1);border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column}
.settings-overlay.show .settings-modal{transform:translateY(0)}
.settings-content{padding:16px 18px;overflow-y:auto;flex:1;scrollbar-width:none}
.settings-content::-webkit-scrollbar{display:none}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.settings-item{background:rgba(255,255,255,.04);border-radius:16px;padding:12px;text-align:center;cursor:pointer;position:relative;border:2px solid transparent;transition:all .2s}
.settings-item:hover{background:rgba(255,255,255,.08)}
.settings-item.active{border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.1)}
.settings-item img{width:60px;height:60px;object-fit:contain;border-radius:12px}

.settings-gift-toggle{
    margin-bottom:16px;
    padding:14px;
    border-radius:14px;
    background:rgba(59,130,246,.06);
    border:1px solid rgba(59,130,246,.15);
}
.settings-gift-toggle label{
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px;
}
.settings-gift-toggle .lbl{
    font-family:inherit;font-weight:700;font-size:14px;color:#fff;
}
.settings-gift-toggle .desc{
    font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;
}
.settings-gift-toggle input[type="checkbox"]{
    width:22px;height:22px;cursor:pointer;accent-color:#3B82F6;flex-shrink:0;
}

/* MOBILE */
@media(max-width:600px){
    .game-field{margin:0 8px;border-radius:20px;aspect-ratio:10/9;min-height:auto}
    .rocket-wrap img{width:210px;height:210px}
    .rocket-wrap.showing-gift img{width:225px;height:225px}
}
@media(max-width:400px){
    .countdown-display{font-size:min(180px,40vw)}
    .game-field{aspect-ratio:10/9;min-height:auto;margin:0 6px;border-radius:16px}
    .rocket-wrap img{width:180px;height:180px}
    .rocket-wrap.showing-gift img{width:195px;height:195px}
    .top-bar{padding:8px 12px}
    .bal-pill-crash{padding:5px 10px;font-size:12px}
    .bet-row{padding:8px 10px}
    .inv-card .inv-name{font-size:9px}
    .inv-card .inv-val{font-size:10px}
}
</style>

                        <div class="lbl">Показывать подарки</div>
                        <div class="desc">Вместо ракеты — подарок при достижимом выигрыше</div>
                    </div>
                    <input type="checkbox" id="showGiftsToggle" onchange="toggleShowGifts(this)">
                </label>
            </div>

            <div class="settings-grid" id="rocketGrid"></div>
        </div>
        <button onclick="closeSettings()" style="margin:0 18px 18px;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#1e3a6e,#6B7A8D);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;width:calc(100% - 36px)">close</button>
    </div>
</div>

<!-- WIN SHEET -->
<div class="win-overlay" id="winOverlay">
    <div class="win-sheet">
        <div class="win-sheet-handle"></div>
        <div id="winContent"></div>
        <button class="win-collect-btn" onclick="closeWin()">Получить</button>
    </div>
</div>

<script>
/* ==================================================
   CRASH CORE v4 — с патчами
   ================================================== */

var userData = null;
var authReady = false;

function isTelegramWebApp(){
    return typeof Telegram !== 'undefined' && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user;
}

let gameId = null, prevGameId = null;
let status = 'counting', prevSt = 'counting';
let dispMult = 1.0, servMult = 1.0;
let hasBet = false, betAmt = 0;
let betIsGift = false;
let betGiftImg = null;
let cashedOut = false;
let cashedOutBetAmt = 0;
let cashedOutGiftImg = null;
let crashDone = false;
let lastBetsHash = '';
let betsGeneration = 0;
let countdownShown = -1;
let lastTimeRemaining = 99;
let lastTrTimestamp = 0;
let autoCashoutDone = false;
let boomUntil = 0;
let pendingBet = null;
let savedBetAmount = localStorage.getItem('crash_bet_amount') || '';
let selectedGift = null;
let inventoryItems = [];
let currentRocket = localStorage.getItem('crash_rocket') || 'crash';
let showGifts = localStorage.getItem('crash_show_gifts') !== 'off';

const $ = id => document.getElementById(id);

function formatCrashMoney(stars){
    var t = Number(stars||0)/100;
    if(t === 0) return '0.00';
    if(t >= 100) return t.toFixed(0);
    if(t >= 10) return t.toFixed(1);
    return t.toFixed(2);
}
function starsToTon(s){ return Number(s||0)/100; }
function formatTon(t){ return (Math.round(Number(t||0)*100)/100).toFixed(2); }

function updateUI(data){
    if(!data) return;
    var el = $('balVal');
    if(el) el.textContent = formatCrashMoney(data.balance_stars||0);
}

/* LOADING */
(function(){
    var bar = $('ldProgressBar');
    var txt = $('ldTxt');
    var imgs = document.querySelectorAll('.ld-panel img');
    window._ldP = 0;

    for(var i = 0; i < imgs.length; i++){
        (function(idx){
            setTimeout(function(){
                imgs[idx].src = '/static/img/star.png';
                imgs[idx].classList.add('show');
            }, idx * 60);
        })(i);
    }

    var simId = setInterval(function(){
        if(window._ldP >= 40){ clearInterval(simId); return; }
        window._ldP += 0.8;
        if(bar) bar.style.width = window._ldP + '%';
        if(txt) txt.textContent = 'LOADING ' + Math.round(window._ldP) + '%';
    }, 80);

    window._ldUpdate = function(pct){
        if(pct <= window._ldP) return;
        window._ldP = pct;
        if(bar) bar.style.width = pct + '%';
        if(txt) txt.textContent = 'LOADING ' + Math.round(pct) + '%';
    };

    window._ldDone = function(){
        if(bar) bar.style.width = '100%';
        if(txt) txt.textContent = 'READY!';
        setTimeout(function(){
            var ls = $('ldScreen');
            if(ls){
                ls.classList.add('hidden');
                setTimeout(function(){ ls.style.display = 'none'; }, 500);
            }
        }, 300);
    };
})();

/* AUTH */
async function initTelegramApp(){
    if(window._ldUpdate) window._ldUpdate(5);

    const saved = localStorage.getItem('rasswet_user');
    if(saved){
        try{
            const p = JSON.parse(saved);
            if(p && p.id) userData = p;
        }catch(e){}
    }

    if(!userData || !userData.id){
        if(isTelegramWebApp()){
            try{
                const tg = Telegram.WebApp;
                tg.ready(); tg.expand();
                try{ if(tg.requestFullscreen) tg.requestFullscreen(); }catch(e){}
                const u = tg.initDataUnsafe.user;
                if(u){
                    userData = {
                        id: u.id, first_name: u.first_name,
                        last_name: u.last_name||'', username: u.username||'',
                        photo_url: u.photo_url||'',
                        balance_stars: 0, balance_tickets: 0
                    };
                }
            }catch(e){ console.error('TG err:', e); }
        }
    }

    if(window._ldUpdate) window._ldUpdate(15);

    if(!userData || !userData.id){
        try{
            const a = await Promise.race([
                telegramAuth(),
                new Promise((_,r) => setTimeout(() => r('timeout'), 4000))
            ]);
            if(a && a.id) userData = a;
        }catch(e){}
    }

    if(!userData || !userData.id){
        userData = {id: 0, first_name: 'Player', balance_stars: 0, balance_tickets: 0};
    }

    updateUI(userData);

    if(userData.id){
        registerUser();
        loadUserData();
    }

    authReady = true;
    if(window._ldUpdate) window._ldUpdate(30);

    if(userData.id){
        try{
            const ac = new AbortController();
            setTimeout(() => ac.abort(), 4000);
            const br = await fetch('/api/check-ban?user_id=' + userData.id, {signal: ac.signal});
            const bd = await br.json();
            if(bd.success && bd.banned){ window.location.href = '/ban'; return; }
        }catch(e){}
    }

    if(window._ldUpdate) window._ldUpdate(50);

    try{
        const rc = await fetch('/api/crash/customizations');
        const rd = await rc.json();
        if(rd.success && rd.rockets){
            window._rocketsData = rd.rockets || [];
        }
    }catch(e){}

    if(window._ldUpdate) window._ldUpdate(80);

    applyRocket();
    if(window._ldUpdate) window._ldUpdate(95);
    if(window._ldDone) window._ldDone();

    updStatus();
    loadBets();
    loadHist();
    ensureGiftCatalog();

    if(savedBetAmount) setBetInputFromStars(savedBetAmount);

    var _statusPending = false, _betsPending = false;
    function pollStatus(){
        if(_statusPending) return;
        _statusPending = true;
        updStatus().finally(() => { _statusPending = false; });
    }
    function pollBets(){
        if(_betsPending) return;
        _betsPending = true;
        loadBets().finally(() => { _betsPending = false; });
    }

    setInterval(pollStatus, 800);
    setInterval(loadUserData, 20000);
    setInterval(pollBets, 1200);
    setInterval(function(){ fetch('/api/ping').catch(()=>{}); }, 30000);

    document.addEventListener('visibilitychange', function(){
        if(!document.hidden){ pollStatus(); pollBets(); }
    });

    requestAnimationFrame(render);
}

async function loadUserData(){
    if(!userData || !userData.id) return;
    try{
        const r = await fetch('/api/user/' + userData.id);
        const d = await r.json();
        if(d.success){
            userData = Object.assign({}, userData, d.user);
            updateUI(userData);
            try{ localStorage.setItem('rasswet_user', JSON.stringify(userData)); }catch(e){}
        } else { await registerUser(); }
    }catch(e){}
}

async function registerUser(){
    if(!userData || !userData.id) return;
    try{
        const r = await fetch('/api/telegram-auth', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(userData)
        });
        const d = await r.json();
        if(d.success){
            userData = Object.assign({}, userData, d.user);
            updateUI(userData);
            try{ localStorage.setItem('rasswet_user', JSON.stringify(userData)); }catch(e){}
        }
    }catch(e){}
}

/* BET MODAL */
function openBetModal(){
    try{ playSound('click'); }catch(e){}
    if(pendingBet){ cancelPendingBet(); return; }
    if(hasBet){ showToast('Ставка уже сделана','err'); return; }
    var modal = $('betModal');
    if(!modal) return;
    modal.classList.add('show');
    var bi = $('betInput');
    if(bi && savedBetAmount) bi.value = starsToBetInputValue(savedBetAmount);
}

function closeBetModal(){
    var modal = $('betModal');
    if(modal) modal.classList.remove('show');
    selectedGift = null;
    updateSelectedSummary();
}

function cancelPendingBet(){
    pendingBet = null;
    showToast('Отменено','ok');
    updateBetButton();
}

document.addEventListener('DOMContentLoaded', function(){
    var m = $('betModal');
    if(m) m.addEventListener('click', function(e){ if(e.target === m) closeBetModal(); });
});

function switchTab(tab){
    var t1 = $('tabStars');
    var t2 = $('tabInv');
    if(t1) t1.classList.toggle('active', tab === 'stars');
    if(t2) t2.classList.toggle('active', tab === 'inv');
    var ss = $('starsSec');
    var is_ = $('invSec');
    if(ss) ss.style.display = tab === 'stars' ? 'block' : 'none';
    if(is_) is_.style.display = tab === 'inv' ? 'block' : 'none';
    if(tab === 'inv') loadInventory();
}

function starsToBetInputValue(stars){
    var tons = Number(stars||0)/100;
    return (Math.round(tons*100)/100).toString().replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
}
function parseBetInputToStars(raw){
    var tons = parseFloat(String(raw||'').replace(',','.'));
    if(!tons || tons <= 0) return 0;
    return Math.round(tons*100);
}
function setBetInputFromStars(stars){
    var i = $('betInput');
    if(i) i.value = starsToBetInputValue(stars);
}

/* CONFIRM STARS BET — МГНОВЕННО */
var _betLocked = false;
async function confirmStarsBet(){
    if(_betLocked) return;
    if(!userData || !userData.id){ showToast('Auth error','err'); return; }
    var input = $('betInput');
    if(!input) return;
    var amt = parseBetInputToStars(input.value);
    if(!amt || amt < 10){ showToast('Мин. 0.1 TON','err'); return; }
    if(amt > (userData.balance_stars||0)){ showToast('Недостаточно средств','err'); return; }

    _betLocked = true;
    savedBetAmount = amt;
    try{ localStorage.setItem('crash_bet_amount', amt); }catch(e){}

    if(status === 'flying'){
        pendingBet = {type:'stars', amount: amt};
        closeBetModal();
        showToast('Ставка на след. раунд','ok');
        updateBetButton();
        _betLocked = false;
        return;
    }

    /* МГНОВЕННЫЙ UI */
    hasBet = true;
    betAmt = amt;
    betIsGift = false;
    betGiftImg = null;
    userData.balance_stars = (userData.balance_stars||0) - amt;
    updateUI(userData);
    closeBetModal();
    updateBetButton();
    showToast('Ставка '+formatCrashMoney(amt)+' принята!','ok');
    try{ playSound('bet'); }catch(e){}
    try{ triggerVibration([30]); }catch(e){}

    (async function(){
        try{
            var r = await fetch('/api/ultimate-crash/place-bet', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({user_id: userData.id, bet_amount: amt})
            });
            var d = await r.json();
            if(d.success){
                userData.balance_stars = d.new_balance;
                updateUI(userData);
                try{ localStorage.setItem('rasswet_user', JSON.stringify(userData)); }catch(e){}
                loadBets();
            } else {
                hasBet = false;
                betAmt = 0;
                userData.balance_stars = (userData.balance_stars||0) + amt;
                updateUI(userData);
                var err = (d.error||'').toLowerCase();
                if(err.indexOf('late') !== -1 || err.indexOf('начал') !== -1){
                    pendingBet = {type:'stars', amount: amt};
                    showToast('Ставка на след. раунд','ok');
                } else {
                    showToast(d.error || 'Ошибка','err');
                }
                updateBetButton();
            }
        }catch(e){
            hasBet = false;
            betAmt = 0;
            userData.balance_stars = (userData.balance_stars||0) + amt;
            updateUI(userData);
            updateBetButton();
            showToast('Ошибка сети','err');
        }finally{
            _betLocked = false;
        }
    })();
}

async function processPendingBet(){
    if(!pendingBet) return;
    var bet = pendingBet;
    pendingBet = null;
    if(bet.type === 'stars'){
        try{
            var r = await fetch('/api/ultimate-crash/place-bet', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({user_id: userData.id, bet_amount: bet.amount})
            });
            var d = await r.json();
            if(d.success){
                hasBet = true;
                betAmt = bet.amount;
                userData.balance_stars = d.new_balance;
                updateUI(userData);
                showToast('Ставка принята!','ok');
                loadBets();
            }
        }catch(e){}
    } else if(bet.type === 'gift' && bet.inventoryId){
        try{
            var rg = await fetch('/api/ultimate-crash/place-bet-gift', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({user_id: userData.id, inventory_id: bet.inventoryId})
            });
            var dg = await rg.json();
            if(dg.success){
                hasBet = true;
                betAmt = dg.bet_amount || bet.amount;
                betIsGift = true;
                betGiftImg = bet.giftImage || null;
                showToast('Ставка подарком принята!','ok');
                loadBets();
            }
        }catch(e){}
    }
    updateBetButton();
}

/* CASHOUT */
var cashoutLocked = false;
async function doCashout(){
    if(!hasBet || !userData || !userData.id) return;
    if(cashoutLocked) return;
    cashoutLocked = true;

    var btn = $('cashoutBtn');
    var pb = $('placeBetBtn');
    var mult = Math.max(dispMult, servMult);
    var instantWin = Math.floor(betAmt * mult);

    cashedOutBetAmt = betAmt;
    cashedOutGiftImg = betGiftImg;
    cashedOut = true;

    if(btn) btn.style.display = 'none';
    if(pb){
        pb.style.display = 'block';
        pb.disabled = true;
        pb.innerHTML = '<span class="btn-text">+'+formatCrashMoney(instantWin)+'</span>';
        pb.style.pointerEvents = 'none';
    }

    try{ triggerVibration([50,30,50,30,100]); }catch(e){}
    try{ playSound('cashout'); }catch(e){}

    try{
        var r = await fetch('/api/ultimate-crash/cashout-simple', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({user_id: userData.id, client_mult: mult})
        });
        var d = await r.json();
        if(d.success){
            hasBet = false;
            betAmt = 0;
            betGiftImg = null;
            userData.balance_stars = d.new_balance;
            updateUI(userData);
            try{ playSound('win'); }catch(e){}
            showWin(d);
            loadBets();
        } else {
            cashedOut = false;
            cashedOutGiftImg = null;
            hasBet = true;
            if(btn){ btn.style.display='block'; btn.disabled=false; btn.className='cashout-btn'; btn.textContent='COLLECT'; }
            if(pb) pb.style.display = 'none';
            showToast(d.error || 'Ошибка','err');
        }
    }catch(e){
        cashedOut = false;
        cashedOutGiftImg = null;
        hasBet = true;
        if(btn){ btn.style.display='block'; btn.disabled=false; btn.className='cashout-btn'; btn.textContent='COLLECT'; }
        if(pb) pb.style.display = 'none';
        showToast('Ошибка сети','err');
    }finally{
        cashoutLocked = false;
    }
}

function updateBetButton(){
    var pb = $('placeBetBtn');
    if(!pb) return;
    if(status === 'flying'){
        if(pendingBet){
            pb.innerHTML = '<span class="btn-text">CANCEL ('+formatCrashMoney(pendingBet.amount)+')</span>';
            pb.disabled = false;
        } else {
            pb.innerHTML = '<span class="btn-text">BET ON NEXT</span>';
            pb.disabled = false;
        }
    } else if(status === 'waiting' || status === 'counting'){
        if(hasBet){ pb.innerHTML = '<span class="btn-text">BET PLACED</span>'; pb.disabled = true; }
        else if(pendingBet){ pb.innerHTML = '<span class="btn-text">CANCEL ('+formatCrashMoney(pendingBet.amount)+')</span>'; pb.disabled = false; }
        else { pb.innerHTML = '<span class="btn-text">Place bet</span>'; pb.disabled = false; }
    }
}

/* INVENTORY */
async function loadInventory(){
    if(!userData || !userData.id) return;
    try{
        var r = await fetch('/api/inventory/'+userData.id);
        if(!r.ok) return;
        var d = await r.json();
        var grid = $('invGrid');
        if(!grid) return;

        var NON_BET = [110];
        inventoryItems = (d.inventory||[]).filter(function(i){
            return !i.is_withdrawing && i.gift_value >= 25 && NON_BET.indexOf(Number(i.gift_id)) === -1;
        });

        if(!inventoryItems.length){
            grid.innerHTML = '<div class="inv-empty">Нет подарков для ставок (мин. 25⭐)</div>';
            return;
        }

        grid.innerHTML = inventoryItems.map(function(i){
            var isSel = selectedGift && selectedGift.id === i.id;
            var tonVal = (i.gift_value/100).toFixed(2);
            var img = i.gift_image || '/static/img/gift.png';
            return '<div class="inv-card'+(isSel?' selected':'')+'" data-id="'+i.id+'" onclick="toggleGiftSelection('+i.id+')">'
                +'<img src="'+img+'" onerror="this.src=\'/static/img/gift.png\'" loading="lazy" alt="">'
                +'<div class="inv-name">'+(i.gift_name||'').substring(0,16)+'</div>'
                +'<div class="inv-val"><img src="/static/img/ton.png" alt="">'+tonVal+'</div>'
                +'</div>';
        }).join('');
    }catch(e){}
}

function toggleGiftSelection(id){
    var item = inventoryItems.find(function(i){ return i.id === id; });
    if(!item) return;
    if(selectedGift && selectedGift.id === id){
        selectedGift = null;
    } else {
        selectedGift = {
            id: item.id,
            name: item.gift_name,
            value: item.gift_value,
            image: item.gift_image
        };
    }
    document.querySelectorAll('.inv-card').forEach(function(c){
        c.classList.toggle('selected', selectedGift && c.dataset.id === String(selectedGift.id));
    });
    updateSelectedSummary();
}

function clearSelectedGifts(){
    selectedGift = null;
    document.querySelectorAll('.inv-card').forEach(function(c){ c.classList.remove('selected'); });
    updateSelectedSummary();
}

function updateSelectedSummary(){
    var sum = $('selectedSummary');
    var cnt = $('selectedCount');
    var tot = $('selectedTotal');
    var btn = $('confirmGiftsBtn');

    if(!selectedGift){
        if(sum) sum.classList.remove('show');
        if(btn) btn.classList.remove('show');
        return;
    }

    if(cnt) cnt.textContent = '1';
    if(tot) tot.textContent = (selectedGift.value/100).toFixed(2);
    if(sum) sum.classList.add('show');
    if(btn){
        btn.classList.add('show');
        btn.textContent = 'BET GIFT ('+(selectedGift.value/100).toFixed(2)+' TON)';
    }
}

/* CONFIRM GIFT BET — МГНОВЕННО */
var _giftLocked = false;
async function confirmGiftBet(){
    if(_giftLocked) return;
    if(!selectedGift){ showToast('Выберите подарок','err'); return; }
    if(!userData || !userData.id) return;

    _giftLocked = true;
    var sGift = selectedGift;

    if(status === 'flying'){
        pendingBet = {type:'gift', amount: sGift.value, inventoryId: sGift.id, giftImage: sGift.image};
        closeBetModal();
        showToast('Подарок на след. раунд','ok');
        updateBetButton();
        _giftLocked = false;
        return;
    }

    hasBet = true;
    betAmt = sGift.value;
    betIsGift = true;
    betGiftImg = sGift.image;
    closeBetModal();
    updateBetButton();
    showToast('Подарок ' + (sGift.name||'').substring(0,20) + ' — принят!','ok');
    try{ playSound('bet'); }catch(e){}
    try{ triggerVibration([30]); }catch(e){}

    (async function(){
        try{
            var r = await fetch('/api/ultimate-crash/place-bet-gift', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({user_id: userData.id, inventory_id: sGift.id})
            });
            var d = await r.json();
            if(d.success){
                betAmt = d.bet_amount || sGift.value;
                loadBets();
            } else {
                hasBet = false;
                betAmt = 0;
                betGiftImg = null;
                showToast(d.error || 'Ошибка','err');
                updateBetButton();
            }
        }catch(e){
            hasBet = false;
            betAmt = 0;
            betGiftImg = null;
            showToast('Ошибка сети','err');
            updateBetButton();
        }finally{
            _giftLocked = false;
        }
    })();
}

/* STATUS POLLING */
async function updStatus(){
    if(!authReady) return;
    try{
        var url = '/api/ultimate-crash/simple-status';
        if(userData && userData.id) url += '?user_id=' + userData.id;
        var r = await fetch(url);
        if(!r.ok) return;
        var d = await r.json();
        if(!d.success && !d.game) return;

        var g = d.game;
        prevSt = status;
        status = g.status;
        prevGameId = gameId;
        gameId = g.id;
        servMult = parseFloat(g.current_multiplier) || 1.0;
        var tr = g.time_remaining || 0;
        lastTimeRemaining = tr;
        lastTrTimestamp = performance.now();

        if(status === 'flying') onNewServerMult(servMult);

        if(d.user_balance !== undefined && d.user_balance !== null && userData){
            userData.balance_stars = d.user_balance;
            updateUI(userData);
        }

        if(d.user_bet && d.user_bet.status === 'active'){
            hasBet = true;
            betAmt = d.user_bet.bet_amount;
        } else if(d.user_bet && d.user_bet.status === 'cashed_out'){
            hasBet = false;
        } else if(!cashedOut){
            if(status !== 'counting' && status !== 'waiting'){
                hasBet = false;
                betAmt = 0;
            }
        }

        var newRound = prevGameId !== null && gameId !== prevGameId;
        if(newRound){
            hasBet = false;
            betAmt = 0;
            betIsGift = false;
            betGiftImg = null;
            cashedOut = false;
            cashedOutBetAmt = 0;
            cashedOutGiftImg = null;
        }

        var cd = $('cdDisplay');
        var wl = $('waitLabel');
        var rw = $('rocketWrap');
        var bm = $('boomWrap');
        var gf = $('gameField');
        var pb = $('placeBetBtn');
        var cb = $('cashoutBtn');
        var coeff = $('coeffBox');

        if(status === 'waiting' || status === 'counting'){
            if(wl) wl.style.opacity = '0';
            if(rw){ rw.classList.add('hide'); rw.classList.remove('flying'); }
            var rImg = rw ? rw.querySelector('img') : null;
            if(rImg) rImg.style.transform = '';
            if(bm && Date.now() >= boomUntil) bm.classList.remove('show');

                dispMult = 1;
                servMult = 1;
                autoCashoutDone = false;
                cashoutLocked = false;
                cashedOut = false;
                cashedOutBetAmt = 0;
                cashedOutGiftImg = null;
                multGrowthRate = 0;
                prevServMult = 1.0;
                lastPollTimestamp = 0;
                lastFrameTime = 0;
                lastGiftId = null;

                if(rw){
                    rw.classList.remove('cashed-out','gift-change','showing-gift');
                    var ri = rw.querySelector('img');
                    var rg = getRocketGif();
                    lastRocketSrc = '';
                    if(ri){ ri.src = ''; ri.src = rg; }
                    lastRocketSrc = rg;
                }

                if(!d.user_bet || d.user_bet.status !== 'active'){
                    hasBet = false;
                    betAmt = 0;
                }

                betsGeneration++;
                lastBetsHash = '';
                var bce = $('betsCount'); if(bce) bce.textContent = '0';
                var ble = $('betsList'); if(ble) ble.innerHTML = '<div class="no-bets">Waiting for bets...</div>';

                if(pendingBet && !hasBet) processPendingBet();

            if(pb){

                pb.style.pointerEvents = '';

                    pb.disabled = true;
                    pb.innerHTML = '<span class="btn-text">BET PLACED</span>';
                } else if(pendingBet){
                    pb.disabled = false;
                    pb.innerHTML = '<span class="btn-text">CANCEL ('+formatCrashMoney(pendingBet.amount)+')</span>';
                } else {
                    pb.disabled = false;
                    pb.innerHTML = '<span class="btn-text">Place bet</span>';
                }
            }
            if(cb) cb.style.display = 'none';

        } else if(status === 'flying'){
            if(prevSt === 'counting' || prevSt === 'waiting'){
                if(countdownShown !== 'GO'){
                    var cdGo = $('cdDisplay');
                    if(cdGo){
                        cdGo.textContent = 'GO';
                        cdGo.classList.remove('active');

                    setTimeout(function(){
                        var c = $('cdDisplay');
                        if(c){ c.className = 'countdown-display'; c.textContent = ''; }
                        countdownShown = -1;
                    }, 400);
                }
            } else {
                if(cd){ cd.className = 'countdown-display'; cd.textContent = ''; }
                countdownShown = -1;
            }

            if(wl) wl.style.opacity = '0';
            if(rw) rw.classList.remove('hide');
            if(bm) bm.classList.remove('show');
            if(gf) gf.classList.add('flying');
            if(coeff) coeff.className = 'coeff-box live';
            if(crashDone) crashDone = false;

            if(cashedOut){
                if(pb){
                    pb.style.display = 'block';
                    pb.disabled = true;
                    pb.style.pointerEvents = 'none';
                    pb.innerHTML = '<span class="btn-text">WIN!</span>';
                }
                if(cb){ cb.style.display = 'none'; }
            } else if(hasBet){
                if(pb) pb.style.display = 'none';
                if(cb){
                    cb.style.display = 'block';
                    cb.disabled = false;
                    cb.className = 'cashout-btn';
                    cb.textContent = 'COLLECT';
                }
            } else {
                if(pb){
                    pb.style.display = 'block';
                    pb.disabled = false;
                    pb.style.pointerEvents = '';
                    if(pendingBet) pb.innerHTML = '<span class="btn-text">CANCEL ('+formatCrashMoney(pendingBet.amount)+')</span>';
                    else pb.innerHTML = '<span class="btn-text">BET ON NEXT</span>';
                }
                if(cb) cb.style.display = 'none';
            }

        } else if(status === 'crashed'){
            if(cd){ cd.className = 'countdown-display'; cd.textContent = ''; }
            var rcImg = rw ? rw.querySelector('img') : null;
            if(rcImg) rcImg.style.transform = '';
            countdownShown = -1;
            if(wl) wl.style.opacity = '0';
            if(rw){ rw.classList.add('hide'); rw.classList.remove('flying'); }
            if(gf) gf.classList.remove('flying');

            if(bm && Date.now() >= boomUntil && bm.classList.contains('show')) bm.classList.remove('show');

            if(!crashDone){
                if(bm){
                    bm.classList.remove('show');
                    var boomImg = bm.querySelector('img');

                        boomImg.src = '/static/gifs/boom.gif?t=' + Date.now();

                crashDone = true;
                try{ playSound('crash'); }catch(e){}
                triggerVibration([200,80,200,80,200,80,250]);
                if(hasBet) showToast('Crashed at ' + servMult.toFixed(2) + 'x!','err');

                betAmt = 0;

                cb.disabled = true;
                cb.className = 'cashout-btn crash-state';
                cb.textContent = 'CRASH ' + servMult.toFixed(2) + 'x';
            }
            hasBet = false;
            betAmt = 0;
        }
    }catch(e){ console.error('updStatus:', e); }

/* RENDER */
let lastRenderStatus = null;
let lastRocketUpdateTime = 0;
let multGrowthRate = 0;
let prevServMult = 1.0;
let lastPollTimestamp = 0;
let lastFrameTime = 0;
let lastGiftId = null;
let lastRocketSrc = '';
var _rw = null, _rImg = null, _gf = null, _coeffBox = null, _cdDisp = null;
var _rwFlying = false, _prevCoeffText = '';
var _renderCacheInited = false;
var _coeffLastUpdate = 0;

function _initRenderCache(){
    _rw = $('rocketWrap');
    _gf = $('gameField');
    _coeffBox = $('coeffBox');
    _cdDisp = $('cdDisplay');
    if(_rw) _rImg = _rw.querySelector('img');
    _renderCacheInited = true;
}

function onNewServerMult(newMult){
    var now = performance.now();
    if(lastPollTimestamp > 0 && newMult > prevServMult){
        var elapsed = now - lastPollTimestamp;
        if(elapsed > 30) multGrowthRate = (newMult - prevServMult) / elapsed;
    }
    prevServMult = newMult;
    lastPollTimestamp = now;
    if(dispMult < newMult - 0.05) dispMult = newMult - 0.01;
}

function render(){
    var now = performance.now();
    var dt = lastFrameTime > 0 ? (now - lastFrameTime) : 16;
    if(dt > 100) dt = 100;
    lastFrameTime = now;

    if(!_renderCacheInited) _initRenderCache();

    if(window._rocketSwitching){
        requestAnimationFrame(render);
        return;
    }

    if(status === 'flying'){
        if(multGrowthRate > 0){
            var delta = multGrowthRate * dt;
            if(delta > 0.03) delta = 0.03;
            dispMult += delta;
            if(dispMult > prevServMult + 0.8) multGrowthRate *= 0.7;
        }
        if(dispMult < 1.0) dispMult = 1.0;

        if(_rw && !_rwFlying){ _rw.classList.add('flying'); _rwFlying = true; }

        if(_rw && _rImg && !_rw.classList.contains('showing-gift') && !window._rocketSwitching){
            if(_rImg.complete && _rImg.naturalWidth > 0){
                var tilt = dispMult >= 2.0 ? Math.min(30, (dispMult - 2.0) * 3.5) : 0;
                var sc = 1 + Math.max(0, Math.min(dispMult - 1.5, 1)) * 0.015;
                _rImg.style.transform = 'rotate(' + tilt + 'deg) scale(' + sc + ')';
            }
        }

        if(now - _coeffLastUpdate > 33){
            _coeffLastUpdate = now;
            var ct = dispMult.toFixed(2) + 'x';
            if(ct !== _prevCoeffText && _coeffBox){
                _coeffBox.textContent = ct;
                _prevCoeffText = ct;
            }
        }

        if(now - lastRocketUpdateTime > 250){
            lastRocketUpdateTime = now;
            updateRocketImage();
        }

        if(hasBet && !autoCashoutDone){
            var acCb = $('autoCashoutCheck');
            if(acCb && acCb.checked){
                var acV = parseFloat($('autoCashoutVal').value);
                if(acV > 1 && dispMult >= acV){
                    autoCashoutDone = true;
                    doCashout();
                }
            }
        }
    } else {
        if(lastRenderStatus === 'flying'){
            updateRocketImage();
            _rwFlying = false;
            _prevCoeffText = '';
            dispMult = 1.0;
            prevServMult = 1.0;
            multGrowthRate = 0;
        }

        if((status === 'counting' || status === 'waiting') && lastTrTimestamp > 0 && lastTimeRemaining <= 10){
            var elapsed = (performance.now() - lastTrTimestamp) / 1000;
            var sec = Math.max(0, Math.ceil(Math.max(0, lastTimeRemaining - elapsed)));
            if(sec > 5) sec = 5;
            var label = sec > 0 ? String(sec) : 'GO';
            if(countdownShown !== label){
                countdownShown = label;
                if(_cdDisp){
                    _cdDisp.textContent = label;
                    _cdDisp.classList.remove('active');
                    void _cdDisp.offsetWidth;
                    _cdDisp.classList.add('active');
                    if(label !== 'GO'){
                        try{ playSound('countdown'); }catch(e){}
                        try{ triggerVibration([80,30,80]); }catch(e){}
                    }
                }
            }
        }
    }
    lastRenderStatus = status;
    requestAnimationFrame(render);
}

/* ROCKET */
function getRocketGif(){
    return '/static/gifs/rockets/' + currentRocket + '.gif';
}

function applyRocket(){
    var rw = $('rocketWrap');
    if(!rw) return;
    var img = rw.querySelector('img');
    if(!img) return;
    var rg = getRocketGif();
    lastRocketSrc = rg;
    img.src = rg;
}

function updateRocketImage(){
    var rw = $('rocketWrap');
    if(!rw) return;
    var ri = rw.querySelector('img');
    if(!ri) return;

    var showAmt = 0;
    var isGrayscale = false;

    if(hasBet && betAmt > 0){
        showAmt = betAmt;
    } else if(cashedOut && cashedOutBetAmt > 0 && status === 'flying'){
        showAmt = cashedOutBetAmt;
        isGrayscale = true;
    }

    /* Если выключено или не flying — только ракета */
    if(!showGifts || !(showAmt > 0 && status === 'flying')){
        rw.classList.remove('cashed-out','gift-change','showing-gift');
        if(lastGiftId !== null){
            lastGiftId = null;
            var rg0 = getRocketGif();
            if(lastRocketSrc !== rg0){ lastRocketSrc = rg0; ri.src = rg0; }
        }
        return;
    }

    var potentialWin = Math.floor(showAmt * dispMult);
    var gift = getAchievableGift(potentialWin);

    if(isGrayscale){
        rw.classList.add('cashed-out');
    } else {
        rw.classList.remove('cashed-out');
    }

    if(gift){
        var gid = gift.value;
        if(lastGiftId !== gid){
            lastGiftId = gid;
            var imgSrc = gift.image || '/static/img/gift.png';
            ri.onerror = function(){
                this.onerror = null;
                var fb = getRocketGif();
                if(lastRocketSrc !== fb){ lastRocketSrc = fb; this.src = fb; }
            };
            if(lastRocketSrc !== imgSrc){
                lastRocketSrc = imgSrc;
                ri.src = imgSrc;
            }
            rw.classList.add('showing-gift');
        }
    } else {
        if(lastGiftId !== null){
            lastGiftId = null;
            var rg = getRocketGif();
            if(lastRocketSrc !== rg){ lastRocketSrc = rg; ri.src = rg; }
        }
        rw.classList.remove('showing-gift');
        if(!isGrayscale) rw.classList.remove('cashed-out');
    }
}

/* GIFT CATALOG */
var _giftCatalogCache = null;
async function ensureGiftCatalog(){
    if(_giftCatalogCache) return _giftCatalogCache;
    try{
        var r = await fetch('/api/gifts-list?models=1');
        var d = await r.json();
        if(d.success && d.gifts){
            _giftCatalogCache = d.gifts
                .filter(function(g){ return g.value > 0 && g.type !== 'stars_balance'; })
                .sort(function(a,b){ return (a.value||0)-(b.value||0); });
        }
    }catch(e){}
    return _giftCatalogCache || [];
}

function getAchievableGift(potentialWin){
    if(!_giftCatalogCache || potentialWin < 5) return null;
    var best = null;
    for(var i = _giftCatalogCache.length - 1; i >= 0; i--){
        if(_giftCatalogCache[i].value <= potentialWin){
            best = _giftCatalogCache[i];
            break;
        }
    }
    return best;
}

/* SOUND */
var audioContext = null;
var soundMasterGain = null;

function initAudio(){
    if(audioContext) return;
    try{
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        soundMasterGain = audioContext.createGain();
        soundMasterGain.gain.value = 0.5;
        soundMasterGain.connect(audioContext.destination);
    }catch(e){}
}

function makeOsc(freq, type, gainVal, startT, dur){
    if(!soundMasterGain) return;
    try{
        var o = audioContext.createOscillator();
        var g = audioContext.createGain();
        o.connect(g);
        g.connect(soundMasterGain);
        o.frequency.setValueAtTime(freq, startT);
        o.type = type;
        g.gain.setValueAtTime(gainVal, startT);
        g.gain.exponentialRampToValueAtTime(0.001, startT + dur);
        o.start(startT);
        o.stop(startT + dur);
    }catch(e){}
}

function playSound(type){
    initAudio();
    if(!audioContext) return;
    if(audioContext.state === 'suspended') audioContext.resume();
    var now = audioContext.currentTime;
    if(type === 'click'){ makeOsc(1200,'sine',0.1,now,0.03); }
    else if(type === 'bet'){ makeOsc(880,'sine',0.12,now,0.12); makeOsc(1320,'sine',0.1,now+0.02,0.1); }
    else if(type === 'countdown'){ makeOsc(900,'sine',0.12,now,0.05); }
    else if(type === 'cashout'){ makeOsc(1400,'sine',0.14,now,0.1); makeOsc(1800,'sine',0.1,now+0.06,0.08); }
    else if(type === 'crash'){ makeOsc(35,'sine',0.3,now,0.6); makeOsc(70,'triangle',0.18,now+0.06,0.45); }
    else if(type === 'win'){ [523,659,784,988].forEach(function(f,i){ makeOsc(f,'triangle',0.12,now+i*0.07,0.35); }); }
}

function triggerVibration(pattern){
    try{
        if(typeof Telegram !== 'undefined' && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
            return;
        }
    }catch(e){}
    try{
        if(navigator.vibrate){
            if(Array.isArray(pattern)) navigator.vibrate(pattern.map(function(v){ return Math.min(v*2, 500); }));
            else navigator.vibrate(Math.min(pattern*2, 500));
        }
    }catch(e){}
}

/* TOAST */
function showToast(msg, type){
    document.querySelectorAll('.toast').forEach(function(t){ t.remove(); });
    var t = document.createElement('div');
    t.className = 'toast' + (type ? ' '+type : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){
        t.style.opacity = '0';
        t.style.transition = 'opacity .3s';
        setTimeout(function(){ t.remove(); }, 300);
    }, 2500);
}

            html += '<img src="' + gImg + '" onerror="this.src=\'/static/img/gift.png\'" style="width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.2);padding:4px;box-sizing:border-box;display:block">';

            html += '<div style="font-size:10px;font-weight:800;color:#8CA0BE;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:2px"><img src="/static/img/ton.png" style="width:10px;height:10px">' + formatTon(gValue/100) + '</div>';
            html += '</div>';
        }

        if(starRemainder > 0){
            html += '<div style="background:rgba(30,228,76,.08);border:1px solid rgba(30,228,76,.2);border-radius:12px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px;box-sizing:border-box">';
            html += '<div style="font-size:20px;font-weight:900;color:#1EE44C;line-height:1">+' + formatCrashMoney(starRemainder) + '</div>';
            html += '<div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.6);margin-top:2px">TON</div>';
            html += '</div>';
        }

        html += '</div>';
        html += '</div>';
    } else if(starRemainder > 0 || winTon > 0){
        html += '<div class="win-breakdown">+' + formatCrashMoney(starRemainder || d.win_amount || 0) + ' TON на баланс</div>';
    }

    content.innerHTML = html;
    var wo = $('winOverlay');
    if(wo) wo.classList.add('show');
    triggerVibration([30,20,60]);
}

function closeWin(){
    var wo = $('winOverlay');
    if(wo) wo.classList.remove('show');
}

/* SETTINGS */
function openSettings(){
    var so = $('settingsOverlay');
    if(so) so.classList.add('show');
    var cb = $('showGiftsToggle');
    if(cb) cb.checked = showGifts;
    renderSettings();
}
function closeSettings(){
    var so = $('settingsOverlay');
    if(so) so.classList.remove('show');
}
document.addEventListener('DOMContentLoaded', function(){
    var so = $('settingsOverlay');
    if(so) so.addEventListener('click', function(e){ if(e.target === this) closeSettings(); });
});

function toggleShowGifts(cb){
    showGifts = !!cb.checked;
    localStorage.setItem('crash_show_gifts', showGifts ? 'on' : 'off');
    showToast(showGifts ? 'Подарки включены' : 'Только ракета', 'ok');
    updateRocketImage();
}

var ROCKET_SLOTS = ['crash','cat','dog','banana','plane','rabbit','ice','unicorn','goldenplane','telegram','TonTheMoon'];

function renderSettings(){
    var rg = $('rocketGrid');
    if(!rg) return;
    rg.innerHTML = ROCKET_SLOTS.map(function(rid){
        var isActive = currentRocket === rid;
        var src = '/static/gifs/rockets/'+rid+'.gif';
        return '<div class="settings-item'+(isActive?' active':'')+'" onclick="selectRocket(\''+rid+'\')">'
            +'<img src="'+src+'" onerror="this.src=\'/static/gifs/rockets/crash.gif\'">'
            +'</div>';
    }).join('');
}

function selectRocket(rid){
    if(currentRocket === rid){
        closeSettings();
        return;
    }
    if(window._rocketSwitching) return;
    window._rocketSwitching = true;

    var newSrc = '/static/gifs/rockets/' + rid + '.gif';
    var test = new Image();
    test.onload = function(){
        currentRocket = rid;
        localStorage.setItem('crash_rocket', rid);

        var rw = document.getElementById('rocketWrap');
        if(rw){
            var img = rw.querySelector('img');
            if(img){
                img.style.transform = '';
                rw.classList.remove('flying','showing-gift','cashed-out','gift-change');
                lastRocketSrc = newSrc;
                img.src = newSrc;
            }
        }
        _rwFlying = false;
        _prevCoeffText = '';
        window._rocketSwitching = false;

        renderSettings();
        showToast('Ракета изменена!','ok');
        setTimeout(closeSettings, 200);
    };
    test.onerror = function(){
        window._rocketSwitching = false;
        showToast('Ошибка загрузки ракеты','err');
    };
    test.src = newSrc;
}

/* DEPOSIT */
function openDepositSelector(){
    var so = $('depositOverlay');
    if(so) so.classList.add('show');
    var sb = $('starsDepositBtn');
    if(sb){
        if(!isTelegramWebApp()){
            sb.classList.add('disabled');
            sb.onclick = null;
        } else {
            sb.classList.remove('disabled');
            sb.onclick = function(){ closeDepositSelector(); openStarsDeposit(); };
        }
    }
}
function closeDepositSelector(){
    var so = $('depositOverlay');
    if(so) so.classList.remove('show');
}
function openTonDeposit(){ showToast('TON пополнение скоро','ok'); }
function openStarsDeposit(){
    if(!isTelegramWebApp()){ showToast('Stars только в Telegram','err'); return; }
    var so = $('starsDepositOverlay');
    if(so) so.classList.add('show');
    var ee = $('starsDepositError');
    if(ee) ee.style.display = 'none';
}
function closeStarsDeposit(){
    var so = $('starsDepositOverlay');
    if(so) so.classList.remove('show');
}

document.addEventListener('DOMContentLoaded', function(){
    var sda = $('starsDepositAmount');
    if(sda){
        sda.addEventListener('input', function(){
            var v = parseInt(this.value)||0;
            var spa = $('starsPayAmount');
            if(spa) spa.textContent = v > 0 ? v : '0';
        });
    }
    var sdo = $('starsDepositOverlay');
    if(sdo) sdo.addEventListener('click', function(e){ if(e.target === this) closeStarsDeposit(); });
    var do_ = $('depositOverlay');
    if(do_) do_.addEventListener('click', function(e){ if(e.target === this) closeDepositSelector(); });
});

async function payWithStars(){
    var amountEl = $('starsDepositAmount');
    var amount = parseInt(amountEl ? amountEl.value : 0) || 0;
    var errEl = $('starsDepositError');
    if(amount < 1 || amount > 10000){
        if(errEl){ errEl.textContent = 'Введите 1-10000'; errEl.style.display = 'block'; }
        return;
    }
    if(errEl) errEl.style.display = 'none';
    var btn = $('starsPayBtn');
    if(btn) btn.disabled = true;
    try{
        var r = await fetch('/api/stars/create-invoice', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({user_id: userData.id, amount: amount})
        });
        var d = await r.json();
        if(d.success && d.invoice_link){
            if(typeof Telegram !== 'undefined' && Telegram.WebApp && Telegram.WebApp.openInvoice){
                Telegram.WebApp.openInvoice(d.invoice_link, function(status){
                    if(status === 'paid'){
                        showToast('Оплата успешна!','ok');
                        closeStarsDeposit();
                        loadUserData();
                    }
                    if(btn) btn.disabled = false;
                });
            } else {
                window.open(d.invoice_link, '_blank');
                if(btn) btn.disabled = false;
            }
        } else {
            if(errEl){ errEl.textContent = d.error || 'Ошибка'; errEl.style.display = 'block'; }
            if(btn) btn.disabled = false;
        }
    }catch(e){
        if(errEl){ errEl.textContent = 'Ошибка сети'; errEl.style.display = 'block'; }
        if(btn) btn.disabled = false;
    }
}

/* INIT */
document.addEventListener('DOMContentLoaded', function(){
    initTelegramApp();

    setTimeout(function(){
        var ls = $('ldScreen');
        if(ls && !ls.classList.contains('hidden')){
            ls.classList.add('hidden');
            setTimeout(function(){ ls.style.display = 'none'; }, 500);
        }
    }, 15000);

    function updOnline(){
        fetch('/api/online-count').then(function(r){ return r.json(); }).then(function(d){
            var el = $('onlineCount');
            if(el && d.count !== undefined) el.textContent = d.count;
        }).catch(function(){});
    }
    updOnline();
    setInterval(updOnline, 30000);
});

document.addEventListener('click', initAudio, {once: true});
document.addEventListener('touchstart', initAudio, {once: true});
</script>
