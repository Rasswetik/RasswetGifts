<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" href="/static/img/logo.png">
<title>CRASH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
    background:#1C2233;
    color:#fff;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}
.container{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:80px;
    padding-top:calc(env(safe-area-inset-top,20px) + 50px + 3vh);
}

/* TOP BAR */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;position:relative;z-index:10}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{
    display:flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:20px;
    border:1.5px solid rgba(30,228,76,.45);
    background:rgba(30,228,76,.12);
    font-size:13px;font-weight:700;color:#1EE44C;
}
.settings-btn-sm{
    width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.6);cursor:pointer;
}
.bal-pill{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    font-size:13px;font-weight:700;
}
.bal-plus{
    width:28px;height:28px;border-radius:50%;
    border:1px solid rgba(120,135,160,.45);
    background:rgba(120,135,160,.3);
    color:#A0B0C4;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
}
.top-right{display:flex;gap:8px;align-items:center}

/* GAME FIELD */
.game-field{
    margin:0 12px;
    border-radius:20px;
    background:#0B1120;
    border:1px solid rgba(59,130,246,.12);
    position:relative;
    overflow:hidden;
    min-height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}
.game-field::before{
    content:'';
    position:absolute;inset:0;
    background:
        linear-gradient(rgba(99,160,255,.15) 1px,transparent 1px),
        linear-gradient(90deg,rgba(99,160,255,.15) 1px,transparent 1px);
    background-size:48px 48px;
    pointer-events:none;
}
.countdown-display{
    font-weight:900;
    font-size:min(200px,42vw);
    color:rgba(255,255,255,.85);
    position:absolute;
    z-index:4;
    user-select:none;
    line-height:1;
    opacity:0;
}
.countdown-display.active{opacity:1;animation:cdPop .3s cubic-bezier(.22,.9,.2,1)}
@keyframes cdPop{
    0%{transform:scale(2);opacity:0}
    60%{transform:scale(.95)}
    100%{transform:scale(1);opacity:1}
}

/* ROCKET */
.rocket-wrap{
    position:absolute;
    top:52%;left:50%;
    transform:translate(-50%,-50%);
    z-index:2;
    transition:opacity .3s;
}
.rocket-wrap img{
    width:170px;height:170px;
    object-fit:contain;
    border:none;background:transparent;
    will-change:transform;
}
.rocket-wrap.hide{opacity:0;pointer-events:none}

/* TURBO COUNTER */
.turbo-counter{
    display:none;
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    font-weight:900;
    font-size:min(80px,20vw);
    color:#fff;
    pointer-events:none;
    line-height:1;
}
.turbo-counter.active{display:block}
.turbo-counter .tc-x{font-size:.5em;opacity:.7;margin-left:2px}

/* BOOM */
.boom-wrap{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:10;pointer-events:none;
    display:none;
}
.boom-wrap.show{display:flex;animation:boomPop .4s ease-out forwards}
.boom-wrap img{width:180px;height:180px;object-fit:contain}
@keyframes boomPop{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
    50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}

/* BET BUTTON */
.bet-area{padding:6px 12px 4px;position:relative;z-index:100}
.place-bet-btn{
    width:100%;padding:15px;
    border-radius:16px;
    border:2px solid rgba(6,182,212,.3);
    background:linear-gradient(135deg,#06B6D4,#3B82F6);
    color:#fff;font-weight:800;font-size:15px;
    text-transform:uppercase;letter-spacing:.5px;
    cursor:pointer;
}
.place-bet-btn:disabled{opacity:.35;cursor:default}
.place-bet-btn:not(:disabled):active{transform:scale(.98)}

/* CASHOUT */
.cashout-btn{
    width:100%;padding:12px 14px;
    border-radius:20px;
    border:2px solid rgba(255,255,255,.1);
    background:linear-gradient(135deg,rgba(30,228,76,.95),rgba(24,184,62,.95));
    color:#061510;font-weight:800;font-size:16px;
    text-transform:uppercase;
    display:none;
    align-items:center;justify-content:space-between;
    gap:10px;cursor:pointer;
}
.cashout-btn.visible{display:flex}
.cashout-btn:not(:disabled):active{transform:scale(.98)}
.cashout-btn.crash-state{
    background:linear-gradient(135deg,#E8527A,#C42247) !important;
    color:#fff !important;
    pointer-events:none;
}
.cb-gift-side{
    width:42px;height:42px;flex-shrink:0;
    object-fit:contain;
}
.cb-gift-side.empty{opacity:.3}
.cb-center{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.cb-label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.cb-win{font-size:20px;font-weight:900}

/* HISTORY */
.history-section{padding:4px 12px 2px}
.history-scroll{
    display:flex;gap:5px;overflow-x:auto;padding-bottom:0;
    scrollbar-width:none;
}
.history-scroll::-webkit-scrollbar{display:none}
.coeff-box{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(30,228,76,.15);
    border:1px solid rgba(30,228,76,.3);
    border-radius:20px;padding:4px 11px;
    font-size:12px;font-weight:800;color:#1EE44C;
    flex-shrink:0;
}
.coeff-box.live{color:#1EE44C}
.coeff-box.crashed{background:rgba(220,60,80,.2);color:#F96999;border-color:rgba(249,105,153,.3)}
.coeff-box.waiting{background:rgba(30,228,76,.15);color:#1EE44C}

.h-pill{
    padding:4px 11px;border-radius:20px;
    font-size:12px;font-weight:700;
    white-space:nowrap;flex-shrink:0;
}
.h-pill.low{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.08)}
.h-pill.mid{background:rgba(30,228,76,.12);color:#1EE44C;border:1px solid rgba(30,228,76,.2)}
.h-pill.high{background:rgba(255,200,0,.12);color:#FFC800;border:1px solid rgba(255,200,0,.2)}
.h-pill.mega{background:rgba(255,200,0,.18);color:#FFD700;border:1px solid rgba(255,200,0,.3)}

/* BETS */
.bets-section{padding:4px 12px 24px}
.bets-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bets-title{font-size:13px;font-weight:800;color:#fff}
.bets-count{
    font-size:11px;color:rgba(140,160,190,.8);font-weight:700;
    background:rgba(107,122,141,.15);
    padding:2px 9px;border-radius:10px;
}
.bets-list{
    display:flex;flex-direction:column;gap:4px;
    max-height:260px;overflow-y:auto;
}
.bets-list::-webkit-scrollbar{width:3px}
.bets-list::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}

.bet-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:7px 10px;border-radius:12px;
    background:rgba(28,34,51,.85);gap:8px;
}
.bet-row.won{background:rgba(30,228,76,.06)}
.bet-row.lost{background:rgba(249,105,153,.04)}
.bet-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.bet-avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,#2a3040,#3a4558);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:rgba(255,255,255,.6);
    overflow:hidden;flex-shrink:0;
}
.bet-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.bet-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.bet-name{
    font-weight:700;font-size:12px;color:#fff;
    max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bet-amt{
    font-size:11px;color:rgba(140,160,190,.7);font-weight:600;
    display:flex;align-items:center;gap:5px;
}
.bet-amount-text{font-weight:800;color:#fff;font-size:12px}
.bet-status{
    display:flex;align-items:center;gap:5px;
    padding:4px 9px;border-radius:10px;
    font-size:11px;font-weight:700;flex-shrink:0;
}
.bet-status svg{width:13px;height:13px}
.bet-status.active{background:rgba(107,122,141,.12);color:rgba(160,180,200,.8)}
.bet-status.won{background:rgba(30,228,76,.12);color:#1EE44C}
.bet-status.lost{background:rgba(249,105,153,.1);color:#F96999}

.no-bets{text-align:center;padding:30px 20px;color:rgba(255,255,255,.2);font-size:13px}

/* MODAL */
.modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    z-index:5000;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;
    transition:opacity .25s,visibility .25s;
}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-sheet{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px 24px 0 0;
    width:100%;max-width:480px;
    max-height:85vh;overflow-y:auto;
    padding:20px 16px 30px;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.34,.69,.7,1);
    border-top:1px solid rgba(59,130,246,.2);
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:rgba(120,135,160,.2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:900;margin-bottom:18px;text-align:center}

.bet-input-wrap{display:flex;gap:8px;margin-bottom:14px}
.bet-input-wrap input{
    flex:1;padding:14px 18px;
    border-radius:14px;
    border:1px solid rgba(59,130,246,.15);
    background:rgba(59,130,246,.05);
    color:#fff;font-size:17px;font-weight:700;
    outline:none;text-align:center;
    font-family:inherit;
}
.bet-input-wrap input::placeholder{color:rgba(255,255,255,.25)}

.confirm-bet-btn{
    width:100%;padding:15px;
    border-radius:14px;border:none;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    color:#fff;font-weight:800;font-size:15px;
    cursor:pointer;font-family:inherit;
}
.confirm-bet-btn:disabled{opacity:.45;cursor:not-allowed}

/* INVENTORY */
.inv-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:8px;max-height:420px;overflow-y:auto;
    padding:4px;box-sizing:border-box;
}
.inv-grid::-webkit-scrollbar{width:3px}
.inv-grid::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}
.inv-card{
    background:rgba(59,130,246,.06);
    border:1.5px solid rgba(59,130,246,.15);
    border-radius:14px;
    padding:6px;
    text-align:center;
    cursor:pointer;
    transition:all .15s;
    position:relative;
    overflow:hidden;
}
.inv-card.selected{
    border-color:#3B82F6;
    background:rgba(59,130,246,.18);
    box-shadow:0 0 0 2px rgba(59,130,246,.4);
}
.inv-card.selected::after{
    content:'✓';
    position:absolute;
    top:6px;right:6px;
    width:22px;height:22px;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    border-radius:50%;
    color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
}
.inv-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:contain;
    border-radius:8px;
    background:rgba(0,0,0,.2);
    padding:4px;
    box-sizing:border-box;
    margin-bottom:4px;
    display:block;
}
.inv-name{
    font-size:10px;font-weight:700;
    color:rgba(255,255,255,.85);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.inv-val{
    font-size:11px;font-weight:800;
    color:#8CA0BE;padding:3px 4px;
    display:flex;align-items:center;justify-content:center;
    gap:3px;
    background:rgba(59,130,246,.08);
    border-radius:6px;
    margin-top:2px;
}
.inv-val img{width:12px;height:12px;margin:0;background:none;padding:0}

/* TOAST */
.toast{
    position:fixed;bottom:20px;left:50%;
    transform:translateX(-50%);
    background:rgba(20,20,20,.95);
    padding:10px 20px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.06);
    font-size:13px;font-weight:700;
    z-index:7000;
    max-width:90%;text-align:center;
    animation:toastUp .3s ease;
}
.toast.ok{border-color:rgba(30,228,76,.2)}
.toast.err{border-color:rgba(249,105,153,.2)}
@keyframes toastUp{
    from{transform:translateX(-50%) translateY(16px);opacity:0}
    to{transform:translateX(-50%);opacity:1}
}

/* SETTINGS */
.settings-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    z-index:5600;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;
    transition:opacity .3s,visibility .3s;
}
.settings-overlay.show{opacity:1;visibility:visible}
.settings-modal{
    background:linear-gradient(180deg,#1E2538,#151B2D);
    border-radius:24px 24px 0 0;
    width:100%;max-width:480px;
    max-height:82vh;overflow-y:auto;
    padding:16px 18px 30px;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.22,.9,.2,1);
}
.settings-overlay.show .settings-modal{transform:translateY(0)}

.settings-item{
    background:rgba(255,255,255,.04);
    border-radius:16px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}
.settings-item .info{flex:1;min-width:0}
.settings-item .lbl{font-size:14px;font-weight:700;color:#fff}
.settings-item .desc{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.toggle{
    position:relative;
    width:52px;height:30px;min-width:52px;
    background:rgba(60,60,80,.7);
    border-radius:15px;
    cursor:pointer;
    transition:background .3s;
}
.toggle::after{
    content:'';
    position:absolute;
    width:24px;height:24px;
    border-radius:50%;background:#fff;
    top:2px;left:2px;
    transition:transform .3s;
}
.toggle.on{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.toggle.on::after{transform:translateX(22px)}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;bottom:0;left:50%;
    transform:translateX(-50%);
    z-index:4000;
    width:100%;max-width:480px;
    height:72px;
    padding:0 8px calc(env(safe-area-inset-bottom,0) + 8px);
    background:rgba(28,34,51,.95);
    border-top:1px solid rgba(59,130,246,.08);
    display:flex;align-items:center;justify-content:space-around;
}
.bnav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;padding:8px 16px;border-radius:12px;
    color:rgba(255,255,255,.4);
    font-weight:600;text-decoration:none;
}
.bnav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.bnav-item span{font-size:10px}
.bnav-item.active{background:rgba(255,255,255,.08);color:#fff}
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <div class="top-left">
            <div class="online-pill">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                <span id="onlineCount">0</span>
            </div>
            <button class="settings-btn-sm" onclick="openSettings()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
        <div class="top-right">
            <div class="bal-pill">
                <img src="/static/img/ton.png" width="16" height="16" alt="TON">
                <span id="balVal">0.00</span>
            </div>
            <button class="bal-plus" onclick="openDeposit()">+</button>
        </div>
    </div>

    <div class="game-field" id="gameField">
        <div class="countdown-display" id="cdDisplay"></div>
        <div class="turbo-counter" id="turboCounter">
            <span class="tc-mult" id="turboMult">1.00</span><span class="tc-x">x</span>
        </div>
        <div class="rocket-wrap hide" id="rocketWrap">
            <img src="/static/gifs/rockets/crash.gif" alt="">
        </div>
        <div class="boom-wrap" id="boomWrap">
            <img src="/static/gifs/boom.gif" alt="">
        </div>
    </div>

    <div class="history-section">
        <div class="history-scroll" id="histScroll">
            <div class="coeff-box" id="coeffBox">--</div>
        </div>
    </div>

    <div class="bet-area">
        <button class="place-bet-btn" id="placeBetBtn" onclick="openBetModal()">
            <span class="btn-text">Place bet</span>
        </button>
        <button class="cashout-btn" id="cashoutBtn" onclick="doCashout()">
            <img class="cb-gift-side empty" id="cbGiftLeft" src="/static/img/gift.png" alt="">
            <div class="cb-center">
                <span class="cb-label">CASH OUT</span>
                <span class="cb-win" id="cbWin">0.00</span>
            </div>
            <img class="cb-gift-side empty" id="cbGiftRight" src="/static/img/gift.png" alt="">
        </button>
    </div>

    <div class="bets-section">
        <div class="bets-header">
            <div class="bets-title">BETS</div>
            <div class="bets-count" id="betsCount">0</div>
        </div>
        <div class="bets-list" id="betsList">
            <div class="no-bets">Waiting for bets...</div>
        </div>
    </div>
</div>

<!-- BET MODAL -->
<div class="modal-overlay" id="betModal" onclick="if(event.target===this)closeBetModal()">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Place bet</div>
        <div class="bet-input-wrap">
            <input type="number" id="betInput" placeholder="Enter TON amount (min. 0.1)" min="0.1" step="0.01" inputmode="decimal">
        </div>
        <button class="confirm-bet-btn" id="confirmBetBtn" onclick="confirmStarsBet()">BET</button>
    </div>
</div>

<!-- SETTINGS -->
<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
    <div class="settings-modal">
        <div class="modal-handle"></div>
        <div class="modal-title">Настройки</div>

        <div class="settings-item">
            <div class="info">
                <div class="lbl">Режим оптимизации</div>
                <div class="desc">Меньше анимаций, меньше лагов</div>
            </div>
            <div class="toggle" id="optimizeToggle" onclick="toggleOptimize()"></div>
        </div>

        <div class="settings-item">
            <div class="info">
                <div class="lbl">Турбо-режим</div>
                <div class="desc">Только счётчик, без ракеты</div>
            </div>
            <div class="toggle" id="turboToggle" onclick="toggleTurbo()"></div>
        </div>

        <button class="confirm-bet-btn" style="margin-top:16px" onclick="closeSettings()">Закрыть</button>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a class="bnav-item active" href="/games">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="10" r="1" fill="currentColor"/><circle cx="18" cy="12" r="1" fill="currentColor"/></svg>
        <span>Игры</span>
    </a>
    <a class="bnav-item" href="/news">
        <svg viewBox="0 0 24 24"><path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2"/></svg>
        <span>Новости</span>
    </a>

        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
        <span>Топ</span>
    </a>

        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Профиль</span>
    </a>

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var tg = window.Telegram && window.Telegram.WebApp;
var userData = null;
var gameId = 0;
var prevGameId = 0;
var status = 'waiting';
var prevSt = 'waiting';
var dispMult = 1.0;
var servMult = 1.0;
var prevServMult = 1.0;
var hasBet = false;
var betAmt = 0;
var cashedOut = false;
var cashoutLocked = false;
var hasFetched = false;
var _lastCoeffText = '';
var optimizeMode = localStorage.getItem('crash_optimize') === '1';
var turboMode = localStorage.getItem('crash_turbo') === '1';

function $(id){ return document.getElementById(id); }

function formatMoney(stars){
    var t = Number(stars || 0) / 100;
    return t.toFixed(2);
}
function formatTon(stars){
    var t = Number(stars || 0) / 100;
    return t.toFixed(2);
}

function showToast(msg, type){
    document.querySelectorAll('.toast').forEach(function(t){ t.remove(); });
    var t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){
        t.style.opacity = '0';
        t.style.transition = 'opacity .3s';
        setTimeout(function(){ t.remove(); }, 300);
    }, 2500);
}

function updateBalance(showHint){
    if(!userData) return;
    var el = $('balVal');
    if(el) el.textContent = formatMoney(userData.balance_stars);
    if(showHint === false) return;
}

/* ══════════════════════════════════════════════════════════════
   OPTIMIZE / TURBO
   ══════════════════════════════════════════════════════════════ */
function toggleOptimize(){
    optimizeMode = !optimizeMode;
    if(optimizeMode && turboMode){
        turboMode = false;
        localStorage.setItem('crash_turbo', '0');
    }
    localStorage.setItem('crash_optimize', optimizeMode ? '1' : '0');
    syncToggles();
    showToast(optimizeMode ? '⚡ Оптимизация ВКЛ' : 'Оптимизация ВЫКЛ', 'ok');
}
function toggleTurbo(){
    turboMode = !turboMode;
    if(turboMode && optimizeMode){
        optimizeMode = false;
        localStorage.setItem('crash_optimize', '0');
    }
    localStorage.setItem('crash_turbo', turboMode ? '1' : '0');
    syncToggles();
    showToast(turboMode ? '🚀 Турбо ВКЛ' : 'Турбо ВЫКЛ', 'ok');
}
function syncToggles(){
    var ot = $('optimizeToggle');
    if(ot) ot.classList.toggle('on', optimizeMode);
    var tt = $('turboToggle');
    if(tt) tt.classList.toggle('on', turboMode);
}
function openSettings(){
    var so = $('settingsOverlay');
    if(so) so.classList.add('show');
    syncToggles();
}
function closeSettings(){
    var so = $('settingsOverlay');
    if(so) so.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
async function init(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userData = auth;
        if(tg){
            try{
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#1C2233');
                tg.setBackgroundColor('#1C2233');
            }catch(e){}
        }
    }
    if(!userData || !userData.id){
        userData = {id: 0, balance_stars: 0, first_name: 'Player'};
    }
    await loadUser();
    loadStatus();
    loadBets();
    loadHistory();
    loadOnline();

    setInterval(loadStatus, 250);
    setInterval(loadBets, 750);
    setInterval(loadUser, 15000);
    setInterval(loadOnline, 30000);

    syncToggles();
    requestAnimationFrame(render);
}

async function loadUser(){
    if(!userData || !userData.id) return;
    try{
        var r = await fetch('/api/user/' + userData.id);
        var d = await r.json();
        if(d.success){
            userData = d.user || userData;
            updateBalance();
        }
    }catch(e){}
}

async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var el = $('onlineCount');
        if(el) el.textContent = d.count || 0;
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   STATUS
   ══════════════════════════════════════════════════════════════ */
async function loadStatus(){
    try{
        var url = '/api/ultimate-crash/simple-status';
        if(userData && userData.id) url += '?user_id=' + userData.id;
        var r = await fetch(url);
        var d = await r.json();
        if(!d.success) return;

        var g = d.game;
        if(!g) return;

        prevSt = status;
        status = g.status;
        prevGameId = gameId;
        gameId = g.id;
        servMult = parseFloat(g.current_multiplier) || 1.0;
        prevServMult = servMult;

        if(d.user_balance !== undefined && d.user_balance !== null && userData){
            userData.balance_stars = d.user_balance;
            updateBalance();
        }

        if(d.user_bet && d.user_bet.status === 'active'){
            hasBet = true;
            betAmt = d.user_bet.bet_amount;
        }

        /* Новый раунд */
        if(prevGameId !== gameId && prevGameId !== 0){
            hasBet = false;
            betAmt = 0;
            cashedOut = false;
            cashoutLocked = false;
            dispMult = 1.0;
            updateBetButton();
            loadBets();
        }

        updateUI();
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   UI UPDATE
   ══════════════════════════════════════════════════════════════ */
function updateUI(){
    var cd = $('cdDisplay');
    var rw = $('rocketWrap');
    var bm = $('boomWrap');
    var pb = $('placeBetBtn');
    var cb = $('cashoutBtn');
    var coeff = $('coeffBox');

    if(status === 'waiting' || status === 'counting'){
        if(rw) rw.classList.add('hide');
        if(bm) bm.classList.remove('show');
        if(coeff){
            coeff.className = 'coeff-box waiting';
            coeff.textContent = 'Waiting';
        }
        if(cd){
            cd.textContent = '';
            cd.classList.remove('active');
        }
        if(pb){
            pb.style.display = 'block';
            pb.style.pointerEvents = '';
            if(hasBet){
                pb.disabled = true;
                pb.innerHTML = '<span class="btn-text">BET PLACED</span>';
            } else {
                pb.disabled = false;
                pb.innerHTML = '<span class="btn-text">Place bet</span>';
            }
        }
        if(cb) cb.classList.remove('visible');
    }
    else if(status === 'flying'){
        if(rw) rw.classList.remove('hide');
        if(bm) bm.classList.remove('show');
        if(coeff){
            coeff.className = 'coeff-box live';
            var ct = dispMult.toFixed(2) + 'x';
            if(ct !== _lastCoeffText){
                coeff.textContent = ct;
                _lastCoeffText = ct;
            }
        }
        if(hasBet && !cashedOut){
            if(pb) pb.style.display = 'none';
            if(cb){
                cb.classList.add('visible');
                cb.classList.remove('crash-state');
                cb.disabled = false;
                var winAmt = Math.floor(betAmt * Math.max(dispMult, servMult));
                var cbWin = $('cbWin');
                if(cbWin) cbWin.textContent = formatMoney(winAmt);
            }
        } else if(cashedOut){
            if(pb){
                pb.style.display = 'block';
                pb.disabled = true;
                pb.innerHTML = '<span class="btn-text">CASHED OUT</span>';
            }
            if(cb){
                cb.classList.add('visible');
                cb.classList.add('crash-state');
            }
        } else {
            if(pb){
                pb.style.display = 'block';
                pb.disabled = false;
                pb.innerHTML = '<span class="btn-text">BET ON NEXT</span>';
            }
            if(cb) cb.classList.remove('visible');
        }
    }
    else if(status === 'crashed'){
        if(rw) rw.classList.add('hide');
        if(bm){
            bm.classList.remove('show');
            void bm.offsetWidth;
            bm.classList.add('show');
            setTimeout(function(){ bm.classList.remove('show'); }, 2000);
        }
        if(coeff){
            coeff.className = 'coeff-box crashed';
            coeff.textContent = servMult.toFixed(2) + 'x';
        }
        if(cd){
            cd.textContent = '';
            cd.classList.remove('active');
        }
        if(pb) pb.style.display = 'none';
        if(cb) cb.classList.remove('visible');
        hasBet = false;
        betAmt = 0;
    }
}

function updateBetButton(){
    var pb = $('placeBetBtn');
    if(!pb) return;
    if(status === 'flying' || status === 'crashed'){
        pb.innerHTML = '<span class="btn-text">BET ON NEXT</span>';
        pb.disabled = false;
    } else {
        pb.innerHTML = '<span class="btn-text">Place bet</span>';
        pb.disabled = false;
    }
}

/* ══════════════════════════════════════════════════════════════
   RENDER (60 FPS)
   ══════════════════════════════════════════════════════════════ */
var lastFrame = 0;
var lastMultUpdate = 0;

function render(){
    var now = performance.now();
    var dt = lastFrame > 0 ? (now - lastFrame) : 16;
    if(dt > 100) dt = 100;
    lastFrame = now;

    if(status === 'flying'){
        /* Плавно подтягиваем dispMult к servMult */
        if(dispMult < servMult){
            var gap = servMult - dispMult;
            var inc = Math.min(gap * 0.3, 0.08);
            dispMult = Math.min(dispMult + inc, servMult);
        }
        if(dispMult < 1) dispMult = 1;

        /* Обновляем текст коэфа */
        if(now - lastMultUpdate > 50){
            lastMultUpdate = now;
            var cb = $('coeffBox');
            if(cb && status === 'flying'){
                var ct = dispMult.toFixed(2) + 'x';
                if(ct !== _lastCoeffText){
                    cb.textContent = ct;
                    _lastCoeffText = ct;
                }
            }
            /* Счётчик в турбо */
            updateTurboCounter();
        }

        /* Обновляем сумму в cashout */
        if(hasBet && !cashedOut){
            var cbWin = $('cbWin');
            if(cbWin){
                var winAmt = Math.floor(betAmt * Math.max(dispMult, servMult));
                cbWin.textContent = formatMoney(winAmt);
            }
        }
    }

    requestAnimationFrame(render);
}

function updateTurboCounter(){
    var tc = $('turboCounter');
    if(!tc) return;
    if(!turboMode || status !== 'flying'){
        tc.classList.remove('active');
        return;
    }
    tc.classList.add('active');
    var tm = $('turboMult');
    if(tm) tm.textContent = dispMult.toFixed(2);
    tc.classList.remove('mid','high','mega');
    if(dispMult >= 5) tc.classList.add('mega');
    else if(dispMult >= 3) tc.classList.add('high');
    else if(dispMult >= 1.5) tc.classList.add('mid');
}

/* ══════════════════════════════════════════════════════════════
   BETS
   ══════════════════════════════════════════════════════════════ */
async function loadBets(){
    if(status === 'crashed') return;
    try{
        var r = await fetch('/api/ultimate-crash/recent-bets?limit=30');
        var d = await r.json();
        if(!d.success) return;

        var bets = (d.bets || []).sort(function(a,b){ return b.bet_amount - a.bet_amount; });
        var bc = $('betsCount');
        if(bc) bc.textContent = bets.length;

        var list = $('betsList');
        if(!list) return;

        if(!bets.length){
            list.innerHTML = '<div class="no-bets">Waiting for bets...</div>';
            return;
        }

        var html = '';
        bets.forEach(function(b){
            var name = b.first_name || ('User ' + b.user_id);
            var ini = (b.first_name || 'U')[0].toUpperCase();
            var hasPhoto = b.photo_url && b.photo_url !== '/static/img/default_avatar.png';
            var avatar = hasPhoto ? '<img src="' + b.photo_url + '">' : ini;
            var cls = 'active';
            var statusHtml = '';

            if(b.status === 'cashed_out'){
                cls = 'won';
                var coef = b.cashout_multiplier ? parseFloat(b.cashout_multiplier).toFixed(2) : '?';
                var win = b.win_amount || 0;
                statusHtml = '<div class="bet-status won">×' + coef + ' +' + formatMoney(win) + '</div>';
            } else if(b.status === 'lost'){
                cls = 'lost';
                statusHtml = '<div class="bet-status lost">×' + servMult.toFixed(2) + '</div>';
            } else {
                statusHtml = '<div class="bet-status active">×' + servMult.toFixed(2) + '</div>';
            }

            html += '<div class="bet-row ' + cls + '">'
                + '<div class="bet-left">'
                +   '<div class="bet-avatar">' + avatar + '</div>'
                +   '<div class="bet-info">'
                +     '<div class="bet-name">' + name + '</div>'
                +     '<div class="bet-amt"><span class="bet-amount-text">' + formatMoney(b.bet_amount) + '</span> TON</div>'
                +   '</div>'
                + '</div>'
                + statusHtml
                + '</div>';
        });
        list.innerHTML = html;
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   HISTORY
   ══════════════════════════════════════════════════════════════ */
async function loadHistory(){
    try{
        var r = await fetch('/api/ultimate-crash/history?limit=15');
        var d = await r.json();
        if(!d.success) return;
        var bar = $('histScroll');
        var coeff = $('coeffBox');
        if(!bar || !coeff) return;
        bar.innerHTML = '';
        bar.appendChild(coeff);
        (d.history || []).forEach(function(h){
            var m = parseFloat(h.final_multiplier);
            var cls = 'low';
            if(m >= 5) cls = 'mega';
            else if(m >= 3) cls = 'high';
            else if(m >= 1.5) cls = 'mid';
            var p = document.createElement('div');
            p.className = 'h-pill ' + cls;
            p.textContent = m.toFixed(2) + 'x';
            bar.appendChild(p);
        });
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   BET MODAL
   ══════════════════════════════════════════════════════════════ */
function openBetModal(){
    if(hasBet){
        showToast('Уже есть ставка', 'err');
        return;
    }
    var m = $('betModal');
    if(m) m.classList.add('show');
}
function closeBetModal(){
    var m = $('betModal');
    if(m) m.classList.remove('show');
}

async function confirmStarsBet(){
    if(!userData || !userData.id){
        showToast('Ошибка авторизации', 'err');
        return;
    }
    var input = $('betInput');
    if(!input) return;
    var tons = parseFloat(String(input.value).replace(',', '.'));
    if(!tons || tons < 0.1){
        showToast('Мин. 0.1 TON', 'err');
        return;
    }
    var amt = Math.round(tons * 100);
    if(amt > (userData.balance_stars || 0)){
        showToast('Недостаточно средств', 'err');
        return;
    }

    var btn = $('confirmBetBtn');
    if(btn) btn.disabled = true;

    try{
        var r = await fetch('/api/ultimate-crash/place-bet', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: userData.id, bet_amount: amt})
        });
        var d = await r.json();
        if(d.success){
            hasBet = true;
            betAmt = amt;
            userData.balance_stars = d.new_balance;
            updateBalance();
            closeBetModal();
            showToast('Ставка принята!', 'ok');
            loadBets();
        } else {
            showToast(d.error || 'Ошибка', 'err');
        }
    }catch(e){
        showToast('Ошибка сети', 'err');
    } finally {
        if(btn) btn.disabled = false;
    }
}

/* ══════════════════════════════════════════════════════════════
   CASHOUT
   ══════════════════════════════════════════════════════════════ */
async function doCashout(){
    if(!hasBet || !userData || !userData.id) return;
    if(cashoutLocked) return;
    cashoutLocked = true;

    /* Фиксируем множитель локально */
    var frozen = Math.max(dispMult, servMult);
    frozen = Math.round((frozen + 0.02) * 100) / 100;
    var winAmt = Math.floor(betAmt * frozen);

    cashedOut = true;

    /* Сразу показываем +X */
    var pb = $('placeBetBtn');
    if(pb){
        pb.style.display = 'block';
        pb.disabled = true;
        pb.innerHTML = '<span class="btn-text">+' + formatMoney(winAmt) + '</span>';
    }
    var cb = $('cashoutBtn');
    if(cb){
        cb.classList.add('crash-state');
        cb.disabled = true;
    }
    showToast('Cashed out ' + frozen.toFixed(2) + 'x!', 'ok');

    try{
        var r = await fetch('/api/ultimate-crash/cashout-simple', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: userData.id, client_mult: frozen})
        });
        var d = await r.json();
        if(d.success){
            userData.balance_stars = d.new_balance;
            updateBalance();
        }
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */
function openDeposit(){
    showToast('Пополнение через /inventory', 'ok');
}

/* ══════════════════════════════════════════════════════════════
   START
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function(){
    init();
});
</script>
