<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rasswet Gifts — Игры</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
:root{
    --bg:#1C2233;
    --panel:#0B1120;
    --panel-2:#0d1424;
    --border:rgba(99,160,255,.12);
    --text:#fff;
    --text-2:#8CA0BE;
    --text-3:rgba(140,160,190,.6);
    --green:#1EE44C;
    --red:#FF3064;
    --gold:#FFD700;
    --blue:#3B82F6;
    --blue-2:#2563EB;
    --safe-top:env(safe-area-inset-top, 20px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════ TOP BAR ══════════════ */
.top-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(var(--safe-top) + 58px) 14px 10px;
    max-width:480px;margin:0 auto;
    position:relative;z-index:10;
}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{
    display:flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:20px;
    border:1.5px solid rgba(30,228,76,.45);
    background:rgba(30,228,76,.12);
    font-family:inherit;font-weight:700;font-size:13px;color:#1EE44C;
    backdrop-filter:blur(5px);
}
.online-pill svg{width:12px;height:12px}
.top-right-btns{display:flex;gap:8px;align-items:center}
.bal-pill-crash{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    font-weight:700;font-size:13px;color:#fff;
    backdrop-filter:blur(5px);
}
.bal-pill-crash img{width:16px;height:16px}
.bal-plus-crash{
    width:28px;height:28px;border-radius:50%;
    border:none;background:rgba(120,135,160,.3);
    color:#A0B0C4;font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    border:1px solid rgba(120,135,160,.45);
}
.bal-plus-crash:active{transform:scale(.9)}

/* ══════════════ CONTAINER ══════════════ */
.games-container{
    max-width:480px;margin:0 auto;
    padding:4px 12px calc(var(--safe-bottom) + 32px);
    position:relative;z-index:1;
}

/* ══════════════ PAGE TITLE ══════════════ */
.page-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;padding:0 2px;
}
.page-title{
    font-size:20px;font-weight:800;color:#fff;
    letter-spacing:-.3px;
}

/* ══════════════ GAME CARD ══════════════ */
.game-card{
    position:relative;
    border:none;
    border-radius:22px;
    cursor:pointer;
    transition:transform .3s cubic-bezier(.175,.885,.32,1.275);
    overflow:hidden;
    width:100%;
    height:158px;
    margin-bottom:12px;
    display:block;
    text-align:left;
    padding:0;
    background:none;
    isolation:isolate;
    -webkit-tap-highlight-color:transparent;
}
.game-card:active{transform:scale(.97)}

.game-card::before{
    content:'';position:absolute;inset:-2px;
    border-radius:24px;z-index:-1;
    opacity:.7;filter:blur(16px);
    transition:opacity .3s;
}
.game-card-crash::before{background:linear-gradient(135deg,#ff5722,#8b0000)}
.game-card-cases::before{background:linear-gradient(135deg,#3b82f6,#1e3a8a)}
.game-card-market::before{background:linear-gradient(135deg,#10b981,#064e3b)}
.game-card-upgrade::before{background:linear-gradient(135deg,#8b5cf6,#4c1d95)}
.game-card:active::before{opacity:.4}

.game-card-content{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:18px 20px;height:100%;width:100%;
    position:relative;z-index:3;
}

.game-card-info{display:flex;flex-direction:column;gap:8px;align-self:center}

.game-card-text{
    font-size:26px;font-weight:800;color:#fff;
    line-height:1.1;letter-spacing:-.5px;
    text-shadow:0 2px 12px rgba(0,0,0,.5);
}

.game-card-players{
    position:absolute;top:12px;left:16px;
    display:flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;
    color:rgba(255,255,255,.75);
    z-index:5;
    background:rgba(0,0,0,.3);
    padding:4px 10px;border-radius:20px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.1);
}
.game-card-players svg{width:11px;height:11px;opacity:.8}

.game-card-gif{
    position:absolute;right:6px;bottom:-6px;
    width:130px;height:130px;
    object-fit:contain;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));
    z-index:4;pointer-events:none;
    will-change:transform;
    animation:floatGif 4.5s ease-in-out infinite;
}
@keyframes floatGif{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-6px) rotate(-1deg)}
    50%{transform:translateY(0) rotate(0)}
    75%{transform:translateY(-3px) rotate(1deg)}
}

/* ══════════════ ТЕМЫ КАРТОЧЕК ══════════════ */
.game-card-crash{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(255,87,34,.35) 0%, transparent 60%),
        radial-gradient(120% 100% at 20% 100%, rgba(139,0,0,.55) 0%, transparent 70%),
        linear-gradient(135deg, #2a0a00 0%, #1a0500 50%, #0f0200 100%);
    box-shadow:0 8px 32px rgba(255,87,34,.25), inset 0 1px 0 rgba(255,255,255,.08);
    border:1px solid rgba(255,87,34,.2);
}
.game-card-cases{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(59,130,246,.35) 0%, transparent 60%),
        radial-gradient(120% 100% at 20% 100%, rgba(30,58,138,.55) 0%, transparent 70%),
        linear-gradient(135deg, #001033 0%, #000820 50%, #000410 100%);
    box-shadow:0 8px 32px rgba(59,130,246,.25), inset 0 1px 0 rgba(255,255,255,.08);
    border:1px solid rgba(59,130,246,.2);
}
.game-card-market{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(16,185,129,.35) 0%, transparent 60%),
        radial-gradient(120% 100% at 20% 100%, rgba(6,78,59,.55) 0%, transparent 70%),
        linear-gradient(135deg, #001a10 0%, #000d08 50%, #000402 100%);
    box-shadow:0 8px 32px rgba(16,185,129,.25), inset 0 1px 0 rgba(255,255,255,.08);
    border:1px solid rgba(16,185,129,.2);
}
.game-card-upgrade{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(139,92,246,.35) 0%, transparent 60%),
        radial-gradient(120% 100% at 20% 100%, rgba(76,29,149,.55) 0%, transparent 70%),
        linear-gradient(135deg, #160a2a 0%, #0d0518 50%, #06020d 100%);
    box-shadow:0 8px 32px rgba(139,92,246,.25), inset 0 1px 0 rgba(255,255,255,.08);
    border:1px solid rgba(139,92,246,.2);
}

/* ══════════════ UPGRADE WHEEL ══════════════ */
.upgrade-wheel-svg{
    position:absolute;right:-10px;bottom:-20px;
    width:160px;height:160px;
    z-index:4;pointer-events:none;
    filter:drop-shadow(0 8px 24px rgba(139,92,246,.4));
}
.upgrade-wheel-svg .wheel-ring{fill:none;stroke:#1a1a24;stroke-width:22}
.upgrade-wheel-svg .wheel-tick{stroke:#fff;stroke-width:2;stroke-linecap:round}
.upgrade-wheel-svg .wheel-inner{fill:none;stroke:rgba(255,255,255,.06);stroke-width:1}
.upgrade-wheel-svg .wheel-pointer{fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.upgrade-wheel-svg .wheel-green{fill:none;stroke:url(#upgradeGreenGrad);stroke-width:22}

/* ══════════════ TAGS ══════════════ */
.game-card-tag{
    position:absolute;top:12px;right:12px;
    border-radius:8px;padding:5px 11px;
    font-size:10px;font-weight:800;color:#fff;
    letter-spacing:.8px;z-index:5;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    text-transform:uppercase;
}
.tag-live{
    background:linear-gradient(135deg,#ff6b35,#e74c3c);
    box-shadow:0 4px 12px rgba(255,107,53,.5);
    animation:livePulse 2s ease-in-out infinite;
}
@keyframes livePulse{
    0%,100%{box-shadow:0 4px 12px rgba(255,107,53,.5)}
    50%{box-shadow:0 4px 20px rgba(255,107,53,.9)}
}
.tag-new{
    background:linear-gradient(135deg,#4ade80,#22c55e);
    box-shadow:0 4px 12px rgba(74,222,128,.5);
}
.tag-hot{
    background:linear-gradient(135deg,#f43f5e,#be123c);
    box-shadow:0 4px 12px rgba(244,63,94,.5);
}

/* ══════════════ EMPTY STATE ══════════════ */
.empty-msg{
    text-align:center;padding:60px 20px;
    color:rgba(255,255,255,.3);
    font-size:14px;font-weight:600;
}

@media(max-width:380px){
    .game-card{height:145px}
    .game-card-text{font-size:22px}
    .game-card-gif{width:110px;height:110px}
    .upgrade-wheel-svg{width:135px;height:135px}
}
</style>
</head>

<style>

<script>
var userId = null;
var userData = null;
var ROCKET_SLOTS = ['crash','cat','dog','banana','plane','rabbit','ice','unicorn','goldenplane','telegram','TonTheMoon'];
var lastCrashGif = 'crash';

function $(id){ return document.getElementById(id); }

/* ══════════════════════════════════════════════════════════════
   RANDOM CRASH GIF
   ══════════════════════════════════════════════════════════════ */
function randomizeCrashGif(){
    var img = $('crashGif');
    if(!img) return;
    var pool = ROCKET_SLOTS.filter(function(r){ return r !== lastCrashGif; });
    var random = pool[Math.floor(Math.random() * pool.length)];
    lastCrashGif = random;
    img.style.opacity = '0';
    img.style.transition = 'opacity .3s';
    setTimeout(function(){
        img.src = '/static/gifs/rockets/' + random + '.gif';
        img.onerror = function(){
            this.onerror = null;
            this.src = '/static/gifs/rockets/crash.gif';
        };
        img.style.opacity = '1';
    }, 150);
}
setInterval(randomizeCrashGif, 3000);

/* ══════════════════════════════════════════════════════════════
   UPGRADE WHEEL ANIMATION
   ══════════════════════════════════════════════════════════════ */
(function initUpgradeWheel(){
    var risksGroup = $('upgradeWheelRisks');
    if(!risksGroup) return;

    var cx = 100, cy = 100, rOuter = 86;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 7 : 4;
        var width = isMajor ? 1.8 : 1;
        var opacity = isMajor ? 0.75 : 0.4;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 1);
        var y1 = cy + Math.sin(rad) * (rOuter - 1);
        var x2 = cx + Math.cos(rad) * (rOuter - 1 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 1 - len);
        html += '<line class="wheel-tick" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1)
              + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1)
              + '" stroke="rgba(255,255,255,' + opacity + ')"'
              + ' stroke-width="' + width + '"/>';
    }
    risksGroup.innerHTML = html;

    var rotator = $('upgradeWheelRotator');
    if(!rotator) return;

    var angles = [0, 45, -30, 15, -60, 30, 0];
    var i = 0;
    function nextAngle(){
        var target = angles[i % angles.length];
        rotator.style.transition = 'transform 1.8s cubic-bezier(.34,1.56,.64,1)';
        rotator.style.transform = 'rotate(' + target + 'deg)';
        i++;
    }
    setTimeout(function(){
        nextAngle();
        setInterval(nextAngle, 2400);
    }, 500);
})();

/* ══════════════════════════════════════════════════════════════
   NAV
   ══════════════════════════════════════════════════════════════ */
function goTo(url){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}
    window.location.href = url;
}

/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */
function openDeposit(){ $('depositOverlay').classList.add('show'); }
function closeDeposit(){ $('depositOverlay').classList.remove('show'); }

/* ══════════════════════════════════════════════════════════════
   TOP BAR / ONLINE
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            userData = d.user;
            $('balVal').textContent = ((userData.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}

async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var count = d.count || 0;
        var el = $('onlineCount');
        if(el) el.textContent = count;

        var crashN = Math.max(3, Math.floor(count * 0.6 + Math.random() * 5));
        var casesN = Math.max(2, Math.floor(count * 0.4 + Math.random() * 4));
        var marketN = Math.max(1, Math.floor(count * 0.3 + Math.random() * 3));
        var upgN = Math.max(1, Math.floor(count * 0.35 + Math.random() * 3));

        if($('crashPlayers')) $('crashPlayers').textContent = crashN + ' играют';
        if($('casesPlayers')) $('casesPlayers').textContent = casesN + ' играют';
        if($('marketPlayers')) $('marketPlayers').textContent = marketN + ' играют';
        if($('upgradePlayers')) $('upgradePlayers').textContent = upgN + ' играют';
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
async function initGames(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd && bd.banned){ window.location.href = '/ban'; return; }
        }catch(e){}
        try{
            if(window.Telegram && Telegram.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                Telegram.WebApp.setHeaderColor('#1C2233');
                Telegram.WebApp.setBackgroundColor('#1C2233');
            }
        }catch(e){}
    }
    loadTopBar();
    loadOnline();
    setInterval(loadOnline, 15000);
}

document.addEventListener('DOMContentLoaded', function(){
    randomizeCrashGif();
    initGames();
});
</script>
