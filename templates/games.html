<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rasswet Gifts — Игры</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
:root{
    --bg:#1C2233;
    --panel:#0B1120;
    --text:#fff;
    --text-2:#8CA0BE;
    --text-3:rgba(140,160,190,.6);
    --green:#1EE44C;
    --red:#FF3064;
    --gold:#FFD700;
    --blue:#3B82F6;
    --blue-2:#2563EB;
    --safe-top:env(safe-area-inset-top, 20px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════ TOP BAR ══════════════ */
.top-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(var(--safe-top) + 58px) 14px 10px;
    max-width:480px;margin:0 auto;
    position:relative;z-index:10;
}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{
    display:flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:20px;
    border:1.5px solid rgba(30,228,76,.45);
    background:rgba(30,228,76,.12);
    font-weight:700;font-size:13px;color:#1EE44C;
    backdrop-filter:blur(5px);
}
.online-pill svg{width:12px;height:12px}
.top-right-btns{display:flex;gap:8px;align-items:center}
.bal-pill-crash{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    font-weight:700;font-size:13px;color:#fff;
    backdrop-filter:blur(5px);
}
.bal-pill-crash img{width:16px;height:16px}
.bal-plus-crash{
    width:28px;height:28px;border-radius:50%;
    border:none;background:rgba(120,135,160,.3);
    color:#A0B0C4;font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    border:1px solid rgba(120,135,160,.45);
}
.bal-plus-crash:active{transform:scale(.9)}

/* ══════════════ CONTAINER ══════════════ */
.games-container{
    max-width:480px;margin:0 auto;
    padding:8px 12px calc(var(--safe-bottom) + 32px);
    position:relative;z-index:1;
}

/* ══════════════ GAME CARD ══════════════ */
.game-card{
    position:relative;
    border:none;
    border-radius:28px;
    cursor:pointer;
    transition:transform .3s cubic-bezier(.175,.885,.32,1.275);
    overflow:hidden;
    width:100%;
    height:160px;
    margin-bottom:14px;
    display:block;
    text-align:left;
    padding:0;
    background:none;
    isolation:isolate;
    -webkit-tap-highlight-color:transparent;
}
.game-card:active{transform:scale(.97)}

.game-card::before{
    content:'';position:absolute;inset:-2px;
    border-radius:30px;z-index:-1;
    opacity:.85;filter:blur(18px);
    transition:opacity .3s;
}
.game-card-inventory::before{background:linear-gradient(135deg,#fbbf24,#b45309)}
.game-card-crash::before{background:linear-gradient(135deg,#ff8a3d,#c2410c)}
.game-card-cases::before{background:linear-gradient(135deg,#60a5fa,#1e40af)}
.game-card-market::before{background:linear-gradient(135deg,#34d399,#047857)}
.game-card-upgrade::before{background:linear-gradient(135deg,#a78bfa,#6d28d9)}
.game-card:active::before{opacity:.5}

.game-card-content{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:18px 22px;height:100%;width:100%;
    position:relative;z-index:3;
}

.game-card-info{display:flex;flex-direction:column;gap:8px;align-self:center}

.game-card-text{
    font-size:26px;font-weight:800;color:#fff;
    line-height:1.1;letter-spacing:-.5px;
    text-shadow:0 2px 12px rgba(0,0,0,.5);
}

.game-card-players{
    position:absolute;top:14px;left:18px;
    display:flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;
    color:rgba(255,255,255,.85);
    z-index:5;
    background:rgba(0,0,0,.4);
    padding:5px 12px;border-radius:20px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.15);
}
.game-card-players svg{width:11px;height:11px;opacity:.9}

/* ════ GIF / PNG — с закруглением и overflow ════ */
.game-card-gif{
    position:absolute;right:8px;bottom:-6px;
    width:135px;height:135px;
    object-fit:contain;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));
    z-index:4;pointer-events:none;
    will-change:transform;
    animation:floatGif 4.5s ease-in-out infinite;
    border-radius:22px;
    overflow:hidden;
}
/* Для маркета (PNG в квадрате) — обрезаем по кругу/скруглению */
.game-card-gif.rounded{
    border-radius:24px;
    overflow:hidden;
    mask-image:radial-gradient(circle at center, #000 68%, transparent 100%);
    -webkit-mask-image:radial-gradient(circle at center, #000 68%, transparent 100%);
    background:transparent;
    padding:0;
}
@keyframes floatGif{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-6px) rotate(-1deg)}
    50%{transform:translateY(0) rotate(0)}
    75%{transform:translateY(-3px) rotate(1deg)}
}

/* ══════════════ ТЕМЫ КАРТОЧЕК ══════════════ */
.game-card-inventory{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(251,191,36,.45) 0%, transparent 65%),
        radial-gradient(120% 100% at 20% 100%, rgba(180,83,9,.7) 0%, transparent 75%),
        linear-gradient(135deg, #3d2505 0%, #291a0a 50%, #1a1005 100%);
    box-shadow:
        0 10px 36px rgba(251,191,36,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
    border:1.5px solid rgba(251,191,36,.35);
}
.game-card-crash{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(255,138,61,.45) 0%, transparent 65%),
        radial-gradient(120% 100% at 20% 100%, rgba(194,65,12,.7) 0%, transparent 75%),
        linear-gradient(135deg, #3d1505 0%, #29100a 50%, #1a0a05 100%);
    box-shadow:
        0 10px 36px rgba(255,138,61,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
    border:1.5px solid rgba(255,138,61,.35);
}
.game-card-cases{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(96,165,250,.45) 0%, transparent 65%),
        radial-gradient(120% 100% at 20% 100%, rgba(30,64,175,.7) 0%, transparent 75%),
        linear-gradient(135deg, #0a1a45 0%, #081230 50%, #050a1e 100%);
    box-shadow:
        0 10px 36px rgba(96,165,250,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
    border:1.5px solid rgba(96,165,250,.35);
}
.game-card-market{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(52,211,153,.45) 0%, transparent 65%),
        radial-gradient(120% 100% at 20% 100%, rgba(4,120,87,.7) 0%, transparent 75%),
        linear-gradient(135deg, #00291c 0%, #001a13 50%, #000d09 100%);
    box-shadow:
        0 10px 36px rgba(52,211,153,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
    border:1.5px solid rgba(52,211,153,.35);
}
.game-card-upgrade{
    background:
        radial-gradient(90% 70% at 85% 20%, rgba(167,139,250,.45) 0%, transparent 65%),
        radial-gradient(120% 100% at 20% 100%, rgba(109,40,217,.7) 0%, transparent 75%),
        linear-gradient(135deg, #231045 0%, #180a30 50%, #0d0518 100%);
    box-shadow:
        0 10px 36px rgba(167,139,250,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
    border:1.5px solid rgba(167,139,250,.35);
}

/* ══════════════ UPGRADE WHEEL ══════════════ */
.upgrade-wheel-svg{
    position:absolute;right:-10px;bottom:-20px;
    width:160px;height:160px;
    z-index:4;pointer-events:none;
    filter:drop-shadow(0 8px 24px rgba(167,139,250,.55));
}
.upgrade-wheel-svg .wheel-ring{fill:none;stroke:#1a1a2e;stroke-width:22}
.upgrade-wheel-svg .wheel-tick{stroke:#fff;stroke-width:2;stroke-linecap:round}
.upgrade-wheel-svg .wheel-inner{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1}
.upgrade-wheel-svg .wheel-pointer{fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.9))}
.upgrade-wheel-svg .wheel-green{fill:none;stroke:url(#upgradeGreenGrad);stroke-width:22}

/* ══════════════ TAGS ══════════════ */
.game-card-tag{
    position:absolute;top:14px;right:14px;
    border-radius:10px;padding:6px 12px;
    font-size:10px;font-weight:800;color:#fff;
    letter-spacing:.8px;z-index:5;
    box-shadow:0 4px 14px rgba(0,0,0,.45);
    text-transform:uppercase;
    border:1px solid rgba(255,255,255,.15);
}
.tag-live{
    background:linear-gradient(135deg,#ff8a3d,#e74c3c);
    box-shadow:0 4px 14px rgba(255,138,61,.6);
    animation:livePulse 2s ease-in-out infinite;
}
@keyframes livePulse{
    0%,100%{box-shadow:0 4px 14px rgba(255,138,61,.6)}
    50%{box-shadow:0 4px 22px rgba(255,138,61,1)}
}
.tag-new{
    background:linear-gradient(135deg,#4ade80,#16a34a);
    box-shadow:0 4px 14px rgba(74,222,128,.6);
}
.tag-hot{
    background:linear-gradient(135deg,#fb7185,#be123c);
    box-shadow:0 4px 14px rgba(244,63,94,.6);
}
.tag-gold{
    background:linear-gradient(135deg,#FFD700,#FFA500);
    color:#000;
    box-shadow:0 4px 14px rgba(255,215,0,.6);
}

/* ══════════════ EMPTY ══════════════ */
.empty-msg{
    text-align:center;padding:60px 20px;
    color:rgba(255,255,255,.3);
    font-size:14px;font-weight:600;
}

/* ══════════════ DEPOSIT MODAL ══════════════ */
.deposit-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.85);
    z-index:9600;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{
    background:linear-gradient(180deg,#1E2538,#151B2D);
    border-radius:28px;width:90%;max-width:360px;
    padding:24px 20px;transform:scale(.9);
    transition:transform .3s;
    border:1px solid rgba(255,255,255,.1);
}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.deposit-title{font-weight:800;font-size:18px;color:#fff}
.deposit-close{
    width:32px;height:32px;border-radius:12px;
    border:none;background:rgba(249,105,153,.15);
    cursor:pointer;color:#F96999;font-size:18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
}
.deposit-methods{display:flex;gap:12px}
.deposit-method-btn{
    position:relative;flex:1;padding:20px 14px;border-radius:22px;
    border:2px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:10px;
    transition:all .2s;
}
.deposit-method-btn:active{transform:scale(.96);background:rgba(255,255,255,.08)}
.deposit-method-btn img{width:48px;height:48px;object-fit:contain}
.deposit-method-btn span{font-weight:700;font-size:13px;color:#fff}

@media(max-width:380px){
    .game-card{height:148px;border-radius:24px}
    .game-card-text{font-size:22px}
    .game-card-gif{width:118px;height:118px}
    .game-card-gif.rounded{border-radius:20px}
    .upgrade-wheel-svg{width:135px;height:135px}
    .game-card-tag{padding:5px 10px;border-radius:8px}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="top-left">
        <div class="online-pill">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span id="onlineCount">0</span>
        </div>
    </div>
    <div class="top-right-btns">
        <div class="bal-pill-crash">
            <img src="/static/img/ton.png" alt="TON">
            <span id="balVal">0.00</span>
        </div>
        <button class="bal-plus-crash" onclick="openDeposit()">+</button>
    </div>
</div>

<div class="games-container">

    <!-- 1. INVENTORY (первая, со сдвигом 15% вправо и пониже) -->
    <button class="game-card game-card-inventory" id="invCard" onclick="goTo('/inventory')">
        <div class="game-card-players">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>Твой профиль</span>
        </div>
        <div class="game-card-content">
            <div class="game-card-info">
                <span class="game-card-text">Инвентарь</span>
            </div>
            <img src="/static/gifs/inv.gif" alt="Inventory" class="game-card-gif" loading="lazy"
                 onerror="this.onerror=null;this.src='/static/img/gift.png'">
        </div>
        <div class="game-card-tag tag-gold">★ МОЙ</div>
    </button>

    <!-- 2. UPGRADE -->
    <button class="game-card game-card-upgrade" onclick="goTo('/upgrade')">
        <div class="game-card-players">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="upgradePlayers">0 играют</span>
        </div>
        <div class="game-card-content">
            <div class="game-card-info">
                <span class="game-card-text">Апгрейды</span>
            </div>
        </div>

        <svg class="upgrade-wheel-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="upgradeGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#24C38E"/>
                    <stop offset="100%" stop-color="#10b981"/>
                </linearGradient>
            </defs>

            <g id="upgradeWheelRotator" style="transform-origin:120px 120px">
                <circle class="wheel-ring" cx="120" cy="120" r="100"/>
                <circle class="wheel-green" cx="120" cy="120" r="100"
                        stroke-dasharray="190 628"
                        transform="rotate(-90 120 120)"/>
                <g id="upgradeWheelRisks" opacity="0.6"></g>
                <circle class="wheel-inner" cx="120" cy="120" r="86"/>
            </g>

            <path class="wheel-pointer"
                  d="M120 34 L104 62 C110 58 130 58 136 62 Z"
                  stroke="rgba(0,0,0,.4)" stroke-width="1" stroke-linejoin="round"/>
            <circle cx="120" cy="62" r="5" fill="#fff"/>
        </svg>

        <div class="game-card-tag tag-new">NEW</div>
    </button>

    <!-- 3. CRASH -->
    <button class="game-card game-card-crash" onclick="goTo('/crash')">
        <div class="game-card-players">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="crashPlayers">0 играют</span>
        </div>
        <div class="game-card-content">
            <div class="game-card-info">
                <span class="game-card-text">Краш</span>
            </div>
            <img src="/static/gifs/rockets/crash.gif" alt="Crash" class="game-card-gif" id="crashGif" loading="lazy">
        </div>
        <div class="game-card-tag tag-live">LIVE</div>
    </button>

    <!-- 4. CASES -->
    <button class="game-card game-card-cases" onclick="goTo('/cases')">
        <div class="game-card-players">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="casesPlayers">0 играют</span>
        </div>
        <div class="game-card-content">
            <div class="game-card-info">
                <span class="game-card-text">Кейсы</span>
            </div>
            <img src="/static/gifs/cases.gif" alt="Cases" class="game-card-gif" loading="lazy"
                 onerror="this.onerror=null;this.src='/static/gifs/Hlop.gif'">
        </div>
        <div class="game-card-tag tag-hot">HOT</div>
    </button>

    <!-- 5. MARKET -->
    <button class="game-card game-card-market" onclick="goTo('/market')">
        <div class="game-card-players">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="marketPlayers">0 играют</span>
        </div>
        <div class="game-card-content">
            <div class="game-card-info">
                <span class="game-card-text">Маркет</span>
            </div>
            <img src="/static/img/gift.png" alt="Market" class="game-card-gif rounded" id="marketGif" loading="lazy">
        </div>
        <div class="game-card-tag tag-new">NEW</div>
    </button>

</div>

<!-- DEPOSIT MODAL -->
<div class="deposit-overlay" id="depositOverlay" onclick="if(event.target===this)closeDeposit()">
    <div class="deposit-modal">
        <div class="deposit-header">
            <div class="deposit-title">Пополнение</div>
            <button class="deposit-close" onclick="closeDeposit()">✕</button>
        </div>
        <div class="deposit-methods">
            <button class="deposit-method-btn" onclick="closeDeposit();goTo('/crash')">
                <img src="/static/img/ton.png" alt="TON">
                <span>TON</span>
            </button>
            <button class="deposit-method-btn" onclick="closeDeposit();goTo('/crash')">
                <img src="/static/img/star.png" alt="Stars">
                <span>Stars</span>
            </button>
        </div>
    </div>
</div>

<script>
var userId = null;
var userData = null;
var ROCKET_SLOTS = ['crash','cat','dog','banana','plane','rabbit','ice','unicorn','goldenplane','telegram','TonTheMoon'];
var lastCrashGif = 'crash';

function $(id){ return document.getElementById(id); }

/* ══════════════════════════════════════════════════════════════
   INVENTORY CARD — сдвиг 15% вправо + ниже
   ══════════════════════════════════════════════════════════════ */
function applyInventoryCardOffset(){
    var card = $('invCard');
    if(!card) return;
    // Сдвиг 15% вправо + опускаем на 20px
    card.style.transform = 'translateX(15%)';
    card.style.marginTop = '20px';
}
applyInventoryCardOffset();

/* ══════════════════════════════════════════════════════════════
   RANDOM CRASH GIF
   ══════════════════════════════════════════════════════════════ */
function randomizeCrashGif(){
    var img = $('crashGif');
    if(!img) return;
    var pool = ROCKET_SLOTS.filter(function(r){ return r !== lastCrashGif; });
    var random = pool[Math.floor(Math.random() * pool.length)];
    lastCrashGif = random;
    img.style.opacity = '0';
    img.style.transition = 'opacity .3s';
    setTimeout(function(){
        img.src = '/static/gifs/rockets/' + random + '.gif';
        img.onerror = function(){
            this.onerror = null;
            this.src = '/static/gifs/rockets/crash.gif';
        };
        img.style.opacity = '1';
    }, 150);
}

/* ══════════════════════════════════════════════════════════════
   RANDOM MARKET PNG
   ══════════════════════════════════════════════════════════════ */
async function randomizeMarketGif(){
    var img = $('marketGif');
    if(!img) return;
    try{
        var r = await fetch('/api/market/gifts');
        var d = await r.json();
        if(d.success && d.gifts && d.gifts.length){
            var pool = d.gifts.slice(0, Math.min(30, d.gifts.length));
            var gift = pool[Math.floor(Math.random() * pool.length)];
            var src = buildMarketGiftImage(gift);
            img.src = src;
            img.onerror = function(){
                this.onerror = null;
                var alt = pool[Math.floor(Math.random() * pool.length)];
                this.src = buildMarketGiftImage(alt);
            };
        }
    }catch(e){}
}

function buildMarketGiftImage(gift){
    if(!gift) return '/static/img/gift.png';
    if(gift.slug){
        var cleanSlug = String(gift.slug).replace(/\s/g, '');
        var nftNum = Math.floor(Math.random() * 4999) + 1;
        return 'https://nft.fragment.com/gift/' + cleanSlug + '-' + nftNum + '.medium.jpg';
    }
    return gift.image || '/static/img/gift.png';
}

/* ══════════════════════════════════════════════════════════════
   UPGRADE WHEEL ANIMATION
   ══════════════════════════════════════════════════════════════ */
(function initUpgradeWheel(){
    var risksGroup = $('upgradeWheelRisks');
    if(!risksGroup) return;

    var cx = 120, cy = 120, rOuter = 100;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 8 : 5;
        var width = isMajor ? 1.8 : 1;
        var opacity = isMajor ? 0.75 : 0.4;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 2);
        var y1 = cy + Math.sin(rad) * (rOuter - 2);
        var x2 = cx + Math.cos(rad) * (rOuter - 2 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 2 - len);
        html += '<line class="wheel-tick" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1)
              + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1)
              + '" stroke="rgba(255,255,255,' + opacity + ')"'
              + ' stroke-width="' + width + '"/>';
    }
    risksGroup.innerHTML = html;

    var rotator = $('upgradeWheelRotator');
    if(!rotator) return;

    var angles = [0, 45, -30, 15, -60, 30, 0];
    var i = 0;
    function nextAngle(){
        var target = angles[i % angles.length];
        rotator.style.transition = 'transform 1.8s cubic-bezier(.34,1.56,.64,1)';
        rotator.style.transform = 'rotate(' + target + 'deg)';
        i++;
    }
    setTimeout(function(){
        nextAngle();
        setInterval(nextAngle, 2400);
    }, 500);
})();

/* ══════════════════════════════════════════════════════════════
   TOP BAR / ONLINE
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            userData = d.user;
            $('balVal').textContent = ((userData.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}

async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var count = d.count || 0;
        var el = $('onlineCount');
        if(el) el.textContent = count;

        var crashN = Math.max(3, Math.floor(count * 0.6 + Math.random() * 5));
        var casesN = Math.max(2, Math.floor(count * 0.4 + Math.random() * 4));
        var marketN = Math.max(1, Math.floor(count * 0.3 + Math.random() * 3));
        var upgN = Math.max(1, Math.floor(count * 0.35 + Math.random() * 3));

        if($('crashPlayers')) $('crashPlayers').textContent = crashN + ' играют';
        if($('casesPlayers')) $('casesPlayers').textContent = casesN + ' играют';
        if($('marketPlayers')) $('marketPlayers').textContent = marketN + ' играют';
        if($('upgradePlayers')) $('upgradePlayers').textContent = upgN + ' играют';
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
async function initGames(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd && bd.banned){ window.location.href = '/ban'; return; }
        }catch(e){}
        try{
            if(window.Telegram && Telegram.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                Telegram.WebApp.setHeaderColor('#1C2233');
                Telegram.WebApp.setBackgroundColor('#1C2233');
            }
        }catch(e){}
    }
    loadTopBar();
    loadOnline();
    randomizeCrashGif();
    randomizeMarketGif();
    setInterval(loadOnline, 15000);
    setInterval(randomizeCrashGif, 3000);
    setInterval(randomizeMarketGif, 5000);
}

document.addEventListener('DOMContentLoaded', function(){
    applyInventoryCardOffset();
    initGames();
});
