<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rasswet Gifts — Игры</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>

<style>
:root{
    --bg:#080d1b;
    --header:#0c1221;
    --text:#f7f9fd;
    --muted:#91a1bb;
    --cyan:#20b8ff;
    --red:#ff315d;
    --blue:#6e91bd;
    --line:rgba(102,143,190,.20);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{min-height:100%}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(700px 450px at 8% 55%,rgba(24,91,145,.13),transparent 72%),
        radial-gradient(700px 450px at 94% 55%,rgba(95,58,53,.10),transparent 72%),
        linear-gradient(180deg,#090e1c 0%,#080d1b 100%);
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:76px 0 0;
    pointer-events:none;
    opacity:.30;
    background-image:
        linear-gradient(rgba(110,145,189,.07) 1px,transparent 1px),
        linear-gradient(90deg,rgba(110,145,189,.07) 1px,transparent 1px);
    background-size:80px 80px;
}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}

/* HEADER */
.top-bar{
    height:76px;
    width:100%;
    padding:0 42px;
    display:flex;
    align-items:center;
    position:relative;
    z-index:10;
    background:rgba(10,15,29,.96);
    border-bottom:1px solid rgba(110,145,189,.12);
    box-shadow:0 1px 25px rgba(0,0,0,.16);
}

.desktop-left{
    display:flex;
    align-items:center;
}

.main-nav{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.logo-btn{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-btn img{
    width:38px;
    height:38px;
    object-fit:contain;
}

.main-nav{
    display:flex;
    align-items:center;
    gap:2px;
}

.nav-btn{
    height:40px;
    padding:0 13px;
    border-radius:22px;
    display:flex;
    align-items:center;
    gap:8px;
    color:#8e9db6;
    font-size:14px;
    font-weight:700;
    transition:.18s ease;
    white-space:nowrap;
}

.nav-btn:hover{
    color:#c4d1e2;
    background:rgba(106,143,185,.07);
}

.nav-btn.active{
    color:#20b8ff;
    background:rgba(28,128,189,.17);
    box-shadow:
        inset 0 0 0 1px rgba(32,184,255,.28),
        0 4px 18px rgba(16,125,185,.08);
}

.nav-icon{
    width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:currentColor;
}

.nav-icon svg{width:18px;height:18px}

.account{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:9px;
}

.balance{
    height:36px;
    min-width:88px;
    padding:0 10px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:#edf5ff;
    background:linear-gradient(180deg,#14253a,#101d30);
    border:1px solid rgba(38,153,218,.34);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
    font-size:14px;
    font-weight:800;
}

.balance img{
    width:16px;
    height:16px;
    object-fit:contain;
}

.balance-value{min-width:35px;text-align:right}

.plus-btn{
    width:28px;
    height:28px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#eaf7ff;
    font-size:0;
    line-height:1;
    background:linear-gradient(180deg,rgba(32,184,255,.24),rgba(16,90,140,.22));
    border:1px solid rgba(32,184,255,.45);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 4px 16px rgba(16,125,185,.16);
    transition:.18s ease;
}

.plus-btn svg{width:13px;height:13px}

.plus-btn:hover{
    background:linear-gradient(180deg,rgba(32,184,255,.36),rgba(16,90,140,.3));
    border-color:rgba(32,184,255,.68);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        0 6px 20px rgba(16,125,185,.24);
}

.plus-btn:active{transform:scale(.92)}

.avatar{
    width:43px;
    height:43px;
    padding:2px;
    border-radius:50%;
    overflow:hidden;
    background:#101a2b;
    border:2px solid #257fca;
    box-shadow:0 0 0 2px rgba(37,127,202,.12);
}

.avatar img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

/* PAGE */
.page{
    width:min(100%,980px);
    margin:0 auto;
    padding:48px 28px 80px;
    position:relative;
    z-index:1;
}

.page-title{
    font-size:32px;
    line-height:1;
    font-weight:900;
    letter-spacing:-.8px;
    margin-bottom:27px;
}

/* ONLY TWO GAME BUTTONS */
.games-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:26px;
    width:100%;
}

.game-card{
    height:245px;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    background:#101727;
    text-align:left;
    isolation:isolate;
    transition:transform .18s ease,box-shadow .18s ease;
}

.game-card:before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    transform:scale(1.001);
    transition:transform .35s ease;
}

.game-card:after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:
        linear-gradient(180deg,rgba(4,7,14,.03) 20%,rgba(4,7,14,.12) 45%,rgba(4,7,14,.88) 100%),
        linear-gradient(90deg,rgba(4,7,14,.34),transparent 65%);
}

.game-card.crash{
    border:2px solid var(--red);
    box-shadow:
        0 0 0 1px rgba(255,49,93,.12),
        0 0 30px rgba(255,49,93,.11);
}

.game-card.mines{
    border:2px solid var(--cyan);
    box-shadow:
        0 0 0 1px rgba(32,184,255,.11),
        0 0 30px rgba(32,184,255,.10);
}

.game-card.crash:before{background-image:url("/static/img/crash.png")}
.game-card.mines:before{background-image:url("/static/img/mines.png")}

.game-card:hover{transform:translateY(-3px)}
.game-card:hover:before{transform:scale(1.035)}
.game-card:active{transform:scale(.985)}

.game-card-content{
    position:absolute;
    left:27px;
    right:20px;
    bottom:22px;
    z-index:2;
}

.game-name{
    color:#fff;
    font-size:34px;
    line-height:1;
    font-weight:900;
    letter-spacing:-.7px;
    text-shadow:0 2px 13px rgba(0,0,0,.75);
}

.game-subtitle{
    display:block;
    margin-top:9px;
    color:#fff;
    font-size:13px;
    line-height:1;
    font-weight:800;
    letter-spacing:.35px;
    text-transform:uppercase;
    text-shadow:0 1px 7px rgba(0,0,0,.8);
}

/* DEPOSIT */
.deposit-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(3,7,14,.80);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.2s ease;
}

.deposit-overlay.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.deposit-modal{
    width:min(100%,390px);
    padding:22px;
    border-radius:20px;
    background:#111b2c;
    border:1px solid rgba(111,151,198,.25);
    box-shadow:0 25px 90px rgba(0,0,0,.55);
    transform:translateY(10px) scale(.97);
    transition:.2s ease;
}

.deposit-overlay.show .deposit-modal{transform:none}

.deposit-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.deposit-title{font-size:20px;font-weight:850}

.deposit-close{
    width:35px;
    height:35px;
    border-radius:10px;
    color:#95a7c0;
    background:rgba(143,168,200,.08);
}

.deposit-methods{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.deposit-method-btn{
    min-height:115px;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:rgba(100,139,181,.06);
    border:1px solid rgba(100,139,181,.16);
    transition:.16s ease;
}

.deposit-method-btn:hover{
    background:rgba(100,139,181,.11);
    border-color:rgba(100,139,181,.35);
}

.deposit-method-btn img{width:40px;height:40px;object-fit:contain}
.deposit-method-btn span{font-size:14px;font-weight:800;color:#fff}

/* MOBILE */
@media(max-width:700px){
    body:before{inset:62px 0 0;background-size:65px 65px}

    .top-bar{
        height:auto;
        min-height:62px;
        padding:8px 11px;
        background:#0b111e;
    }

    .desktop-left{display:none}

    .account{
        width:100%;
        justify-content:flex-end;
        gap:7px;
    }

    .balance{
        min-width:88px;
        height:34px;
        padding:0 9px;
        border-radius:10px;
        font-size:12.5px;
    }

    .balance img{width:15px;height:15px}

    .plus-btn{
        width:25px;
        height:25px;
        border-radius:8px;
        font-size:0;
    }

    .plus-btn svg{width:12px;height:12px}
    .avatar{width:38px;height:38px}

    .page{
        width:100%;
        padding:28px 12px 40px;
    }

    .page-title{
        font-size:28px;
        margin-bottom:18px;
    }

    .games-grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    .game-card{
        height:178px;
        border-radius:17px;
    }

    .game-card-content{
        left:17px;
        bottom:16px;
    }

    .game-name{font-size:27px}
    .game-subtitle{font-size:11px;margin-top:7px}
}

<style id="events-halloween-css">.event-card{grid-column:1/-1;height:190px!important;border:2px solid #a855f7!important;background:linear-gradient(120deg,#261039,#4c1d68)!important;box-shadow:0 0 35px rgba(168,85,247,.18),inset 0 0 35px rgba(168,85,247,.08)!important}.event-card:before{background-image:url("/static/img/witchhat.png")!important;background-size:contain!important;background-position:right center!important}.event-card:after{background:linear-gradient(90deg,rgba(22,5,35,.96) 0%,rgba(22,5,35,.72) 45%,rgba(22,5,35,.08) 100%)!important}.event-card .game-name{color:#f2dcff;font-size:31px;line-height:.95;max-width:220px}.event-card .event-timer{display:inline-flex;margin-top:10px;padding:7px 10px;border-radius:10px;background:rgba(168,85,247,.18);border:1px solid rgba(216,180,254,.25);color:#e9d5ff;font-size:12px;font-weight:900}.halloween-active{--bg:#0d0617;--header:#12091e;--line:rgba(168,85,247,.28)}.halloween-active body{background:radial-gradient(700px 500px at 8% 40%,rgba(113,45,145,.22),transparent 70%),radial-gradient(700px 500px at 94% 65%,rgba(168,85,247,.18),transparent 70%),linear-gradient(180deg,#12051c,#08040d)}.halloween-active body:before{background-image:linear-gradient(rgba(168,85,247,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.08) 1px,transparent 1px)}.halloween-active .top-bar{background:rgba(18,7,28,.96);border-bottom-color:rgba(168,85,247,.22)}.halloween-active .nav-btn.active{color:#d8a8ff;background:rgba(139,92,246,.18);box-shadow:inset 0 0 0 1px rgba(168,85,247,.35),0 4px 18px rgba(139,92,246,.1)}.halloween-active .page-title{color:#f0dcff}.halloween-active .game-card:not(.event-card){filter:saturate(.85) hue-rotate(8deg)}@media(max-width:700px){.event-card{height:178px!important}.event-card .game-name{font-size:26px}.event-card:before{background-size:190px auto!important}}
</style>
</style>
</head>

    <div class="desktop-left">

        <nav class="main-nav">

                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                    </svg>
                </span>
                <span>Апгрейды</span>
            </button>

            <!-- СЕЗОН -->
            <button class="nav-btn" onclick="goTo('/leaderboard')">

                        <path d="M7 4h10v5.5c0 3.2-2.1 5.7-5 6.4-2.9-.7-5-3.2-5-6.4V4Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                        <path d="M7 7H4v2.5A3.5 3.5 0 0 0 7.5 13M17 7h3v2.5a3.5 3.5 0 0 1-3.5 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>

            <!-- ИГРЫ -->
            <button class="nav-btn active" onclick="goTo('/games')">

    </div>

    <div class="account">

<main class="page">
    <h1 class="page-title">Игры</h1>

<!-- POPUP ПОПОЛНЕНИЯ -->
<div class="deposit-overlay" id="depositOverlay" onclick="if(event.target===this)closeDeposit()">
    <div class="deposit-modal">

        <div class="deposit-header">
            <div class="deposit-title">Пополнение</div>
            <button class="deposit-close" onclick="closeDeposit()" aria-label="Закрыть">✕</button>
        </div>

        <div class="deposit-hint">Выберите способ пополнения</div>

        <div class="deposit-methods">
            <button class="deposit-method-btn" onclick="depositMethod('ton')">
                <img src="/static/img/ton.png" alt="TON">
                <span>TON</span>
            </button>

            <button class="deposit-method-btn" onclick="depositMethod('stars')">
                <img src="/static/img/star.png" alt="Stars">
                <span>Stars</span>
            </button>
        </div>

    </div>
</div>

<script>
var userId = null;
var userData = null;

function $(id){
    return document.getElementById(id);
}

function goTo(url){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}

    window.location.href = url;
}

function openDeposit(){
    var overlay = $('depositOverlay');
    if(!overlay) return;

    overlay.classList.add('show');

    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}
}

function closeDeposit(){
    var overlay = $('depositOverlay');
    if(!overlay) return;
    overlay.classList.remove('show');
}

/*
 * Раньше кнопки пополнения ошибочно вели на /crash.
 * Теперь они ведут на отдельный маршрут пополнения.
 * Если на сервере уже есть /deposit, он откроется с выбранным методом.
 */
function depositMethod(method){
    closeDeposit();

    var url = '/deposit?method=' + encodeURIComponent(method);

    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}

    window.location.href = url;
}

function setAvatar(auth,user){
    var img = $('avatarImg');
    if(!img) return;

    var photo =
        (auth && (auth.photo_url || auth.photoUrl)) ||
        (user && (user.photo_url || user.photoUrl));

    if(photo){
        img.src = photo;

        img.onerror = function(){
            this.onerror = null;
            this.src = '/static/img/logo.png';
        };
    }
}

async function loadTopBar(){
    if(!userId) return;

    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();

        if(d.success && d.user){
            userData = d.user;

            /*
             * Оставляем совместимость с текущим API:
             * balance_stars хранится в сотых долях Stars.
             */
            var balanceStars = Number(d.user.balance_stars || 0);

            if($('balVal')){
                $('balVal').textContent = (balanceStars / 100).toFixed(2);
            }

            setAvatar(null,d.user);
        }
    }catch(e){}
}

async function loadHalloweenEvent(){
    try{
        var r=await fetch('/api/events/witch-hat-party');
        var d=await r.json();
        var e=d.event||{};
        var card=$('witchHatEvent');
        if(!card) return;
        if(e.active){
            document.documentElement.classList.add('halloween-active');
            card.style.display='block';
            var left=Number(e.remaining_seconds||0);
            function tick(){
                left=Math.max(0,left-1);
                var x=Math.floor(left/86400),h=Math.floor(left%86400/3600),m=Math.floor(left%3600/60),sec=left%60;
                var text=(x?x+'д ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
                var el=$('witchHatTimer');if(el)el.textContent='Осталось '+text;
                if(left<=0){card.style.display='none';document.documentElement.classList.remove('halloween-active');}
            }
            if($('witchHatTimer')) $('witchHatTimer').textContent='Осталось '+(function(){var x=Math.floor(left/86400),h=Math.floor(left%86400/3600),m=Math.floor(left%3600/60),sec=left%60;return (x?x+'д ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')})();
            clearInterval(window._eventTimer);window._eventTimer=setInterval(tick,1000);
        }else{card.style.display='none';document.documentElement.classList.remove('halloween-active')}
    }catch(e){}
}

async function initGames(){
    var auth = null;

    try{
        auth = await telegramAuth();
    }catch(e){}

    if(auth && auth.id){
        userId = auth.id;

        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();

            if(bd && bd.banned){
                window.location.href = '/ban';
                return;
            }
        }catch(e){}

        setAvatar(auth,null);

        try{
            if(window.Telegram && Telegram.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                Telegram.WebApp.setHeaderColor('#0b111c');
                Telegram.WebApp.setBackgroundColor('#0b111c');
            }
        }catch(e){}
    }

    loadTopBar();
    loadHalloweenEvent();
}

document.addEventListener('DOMContentLoaded',initGames);
</script>
