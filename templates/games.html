<style>
:root{
    --bg:#1C2233;
    --panel:#0B1120;
    --text:#fff;
    --text-2:#8CA0BE;
    --text-3:rgba(140,160,190,.6);
    --green:#1EE44C;
    --red:#FF3064;
    --gold:#FFD700;
    --blue:#3B82F6;
    --blue-2:#2563EB;
    --safe-top:env(safe-area-inset-top, 20px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════ TOP BAR ══════════════ */
.top-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(var(--safe-top) + 20px) 14px 10px;
    max-width:480px;margin:0 auto;
    position:relative;z-index:10;
}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{
    display:flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:20px;
    border:1.5px solid rgba(30,228,76,.45);
    background:rgba(30,228,76,.12);
    font-weight:700;font-size:13px;color:#1EE44C;
    backdrop-filter:blur(5px);
}
.online-pill svg{width:12px;height:12px}
.top-right-btns{display:flex;gap:8px;align-items:center}
.bal-pill-crash{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    font-weight:700;font-size:13px;color:#fff;
    backdrop-filter:blur(5px);
}
.bal-pill-crash img{width:16px;height:16px}
.bal-plus-crash{
    width:28px;height:28px;border-radius:50%;
    border:none;background:rgba(120,135,160,.3);
    color:#A0B0C4;font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    border:1px solid rgba(120,135,160,.45);
}
.bal-plus-crash:active{transform:scale(.9)}

/* ══════════════ GAMES HOME — REFERENCE LAYOUT ══════════════ */
body{
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:#171717;
    background-image:linear-gradient(180deg,#171717 0%,#151515 100%);
}
.top-bar{
    height:79px;
    margin-top:34px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:8px 7px 8px 14px;
    max-width:480px;
    margin:0 auto;
    position:relative;
    z-index:20;
    background:#242424;
    border-bottom:1px solid #414141;
}
.top-right-btns{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
}
.user-avatar{
    width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;
    background:linear-gradient(135deg,#4b16d1,#17113c);
    border:2px solid #7c42ff;
    box-shadow:0 0 0 1px rgba(255,255,255,.12),0 5px 15px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
}
.user-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.user-avatar svg{width:27px;height:27px;fill:rgba(255,255,255,.9)}
.bal-pill-crash{
    margin-right:auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    gap:3px;
    min-width:110px;
    padding:0 2px;
    border:0;
    background:none;
    backdrop-filter:none;
    font-weight:800;
    font-size:17px;
    color:#fff;
    line-height:1;
}
.bal-pill-crash::before{
    content:'Your balance';
    color:#9b9b9b;
    font-size:11px;
    font-weight:500;
    line-height:1;
    margin-bottom:2px;
}
.bal-pill-crash img{
    width:22px;height:22px;object-fit:contain;
    vertical-align:middle;
}
.bal-pill-crash span{
    display:flex;
    align-items:center;
    gap:5px;
}
.deposit-top-btn{
    height:36px;
    min-width:105px;
    padding:0 14px;
    border-radius:13px;
    background:#8060dd;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:12px;
    font-weight:800;
    box-shadow:none;
}
.deposit-top-btn svg{
    width:16px;height:16px;
    fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

/* small category strip */
.games-container{
    max-width:480px;
    margin:0 auto;
    padding:0 0 calc(var(--safe-bottom) + 24px);
    position:relative;
    z-index:1;
}
.games-divider{
    height:1px;
    width:100%;
    margin:0;
    background:#3a3a3a;
}
.games-grid{
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:8px 23px 0;
}
.game-tile{
    position:relative;
    width:100%;
    height:132px;
    min-height:132px;
    border:0;
    border-radius:21px;
    overflow:hidden;
    cursor:pointer;
    text-align:left;
    padding:0;
    isolation:isolate;
    transition:transform .18s ease,filter .18s ease;
    box-shadow:0 4px 12px rgba(0,0,0,.24);
}
.game-tile:active{transform:scale(.98);filter:brightness(.95)}

/* decorative category chips above cards */
.games-grid .game-tile:first-child{margin-top:40px}
.games-grid .game-tile:first-child::before{
    content:'';
    position:absolute;
    top:-50px;left:32px;
    width:400px;height:42px;
    background:
      radial-gradient(circle at 8% 55%,#f6b51c 0 24px,transparent 25px),
      radial-gradient(circle at 20% 55%,#ff5b88 0 24px,transparent 25px),
      radial-gradient(circle at 32% 55%,#ffc72b 0 24px,transparent 25px),
      radial-gradient(circle at 44% 55%,#6bd9ff 0 24px,transparent 25px),
      radial-gradient(circle at 56% 55%,#b36aff 0 24px,transparent 25px),
      radial-gradient(circle at 68% 55%,#11b7ad 0 24px,transparent 25px),
      radial-gradient(circle at 80% 55%,#ff83aa 0 24px,transparent 25px);
    pointer-events:none;
    z-index:20;
}

/* rocket */

/* Animated gradient backgrounds for Rocket + Market */
.game-tile-rocket, .game-tile-market{
    background-size:220% 220%;
    animation:homeGradientShift 7s ease-in-out infinite;
}
.game-tile-rocket{
    background-image:linear-gradient(125deg,#6aaee8 0%,#8ed1ff 28%,#4f8fd8 55%,#6bb5ee 78%,#8acaff 100%);
}
.game-tile-market{
    background-image:linear-gradient(125deg,#ff9d00 0%,#ffd43b 28%,#f28b00 55%,#ffbd19 78%,#ffe06b 100%);
    animation-delay:-2.2s;
}
@keyframes homeGradientShift{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
}

.game-tile-rocket{
    background-image:linear-gradient(125deg,#6aaee8 0%,#8ed1ff 28%,#4f8fd8 55%,#6bb5ee 78%,#8acaff 100%);
}
.game-tile-rocket::after{
    content:'';
    position:absolute;inset:0;
    z-index:1;
    background:
      linear-gradient(112deg,transparent 0 19%,rgba(255,255,255,.12) 19.2% 21%,transparent 21.2% 37%,rgba(255,255,255,.08) 37.2% 39%,transparent 39.2% 100%),
      linear-gradient(170deg,transparent 0 54%,rgba(255,255,255,.07) 54.2% 55.5%,transparent 55.7%);
}
.game-tile-rocket .game-tile-title{
    position:absolute;left:20px;bottom:18px;z-index:6;
    font-size:23px;
}
.game-tile-rocket .game-tile-title{display:flex;align-items:center;gap:6px}.game-tile-rocket .game-tile-title svg{width:22px;height:22px;flex:none}
.game-tile-rocket .game-tile-subtitle{display:none}
.game-tile-rocket::marker{display:none}

/* hot label */
.game-tile-rocket > .hot-label,
.game-tile-market > .hot-label,
.game-tile-playhub > .hot-label{
    position:absolute;
    left:16px;top:15px;z-index:8;
    padding:6px 9px;
    background:#fff;color:#555;
    border-radius:7px;
    font-size:10px;font-weight:800;
    display:flex;align-items:center;gap:4px;
}
.game-tile > .hot-label svg{width:13px;height:13px;flex:none}

/* generic image */
.game-tile-gif{
    position:absolute;z-index:5;
    right:15px;top:-5px;
    width:106px;height:106px;
    object-fit:contain;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));
    pointer-events:none;
    will-change:transform;
}
.game-tile-rocket .game-tile-gif{transform:rotate(-8deg)}
.game-tile-market{
    background-image:linear-gradient(125deg,#ff9d00 0%,#ffd43b 28%,#f28b00 55%,#ffbd19 78%,#ffe06b 100%);
}
.game-tile-market .game-tile-title{
    position:absolute;left:20px;bottom:18px;z-index:6;
    font-size:23px;
}
.game-tile-market .game-tile-title{display:flex;align-items:center;gap:6px}.game-tile-market .game-tile-title svg{width:21px;height:21px;flex:none}
.game-tile-market .game-tile-subtitle{display:none}
.game-tile-market .game-tile-gif{
    right:-2px;top:-6px;width:132px;height:112px;
    object-fit:contain;
    object-position:center;
    border-radius:0;
    mask-image:none;-webkit-mask-image:none;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.42));
}
.game-tile-market::after{
    content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,181,20,0) 0%,rgba(255,181,20,0) 55%,rgba(255,181,20,.16) 72%,rgba(255,196,44,.34) 100%);
}

/* play hub */
.game-tile-playhub{
    height:132px;
    min-height:132px;
    padding:0;
    background:#4313a7 url('/static/img/playhub.png') center/cover no-repeat;
    border:0;
}
.game-tile-playhub::after{
    content:'';position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg,rgba(48,0,110,.28),rgba(48,0,110,0) 70%);
}
.game-tile-playhub .upg-card{
    position:absolute;z-index:5;
    right:2px;top:-6px;width:108px;height:136px;
    transform:none;
    object-fit:contain;
    border-radius:10px;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.5));
    pointer-events:none;
}
.playhub-copy{
    position:absolute;z-index:7;
    left:16px;bottom:15px;margin:0;padding:0;
}
.playhub-copy .game-tile-title{
    font-size:20px;
    gap:5px;
}
.playhub-copy .game-tile-title svg{
    width:20px;height:20px;
    order:-1;
}
.playhub-copy .game-tile-subtitle{display:none}
/* Upgrade wheel from the old Upgrade button, fitted across Play Hub */
.playhub-upgrade-wheel{
    position:absolute;
    right:-42px;
    bottom:-48px;
    width:230px;
    height:230px;
    z-index:2;
    pointer-events:none;
    filter:drop-shadow(0 8px 24px rgba(167,139,250,.55));
    animation:playhubWheelFloat 3.6s ease-in-out infinite;
    transform-origin:50% 50%;
}
.playhub-upgrade-wheel .wheel-ring{fill:none;stroke:#1a1a2e;stroke-width:22}
.playhub-upgrade-wheel .wheel-tick{stroke:#fff;stroke-width:2;stroke-linecap:round}
.playhub-upgrade-wheel .wheel-inner{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1}
.playhub-upgrade-wheel .wheel-pointer{fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.9))}
.playhub-upgrade-wheel .wheel-green{fill:none;stroke-width:22}
@keyframes playhubWheelFloat{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-4px) scale(1.02)}
}

.playhub-arrow-orbit{position:absolute;z-index:10;right:78px;top:25px;width:58px;height:54px;transform-origin:50% 50%;animation:playhubArrowOrbit 5s linear infinite;pointer-events:none}
.playhub-arrow{position:absolute;left:17px;top:13px;width:24px;height:27px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55));transform:rotate(12deg)}
@keyframes playhubArrowOrbit{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}


/* ═══════════ WIN HISTORY / LIVE FEED ═══════════ */
.win-history{
    display:flex;align-items:center;gap:12px;
    margin:0 23px 16px;
    min-height:48px;
    overflow:hidden;
}
.win-history-head{
    display:flex;align-items:center;gap:7px;
    flex-shrink:0;
}
.win-history-dot{
    width:8px;height:8px;border-radius:50%;
    background:#1EE44C;
    box-shadow:0 0 8px rgba(30,228,76,.55);
    animation:blink 2s ease-in-out infinite;
    flex-shrink:0;
}
.win-history-title{
    font-size:12px;font-weight:800;color:#1EE44C;
    text-transform:uppercase;flex-shrink:0;
}
.win-history-scroll{
    flex:1;min-width:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
}
.feed-track{
    display:flex;gap:8px;
    width:max-content;
    transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.feed-item{
    width:44px;height:44px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
    border-radius:10px;
    padding:3px;flex-shrink:0;
    position:relative;overflow:hidden;
}
.feed-item img{width:100%;height:100%;object-fit:contain;border-radius:6px}
.feed-item-price{
    position:absolute;bottom:0;left:0;right:0;
    background:rgba(0,0,0,.65);
    font-size:8px;font-weight:700;text-align:center;
    padding:1px 0;color:#fff;line-height:1.2;
    border-radius:0 0 6px 6px;
}
@keyframes feedGlow{
    0%{box-shadow:0 0 0 0 rgba(30,228,76,.6);background:rgba(30,228,76,.25)}
    40%{box-shadow:0 0 12px 4px rgba(30,228,76,.35);background:rgba(30,228,76,.12)}
    100%{box-shadow:none;background:rgba(255,255,255,.04)}
}
@keyframes feedSlideIn{
    0%{width:0;padding:0;margin-right:0;opacity:0}
    100%{width:44px;padding:3px;margin-right:8px;opacity:1}
}
.feed-item.new{
    animation:feedSlideIn .4s cubic-bezier(.4,0,.2,1) forwards,feedGlow .9s ease-out .2s forwards;
}

/* PC: обычная верхняя панель + горизонтальная история */
@media(min-width:481px){
    body{max-width:100%;background:#171717}
    .top-bar{
        max-width:1100px;height:79px;margin:0 auto;padding:8px 20px;
    }
    .games-container{max-width:1100px}
    .win-history{
        max-width:1100px;margin:12px auto 18px;
        padding:0 20px;min-height:50px;
    }
    .win-history-title{font-size:12px}
    .feed-item{width:46px;height:46px}
    .games-grid{
        max-width:760px;margin:0 auto;
        padding:8px 23px 24px;
    }
    .games-grid::before,.games-grid::after{display:none}
    .games-grid .game-tile:first-child{margin-top:0}
}

/* Телефон: как в кейсах — LIVE вертикально, справа подарки */
@media(max-width:480px){
    .win-history{
        margin:0 14px 12px;
        min-height:50px;
        gap:8px;
        align-items:center;
    }
    .win-history-head{
        width:25px;height:50px;
        justify-content:center;
        position:relative;
        flex:0 0 25px;
    }
    .win-history-title{
        writing-mode:vertical-rl;
        transform:rotate(180deg);
        font-size:13px;
        line-height:1;
        letter-spacing:.4px;
    }
    .win-history-dot{
        position:absolute;
        width:7px;height:7px;
        top:1px;left:50%;
        transform:translateX(-50%);
    }
    .win-history-scroll{
        flex:1;height:50px;
        display:flex;align-items:center;
    }
    .feed-track{gap:8px}
    .feed-item{width:46px;height:46px;border-radius:10px}
}
@media(max-width:380px){
    .games-grid{padding-left:21px;padding-right:21px}
    .games-grid::before{left:31px}
    .games-grid::after{left:33px}
    .game-tile{height:98px;min-height:98px;border-radius:20px}
    .game-tile-playhub{height:98px;min-height:98px}
    .game-tile-gif{right:8px;width:100px;height:100px}
}


/* ══════════════ PLAY HUB WINDOW ══════════════ */
body.playhub-open{overflow:hidden}

.playhub-overlay{
    position:fixed;
    left:0;right:0;bottom:0;
    top:79px;
    z-index:9000;
    background:#171717;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(8px);
    transition:opacity .22s ease,visibility .22s ease,transform .22s ease;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
}
.playhub-overlay.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translateY(0);
}
.playhub-screen{
    width:100%;
    max-width:480px;
    min-height:100%;
    margin:0 auto;
    padding:10px 14px calc(var(--safe-bottom) + 28px);
    background:linear-gradient(180deg,#171717 0%,#151515 100%);
}
.playhub-screen-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 2px 10px;
}
.playhub-screen-title{
    font-size:18px;
    font-weight:900;
    letter-spacing:.2px;
}
.playhub-close{
    width:34px;
    height:34px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#242424;
    border:1px solid #414141;
    color:#fff;
}
.playhub-close svg{
    width:17px;height:17px;
    fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;
}

.playhub-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
}
.playhub-upgrade-btn{
    position:relative;
    display:block;
    width:100%;
    height:156px;
    min-height:156px;
    padding:0;
    overflow:hidden;
    isolation:isolate;
    border-radius:22px;
    text-align:left;
    background:#25d83a url('https://epicgift.app/assets/play-hub/upgrade-bg.webp') center/cover no-repeat;
    box-shadow:0 8px 24px rgba(0,0,0,.28);
}
.playhub-upgrade-btn::after{
    content:'';
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(90deg,rgba(12,155,25,.18),transparent 54%,rgba(255,255,255,.04));
    pointer-events:none;
}
.playhub-upgrade-hot{
    position:absolute;
    z-index:8;
    left:14px;
    top:14px;
    display:flex;
    align-items:center;
    gap:5px;
    padding:6px 9px;
    border-radius:8px;
    background:rgba(255,255,255,.96);
    color:#ff6b1a;

<script>
var userId = null;
var userData = null;
var ROCKET_SLOTS = ['crash','cat','dog','banana','plane','rabbit','ice','unicorn','goldenplane','telegram','TonTheMoon'];
var lastCrashGif = 'crash';

function $(id){ return document.getElementById(id); }

/* RANDOM ROCKET */
function randomizeCrashGif(){
    var img = $('crashGif');
    if(!img) return;
    var pool = ROCKET_SLOTS.filter(function(r){ return r !== lastCrashGif; });
    var random = pool[Math.floor(Math.random() * pool.length)];
    lastCrashGif = random;
    img.style.opacity = '0';
    img.style.transition = 'opacity .25s ease';
    setTimeout(function(){
        img.src = '/static/gifs/rockets/' + random + '.gif';
        img.onerror = function(){ this.onerror=null; this.src='/static/gifs/rockets/crash.gif'; };
        img.style.opacity = '1';
    },120);
}

/* RANDOM LOCAL GIFT */
async function randomizeMarketGif(){
    var img = $('marketGif');
    if(!img) return;
    try{
        var r = await fetch('/api/market/gifts', {cache:'no-store'});
        var d = await r.json();
        if(d.success && d.gifts && d.gifts.length){
            var pool = d.gifts.slice(0, Math.min(50, d.gifts.length));
            var gift = pool[Math.floor(Math.random() * pool.length)];
            var src = gift.image || '';
            if(src && !/^https?:\/\//i.test(src)){
                var fileName = String(src).split('/').pop();
                src = '/static/gifs/gifts/' + fileName;
            }
            img.style.opacity='0';
            setTimeout(function(){
                img.src = src || '/static/img/gift.png';
                img.onerror=function(){this.onerror=null;this.src='/static/img/gift.png';};
                img.style.opacity='1';
            },120);
        }
    }catch(e){
        img.src='/static/img/gift.png';
    }
}

function setAvatar(auth){
    var wrap=$('userAvatar');
    if(!wrap || !auth) return;
    var photo=auth.photo_url || auth.photoUrl || '';
    if(photo){
        wrap.innerHTML='<img src="'+String(photo).replace(/"/g,'&quot;')+'" alt="">';
        return;
    }
    var initials=((auth.first_name||auth.username||'U').trim().charAt(0)||'U').toUpperCase();
    wrap.innerHTML='<span style="font-size:13px;font-weight:850;color:#fff">'+initials.replace(/[<>]/g,'')+'</span>';
}

/* Old Upgrade wheel: ticks + smoother continuous spin */
(function initPlayHubUpgradeWheel(){
    var risksGroup = document.getElementById('playhubUpgradeWheelRisks');
    var rotator = document.getElementById('playhubUpgradeWheelRotator');
    if(!risksGroup || !rotator) return;
    var cx=120, cy=120, rOuter=100, html='';
    for(var i=0;i<60;i++){
        var angle=(i/60)*360, major=(i%5===0);
        var len=major?8:5, width=major?1.8:1, opacity=major?0.75:0.4;
        var rad=(angle-90)*Math.PI/180;
        var x1=cx+Math.cos(rad)*(rOuter-2), y1=cy+Math.sin(rad)*(rOuter-2);
        var x2=cx+Math.cos(rad)*(rOuter-2-len), y2=cy+Math.sin(rad)*(rOuter-2-len);
        html+='<line class="wheel-tick" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="rgba(255,255,255,'+opacity+')" stroke-width="'+width+'"/>';
    }
    risksGroup.innerHTML=html;
    var angle=0;
    function spin(){
        angle+=90;
        rotator.style.transition='transform 1.35s cubic-bezier(.22,.8,.2,1)';
        rotator.style.transform='rotate('+angle+'deg)';
    }
    setTimeout(function(){spin();setInterval(spin,1700)},450);
})();

/* ══════════════════════════════════════════════════════════════
   NAV
   ══════════════════════════════════════════════════════════════ */
function goTo(url){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}
    window.location.href = url;
}


/* ══════════════════════════════════════════════════════════════
   PLAY HUB
   ══════════════════════════════════════════════════════════════ */
var playHubGiftTimer = null;
var playHubGiftIndex = -1;

/* PNG gifts from the local gift collection used by index.html.
   Try /static/img/gifts first, then the existing /static/gifs/gifts path. */
var PLAY_HUB_GIFTS = [
    ['Pet_Snake.png','Pet_Snake.png'],
    ['JingleBells.png','JingleBells.png'],
    ['Crystal_Ball.png','Crystal_Ball.png'],
    ['BDCandle.png','BDCandle.png'],
    ['pp.png','pp.png'],
    ['Jelly_Bunny.png','Jelly_Bunny.png'],
    ['Holiday_Drink.png','Holiday_Drink.png'],
    ['Neko_Helmet.png','Neko_Helmet.png'],
    ['EternalRose.png','EternalRose.png'],
    ['Diamond_Ring.png','Diamond_Ring.png'],
    ['Cupid_Charm.png','Cupid_Charm.png']
];

function playHubGiftFallback(img){
    var fallback = img.getAttribute('data-fallback');
    if(fallback && img.src.indexOf(fallback) === -1){
        img.onerror = function(){ this.style.opacity='0'; };
        img.src = fallback;
    }else{
        img.style.opacity = '0';
    }
}

function setPlayHubGift(){
    var img = $('playHubGift');
    if(!img || !PLAY_HUB_GIFTS.length) return;

    var next = playHubGiftIndex;
    while(PLAY_HUB_GIFTS.length > 1 && next === playHubGiftIndex){
        next = Math.floor(Math.random() * PLAY_HUB_GIFTS.length);
    }
    playHubGiftIndex = next;

    var pair = PLAY_HUB_GIFTS[next];
    img.style.opacity = '0';
    img.onerror = function(){ playHubGiftFallback(this); };
    img.setAttribute('data-fallback','/static/gifs/gifts/' + pair[1]);
    img.src = '/static/img/gifts/' + pair[0];

    requestAnimationFrame(function(){
        img.style.opacity = '1';
    });
}

function openPlayHub(){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}

    var page = $('playHubOverlay');
    if(!page) return;

    document.body.classList.add('playhub-open');
    page.classList.add('show');

    setPlayHubGift();

    if(playHubGiftTimer) clearInterval(playHubGiftTimer);
    playHubGiftTimer = setInterval(setPlayHubGift, 4000);

    window.scrollTo(0, 0);
}

function closePlayHub(){
    var page = $('playHubOverlay');
    if(!page) return;

    page.classList.remove('show');
    document.body.classList.remove('playhub-open');

    if(playHubGiftTimer){
        clearInterval(playHubGiftTimer);
        playHubGiftTimer = null;
    }

    window.scrollTo(0, 0);
}

document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closePlayHub();
});


/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */

function closeDeposit(){ $('depositOverlay').classList.remove('show'); }

/* ══════════════════════════════════════════════════════════════
   TOP BAR / ONLINE
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            userData = d.user;
            $('balVal').textContent = ((userData.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}

async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var count = d.count || 0;
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
async function initGames(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        setAvatar(auth);
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd && bd.banned){ window.location.href = '/ban'; return; }
        }catch(e){}
        try{
            if(window.Telegram && Telegram.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                try {
                    if (typeof Telegram.WebApp.requestFullscreen === 'function') {
                        Telegram.WebApp.requestFullscreen();
                    }
                } catch (e) {}
                Telegram.WebApp.setHeaderColor('#1C2233');
                Telegram.WebApp.setBackgroundColor('#1C2233');
            }
        }catch(e){}
    }
    loadTopBar();
    randomizeCrashGif();
    randomizeMarketGif();
    setInterval(randomizeCrashGif, 3000);
    setInterval(randomizeMarketGif, 5000);
}



/* ═══════════ WIN HISTORY DATA ═══════════ */
var lastFeedIds = [];

async function loadFeed(){
    try{
        var res = await fetch('/api/recent-wins?limit=20');
        var data = await res.json();
        if(data.success && data.wins && data.wins.length){
            var filtered = data.wins.filter(function(w){
                var img=w.gift_image||w.image||'';
                var name=w.gift_name||'';
                return img.indexOf('/tons/')===-1 && name.indexOf('TON')===-1 && name.indexOf('Stars x')===-1;
            });
            if(!filtered.length) return;
            var newIds=filtered.map(function(w){return w.gift_name+'_'+w.created_at;});
            if(lastFeedIds.length===0){
                renderFeed(data.wins);
            }else{
                for(var i=filtered.length-1;i>=0;i--){
                    if(lastFeedIds.indexOf(newIds[i])===-1) addFeedItem(filtered[i]);
                }
                lastFeedIds=newIds;
            }
        }
    }catch(e){console.error('Feed load error:',e);}
}

function renderFeed(wins){
    var track=document.getElementById('feedTrack');
    if(!track) return;
    var filtered=wins.filter(function(w){
        var img=w.gift_image||w.image||'';
        var name=w.gift_name||'';
        return img.indexOf('/tons/')===-1 && name.indexOf('TON')===-1 && name.indexOf('Stars x')===-1;
    });
    if(!filtered.length) return;
    lastFeedIds=filtered.map(function(w){return w.gift_name+'_'+w.created_at;});
    track.innerHTML=filtered.map(function(w){
        return '<div class="feed-item"><img src="'+(w.gift_image||w.image||'/static/img/gift.png')+'" alt="" onerror="this.src=\'/static/img/gift.png\'"></div>';
    }).join('');
}

function addFeedItem(w){
    var track=document.getElementById('feedTrack');
    if(!track) return;
    var div=document.createElement('div');
    div.className='feed-item new';
    div.innerHTML='<img src="'+(w.gift_image||w.image||'/static/img/gift.png')+'" alt="" onerror="this.src=\'/static/img/gift.png\'">';
    track.insertBefore(div,track.firstChild);
    if(track.children.length>30) track.removeChild(track.lastChild);
}


document.addEventListener('DOMContentLoaded', function(){
    initGames();
    loadFeed();
    setInterval(loadFeed,5000);
});
</script>


<script id="playhub-upgrade-navigation-v3">
document.addEventListener('DOMContentLoaded', function () {
    const upgrade = document.querySelector('.playhub-upgrade-btn');
    if (!upgrade || upgrade.dataset.upgradeNavBound) return;
    upgrade.dataset.upgradeNavBound = '1';

    upgrade.addEventListener('click', function () {
        // Preserve an existing explicit destination if the page already has one.
        const href = upgrade.getAttribute('data-href') ||
                     upgrade.getAttribute('data-url') ||
                     upgrade.getAttribute('href');
        if (href) {
            window.location.href = href;
            return;
        }
        // Standard Play Hub Upgrade route.
        window.location.href = '/play-hub/upgrade';
    });
});
</script>
