<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rasswet Gifts — Игры</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
:root {
    --bg: #0a0a0f;
    --bg-2: #11111a;
    --text: #fff;
    --text-2: rgba(255,255,255,.5);
    --blue: #2844FB;
    --blue-light: #4B81F5;
    --green: #24C38E;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tg-header: 56px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse 100% 60% at 50% 0%, #1a1a2e 0%, #0a0a0f 60%);
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; color: inherit; }

/* ══════════════ TOP BAR ══════════════ */
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-top: calc(var(--safe-top) + var(--tg-header));
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
}
.top-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}
.top-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,.15);
    flex-shrink: 0;
}
.top-nick {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
}
.top-bar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}
.top-balance {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(40,68,251,.15);
    border: 1px solid rgba(75,129,245,.3);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
}
.top-balance img { width: 16px; height: 16px; }
.top-online {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,.5);
}
.top-online-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulseDot 2s ease infinite;
}
@keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
}

/* ══════════════ CONTAINER ══════════════ */
.games-container {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 16px 120px;
    min-height: calc(100vh - 60px);
}

/* ══════════════ GAME CARD ══════════════ */
.game-card {
    position: relative;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    transition: transform .3s cubic-bezier(.175,.885,.32,1.275);
    overflow: hidden;
    width: 100%;
    height: 160px;
    margin-bottom: 14px;
    display: block;
    text-align: left;
    padding: 0;
    background: none;
}
.game-card:active { transform: scale(.97); }

.game-card-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 20px 22px;
    height: 100%;
    width: 100%;
    position: relative;
    z-index: 3;
}

.game-card-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-self: center;
}

.game-card-text {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -.5px;
}

.game-card-players {
    position: absolute;
    top: 14px;
    left: 18px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,.65);
    z-index: 5;
}
.game-card-players svg { width: 12px; height: 12px; opacity: .7; }

.game-card-gif {
    position: absolute;
    right: 10px;
    bottom: -8px;
    width: 130px;
    height: 130px;
    object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.5));
    z-index: 4;
    pointer-events: none;
    will-change: transform;
    animation: floatGif 4.5s ease-in-out infinite;
}
@keyframes floatGif {
    0%   { transform: translateY(0) rotate(0deg); }
    25%  { transform: translateY(-6px) rotate(-1deg); }
    50%  { transform: translateY(0) rotate(0deg); }
    75%  { transform: translateY(-3px) rotate(1deg); }
    100% { transform: translateY(0) rotate(0deg); }
}

/* Rotate icon (for upgrade wheel) */
.game-card-gif.rotating {
    animation: spinContinuous 4s linear infinite;
}
@keyframes spinContinuous {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ─── Colored themes ─── */
.game-card-crash {
    background: radial-gradient(130% 90% at 70% 10%, #af3000, #480d00 45%, #350a00);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.game-card-cases {
    background: radial-gradient(130% 90% at 70% 10%, #001aaf, #000548 45%, #000548);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.game-card-market {
    background: radial-gradient(130% 90% at 70% 10%, #004d00, #001a00 45%, #001200);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.game-card-upgrade {
    background: radial-gradient(130% 90% at 70% 10%, #333, #1a1a1a 45%, #111);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
}

/* ─── Upgrade — рисуем колесо внутри ─── */
.game-card-upgrade .game-card-gif {
    display: none; /* скрываем старую гифку, если есть */
}

.upgrade-wheel-svg {
    position: absolute;
    right: 5px;
    bottom: -15px;
    width: 160px;
    height: 160px;
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.5));
}
.upgrade-wheel-svg .wheel-ring {
    fill: none;
    stroke: #1a1a20;
    stroke-width: 22;
}
.upgrade-wheel-svg .wheel-tick {
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
}
.upgrade-wheel-svg .wheel-inner {
    fill: none;
    stroke: rgba(255,255,255,.04);
    stroke-width: 1;
}
.upgrade-wheel-svg .wheel-pointer {
    fill: #fff;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.8));
}
.upgrade-wheel-svg .wheel-green {
    fill: none;
    stroke: url(#upgradeGreenGrad);
    stroke-width: 22;
}

/* Вращение колеса */
@keyframes rotateWheel {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(45deg); }
    50%  { transform: rotate(-30deg); }
    75%  { transform: rotate(15deg); }
    100% { transform: rotate(0deg); }
}

/* ══════════════ TAGS ══════════════ */
.game-card-tag {
    position: absolute;
    top: 14px;
    right: 14px;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    letter-spacing: .5px;
    z-index: 5;
}

/* ══════════════ RIPPLE ══════════════ */
@keyframes ripple {
    to { transform: scale(4); opacity: 0; }
}

/* ══════════════ BOTTOM NAV ══════════════ */
.bottom-nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    width: 100%; max-width: 480px;
    height: 72px;
    padding: 0 8px calc(var(--safe-bottom) + 8px);
    background: rgba(10,10,15,.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,.04);
    display: flex;
    align-items: center;
    justify-content: space-around;
}
.bnav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 16px;
    border-radius: 12px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,.4);
    font-weight: 600;
    cursor: pointer;
    transition: all .3s;
    text-decoration: none;
}
.bnav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; transition: transform .3s; }
.bnav-item span { font-size: 10px; font-weight: 600; }
.bnav-item.active { background: rgba(40,68,251,.12); color: var(--blue-light); }
.bnav-item:active { transform: scale(.9); }
.bnav-item.active svg { transform: scale(1.1); }

@media (max-width: 360px) {
    .game-card { height: 140px; }
    .game-card-text { font-size: 21px; }
    .game-card-gif { width: 110px; height: 110px; }
    .upgrade-wheel-svg { width: 130px; height: 130px; }
}
</style>
</head>

<div class="top-bar">
    <div class="top-bar-left">

            </svg>
            <span id="upgradePlayers">0 играют</span>

        <div class="game-card-content">
            <div class="game-card-info">
                <span class="game-card-text">Апгрейды</span>
            </div>
        </div>

        <!-- Красивое анимированное колесо -->
        <svg class="upgrade-wheel-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="upgradeGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#24C38E"/>

            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>

<script>
/* ══════════════════════════════════════════════════════════════
   GLOBAL
   ══════════════════════════════════════════════════════════════ */
var userId = null;
var ROCKET_SLOTS = ['crash','cat','dog','banana','plane','rabbit','ice','unicorn','goldenplane','telegram','TonTheMoon'];
var lastCrashGif = 'crash';

/* ══════════════════════════════════════════════════════════════
   RANDOM CRASH GIF
   ══════════════════════════════════════════════════════════════ */
function randomizeCrashGif(){
    var img = document.getElementById('crashGif');
    if(!img) return;
    /* Выбираем случайный gif, не повторяя предыдущий */
    var pool = ROCKET_SLOTS.filter(function(r){ return r !== lastCrashGif; });
    var random = pool[Math.floor(Math.random() * pool.length)];
    lastCrashGif = random;
    img.src = '/static/gifs/rockets/' + random + '.gif';
    img.onerror = function(){
        this.onerror = null;
        this.src = '/static/gifs/rockets/crash.gif';
    };
}

/* Меняем gif краша каждые 3 секунды */
setInterval(randomizeCrashGif, 3000);

/* ══════════════════════════════════════════════════════════════
   UPGRADE WHEEL — риски + вращение
   ══════════════════════════════════════════════════════════════ */
(function initUpgradeWheel(){
    /* Рисуем риски */
    var risksGroup = document.getElementById('upgradeWheelRisks');
    if(!risksGroup) return;

    var cx = 100, cy = 100;
    var rOuter = 86;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 7 : 4;
        var width = isMajor ? 1.8 : 1;
        var opacity = isMajor ? 0.7 : 0.35;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 1);
        var y1 = cy + Math.sin(rad) * (rOuter - 1);
        var x2 = cx + Math.cos(rad) * (rOuter - 1 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 1 - len);
        html += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1)
              + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1)
              + '" stroke="rgba(255,255,255,' + opacity + ')"'
              + ' stroke-width="' + width + '" stroke-linecap="round"/>';
    }
    risksGroup.innerHTML = html;

    /* Анимация вращения колеса */
    var rotator = document.getElementById('upgradeWheelRotator');
    if(!rotator) return;

    var angles = [0, 45, -30, 15, -60, 30, 0];
    var i = 0;

    function nextAngle(){
        var target = angles[i % angles.length];
        rotator.style.transition = 'transform 1.6s cubic-bezier(.34,1.56,.64,1)';
        rotator.style.transform = 'rotate(' + target + 'deg)';
        i++;
    }

    /* Стартуем через 0.5 сек после загрузки */
    setTimeout(function(){
        nextAngle();
        setInterval(nextAngle, 2200);
    }, 500);
})();

/* ══════════════════════════════════════════════════════════════
   NAVIGATION
   ══════════════════════════════════════════════════════════════ */
function goTo(url){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}
    window.location.href = url;
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
async function initGames(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd && bd.banned){ window.location.href = '/ban'; return; }
        }catch(e){}
        try{
            if(window.Telegram && Telegram.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                Telegram.WebApp.setHeaderColor('#0a0a0f');
                Telegram.WebApp.setBackgroundColor('#0a0a0f');
            }
        }catch(e){}
    }
    loadTopBar();
    loadOnline();
    setInterval(loadOnline, 15000);
}

async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            var u = d.user;
            document.getElementById('topNick').textContent = u.first_name || u.username || 'User';
            if(u.photo_url) document.getElementById('topAvatar').src = u.photo_url;
            document.getElementById('topBalance').textContent = ((u.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}

async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var count = d.count || 0;
        document.getElementById('topOnline').textContent = count;

        /* Счётчики "играют" — рандомизируем вокруг онлайна */
        var crashN = Math.max(3, Math.floor(count * 0.6 + Math.random() * 5));
        var casesN = Math.max(2, Math.floor(count * 0.4 + Math.random() * 4));
        var marketN = Math.max(1, Math.floor(count * 0.3 + Math.random() * 3));
        var upgN = Math.max(1, Math.floor(count * 0.35 + Math.random() * 3));

        document.getElementById('crashPlayers').textContent = crashN + ' играют';
        document.getElementById('casesPlayers').textContent = casesN + ' играют';
        document.getElementById('marketPlayers').textContent = marketN + ' играют';
        document.getElementById('upgradePlayers').textContent = upgN + ' играют';
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   START
