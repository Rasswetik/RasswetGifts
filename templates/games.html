<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rasswet Gifts — Игры</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>

<style>
:root{
    --bg:#080d1b;
    --header:#0c1221;
    --text:#f7f9fd;
    --muted:#91a1bb;
    --cyan:#20b8ff;
    --red:#ff315d;
    --blue:#6e91bd;
    --line:rgba(102,143,190,.20);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{min-height:100%}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(700px 450px at 8% 55%,rgba(24,91,145,.13),transparent 72%),
        radial-gradient(700px 450px at 94% 55%,rgba(95,58,53,.10),transparent 72%),
        linear-gradient(180deg,#090e1c 0%,#080d1b 100%);
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:76px 0 0;
    pointer-events:none;
    opacity:.30;
    background-image:
        linear-gradient(rgba(110,145,189,.07) 1px,transparent 1px),
        linear-gradient(90deg,rgba(110,145,189,.07) 1px,transparent 1px);
    background-size:80px 80px;
}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}

/* HEADER */
.top-bar{
    height:76px;
    width:100%;
    padding:0 42px;
    display:flex;
    align-items:center;
    position:relative;
    z-index:10;
    background:rgba(10,15,29,.96);
    border-bottom:1px solid rgba(110,145,189,.12);
    box-shadow:0 1px 25px rgba(0,0,0,.16);
}

.desktop-left{
    display:flex;
    align-items:center;
    gap:28px;
}

.logo-btn{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-btn img{
    width:38px;
    height:38px;
    object-fit:contain;
}

.main-nav{
    display:flex;
    align-items:center;
    gap:2px;
}

.nav-btn{
    height:40px;
    padding:0 13px;
    border-radius:22px;
    display:flex;
    align-items:center;
    gap:8px;
    color:#8e9db6;
    font-size:14px;
    font-weight:700;
    transition:.18s ease;
    white-space:nowrap;
}

.nav-btn:hover{
    color:#c4d1e2;
    background:rgba(106,143,185,.07);
}

.nav-btn.active{
    color:#20b8ff;
    background:rgba(28,128,189,.17);
    box-shadow:
        inset 0 0 0 1px rgba(32,184,255,.28),
        0 4px 18px rgba(16,125,185,.08);
}

.nav-icon{
    width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:currentColor;
}

.nav-icon svg{width:18px;height:18px}

.account{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:9px;
}

.balance{
    height:36px;
    min-width:88px;
    padding:0 10px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:#edf5ff;
    background:linear-gradient(180deg,#14253a,#101d30);
    border:1px solid rgba(38,153,218,.34);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
    font-size:14px;
    font-weight:800;
}

.balance img{
    width:16px;
    height:16px;
    object-fit:contain;
}

.balance-value{min-width:35px;text-align:right}

.plus-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#20b8ff;
    font-size:0;
    line-height:1;
    background:linear-gradient(180deg,#142b42,#101d30);
    border:1px solid rgba(38,153,218,.34);
    transition:.18s ease;
}

.plus-btn:hover{
    background:#17334d;
    border-color:rgba(38,153,218,.55);
}

.plus-btn:active{transform:scale(.94)}

.avatar{
    width:43px;
    height:43px;
    padding:2px;
    border-radius:50%;
    overflow:hidden;
    background:#101a2b;
    border:2px solid #257fca;
    box-shadow:0 0 0 2px rgba(37,127,202,.12);
}

.avatar img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

/* PAGE */
.page{
    width:min(100%,980px);
    margin:0 auto;
    padding:48px 28px 80px;
    position:relative;
    z-index:1;
}

.page-title{
    font-size:32px;
    line-height:1;
    font-weight:900;
    letter-spacing:-.8px;
    margin-bottom:27px;
}

/* ONLY TWO GAME BUTTONS */
.games-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:26px;
    width:100%;
}

.game-card{
    height:245px;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    background:#101727;
    text-align:left;
    isolation:isolate;
    transition:transform .18s ease,box-shadow .18s ease;
}

.game-card:before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    transform:scale(1.001);
    transition:transform .35s ease;
}

.game-card:after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:
        linear-gradient(180deg,rgba(4,7,14,.03) 20%,rgba(4,7,14,.12) 45%,rgba(4,7,14,.88) 100%),
        linear-gradient(90deg,rgba(4,7,14,.34),transparent 65%);
}

.game-card.crash{
    border:2px solid var(--red);
    box-shadow:
        0 0 0 1px rgba(255,49,93,.12),
        0 0 30px rgba(255,49,93,.11);
}

.game-card.mines{
    border:2px solid var(--cyan);
    box-shadow:
        0 0 0 1px rgba(32,184,255,.11),
        0 0 30px rgba(32,184,255,.10);
}

.game-card.crash:before{background-image:url("/static/img/crash.png")}
.game-card.mines:before{background-image:url("/static/img/mines.png")}

.game-card:hover{transform:translateY(-3px)}
.game-card:hover:before{transform:scale(1.035)}
.game-card:active{transform:scale(.985)}

.game-card-content{
    position:absolute;
    left:27px;
    right:20px;
    bottom:22px;
    z-index:2;
}

.game-name{
    color:#fff;
    font-size:34px;
    line-height:1;
    font-weight:900;
    letter-spacing:-.7px;
    text-shadow:0 2px 13px rgba(0,0,0,.75);
}

.game-subtitle{
    display:block;
    margin-top:9px;
    color:#fff;
    font-size:13px;
    line-height:1;
    font-weight:800;
    letter-spacing:.35px;
    text-transform:uppercase;
    text-shadow:0 1px 7px rgba(0,0,0,.8);
}

/* DEPOSIT */
.deposit-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(3,7,14,.80);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.2s ease;
}

.deposit-overlay.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.deposit-modal{
    width:min(100%,390px);
    padding:22px;
    border-radius:20px;
    background:#111b2c;
    border:1px solid rgba(111,151,198,.25);
    box-shadow:0 25px 90px rgba(0,0,0,.55);
    transform:translateY(10px) scale(.97);
    transition:.2s ease;
}

.deposit-overlay.show .deposit-modal{transform:none}

.deposit-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.deposit-title{font-size:20px;font-weight:850}

.deposit-close{
    width:35px;
    height:35px;
    border-radius:10px;
    color:#95a7c0;
    background:rgba(143,168,200,.08);
}

.deposit-methods{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.deposit-method-btn{
    min-height:115px;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:rgba(100,139,181,.06);
    border:1px solid rgba(100,139,181,.16);
    transition:.16s ease;
}

.deposit-method-btn:hover{
    background:rgba(100,139,181,.11);
    border-color:rgba(100,139,181,.35);
}

.deposit-method-btn img{width:40px;height:40px;object-fit:contain}
.deposit-method-btn span{font-size:14px;font-weight:800;color:#fff}

/* MOBILE */
@media(max-width:700px){
    body:before{inset:62px 0 0;background-size:65px 65px}

    .top-bar{
        height:auto;
        min-height:62px;
        padding:8px 11px;
        background:#0b111e;
    }

    .desktop-left{display:none}

    .account{
        width:100%;
        justify-content:flex-end;
        gap:7px;
    }

    .balance{
        min-width:88px;
        height:34px;
        padding:0 9px;
        border-radius:10px;
        font-size:12.5px;
    }

    .balance img{width:15px;height:15px}

    .plus-btn{
        width:36px;
        height:36px;
        font-size:0;
    }

    .plus-btn svg{width:17px;height:17px}
    .avatar{width:38px;height:38px}

    .page{
        width:100%;
        padding:28px 12px 40px;
    }

    .page-title{
        font-size:28px;
        margin-bottom:18px;
    }

    .games-grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    .game-card{
        height:178px;
        border-radius:17px;
    }

    .game-card-content{
        left:17px;
        bottom:16px;
    }

    .game-name{font-size:27px}
    .game-subtitle{font-size:11px;margin-top:7px}
}
</style>
</head>

<body>

<header class="top-bar">

    <div class="desktop-left">
        <button class="logo-btn" onclick="goTo('/cases')" aria-label="Кейсы">
            <img src="/static/img/logo.png" alt="Rasswet Gifts">
        </button>

        <nav class="main-nav">

            <!-- КЕЙСЫ -->
            <button class="nav-btn" onclick="goTo('/cases')">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 9h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9Z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                        <path d="M3 5h18v4H3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                        <path d="M12 5c-1.5-2-4-3-5-1.5S9 6 12 5ZM12 5c1.5-2 3-3 5-1.5S15 6 12 5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                    </svg>
                </span>
                <span>Кейсы</span>
            </button>

            <!-- АПГРЕЙДЫ -->
            <button class="nav-btn" onclick="goTo('/upgrade')">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 17 10 11l4 4 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </span>
                <span>Апгрейды</span>
            </button>

            <!-- СЕЗОН -->
            <button class="nav-btn" onclick="goTo('/leaderboard')">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 4h10v5.5c0 3.2-2.1 5.7-5 6.4-2.9-.7-5-3.2-5-6.4V4Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                        <path d="M7 7H4v2.5A3.5 3.5 0 0 0 7.5 13M17 7h3v2.5a3.5 3.5 0 0 1-3.5 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                        <path d="M12 15.9V19M8.5 21h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                </span>
                <span>Сезон</span>
            </button>

            <!-- МАРКЕТ -->
            <button class="nav-btn" onclick="goTo('/market')">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 9.5h16v9.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9.5Z" fill="currentColor" fill-opacity=".10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                        <path d="M3 9.5 5 4h14l2 5.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
                        <path d="M8 13h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                </span>
                <span>Маркет</span>
            </button>

            <!-- ИГРЫ -->
            <button class="nav-btn active" onclick="goTo('/games')">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 8h10a4.5 4.5 0 0 1 4.42 5.36l-.6 3.02A3 3 0 0 1 15.5 17.3l-.85-1.06a2 2 0 0 0-1.56-.74h-2.18a2 2 0 0 0-1.56.74L8.5 17.3a3 3 0 0 1-5.32-.92l-.6-3.02A4.5 4.5 0 0 1 7 8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                        <path d="M7.5 11.5v3M6 13h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                        <circle cx="15.5" cy="12" r="1" fill="currentColor"></circle>
                        <circle cx="17.5" cy="14" r="1" fill="currentColor"></circle>
                    </svg>
                </span>
                <span>Игры</span>
            </button>

        </nav>
    </div>

    <div class="account">
        <div class="balance" aria-label="Баланс">
            <img src="/static/img/ton.png" alt="TON">
            <span class="balance-value" id="balVal">0.00</span>
        </div>

        <button class="plus-btn" onclick="openDeposit()" aria-label="Пополнение">
            <svg data-v-0d21400d="" width="18" height="18" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path data-v-0d21400d="" d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
        </button>

        <button class="avatar" onclick="goTo('/inventory')" aria-label="Профиль">
            <img id="avatarImg" src="/static/img/logo.png" alt="Профиль">
        </button>
    </div>

</header>

<main class="page">
    <h1 class="page-title">Игры</h1>

    <section class="games-grid">
        <button class="game-card crash" onclick="goTo('/crash')" aria-label="Crash">
            <div class="game-card-content">
                <div class="game-name">Crash</div>
                <span class="game-subtitle">Краш</span>
            </div>
        </button>

        <button class="game-card mines" onclick="goTo('/mines')" aria-label="Mines">
            <div class="game-card-content">
                <div class="game-name">Mines</div>
                <span class="game-subtitle">Мины</span>
            </div>
        </button>
    </section>
</main>

<!-- POPUP ПОПОЛНЕНИЯ -->
<div class="deposit-overlay" id="depositOverlay" onclick="if(event.target===this)closeDeposit()">
    <div class="deposit-modal">

        <div class="deposit-header">
            <div class="deposit-title">Пополнение</div>
            <button class="deposit-close" onclick="closeDeposit()" aria-label="Закрыть">✕</button>
        </div>

        <div class="deposit-hint">Выберите способ пополнения</div>

        <div class="deposit-methods">
            <button class="deposit-method-btn" onclick="depositMethod('ton')">
                <img src="/static/img/ton.png" alt="TON">
                <span>TON</span>
            </button>

            <button class="deposit-method-btn" onclick="depositMethod('stars')">
                <img src="/static/img/star.png" alt="Stars">
                <span>Stars</span>
            </button>
        </div>

    </div>
</div>

<script>
var userId = null;
var userData = null;

function $(id){
    return document.getElementById(id);
}

function goTo(url){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}

    window.location.href = url;
}

function openDeposit(){
    var overlay = $('depositOverlay');
    if(!overlay) return;

    overlay.classList.add('show');

    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}
}

function closeDeposit(){
    var overlay = $('depositOverlay');
    if(!overlay) return;
    overlay.classList.remove('show');
}

/*
 * Раньше кнопки пополнения ошибочно вели на /crash.
 * Теперь они ведут на отдельный маршрут пополнения.
 * Если на сервере уже есть /deposit, он откроется с выбранным методом.
 */
function depositMethod(method){
    closeDeposit();

    var url = '/deposit?method=' + encodeURIComponent(method);

    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}

    window.location.href = url;
}

function setAvatar(auth,user){
    var img = $('avatarImg');
    if(!img) return;

    var photo =
        (auth && (auth.photo_url || auth.photoUrl)) ||
        (user && (user.photo_url || user.photoUrl));

    if(photo){
        img.src = photo;

        img.onerror = function(){
            this.onerror = null;
            this.src = '/static/img/logo.png';
        };
    }
}

async function loadTopBar(){
    if(!userId) return;

    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();

        if(d.success && d.user){
            userData = d.user;

            /*
             * Оставляем совместимость с текущим API:
             * balance_stars хранится в сотых долях Stars.
             */
            var balanceStars = Number(d.user.balance_stars || 0);

            if($('balVal')){
                $('balVal').textContent = (balanceStars / 100).toFixed(2);
            }

            setAvatar(null,d.user);
        }
    }catch(e){}
}

async function initGames(){
    var auth = null;

    try{
        auth = await telegramAuth();
    }catch(e){}

    if(auth && auth.id){
        userId = auth.id;

        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();

            if(bd && bd.banned){
                window.location.href = '/ban';
                return;
            }
        }catch(e){}

        setAvatar(auth,null);

        try{
            if(window.Telegram && Telegram.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                Telegram.WebApp.setHeaderColor('#0b111c');
                Telegram.WebApp.setBackgroundColor('#0b111c');
            }
        }catch(e){}
    }

    loadTopBar();
}

document.addEventListener('DOMContentLoaded',initGames);
</script>

</body>
</html>
