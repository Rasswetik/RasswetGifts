<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rasswet Gifts — Игры</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
:root{
    --bg:#1C2233;
    --panel:#0B1120;
    --text:#fff;
    --text-2:#8CA0BE;
    --text-3:rgba(140,160,190,.6);
    --green:#1EE44C;
    --red:#FF3064;
    --gold:#FFD700;
    --blue:#3B82F6;
    --blue-2:#2563EB;
    --safe-top:env(safe-area-inset-top, 20px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════ TOP BAR ══════════════ */
.top-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(var(--safe-top) + 20px) 14px 10px;
    max-width:480px;margin:0 auto;
    position:relative;z-index:10;
}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{
    display:flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:20px;
    border:1.5px solid rgba(30,228,76,.45);
    background:rgba(30,228,76,.12);
    font-weight:700;font-size:13px;color:#1EE44C;
    backdrop-filter:blur(5px);
}
.online-pill svg{width:12px;height:12px}
.top-right-btns{display:flex;gap:8px;align-items:center}
.bal-pill-crash{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    font-weight:700;font-size:13px;color:#fff;
    backdrop-filter:blur(5px);
}
.bal-pill-crash img{width:16px;height:16px}
.bal-plus-crash{
    width:28px;height:28px;border-radius:50%;
    border:none;background:rgba(120,135,160,.3);
    color:#A0B0C4;font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    border:1px solid rgba(120,135,160,.45);
}
.bal-plus-crash:active{transform:scale(.9)}

/* ══════════════ GAMES HOME — REFERENCE LAYOUT ══════════════ */
body{
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:#171717;
    background-image:linear-gradient(180deg,#171717 0%,#151515 100%);
}
.top-bar{
    height:79px;
    margin-top:34px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:8px 7px 8px 14px;
    max-width:480px;
    margin:0 auto;
    position:relative;
    z-index:20;
    background:#242424;
    border-bottom:1px solid #414141;
}
.top-right-btns{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
}
.user-avatar{
    width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;
    background:linear-gradient(135deg,#4b16d1,#17113c);
    border:2px solid #7c42ff;
    box-shadow:0 0 0 1px rgba(255,255,255,.12),0 5px 15px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
}
.user-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.user-avatar svg{width:27px;height:27px;fill:rgba(255,255,255,.9)}
.bal-pill-crash{
    margin-right:auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    gap:3px;
    min-width:110px;
    padding:0 2px;
    border:0;
    background:none;
    backdrop-filter:none;
    font-weight:800;
    font-size:17px;
    color:#fff;
    line-height:1;
}
.bal-pill-crash::before{
    content:'Your balance';
    color:#9b9b9b;
    font-size:11px;
    font-weight:500;
    line-height:1;
    margin-bottom:2px;
}
.bal-pill-crash img{
    width:22px;height:22px;object-fit:contain;
    vertical-align:middle;
}
.bal-pill-crash span{
    display:flex;
    align-items:center;
    gap:5px;
}
.deposit-top-btn{
    height:36px;
    min-width:105px;
    padding:0 14px;
    border-radius:13px;
    background:#8060dd;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:12px;
    font-weight:800;
    box-shadow:none;
}
.deposit-top-btn svg{
    width:16px;height:16px;
    fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

/* small category strip */
.games-container{
    max-width:480px;
    margin:0 auto;
    padding:0 0 calc(var(--safe-bottom) + 24px);
    position:relative;
    z-index:1;
}
.games-divider{
    height:1px;
    width:100%;
    margin:0;
    background:#3a3a3a;
}
.games-grid{
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:8px 23px 0;
}
.games-grid::before{
    content:'Live';
    display:flex;
    align-items:center;
    position:absolute;
    top:91px;
    left:35px;
    height:32px;
    color:#eee;
    font-size:15px;
    font-weight:800;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    letter-spacing:.2px;
}
.games-grid::after{
    content:'';
    position:absolute;
    top:99px;
    left:37px;
    width:9px;height:9px;border-radius:50%;
    background:#38d46a;
    box-shadow:0 0 8px rgba(56,212,106,.25);
}
.game-tile{
    position:relative;
    width:100%;
    height:132px;
    min-height:132px;
    border:0;
    border-radius:21px;
    overflow:hidden;
    cursor:pointer;
    text-align:left;
    padding:0;
    isolation:isolate;
    transition:transform .18s ease,filter .18s ease;
    box-shadow:0 4px 12px rgba(0,0,0,.24);
}
.game-tile:active{transform:scale(.98);filter:brightness(.95)}

/* decorative category chips above cards */
.games-grid .game-tile:first-child{margin-top:40px}
.games-grid .game-tile:first-child::before{
    content:'';
    position:absolute;
    top:-50px;left:32px;
    width:400px;height:42px;
    background:
      radial-gradient(circle at 8% 55%,#f6b51c 0 24px,transparent 25px),
      radial-gradient(circle at 20% 55%,#ff5b88 0 24px,transparent 25px),
      radial-gradient(circle at 32% 55%,#ffc72b 0 24px,transparent 25px),
      radial-gradient(circle at 44% 55%,#6bd9ff 0 24px,transparent 25px),
      radial-gradient(circle at 56% 55%,#b36aff 0 24px,transparent 25px),
      radial-gradient(circle at 68% 55%,#11b7ad 0 24px,transparent 25px),
      radial-gradient(circle at 80% 55%,#ff83aa 0 24px,transparent 25px);
    pointer-events:none;
    z-index:20;
}

/* rocket */

/* Animated gradient backgrounds for Rocket + Market */
.game-tile-rocket, .game-tile-market{
    background-size:220% 220%;
    animation:homeGradientShift 7s ease-in-out infinite;
}
.game-tile-rocket{
    background-image:linear-gradient(125deg,#6aaee8 0%,#8ed1ff 28%,#4f8fd8 55%,#6bb5ee 78%,#8acaff 100%);
}
.game-tile-market{
    background-image:linear-gradient(125deg,#ff9d00 0%,#ffd43b 28%,#f28b00 55%,#ffbd19 78%,#ffe06b 100%);
    animation-delay:-2.2s;
}
@keyframes homeGradientShift{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
}

.game-tile-rocket{
    background-image:linear-gradient(125deg,#6aaee8 0%,#8ed1ff 28%,#4f8fd8 55%,#6bb5ee 78%,#8acaff 100%);
}
.game-tile-rocket::after{
    content:'';
    position:absolute;inset:0;
    z-index:1;
    background:
      linear-gradient(112deg,transparent 0 19%,rgba(255,255,255,.12) 19.2% 21%,transparent 21.2% 37%,rgba(255,255,255,.08) 37.2% 39%,transparent 39.2% 100%),
      linear-gradient(170deg,transparent 0 54%,rgba(255,255,255,.07) 54.2% 55.5%,transparent 55.7%);
}
.game-tile-rocket .game-tile-title{
    position:absolute;left:20px;bottom:18px;z-index:6;
    font-size:23px;
}
.game-tile-rocket .game-tile-title{display:flex;align-items:center;gap:6px}.game-tile-rocket .game-tile-title svg{width:22px;height:22px;flex:none}
.game-tile-rocket .game-tile-subtitle{display:none}
.game-tile-rocket::marker{display:none}

/* hot label */
.game-tile-rocket > .hot-label,
.game-tile-market > .hot-label,
.game-tile-playhub > .hot-label{
    position:absolute;
    left:16px;top:15px;z-index:8;
    padding:6px 9px;
    background:#fff;color:#555;
    border-radius:7px;
    font-size:10px;font-weight:800;
    display:flex;align-items:center;gap:4px;
}
.game-tile > .hot-label svg{width:13px;height:13px;flex:none}

/* generic image */
.game-tile-gif{
    position:absolute;z-index:5;
    right:15px;top:-5px;
    width:106px;height:106px;
    object-fit:contain;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));
    pointer-events:none;
    will-change:transform;
}
.game-tile-rocket .game-tile-gif{transform:rotate(-8deg)}
.game-tile-market{
    background-image:linear-gradient(125deg,#ff9d00 0%,#ffd43b 28%,#f28b00 55%,#ffbd19 78%,#ffe06b 100%);
}
.game-tile-market .game-tile-title{
    position:absolute;left:20px;bottom:18px;z-index:6;
    font-size:23px;
}
.game-tile-market .game-tile-title{display:flex;align-items:center;gap:6px}.game-tile-market .game-tile-title svg{width:21px;height:21px;flex:none}
.game-tile-market .game-tile-subtitle{display:none}
.game-tile-market .game-tile-gif{
    right:-2px;top:-6px;width:132px;height:112px;
    object-fit:contain;
    object-position:center;
    border-radius:0;
    mask-image:none;-webkit-mask-image:none;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.42));
}
.game-tile-market::after{
    content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,181,20,0) 0%,rgba(255,181,20,0) 55%,rgba(255,181,20,.16) 72%,rgba(255,196,44,.34) 100%);
}

/* play hub */
.game-tile-playhub{
    height:132px;
    min-height:132px;
    padding:0;
    background:#4313a7 url('/static/img/playhub.png') center/cover no-repeat;
    border:0;
}
.game-tile-playhub::after{
    content:'';position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg,rgba(48,0,110,.28),rgba(48,0,110,0) 70%);
}
.game-tile-playhub .upg-card{
    position:absolute;z-index:5;
    right:-2px;top:-8px;width:100px;height:130px;
    transform-origin:100% 0;
    transform:matrix3d(.775344,.1866,0,-.000698,-.304346,.821269,0,-.000548,0,0,1,0,-18,-.479443,0,1);
    object-fit:cover;
    border-radius:10px;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.5));
    pointer-events:none;
}
.playhub-copy{
    position:absolute;z-index:7;
    left:16px;bottom:15px;margin:0;padding:0;
}
.playhub-copy .game-tile-title{
    font-size:20px;
    gap:5px;
}
.playhub-copy .game-tile-title svg{
    width:20px;height:20px;
    order:-1;
}
.playhub-copy .game-tile-subtitle{display:none}
.playhub-arrow-orbit{position:absolute;z-index:10;right:78px;top:25px;width:58px;height:54px;transform-origin:50% 50%;animation:playhubArrowOrbit 5s linear infinite;pointer-events:none}
.playhub-arrow{position:absolute;left:17px;top:13px;width:24px;height:27px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55));transform:rotate(12deg)}
@keyframes playhubArrowOrbit{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

@media(max-width:380px){
    .games-grid{padding-left:21px;padding-right:21px}
    .games-grid::before{left:31px}
    .games-grid::after{left:33px}
    .game-tile{height:98px;min-height:98px;border-radius:20px}
    .game-tile-playhub{height:98px;min-height:98px}
    .game-tile-gif{right:8px;width:100px;height:100px}
}

/* ══════════════ DEPOSIT MODAL ══════════════ */
.deposit-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.85);
    z-index:9600;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{
    background:linear-gradient(180deg,#1E2538,#151B2D);
    border-radius:28px;width:90%;max-width:360px;
    padding:24px 20px;transform:scale(.9);
    transition:transform .3s;
    border:1px solid rgba(255,255,255,.1);
}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.deposit-title{font-weight:800;font-size:18px;color:#fff}
.deposit-close{
    width:32px;height:32px;border-radius:12px;
    border:none;background:rgba(249,105,153,.15);
    cursor:pointer;color:#F96999;font-size:18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
}
.deposit-close svg{width:17px;height:17px
}
.deposit-methods{display:flex;gap:12px}
.deposit-method-btn{
    position:relative;flex:1;padding:20px 14px;border-radius:22px;
    border:2px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:10px;
    transition:all .2s;
}
.deposit-method-btn:active{transform:scale(.96);background:rgba(255,255,255,.08)}
.deposit-method-btn img{width:48px;height:48px;object-fit:contain}
.deposit-method-btn span{font-weight:700;font-size:13px;color:#fff}

@media(max-width:380px){
    .game-card{height:148px;border-radius:24px}
    .game-card-text{font-size:22px}
    .game-card-gif{width:118px;height:118px}
    .game-card-gif.rounded{border-radius:20px}
    .upgrade-wheel-svg{width:135px;height:135px}
    .leaderboard-cup-svg{width:135px;height:135px}
    .game-card-tag{padding:5px 10px;border-radius:8px}
}

/* FINAL MOBILE LAYOUT TUNING */
@media (max-width: 480px){
  html,body{
    width:100%;
    min-width:0;
    max-width:none;
    overflow-x:hidden;
  }
  body{
    min-height:100dvh;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .top-bar{
    width:100%;
    height:74px;
    margin-top:28px;
    padding:8px 12px;
  }
  .user-avatar{width:48px;height:48px}
  .bal-pill-crash{min-width:92px;font-size:16px}
  .bal-pill-crash::before{font-size:10px}
  .bal-pill-crash img{width:20px;height:20px}
  .deposit-top-btn{
    min-width:96px;height:35px;padding:0 12px;border-radius:12px;
    font-size:12px;
  }
  .games-container{
    width:100%;
    padding:0 0 calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  .games-grid{
    width:100%;
    gap:10px;
    padding:8px 14px 0;
  }
  /* Поднимаем игровые кнопки ближе к верхней панели, сохраняя ленту Live */
  .games-grid .game-tile:first-child{margin-top:30px}
  .games-grid::before{top:76px;left:27px}
  .games-grid::after{top:84px;left:29px;width:8px;height:8px}
  .game-tile,
  .game-tile-playhub{
    width:100%;
    height:132px;
    min-height:132px;
    border-radius:19px;
  }
  .game-tile-rocket .game-tile-title,
  .game-tile-market .game-tile-title{
    left:17px;bottom:15px;font-size:21px;
  }
  .game-tile-rocket .game-tile-title svg{width:21px;height:21px}
  .game-tile-market .game-tile-title svg{width:20px;height:20px}
  .game-tile-gif{
    right:7px;top:-7px;width:98px;height:98px;
  }
  .game-tile-market .game-tile-gif{
    right:-3px;top:-8px;width:118px;height:102px;
  }
  .game-tile-rocket > .hot-label,
  .game-tile-market > .hot-label,
  .game-tile-playhub > .hot-label{
    left:14px;top:12px;padding:5px 8px;border-radius:7px;font-size:9px;
  }
  .game-tile > .hot-label svg{width:12px;height:12px}
  .game-tile-playhub .upg-card{
    right:-3px;top:-9px;width:92px;height:132px;
  }
  .playhub-copy{left:14px;bottom:13px}
  .playhub-copy .game-tile-title{font-size:19px}
  .playhub-copy .game-tile-title svg{width:19px;height:19px}
  .playhub-arrow-orbit{right:67px;top:22px;width:52px;height:49px}
  .playhub-arrow{left:15px;top:11px;width:22px;height:25px}
}

@media (max-width:360px){
  .top-bar{padding-left:10px;padding-right:10px}
  .user-avatar{width:45px;height:45px}
  .bal-pill-crash{min-width:82px;font-size:15px}
  .deposit-top-btn{min-width:88px;padding:0 9px}
  .games-grid{padding-left:10px;padding-right:10px;gap:9px}
  .games-grid .game-tile:first-child{margin-top:28px}
  .game-tile,.game-tile-playhub{height:114px;min-height:114px;border-radius:18px}
  .game-tile-rocket .game-tile-title,.game-tile-market .game-tile-title{left:14px;bottom:13px;font-size:19px}
  .game-tile-gif{width:92px;height:132px}
  .game-tile-market .game-tile-gif{width:108px;height:125px}
  .game-tile-playhub .upg-card{width:86px;height:112px}
}

/* Final mobile game-card sizing + animated gradients */
.game-tile, .game-card {
    min-height: 117px !important;
}
.game-tile-rocket, .game-tile-market {
    background-size: 300% 300% !important;
    animation: homeGradientShift 5s ease-in-out infinite !important;
}
.game-tile-rocket {
    background-image: linear-gradient(120deg, #4f8fd8 0%, #9bd8ff 25%, #3978c2 50%, #7bc5ff 75%, #4f8fd8 100%) !important;
}
.game-tile-market {
    background-image: linear-gradient(120deg, #f28b00 0%, #ffe06b 25%, #ff9d00 50%, #ffd43b 75%, #f28b00 100%) !important;
    animation-delay: -1.7s !important;
}
@keyframes homeGradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
@media (max-width: 480px) {
    .game-tile, .game-card { min-height: 117px !important; }
}
@media (max-width: 360px) {
    .game-tile, .game-card { min-height: 112px !important; }
}

/* Final page vertical offset: leave 10% of viewport empty at the top */
.top-bar,
.games-container{
    transform:translateY(10vh);
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="top-right-btns">
        <div class="user-avatar" id="userAvatar" aria-label="Профиль">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.4"/><path d="M4.5 20.5c.4-4.1 3-6.3 7.5-6.3s7.1 2.2 7.5 6.3"/></svg>
        </div>
        <div class="bal-pill-crash">
            <span><img src="/static/img/ton.png" alt="TON"><b id="balVal">0.00</b></span>
        </div>
        <button class="deposit-top-btn" onclick="openDeposit()" aria-label="Deposit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/></svg>
            <span>Deposit</span>
        </button>
    </div>
</div>

<div class="games-container">
    <div class="games-divider"></div>
    <div class="games-grid">
        <!-- 1. ROCKET / CRASH -->
        <button class="game-tile game-tile-rocket" onclick="goTo('/crash')" aria-label="Rocket">
            <div class="hot-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.5 1.2 6.2 4.2 6.9 7.9L20.5 19l-4.2-1.7L14.6 21l-2.1-3.7L8.2 19l1.7-4.2C6.2 14.1 3.2 11.4 2 7.9L7.2 8.8A7.9 7.9 0 0 1 12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="13.8" cy="8.4" r="1.6" fill="currentColor"/></svg><span>HOT!</span></div>
            <div class="game-tile-title"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.315 7.584C12.195 3.883 16.695 1.5 21.75 1.5a.75.75 0 0 1 .75.75c0 5.056-2.383 9.555-6.084 12.436A6.75 6.75 0 0 1 9.75 22.5a.75.75 0 0 1-.75-.75v-4.131A15.838 15.838 0 0 1 6.382 15H2.25a.75.75 0 0 1-.75-.75 6.75 6.75 0 0 1 7.815-6.666ZM15 6.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z" fill="currentColor"/><path d="M5.26 17.242a.75.75 0 1 0-.897-1.203 5.243 5.243 0 0 0-2.05 5.022.75.75 0 0 0 .625.627 5.243 5.243 0 0 0 5.022-2.051.75.75 0 1 0-1.202-.897 3.744 3.744 0 0 1-3.008 1.51c0-1.23.592-2.323 1.51-3.008Z" fill="currentColor"/></svg><span>ROCKET</span></div>
            <img src="/static/gifs/rockets/crash.gif" alt="Rocket" class="game-tile-gif" id="crashGif" loading="eager">
        </button>

        <!-- 2. MARKET -->
        <button class="game-tile game-tile-market" onclick="goTo('/market')" aria-label="Market">
            <div class="hot-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5 12 3l7 5.5v9.75A1.75 1.75 0 0 1 17.25 20h-10A1.75 1.75 0 0 1 5.5 18.25V8.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10h8v7H8z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 10V8h4v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>HOT</span></div>
            <div class="game-tile-title"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.375 3a1.875 1.875 0 0 0 0 3.75h1.875v4.5H3.375A1.875 1.875 0 0 1 1.5 9.375v-.75c0-1.036.84-1.875 1.875-1.875h3.193A3.375 3.375 0 0 1 12 2.753a3.375 3.375 0 0 1 5.432 3.997h3.943c1.035 0 1.875.84 1.875 1.875v.75c0 1.036-.84 1.875-1.875 1.875H12.75v-4.5h1.875a1.875 1.875 0 1 0-1.875-1.875V6.75h-1.5V4.875C11.25 3.839 10.41 3 9.375 3ZM11.25 12.75H3v6.75a2.25 2.25 0 0 0 2.25 2.25h6v-9ZM12.75 12.75v9h6.75a2.25 2.25 0 0 0 2.25-2.25v-6.75h-9Z" fill="currentColor"/></svg><span>Market</span></div>
            <img src="/static/img/upg.png" alt="Market" class="game-tile-gif market-png" id="marketGif" loading="eager">
        </button>

        <!-- 3. PLAY HUB -->
        <button class="game-tile game-tile-playhub" onclick="goTo('/upgrade')" aria-label="Play Hub">
            <div class="hot-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c1.1 2.4 4.1 3.4 4.7 6.2.5 2.3-1.1 4.8-3.8 5.3 1.1-1.5.6-3.7-.9-4.5-.1 2.8-2.8 4.3-4.5 3.4-2.3-1.2-2.6-4.4-.4-6.2.1 1.5 1.2 2.4 2.2 2.6C8.9 7.5 10.5 5.3 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>HOT</span></div>
            <img src="/static/img/upg.png" alt="Upgrade" class="upg-card">
            <div class="playhub-arrow-orbit"><svg class="playhub-arrow" viewBox="0 0 27.6 30.498" fill="none" aria-hidden="true"><path d="M5.08 28.58L25.27 16.4C26.6 15.6 26.55 13.65 25.18 12.92L4.37 1.84C2.8 1 1 2.48 1.51 4.18L4.68 14.68C4.78 15.02 4.79 15.39 4.71 15.73L2.11 26.39C1.68 28.12 3.56 29.5 5.08 28.58Z" fill="#FF9A20" stroke="#FFCFA5"/></svg></div>
            <div class="playhub-copy">
                <div class="game-tile-title"><span>PLAY HUB</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" fill="currentColor"/></svg></div>
            </div>
        </button>
    </div>
</div>

<!-- DEPOSIT MODAL -->
<div class="deposit-overlay" id="depositOverlay" onclick="if(event.target===this)closeDeposit()">
    <div class="deposit-modal">
        <div class="deposit-header">
            <div class="deposit-title">Пополнение</div>
            <button class="deposit-close" onclick="closeDeposit()" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="deposit-methods">
            <button class="deposit-method-btn" onclick="closeDeposit();goTo('/crash')">
                <img src="/static/img/ton.png" alt="TON">
                <span>TON</span>
            </button>
            <button class="deposit-method-btn" onclick="closeDeposit();goTo('/crash')">
                <img src="/static/img/star.png" alt="Stars">
                <span>Stars</span>
            </button>
        </div>
    </div>
</div>

<script>
var userId = null;
var userData = null;
var ROCKET_SLOTS = ['crash','cat','dog','banana','plane','rabbit','ice','unicorn','goldenplane','telegram','TonTheMoon'];
var lastCrashGif = 'crash';

function $(id){ return document.getElementById(id); }

/* RANDOM ROCKET */
function randomizeCrashGif(){
    var img = $('crashGif');
    if(!img) return;
    var pool = ROCKET_SLOTS.filter(function(r){ return r !== lastCrashGif; });
    var random = pool[Math.floor(Math.random() * pool.length)];
    lastCrashGif = random;
    img.style.opacity = '0';
    img.style.transition = 'opacity .25s ease';
    setTimeout(function(){
        img.src = '/static/gifs/rockets/' + random + '.gif';
        img.onerror = function(){ this.onerror=null; this.src='/static/gifs/rockets/crash.gif'; };
        img.style.opacity = '1';
    },120);
}

/* RANDOM LOCAL GIFT */
async function randomizeMarketGif(){
    var img = $('marketGif');
    if(!img) return;
    try{
        var r = await fetch('/api/market/gifts', {cache:'no-store'});
        var d = await r.json();
        if(d.success && d.gifts && d.gifts.length){
            var pool = d.gifts.slice(0, Math.min(50, d.gifts.length));
            var gift = pool[Math.floor(Math.random() * pool.length)];
            var src = gift.image || '';
            if(src && !/^https?:\/\//i.test(src)){
                var fileName = String(src).split('/').pop();
                src = '/static/gifs/gifts/' + fileName;
            }
            img.style.opacity='0';
            setTimeout(function(){
                img.src = src || '/static/img/gift.png';
                img.onerror=function(){this.onerror=null;this.src='/static/img/gift.png';};
                img.style.opacity='1';
            },120);
        }
    }catch(e){
        img.src='/static/img/gift.png';
    }
}

function setAvatar(auth){
    var wrap=$('userAvatar');
    if(!wrap || !auth) return;
    var photo=auth.photo_url || auth.photoUrl || '';
    if(photo){
        wrap.innerHTML='<img src="'+String(photo).replace(/"/g,'&quot;')+'" alt="">';
        return;
    }
    var initials=((auth.first_name||auth.username||'U').trim().charAt(0)||'U').toUpperCase();
    wrap.innerHTML='<span style="font-size:13px;font-weight:850;color:#fff">'+initials.replace(/[<>]/g,'')+'</span>';
}

/* ══════════════════════════════════════════════════════════════
   NAV
   ══════════════════════════════════════════════════════════════ */
function goTo(url){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }catch(e){}
    window.location.href = url;
}

/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */
function openDeposit(){ $('depositOverlay').classList.add('show'); }
function closeDeposit(){ $('depositOverlay').classList.remove('show'); }

/* ══════════════════════════════════════════════════════════════
   TOP BAR / ONLINE
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            userData = d.user;
            $('balVal').textContent = ((userData.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}

async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var count = d.count || 0;
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
async function initGames(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        setAvatar(auth);
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd && bd.banned){ window.location.href = '/ban'; return; }
        }catch(e){}
        try{
            if(window.Telegram && Telegram.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                Telegram.WebApp.setHeaderColor('#1C2233');
                Telegram.WebApp.setBackgroundColor('#1C2233');
            }
        }catch(e){}
    }
    loadTopBar();
    randomizeCrashGif();
    randomizeMarketGif();
    setInterval(randomizeCrashGif, 3000);
    setInterval(randomizeMarketGif, 5000);
}

document.addEventListener('DOMContentLoaded', function(){
    initGames();
});
</script>

</body>
</html>
