<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171F2B" id="themeColorMeta">
<title>Профиль — Rasswet Gifts</title>
<link rel="icon" type="image/png" href="/static/img/logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   ТЕМА: обычный стиль сайта по умолчанию.
   Хэллоуин — это отдельный слой (.halloween-active на <html>),
   который включается автоматически, когда активен ивент
   (см. loadHalloweenEvent), и просто переопределяет переменные ниже.
   ══════════════════════════════════════════════════════════════ */
:root{
    /* базовые цвета (всегда одинаковые) */
    --text:#f7f9fd;
    --blue:#4D9DDB;
    --blue-2:#367FB6;
    --blue-light:#92C7EA;
    --green:#24C38E;
    --red:#FF3064;
    --purple:#8B5CF6;
    --orange:#FF8A3D;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);

    /* обычная тема (по умолчанию) */
    --muted:#8b96ab;
    --muted-2:#5c6a80;
    --line:rgba(110,145,189,.20);
    --card:rgba(28,36,49,.62);
    --glow-1:rgba(77,157,219,.14);
    --glow-2:rgba(77,157,219,.07);
    --glow-3:rgba(77,157,219,.09);
    --bg-a:#171F2B;
    --bg-b:#141b26;
    --bg-c:#121722;
    --grid-line:rgba(110,145,189,.07);
    --topbar-bg:rgba(15,20,29,.96);
    --topbar-border:rgba(110,145,189,.14);
    --nav-hover-color:#c7d3e6;
    --nav-hover-bg:rgba(77,157,219,.08);
    --nav-active-color:#7CAEFF;
    --nav-active-bg:rgba(77,157,219,.16);
    --nav-active-shadow:rgba(77,157,219,.32);
    --ring-1:#4D9DDB;
    --ring-2:#367FB6;
    --avatar-bg-a:#243447;
    --avatar-bg-b:#182231;
    --bottomnav-bg:rgba(17,22,31,.96);
    --bottomnav-border:rgba(110,145,189,.18);
    --bnav-active-color:#7CAEFF;
    --bnav-active-bg:rgba(77,157,219,.15);
    --bnav-active-shadow:rgba(77,157,219,.3);
    --sheet-bg-a:#212c3c;
    --sheet-bg-b:#151d29;
    --sheet-border:rgba(77,157,219,.30);
    --notif-border:rgba(77,157,219,.35);
    --pumpkin-display:none;
}

/* хэллоуин — включается классом .halloween-active на <html> */
html.halloween-active{
    --muted:#9b8bb8;
    --muted-2:#7a6f92;
    --line:rgba(139,92,246,.22);
    --card:rgba(32,20,52,.55);
    --glow-1:rgba(139,92,246,.20);
    --glow-2:rgba(255,138,61,.13);
    --glow-3:rgba(77,157,219,.10);
    --bg-a:#0f0a1c;
    --bg-b:#0d0817;
    --bg-c:#0a0612;
    --grid-line:rgba(139,92,246,.09);
    --topbar-bg:rgba(18,7,28,.96);
    --topbar-border:rgba(168,85,247,.22);
    --nav-hover-color:#d7c9ef;
    --nav-hover-bg:rgba(139,92,246,.09);
    --nav-active-color:#dfb7ff;
    --nav-active-bg:rgba(139,92,246,.18);
    --nav-active-shadow:rgba(168,85,247,.35);
    --ring-1:var(--orange);
    --ring-2:var(--purple);
    --avatar-bg-a:#2a1c44;
    --avatar-bg-b:#1a1128;
    --bottomnav-bg:rgba(20,8,30,.96);
    --bottomnav-border:rgba(168,85,247,.26);
    --bnav-active-color:#d8a8ff;
    --bnav-active-bg:rgba(139,92,246,.18);
    --bnav-active-shadow:rgba(168,85,247,.30);
    --sheet-bg-a:#211235;
    --sheet-bg-b:#160c26;
    --sheet-border:rgba(139,92,246,.30);
    --notif-border:rgba(139,92,246,.35);
    --pumpkin-display:inline;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;min-height:100dvh;width:100%}
body{
    min-height:100dvh;
    overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(650px 420px at 10% 10%,var(--glow-1),transparent 68%),
        radial-gradient(650px 420px at 92% 20%,var(--glow-2),transparent 70%),
        radial-gradient(700px 500px at 50% 100%,var(--glow-3),transparent 70%),
        linear-gradient(180deg,var(--bg-a) 0%,var(--bg-b) 55%,var(--bg-c) 100%);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .4s ease;
}
body:before{
    content:"";
    position:fixed;
    inset:76px 0 0;
    pointer-events:none;
    opacity:.22;
    background-image:
        linear-gradient(var(--grid-line) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:80px 80px;
    transition:background-image .4s ease;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}

/* ══════════════ TOP BAR (стиль раздела «Игры», в цветах этого раздела) ══════════════ */
.top-bar{
    min-height:76px;width:100%;padding:12px clamp(16px,3vw,42px);gap:20px;flex-wrap:wrap;
    display:flex;align-items:center;position:relative;z-index:20;
    background:var(--topbar-bg);
    border-bottom:1px solid var(--topbar-border);
    box-shadow:0 1px 25px rgba(0,0,0,.28);
    transition:background .3s ease,border-color .3s ease;
}
.desktop-left{display:flex;align-items:center;gap:24px;min-width:0;flex:1}
.logo-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.logo-btn img{width:38px;height:38px;object-fit:contain}
.main-nav{display:flex;align-items:center;gap:2px;position:static;flex-wrap:wrap;margin:0 auto}
.nav-btn{
    height:40px;padding:0 13px;border-radius:22px;
    display:flex;align-items:center;gap:8px;
    color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap;
    transition:.18s ease;
}
.nav-btn:hover{color:var(--nav-hover-color);background:var(--nav-hover-bg)}
.nav-btn.active{
    color:var(--nav-active-color);
    background:var(--nav-active-bg);
    box-shadow:inset 0 0 0 1px var(--nav-active-shadow),0 4px 18px var(--nav-active-shadow);
}
.nav-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:currentColor}
.nav-icon svg{width:18px;height:18px}
.account{margin-left:auto;display:flex;align-items:center;gap:9px;flex-shrink:0}
.balance{
    height:36px;min-width:88px;padding:0 10px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    color:#eaf2fb;
    background:linear-gradient(180deg,var(--sheet-bg-a),var(--sheet-bg-b));
    border:1px solid rgba(77,157,219,.38);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
    font-size:14px;font-weight:800;
    transition:background .3s ease;
}
.balance img{width:16px;height:16px;object-fit:contain}
.balance-value{min-width:35px;text-align:right}
.plus-btn{
    width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:#eaf3ff;
    background:linear-gradient(180deg,rgba(77,157,219,.26),rgba(77,110,180,.20));
    border:1px solid rgba(77,157,219,.48);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 16px rgba(77,157,219,.16);
    transition:.18s ease;
}
.plus-btn svg{width:13px;height:13px}
.plus-btn:hover{background:linear-gradient(180deg,rgba(77,157,219,.38),rgba(77,110,180,.28));border-color:rgba(77,157,219,.7)}
.plus-btn:active{transform:scale(.92)}
.avatar-btn{
    width:43px;height:43px;padding:2px;border-radius:50%;overflow:hidden;
    background:var(--avatar-bg-b);
    border:2px solid;
    border-image:linear-gradient(135deg,var(--ring-1),var(--ring-2)) 1;
    box-shadow:0 0 0 2px rgba(77,157,219,.14);
    transition:border-image .3s ease;
}
.avatar-btn img{width:100%;height:100%;border-radius:50%;object-fit:cover}

/* Нижняя навигация — только для телефонов */
.bottom-nav{display:none}
@media(max-width:700px){
    .bottom-nav{
        position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));
        z-index:4000;height:66px;padding:6px;display:grid;
        grid-template-columns:repeat(4,1fr);gap:4px;border-radius:20px;
        background:var(--bottomnav-bg);
        border:1px solid var(--bottomnav-border);
        box-shadow:0 14px 45px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);
        backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
        transition:background .3s ease,border-color .3s ease;
    }
    .bottom-nav-btn{
        min-width:0;border-radius:15px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:4px;
        color:var(--muted);font-size:10px;font-weight:850;transition:.18s ease;
    }
    .bottom-nav-btn .nav-icon,.bottom-nav-btn .nav-icon svg{width:21px;height:21px}
    .bottom-nav-btn.active{color:var(--bnav-active-color);background:var(--bnav-active-bg);box-shadow:inset 0 0 0 1px var(--bnav-active-shadow)}
}
@media(min-width:701px){.bottom-nav{display:none!important}}

/* ══════════════ PAGE ══════════════ */
.page{width:min(100%,1280px);margin:0 auto;padding:40px 24px calc(40px + var(--safe-bottom));position:relative;z-index:1}
.page-title{
    font-size:26px;font-weight:900;letter-spacing:-.6px;margin-bottom:22px;
    display:flex;align-items:center;gap:10px;
}
.page-title .pumpkin{font-size:24px;filter:drop-shadow(0 0 10px rgba(255,138,61,.5));display:var(--pumpkin-display)}

.top-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;margin-bottom:16px;align-items:stretch}

.panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;padding:22px;min-width:0;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:relative;overflow:hidden;
    transition:background .3s ease,border-color .3s ease;
}
.panel:before{
    content:"";position:absolute;top:-70px;right:-40px;width:200px;height:200px;
    background:radial-gradient(circle,var(--glow-1) 0%,transparent 70%);
    pointer-events:none;
    transition:background .3s ease;
}

/* PROFILE PANEL */
.profile-panel{display:flex;align-items:center;gap:16px}
.avatar-wrap{
    width:76px;height:76px;min-width:76px;border-radius:50%;
    padding:3px;
    background:linear-gradient(135deg,var(--ring-1),var(--ring-2));
    box-shadow:0 0 26px rgba(77,157,219,.30);
    position:relative;z-index:1;
    transition:background .3s ease;
}
.avatar-inner{
    width:100%;height:100%;border-radius:50%;overflow:hidden;
    background:linear-gradient(135deg,var(--avatar-bg-a),var(--avatar-bg-b));
    display:flex;align-items:center;justify-content:center;
    transition:background .3s ease;
}
.avatar-inner img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-fallback{font-size:28px;font-weight:800;color:#fff}
.profile-info{min-width:0;flex:1;position:relative;z-index:1}
.profile-name{
    font-size:18px;font-weight:850;letter-spacing:-.2px;margin-bottom:8px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.profile-balance{
    max-width:100%;overflow-wrap:anywhere;
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(77,157,219,.14);border:1px solid rgba(77,157,219,.32);
    border-radius:14px;padding:8px 14px;font-size:15px;font-weight:800;color:#9FCBFF;
}
.profile-balance img{width:16px;height:16px}

/* SETTINGS PANEL */
.settings-title{font-size:15px;font-weight:850;margin-bottom:16px;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.settings-row{margin-bottom:14px;position:relative;z-index:1}
.settings-row:last-child{margin-bottom:0}
.settings-label{font-size:12px;font-weight:750;color:var(--muted);margin-bottom:9px;text-transform:uppercase;letter-spacing:.4px}
.lang-toggle{display:inline-flex;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.lang-btn{
    min-width:48px;min-height:44px;
    padding:8px 18px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted);
    transition:.15s ease;
}
.lang-btn.active{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;box-shadow:0 4px 14px rgba(77,157,219,.35)}
.promo-row{display:flex;gap:8px}
.promo-field{
    flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;color:#fff;font-size:16px;font-family:inherit;
    outline:none;transition:border-color .15s;
}
.promo-field::placeholder{color:var(--muted-2)}
.promo-field:focus{border-color:rgba(77,157,219,.55)}
.promo-apply{
    padding:0 18px;border-radius:12px;font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blue-2));
    box-shadow:0 4px 14px rgba(77,157,219,.3);white-space:nowrap;
    transition:transform .15s,opacity .15s;
}
.promo-apply:active{transform:scale(.96)}
.promo-apply:disabled{opacity:.5;cursor:not-allowed}
.promo-msg{font-size:12px;font-weight:700;margin-top:8px;min-height:14px}
.promo-msg.err{color:var(--red)}
.promo-msg.ok{color:var(--green)}

/* INVENTORY PANEL */
.inv-panel{padding:22px}
.inv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;position:relative;z-index:1;flex-wrap:wrap}
.inv-head-left{display:flex;align-items:center;gap:10px}
.inv-head-title{font-size:16px;font-weight:850}
.inv-count{
    background:rgba(77,157,219,.16);border:1px solid rgba(77,157,219,.35);
    color:#9FCBFF;font-size:12px;font-weight:850;border-radius:20px;padding:4px 11px;min-width:22px;text-align:center;
}
.sell-all-btn{
    padding:11px 18px;border-radius:12px;font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blue-2));
    box-shadow:0 4px 14px rgba(77,157,219,.3);
    transition:transform .15s,opacity .15s;
}
.sell-all-btn:active{transform:scale(.96)}
.sell-all-btn:disabled{opacity:.4;cursor:not-allowed}

.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;width:100%;position:relative;z-index:1}
@media(max-width:700px){.inv-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}}

.item-card{
    min-width:0;
    background:rgba(14,18,26,.72);
    border:1px solid var(--line);
    border-radius:16px;padding:9px 8px 10px;
    display:flex;flex-direction:column;
    transition:border-color .15s,transform .15s,background .3s ease;
}
.item-card:hover{border-color:rgba(77,157,219,.35)}
.item-name{
    font-size:13px;font-weight:750;color:rgba(255,255,255,.9);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:2px 2px 7px;text-align:center;
}
.item-img-wrap{
    width:100%;aspect-ratio:1/1;border-radius:12px;
    background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.04);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.item-img-wrap img{width:100%;height:100%;object-fit:contain;padding:8px}
.item-price{
    display:flex;align-items:center;justify-content:center;gap:4px;
    font-size:14px;font-weight:800;color:#9FCBFF;padding:12px 0;overflow-wrap:anywhere;
}
.item-price img{width:12px;height:12px}
.item-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:auto}
.item-btn{
    min-width:0;min-height:44px;padding:10px 4px;border-radius:9px;font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.3px;
    transition:transform .15s,opacity .15s;
}
.item-btn:active:not(:disabled){transform:scale(.94)}
.item-btn:disabled{opacity:.4;cursor:not-allowed}
.item-btn-sell{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.12)}
.item-btn-withdraw{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff}

.inv-empty{
    grid-column:1/-1;
    width:100%;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    border-radius:18px;border:1px dashed var(--line);
    color:rgba(255,255,255,.32);font-size:14px;font-weight:700;
}
.inv-empty svg{width:44px;height:44px;stroke:rgba(255,255,255,.24);fill:none;stroke-width:1.6}

@media(max-width:700px){
    body:before{inset:calc(62px + env(safe-area-inset-top)) 0 0;background-size:65px 65px}
    .top-bar{
        margin-top:0;height:auto;min-height:calc(62px + env(safe-area-inset-top));
        padding:calc(8px + env(safe-area-inset-top)) 11px 8px;background:var(--topbar-bg);
    }
    .desktop-left{display:none}
    .account{width:100%;justify-content:flex-end;gap:7px}
    .balance{min-width:88px;height:34px;padding:0 9px;border-radius:10px;font-size:12.5px}
    .balance img{width:15px;height:15px}
    .plus-btn{width:44px;height:44px;border-radius:12px}
    .plus-btn svg{width:12px;height:12px}
    .avatar-btn{width:44px;height:44px}

    .page{padding:24px 12px calc(100px + env(safe-area-inset-bottom))}
    .page-title{font-size:22px;margin-bottom:16px}
    .top-grid{grid-template-columns:1fr;gap:12px}
    .panel{padding:18px;border-radius:18px}
    .profile-panel{gap:13px}
    .avatar-wrap{width:64px;height:64px;min-width:64px}
    .profile-name{font-size:16px}
    .promo-row{flex-direction:column}
    .promo-apply{padding:12px}
    .inv-panel{padding:14px}
}

/* MODAL: MRKT WITHDRAW PICKER */
.overlay{
    position:fixed;inset:0;z-index:60000;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(6,3,12,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;
}
.overlay.show{opacity:1;visibility:visible}
.sheet{
    background:linear-gradient(180deg,var(--sheet-bg-a) 0%,var(--sheet-bg-b) 100%);
    border-radius:24px 24px 0 0;width:100%;max-width:520px;
    padding:16px 18px calc(24px + var(--safe-bottom));
    transform:translateY(100%);transition:transform .35s cubic-bezier(.32,1,.23,1),background .3s ease;
    border-top:1px solid var(--sheet-border);max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
}
.overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-title{font-size:16px;font-weight:850}
.sheet-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.sheet-close{width:44px;height:44px;flex-shrink:0;border-radius:10px;background:rgba(255,48,100,.15);color:#FF3064;font-size:14px;font-weight:800}

.mrkt-loading{display:flex;align-items:center;gap:10px;padding:24px 4px;color:var(--muted);font-size:13px;font-weight:700}
.mrkt-spinner{width:22px;height:22px;border:3px solid rgba(77,157,219,.2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mrkt-error{color:var(--red);font-size:13px;font-weight:700;padding:10px 2px;display:none}
.mrkt-error.show{display:block}
.mrkt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mrkt-card{
    background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.06);border-radius:14px;
    padding:10px;text-align:left;transition:border-color .15s,background .15s;
}
.mrkt-card.selected{border-color:var(--blue);background:rgba(77,157,219,.14)}
.mrkt-card img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:6px}
.mrkt-model{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrkt-meta{font-size:10px;color:var(--muted);margin:3px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrkt-price{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#9FCBFF}
.mrkt-price img{width:12px;height:12px}
.mrkt-submit{
    width:100%;padding:15px;border-radius:14px;font-size:14px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blue-2));
    box-shadow:0 6px 18px rgba(77,157,219,.35);
}
.mrkt-submit:disabled{opacity:.4;cursor:not-allowed}

/* DEPOSIT */
.deposit-modal{
    background:linear-gradient(180deg,var(--sheet-bg-a),var(--sheet-bg-b));border-radius:22px;
    width:min(100%,380px);padding:22px;border:1px solid var(--sheet-border);
    box-shadow:0 25px 90px rgba(0,0,0,.55);
    transition:background .3s ease,border-color .3s ease;
}
.deposit-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.deposit-title{font-size:17px;font-weight:850}
.deposit-close{width:44px;height:44px;flex-shrink:0;border-radius:10px;background:rgba(255,255,255,.08);color:#cfc3e6}
.deposit-unavailable{font-size:13px;color:var(--muted);line-height:1.6;text-align:center;padding:14px 2px}

/* NOTIF */
.notif{
    position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));transform:translate(-50%,140%);
    z-index:99999;background:rgba(18,14,26,.98);border:1px solid var(--notif-border);
    color:#fff;font-size:13px;font-weight:700;padding:12px 20px;border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.32,1,.23,1),border-color .3s ease;
    max-width:calc(100% - 32px);text-align:center;
}
.notif.show{transform:translate(-50%,0)}
.notif.error{border-color:rgba(255,48,100,.45);color:#ffb3c4}

/* Responsive panel boundaries, safe areas and keyboard/touch access. */
.balance-value{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.balance{min-width:0}
.balance img,.profile-balance img,.item-price img{flex-shrink:0}
.promo-msg,.sheet-subtitle,.mrkt-error{overflow-wrap:anywhere}
.inv-head-left{min-width:0;flex-wrap:wrap}
.sell-all-btn,.promo-apply{min-height:44px}
.inv-empty{padding:24px 12px;text-align:center}
.mrkt-card{min-width:0}
.sheet-head{gap:12px}
.sheet-head>div{min-width:0}
.deposit-modal{max-height:calc(100dvh - 32px);overflow-y:auto}
#depositOverlay{align-items:center;padding:16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue-light);outline-offset:3px}
html:has(.overlay.show){overflow:hidden}
@media(min-width:701px){
    .overlay{align-items:center;padding:24px}
    .sheet{border:1px solid var(--sheet-border);border-radius:24px;max-height:calc(100dvh - 48px)}
    .sheet-handle{display:none}
}
@media(min-width:701px) and (max-width:1000px){
    .desktop-left{flex-basis:100%}
    .account{padding-bottom:2px}
    .top-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
    .profile-panel{flex-direction:column;align-items:flex-start;justify-content:center}
    .profile-info{width:100%;flex:0}
    .promo-row{flex-wrap:wrap}
    .promo-field{flex-basis:180px}
}
@media(max-width:700px){
    .page{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
    .top-bar{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
    .account{min-width:0}
    .bottom-nav{left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right))}
    .notif{bottom:calc(88px + var(--safe-bottom));width:max-content;overflow-wrap:anywhere;visibility:hidden}
    .notif.show{visibility:visible}
    .item-btn{font-size:10px;letter-spacing:0}
}
@media(max-width:359px){
    .inv-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .item-actions{grid-template-columns:1fr}
    .item-card{padding:8px 6px}
    .inv-head{align-items:stretch}
    .sell-all-btn{width:100%}
    .profile-panel{gap:10px}
    .profile-balance{padding:8px}
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var user = null;
var inventory = [];
var currentLang = localStorage.getItem('app_lang') || 'ru';
var _mrktCandidates = [];
var _mrktSelected = null;
var _mrktTargetItem = null;

function $(id){ return document.getElementById(id); }
function starsToTon(s){ return Number(s || 0) / 100; }
function formatTon(t){
    var v = parseFloat(t) || 0;
    if(v === 0) return '0.00';
    if(v >= 100) return v.toFixed(0);
    if(v >= 10) return v.toFixed(1);
    return v.toFixed(2);
}
function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
}
function vibrateIfOn(){
    try{
        if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
            Telegram.WebApp.HapticFeedback.impactOccurred('light');
            return;
        }
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate(30);
}
function goTo(url){
    vibrateIfOn();
    window.location.href = url;
}
function showNotif(msg, isError){
    var el = $('notif');
    if(!el) return;
    el.textContent = msg;
    el.className = 'notif' + (isError ? ' error' : '');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(function(){ el.classList.remove('show'); }, 3000);
}

/* ══════════════════════════════════════════════════════════════
   LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function initLang(){
    var ru = $('langRu'), en = $('langEn');
    if(ru) ru.classList.toggle('active', currentLang === 'ru');
    if(en) en.classList.toggle('active', currentLang === 'en');
}
function setLang(lang){
    currentLang = lang;
    localStorage.setItem('app_lang', lang);
    initLang();
    vibrateIfOn();
}

/* ══════════════════════════════════════════════════════════════
   INIT / AUTH
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function(){
    initLang();
    if(window.Telegram && window.Telegram.WebApp){
        try{
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.setHeaderColor('#171F2B');
            Telegram.WebApp.setBackgroundColor('#171F2B');
        }catch(e){}
    }
    initUser();
    loadHalloweenEvent();
});

/* ══════════════════════════════════════════════════════════════
   ХЭЛЛОУИН — тема включается сама, когда ивент активен на сервере
   (тот же источник, что и на странице «Игры»). По умолчанию —
   обычное оформление сайта.
   ══════════════════════════════════════════════════════════════ */
function setHalloweenTheme(active){
    document.documentElement.classList.toggle('halloween-active', !!active);
    var tc = $('themeColorMeta');
    if(tc) tc.setAttribute('content', active ? '#0d0817' : '#171F2B');
    try{
        if(window.Telegram && Telegram.WebApp){
            Telegram.WebApp.setHeaderColor(active ? '#0d0817' : '#171F2B');
            Telegram.WebApp.setBackgroundColor(active ? '#0d0817' : '#171F2B');
        }
    }catch(e){}
}
async function loadHalloweenEvent(){
    try{
        var r = await fetch('/api/events/witch-hat-party?ts=' + Date.now(), {cache:'no-store'});
        var d = await r.json();
        var active = !!(d && d.event && d.event.active);
        setHalloweenTheme(active);
    }catch(e){
        /* сеть недоступна — не трогаем текущую тему, тихо повторим позже */
    }finally{
        setTimeout(loadHalloweenEvent, 30000);
    }
}

async function initUser(){
    var authData = null;
    try{ authData = await telegramAuth(); }catch(e){ console.error('auth fail', e); }
    if(!authData || !authData.id){
        setTimeout(initUser, 1500);
        return;
    }
    try{
        var br = await fetch('/api/check-ban?user_id=' + authData.id);
        var bd = await br.json();
        if(bd.banned){ window.location.href = '/ban'; return; }
    }catch(e){}
    try{
        var r = await fetch('/api/telegram-auth', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(authData)
        });
        var d = await r.json();
        if(d.success){
            user = d.user;
            updateProfile();
            await loadInventory();
        }
    }catch(e){
        console.error('initUser:', e);
        showNotif('Ошибка загрузки', true);
    }
}

async function refreshUserData(){
    if(!user) return;
    try{
        var r = await fetch('/api/user/' + user.id);
        var d = await r.json();
        if(d.success && d.user){ user = d.user; updateProfile(); }
    }catch(e){}
}

function updateProfile(){
    if(!user) return;
    var name = user.first_name || 'User';
    var nm = $('userName'); if(nm) nm.textContent = name;

    var photoUrl = user.photo_url;
    var validPhoto = photoUrl && photoUrl !== '' && String(photoUrl).indexOf('default_avatar') === -1;
    var avatarInner = $('avatarInner');
    if(avatarInner){
        if(validPhoto){
            var img = document.createElement('img');
            img.alt = 'Avatar';
            img.onerror = function(){ avatarInner.innerHTML = '<div class="avatar-fallback">' + (name[0]||'U').toUpperCase() + '</div>'; };
            img.onload = function(){ avatarInner.innerHTML=''; avatarInner.appendChild(img); };
            img.src = photoUrl;
        } else {
            avatarInner.innerHTML = '<div class="avatar-fallback">' + (name[0]||'U').toUpperCase() + '</div>';
        }
    }
    var topAvatar = $('topAvatarImg');
    if(topAvatar && validPhoto) topAvatar.src = photoUrl;

    var bal = formatTon(starsToTon(user.balance_stars));
    var hb = $('hdrBalance'); if(hb) hb.textContent = bal;
    var sb = $('statBalance'); if(sb) sb.textContent = bal;
}

/* ══════════════════════════════════════════════════════════════
   PROMO
   ══════════════════════════════════════════════════════════════ */
async function activatePromo(){
    var pi = $('promoInput');
    var msg = $('promoMsg');
    var code = pi ? pi.value.trim().toUpperCase() : '';
    if(msg){ msg.textContent=''; msg.className='promo-msg'; }
    if(!code){ if(msg){ msg.textContent='Введите код'; msg.className='promo-msg err'; } return; }
    if(!user){ showNotif('Подождите загрузку профиля', true); return; }
    var btn = $('promoBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Проверка...'; }
    try{
        var r = await fetch('/api/activate-promo', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({user_id: user.id, promo_code: code})
        });
        var d = await r.json();
        if(d.success){
            vibrateIfOn();
            if(pi) pi.value = '';
            if(msg){ msg.textContent = d.message || 'Промокод активирован!'; msg.className = 'promo-msg ok'; }
            await refreshUserData();
            await loadInventory();
        } else {
            if(msg){ msg.textContent = d.error || 'Неверный код'; msg.className = 'promo-msg err'; }
        }
    }catch(e){
        if(msg){ msg.textContent = 'Ошибка сети'; msg.className = 'promo-msg err'; }
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Применить'; }
}

/* ══════════════════════════════════════════════════════════════
   INVENTORY
   ══════════════════════════════════════════════════════════════ */
function getGiftImage(item){
    var img = item.gift_image || '';
    if(!img){
        if(item.fragment_slug) img = 'https://fragment.com/file/gifts/' + item.fragment_slug + '/thumb.webp';
        else img = '/static/img/default_gift.png';
    }
    return img;
}

async function loadInventory(){
    if(!user) return;
    try{
        var r = await fetch('/api/inventory/' + user.id);
        var d = await r.json();
        inventory = (d.success && d.inventory) ? d.inventory : [];
    }catch(e){
        console.error('loadInventory:', e);
        inventory = [];
    }
    renderInventory();
}

function renderInventory(){
    var grid = $('inventoryGrid');
    var count = $('invCount');
    var sellAllBtn = $('sellAllBtn');
    if(count) count.textContent = inventory.length;
    if(sellAllBtn) sellAllBtn.disabled = inventory.length === 0;
    if(!grid) return;

    if(!inventory.length){
        grid.innerHTML = '<div class="inv-empty">'
            + '<svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>'
            + 'Инвентарь пуст</div>';
        return;
    }

    var html = '';
    inventory.forEach(function(item){
        var ton = starsToTon(item.gift_value);
        var imgSrc = getGiftImage(item);
        var onerr = "this.onerror=null;this.src='/static/img/default_gift.png'";
        var busy = !!item.is_withdrawing;
        var name = escapeHtml(item.gift_name || item.name || 'Подарок');
        html += '<div class="item-card">'
            + '<div class="item-name">' + name + '</div>'
            + '<div class="item-img-wrap"><img src="' + escapeHtml(imgSrc) + '" alt="" loading="lazy" decoding="async" onerror="' + onerr + '"></div>'
            + '<div class="item-price"><img src="/static/img/ton.png" alt="">' + formatTon(ton) + '</div>'
            + '<div class="item-actions">'
            + '<button class="item-btn item-btn-sell" ' + (busy?'disabled':'') + ' onclick="sellItem(' + item.id + ')">Продать</button>'
            + '<button class="item-btn item-btn-withdraw" ' + (busy?'disabled':'') + ' onclick="openMrktPicker(' + item.id + ')">Вывод</button>'
            + '</div>'
            + '</div>';
    });
    grid.innerHTML = html;
}

/* Мгновенная продажа — без подтверждения */
async function sellItem(itemId){
    if(!user) return;
    vibrateIfOn();
    try{
        var r = await fetch('/api/sell-gift', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({user_id: user.id, gift_id: itemId})
        });
        var d = await r.json();
        if(d.success){
            showNotif('Подарок продан!');
            await refreshUserData();
            await loadInventory();
        } else {
            showNotif(d.error || 'Ошибка продажи', true);
        }
    }catch(e){
        showNotif('Ошибка сети', true);
    }
}

/* Продать всё сразу — без подтверждения */
async function sellAll(){
    if(!user || !inventory.length) return;
    var ids = inventory.filter(function(i){ return !i.is_withdrawing; }).map(function(i){ return i.id; });
    if(!ids.length){ showNotif('Нет доступных подарков для продажи', true); return; }
    vibrateIfOn();
    var btn = $('sellAllBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Продаём 0/' + ids.length + '...'; }
    var sold = 0;
    for(var i = 0; i < ids.length; i++){
        try{
            var r = await fetch('/api/sell-gift', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({user_id:user.id, gift_id:ids[i]})
            });
            var d = await r.json();
            if(d.success){
                sold++;
                if(btn) btn.textContent = 'Продаём ' + sold + '/' + ids.length + '...';
            }
        }catch(e){}
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Продать всё'; }
    if(sold > 0) showNotif(sold + ' подарков продано!');
    else showNotif('Не удалось продать подарки', true);
    await refreshUserData();
    await loadInventory();
}

/* ══════════════════════════════════════════════════════════════
   ВЫВОД — модели загружаются с торговой площадки (MRKT)
   ══════════════════════════════════════════════════════════════ */
async function openMrktPicker(itemId){
    var item = inventory.find(function(i){ return String(i.id) === String(itemId); });
    if(!item || !user) return;
    if(item.is_withdrawing){ showNotif('Подарок уже выводится', true); return; }
    _mrktTargetItem = item;
    vibrateIfOn();

    var ov = $('mrktOverlay'); if(ov) ov.classList.add('show');
    var grid = $('mrktGrid'); if(grid) grid.innerHTML = '';
    var loading = $('mrktLoading'); if(loading) loading.style.display = 'flex';
    var err = $('mrktError'); if(err){ err.classList.remove('show'); err.textContent = ''; }
    var btn = $('mrktSubmitBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Выберите модель'; }
    _mrktCandidates = []; _mrktSelected = null;
    var subtitle = $('mrktSubtitle'); if(subtitle) subtitle.textContent = (item.gift_name || 'Подарок') + ' — доступные модели';

    try{
        var name = encodeURIComponent(String(item.gift_name || '').replace(/#\d+$/, '').trim());
        var r = await fetch('/api/portal/search?name=' + name + '&limit=500');
        var d = await r.json();
        if(!d.success) throw new Error(d.error || 'Площадка недоступна');
        _mrktCandidates = (d.gifts || []).filter(function(x){ return x && x.id != null; });
        if(!_mrktCandidates.length){
            var r2 = await fetch('/api/portal/gifts?name=' + name);
            var d2 = await r2.json();
            if(d2.success) _mrktCandidates = (d2.gifts || []).filter(function(x){ return x && x.id != null; });
        }
        var byModel = {};
        _mrktCandidates.forEach(function(x){
            var key = String(x.model || x.title || 'Без модели').trim().toLowerCase();
            if(!byModel[key] || Number(x.price_ton||0) < Number(byModel[key].price_ton||0)) byModel[key] = x;
        });
        _mrktCandidates = Object.keys(byModel).map(function(k){ return byModel[k]; });
        _mrktCandidates.sort(function(a,b){ return Number(a.price_ton||0) - Number(b.price_ton||0); });
        renderMrktCandidates();
        if(!_mrktCandidates.length) showMrktError('Сейчас нет доступных моделей этого подарка.');
    }catch(e){
        console.error('mrkt picker', e);
        closeMrktPicker();
        showNotif('Ошибка вывода, попробуйте позже', true);
    }finally{
        if(loading) loading.style.display = 'none';
    }
}

function renderMrktCandidates(){
    var grid = $('mrktGrid'); if(!grid) return;
    if(!_mrktCandidates.length){ grid.innerHTML = ''; return; }
    grid.innerHTML = _mrktCandidates.map(function(g, i){
        var model = g.model || g.title || ('Модель ' + (i+1));
        var meta = []; if(g.backdrop) meta.push(g.backdrop); if(g.symbol) meta.push(g.symbol); if(g.number) meta.push('#'+g.number);
        var img = g.image || '/static/img/gift.png';
        return '<button type="button" class="mrkt-card" data-i="' + i + '" onclick="selectMrktCandidate(' + i + ')">'
            + '<img src="' + escapeHtml(img) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'">'
            + '<div class="mrkt-model">' + escapeHtml(model) + '</div>'
            + '<div class="mrkt-meta">' + escapeHtml(meta.join(' · ')) + '</div>'
            + '<div class="mrkt-price"><img src="/static/img/ton.png" alt="">' + Number(g.price_ton||0).toFixed(2) + ' TON</div>'
            + '</button>';
    }).join('');
}
function selectMrktCandidate(index){
    _mrktSelected = _mrktCandidates[index] || null;
    document.querySelectorAll('.mrkt-card').forEach(function(el){ el.classList.toggle('selected', Number(el.dataset.i) === index); });
    var btn = $('mrktSubmitBtn');
    if(btn){
        if(_mrktSelected){ btn.disabled = false; btn.textContent = 'Вывести выбранный подарок'; }
        else { btn.disabled = true; btn.textContent = 'Выберите модель'; }
    }
    vibrateIfOn();
}
function showMrktError(msg){ var e = $('mrktError'); if(e){ e.textContent = msg; e.classList.add('show'); } }
function closeMrktPicker(){
    var ov = $('mrktOverlay'); if(ov) ov.classList.remove('show');
    _mrktSelected = null; _mrktCandidates = []; _mrktTargetItem = null;
}
async function confirmMrktWithdraw(){
    if(!_mrktSelected || !_mrktTargetItem || !user) return;
    var btn = $('mrktSubmitBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Оформляем вывод…'; }
    try{
        var r = await fetch('/api/portal/buy-withdraw', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                user_id: user.id,
                inventory_id: _mrktTargetItem.id,
                portal_gift_id: _mrktSelected.id,
                portal_gift_price: Number(_mrktSelected.price_ton || 0)
            })
        });
        var d = await r.json();
        if(d.success){
            closeMrktPicker();
            showNotif(d.message || 'Заявка на вывод создана');
            await refreshUserData();
            await loadInventory();
        } else {
            if(btn){ btn.disabled = false; btn.textContent = 'Вывести выбранный подарок'; }
            showNotif(d.error || 'Ошибка вывода', true);
        }
    }catch(e){
        if(btn){ btn.disabled = false; btn.textContent = 'Вывести выбранный подарок'; }
        showNotif('Ошибка сети', true);
    }
}

/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */
function openDeposit(){ vibrateIfOn(); var ov = $('depositOverlay'); if(ov) ov.classList.add('show'); }
function closeDeposit(){ var ov = $('depositOverlay'); if(ov) ov.classList.remove('show'); }
</script>
