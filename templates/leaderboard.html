<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C2233">
<title>Rasswet Gifts - Лидерборд</title>
<link rel="icon" type="image/png" href="/static/img/logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#1C2233;
    --surface:rgba(255,255,255,.04);
    --surface-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --text-2:rgba(255,255,255,.55);
    --text-3:rgba(255,255,255,.35);
    --gold:#FFD700;
    --gold-glow:rgba(255,215,0,.4);
    --silver:#C0C0C0;
    --bronze:#CD7F32;
    --blue:#3B82F6;
    --safe-top:env(safe-area-inset-top,20px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(59,130,246,.25);border-radius:3px}

/* ══════════════ MAIN ══════════════ */
.main{
    max-width:480px;margin:0 auto;
    padding:calc(var(--safe-top) + 58px) 16px calc(var(--safe-bottom) + 96px);
}

/* ══════════════ HELP TIP ══════════════ */
.help-tip{
    display:flex;align-items:center;gap:6px;
    justify-content:center;margin-bottom:10px;
    font-size:12px;color:var(--text-3);
    cursor:pointer;transition:color .2s;
}
.help-tip:active{color:var(--text-2)}
.help-tip svg{width:14px;height:14px;opacity:.5}

/* ══════════════ TIMER ══════════════ */
.season-timer{
    display:flex;align-items:center;gap:6px;justify-content:center;
    font-size:13px;font-weight:700;color:#FFD700;
    margin-bottom:16px;
    background:rgba(255,215,0,.08);
    border:1px solid rgba(255,215,0,.2);
    padding:8px 14px;border-radius:20px;
    width:fit-content;margin-left:auto;margin-right:auto;
}
.season-timer svg{width:14px;height:14px;opacity:.85}

/* ══════════════ PAGE TITLE ══════════════ */
.page-title{
    font-size:24px;font-weight:900;text-align:center;
    margin-bottom:8px;letter-spacing:-.4px;
}
.page-desc{
    text-align:center;color:var(--text-2);font-size:12px;
    line-height:1.5;margin-bottom:24px;
    max-width:340px;margin-left:auto;margin-right:auto;
}

/* ══════════════ PODIUM ══════════════ */
.podium{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:8px;
    margin-bottom:32px;
    padding:0 4px;
    position:relative;
    min-height:290px;
}

.podium-slot{
    flex:1 1 0;
    min-width:0;
    max-width:140px;
    display:flex;flex-direction:column;align-items:center;
    position:relative;
    cursor:pointer;
    transition:transform .15s;
}
.podium-slot:active{transform:scale(.97)}

.podium-name{
    margin-bottom:6px;
    font-size:11px;font-weight:800;color:#fff;
    max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;
    text-align:center;padding:0 4px;
}
.podium-slot.p1 .podium-name{font-size:13px;color:#FFD700}

.podium-avatar{
    border-radius:50%;overflow:hidden;
    background:rgba(255,255,255,.04);
    position:relative;flex-shrink:0;
}
.podium-slot.p1 .podium-avatar{
    width:96px;height:96px;
    border:3px solid var(--gold);
    box-shadow:0 0 30px var(--gold-glow),0 0 60px rgba(255,215,0,.15);
}
.podium-slot.p2 .podium-avatar{
    width:72px;height:72px;
    border:3px solid var(--silver);
    box-shadow:0 0 18px rgba(192,192,192,.3);
}
.podium-slot.p3 .podium-avatar{
    width:72px;height:72px;
    border:3px solid var(--bronze);
    box-shadow:0 0 18px rgba(205,127,50,.3);
}
.podium-avatar img{width:100%;height:100%;object-fit:cover;display:block}

.podium-medal{
    margin-top:-16px;margin-bottom:-8px;
    position:relative;z-index:3;pointer-events:none;
}
.podium-medal img{
    width:56px;height:56px;object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.7));
    animation:medalBounce 2.5s ease-in-out infinite;
}
.podium-slot.p1 .podium-medal img{
    width:70px;height:70px;
    filter:drop-shadow(0 6px 20px rgba(255,215,0,.6));
}
@keyframes medalBounce{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-3px) scale(1.03)}
}

.podium-pedestal{
    width:100%;
    border-radius:14px 14px 0 0;
    padding:12px 6px 14px;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;
    gap:4px;position:relative;overflow:hidden;
    margin-top:0;
}
.podium-pedestal::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent 10%,rgba(255,255,255,.4) 50%,transparent 90%);
    z-index:2;
}
.podium-slot.p1 .podium-pedestal{
    height:140px;
    background:linear-gradient(180deg,rgba(255,215,0,.28) 0%,rgba(255,180,0,.15) 40%,rgba(255,160,0,.06) 100%);
    border:1px solid rgba(255,215,0,.35);
    border-bottom:none;
    box-shadow:inset 0 4px 20px rgba(255,215,0,.15),0 -6px 30px rgba(255,215,0,.15);
}
.podium-slot.p2 .podium-pedestal{
    height:100px;
    background:linear-gradient(180deg,rgba(192,192,192,.22) 0%,rgba(160,160,160,.1) 40%,rgba(140,140,140,.03) 100%);
    border:1px solid rgba(192,192,192,.25);
    border-bottom:none;
    box-shadow:inset 0 3px 15px rgba(192,192,192,.1),0 -4px 20px rgba(192,192,192,.1);
}
.podium-slot.p3 .podium-pedestal{
    height:75px;
    background:linear-gradient(180deg,rgba(205,127,50,.22) 0%,rgba(180,110,45,.1) 40%,rgba(160,90,30,.03) 100%);
    border:1px solid rgba(205,127,50,.25);
    border-bottom:none;
    box-shadow:inset 0 3px 12px rgba(205,127,50,.1),0 -4px 18px rgba(205,127,50,.1);
}

.podium-prize{
    margin-bottom:2px;position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;
}
.podium-prize img{
    width:40px;height:40px;object-fit:contain;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.podium-slot.p1 .podium-prize img{
    width:52px;height:52px;
    filter:drop-shadow(0 4px 14px rgba(255,215,0,.5));
}

.podium-turnover{
    font-size:10px;font-weight:800;color:rgba(255,255,255,.75);
    display:flex;align-items:center;gap:3px;
    white-space:nowrap;position:relative;z-index:1;
}
.podium-slot.p1 .podium-turnover{font-size:11px;color:rgba(255,255,255,.9)}
.podium-turnover img{width:10px;height:10px}

.podium-slot.p1::before{
    content:'';position:absolute;
    top:-20px;left:50%;transform:translateX(-50%);
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,0,.15) 0%,transparent 70%);
    z-index:-1;pointer-events:none;
    animation:goldPulse 3s ease-in-out infinite;
}
@keyframes goldPulse{
    0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.1)}
}

.podium-empty{opacity:.15;pointer-events:none}
.podium-empty .podium-pedestal{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06)}

/* ══════════════ NFT REWARD BADGE ══════════════ */
.nft-badge{
    position:absolute;
    top:6px;right:6px;
    background:linear-gradient(135deg,#8B5CF6,#6366F1);
    border-radius:6px;
    padding:2px 6px;
    font-size:8px;
    font-weight:900;
    letter-spacing:.5px;
    color:#fff;
    box-shadow:0 2px 8px rgba(139,92,246,.4);
    z-index:5;
    text-transform:uppercase;
}

/* ══════════════ LIST (#4+) ══════════════ */
.leaders-list{display:flex;flex-direction:column;gap:8px}

.leader-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    transition:all .15s;
    cursor:pointer;
    position:relative;
}
.leader-item:active{transform:scale(.98);background:var(--surface-2)}

.leader-rank{
    width:28px;flex-shrink:0;
    font-size:14px;font-weight:800;color:var(--text-2);
    text-align:center;
}
.leader-avatar{
    width:44px;height:44px;border-radius:50%;overflow:hidden;
    background:rgba(255,255,255,.04);flex-shrink:0;
    border:2px solid rgba(255,255,255,.1);
}
.leader-avatar img{width:100%;height:100%;object-fit:cover}
.leader-info{flex:1;min-width:0}
.leader-name{
    font-size:14px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;
}
.leader-turnover{
    display:flex;align-items:center;gap:4px;
    font-size:12px;color:var(--text-2);font-weight:600;
}
.leader-turnover img{width:12px;height:12px}
.leader-prize{
    width:48px;height:48px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;
}
.leader-prize img{
    width:42px;height:42px;object-fit:contain;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));
    border-radius:8px;
}
.leader-prize:active{transform:scale(.9)}
.leader-prize.has-nft::after{
    content:'NFT';
    position:absolute;
    bottom:-2px;left:50%;
    transform:translateX(-50%);
    background:linear-gradient(135deg,#8B5CF6,#6366F1);
    color:#fff;
    font-size:7px;
    font-weight:900;
    padding:1px 5px;
    border-radius:4px;
    letter-spacing:.5px;
    box-shadow:0 2px 6px rgba(139,92,246,.5);
}

.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty svg{width:48px;height:48px;margin-bottom:16px;opacity:.3}
.empty p{font-size:13px;font-weight:600}

/* ══════════════ BOTTOM NAV ══════════════ */
.bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    z-index:4000;width:100%;max-width:480px;height:76px;
    padding:0 8px calc(var(--safe-bottom) + 6px);
    background:rgba(28,34,51,.92);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-top:1px solid rgba(59,130,246,.08);
    display:flex;align-items:center;justify-content:space-around;
}
.bnav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:6px 14px;border-radius:12px;
    background:transparent;border:none;
    color:rgba(255,255,255,.4);
    font-family:inherit;font-weight:600;cursor:pointer;
    transition:all .3s;text-decoration:none;
    position:relative;min-height:56px;height:56px;margin:auto 0;
}
.bnav-item svg{width:22px;height:22px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav-item span{font-size:10px;font-weight:600;line-height:1}
.bnav-item.active{background:rgba(255,255,255,.08);color:#fff}
.bnav-item:active{transform:scale(.9)}

/* ══════════════ PROFILE MODAL ══════════════ */
.profile-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:7000;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
}
.profile-overlay.show{opacity:1;visibility:visible}
.profile-card{
    width:100%;max-width:480px;
    max-height:80vh;overflow-y:auto;
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px 24px;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.32,1,.23,1);
    position:relative;
    border-top:1px solid rgba(59,130,246,.2);
}
.profile-overlay.show .profile-card{transform:translateY(0)}
.profile-handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:10px auto 16px;flex-shrink:0}
.profile-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;text-align:center}
.pc-level-wrap{width:100%;max-width:280px;margin-top:8px;margin-bottom:20px}
.pc-level-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:rgba(255,255,255,.4);font-weight:600;margin-bottom:4px}
.pc-level-label span:first-child{color:rgba(255,255,255,.55);font-weight:700}
.pc-level-bg{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.pc-level-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3B82F6,#7CAEFF);transition:width .6s ease}
.pc-level-text{font-size:10px;color:rgba(255,255,255,.3);text-align:center;margin-top:3px}
.pc-stat-rows{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pc-stat-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 14px}
.pc-stat-row img{width:22px;height:22px;flex-shrink:0}
.pc-stat-row-label{font-size:12px;color:rgba(255,255,255,.45);font-weight:600}
.pc-stat-row-val{margin-left:auto;font-size:14px;font-weight:800;color:#fff}
.profile-inv-title{font-size:14px;font-weight:700;color:rgba(255,255,255,.5);margin-top:4px;margin-bottom:8px;text-align:left;width:100%}
.profile-inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.profile-inv-item{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;border:1.5px solid transparent}
.profile-inv-item.upgraded{border-color:rgba(255,215,0,.35);background:linear-gradient(180deg,rgba(255,215,0,.06) 0%,rgba(255,140,0,.04) 100%)}
.profile-inv-img{width:72px;height:72px;object-fit:contain;margin-bottom:4px}
.profile-inv-item.upgraded .profile-inv-img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px;margin:0}
.profile-inv-name{font-size:11px;color:rgba(255,255,255,.8);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;line-height:1.2}
.profile-inv-price{font-size:11px;color:#1EE44C;font-weight:700;margin-top:2px}
.profile-close-btn{width:100%;padding:12px;border:none;border-radius:12px;background:rgba(59,130,246,.15);color:#7CAEFF;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;flex-shrink:0;border:1px solid rgba(59,130,246,.3)}
.profile-close-btn:active{background:rgba(59,130,246,.25)}

/* ══════════════ PRIZE MODAL (Regular + NFT) ══════════════ */
.prize-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:7500;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
    padding:20px;
}
.prize-overlay.show{opacity:1;visibility:visible}
.prize-card{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px;width:100%;max-width:360px;
    padding:24px 20px 20px;
    display:flex;flex-direction:column;align-items:center;
    transform:scale(.9);
    transition:transform .3s cubic-bezier(.32,1,.23,1);
    border:1px solid rgba(59,130,246,.25);
    max-height:90vh;
    overflow-y:auto;
}
.prize-overlay.show .prize-card{transform:scale(1)}
.prize-medal{width:100px;height:100px;margin-bottom:12px;filter:drop-shadow(0 6px 20px rgba(255,215,0,.4));animation:medalBounce 2.5s ease-in-out infinite}
.prize-medal img{width:100%;height:100%;object-fit:contain}
.prize-place{font-size:24px;font-weight:900;margin-bottom:4px;text-align:center}
.prize-place.gold{color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.5)}
.prize-place.silver{color:#C0C0C0;text-shadow:0 0 15px rgba(192,192,192,.4)}
.prize-place.bronze{color:#CD7F32;text-shadow:0 0 15px rgba(205,127,50,.4)}
.prize-place.other{color:#7CAEFF}
.prize-subtitle{font-size:12px;color:var(--text-2);text-align:center;margin-bottom:20px;font-weight:600}
.prize-block{width:100%;padding:18px 16px;border-radius:18px;background:rgba(59,130,246,.06);border:1.5px solid rgba(59,130,246,.2);display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px}
.prize-block.gold{background:linear-gradient(180deg,rgba(255,215,0,.1),rgba(255,180,0,.04));border-color:rgba(255,215,0,.35)}
.prize-block.silver{background:linear-gradient(180deg,rgba(192,192,192,.08),rgba(160,160,160,.03));border-color:rgba(192,192,192,.3)}
.prize-block.bronze{background:linear-gradient(180deg,rgba(205,127,50,.1),rgba(180,110,45,.04));border-color:rgba(205,127,50,.3)}
.prize-block.nft{background:linear-gradient(180deg,rgba(139,92,246,.12),rgba(99,102,241,.04));border-color:rgba(139,92,246,.4)}
.prize-block-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3)}
.prize-img-wrap{width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);border-radius:20px;padding:10px;box-sizing:border-box}
.prize-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.prize-img-wrap.gift{background:linear-gradient(180deg,rgba(59,130,246,.1),rgba(59,130,246,.02))}
.prize-img-wrap.nft{width:180px;height:180px;padding:0;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.3);border:1px solid rgba(139,92,246,.3)}
.prize-img-wrap.nft img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.prize-name{font-size:14px;font-weight:800;text-align:center;color:#fff;line-height:1.2}
.prize-value{font-size:13px;font-weight:700;color:#FFD700;display:flex;align-items:center;gap:5px}
.prize-value img{width:14px;height:14px}
.prize-empty{font-size:13px;color:var(--text-3);font-weight:700;padding:8px 0}
.prize-close-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(59,130,246,.35)}
.prize-close-btn:active{transform:scale(.97)}

/* NFT attributes in prize modal */
.nft-number-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(139,92,246,.15);
    border:1px solid rgba(139,92,246,.35);
    color:#A78BFA;
    padding:4px 12px;border-radius:10px;
    font-size:12px;font-weight:800;
    letter-spacing:.5px;
    margin-bottom:6px;
}
.nft-price-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(255,215,0,.12);
    border:1px solid rgba(255,215,0,.35);
    color:#FFD700;
    padding:5px 14px;border-radius:10px;
    font-size:14px;font-weight:900;
}
.nft-price-badge img{width:14px;height:14px}

.nft-attrs-table{
    width:100%;
    margin-top:14px;
    background:rgba(0,0,0,.25);
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
    display:flex;flex-direction:column;
    gap:1px;
}
.nft-attr-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;
    background:rgba(255,255,255,.02);
    gap:12px;
}
.nft-attr-label{
    font-size:11px;color:rgba(255,255,255,.5);font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;
    flex-shrink:0;
}
.nft-attr-right{
    display:flex;flex-direction:column;align-items:flex-end;gap:2px;
    min-width:0;flex:1;
}
.nft-attr-value{

}

}

/* ══════════════ LEAD INFO MODAL ══════════════ */
.lead-info-overlay{

    .podium-slot.p2 .podium-avatar,

}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
(async function initLeaderboard() {
    var auth = await telegramAuth();
    if (auth && auth.id) {
        try {
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if (bd.banned) { window.location.href = '/ban'; return; }
        } catch(e) {}
    }
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
        try {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#1C2233');
            tg.setBackgroundColor('#1C2233');
        } catch(e) {}
    }
})();

let endTime = null;
let _currentLeaderboardData = null;
const _nftAttrsCache = {};

function $(id){ return document.getElementById(id); }

function getTonSvg(amount) {
    if (amount <= 25) return '/static/img/tons/ton_1.svg';
    if (amount <= 50) return '/static/img/tons/ton_2.svg';
    if (amount <= 100) return '/static/img/tons/ton_3.svg';
    if (amount <= 250) return '/static/img/tons/ton_4.svg';
    return '/static/img/tons/ton_5.svg';
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
}

function formatTon(stars) {
    return (Number(stars || 0) / 100).toFixed(2);
}

/* ══════════════════════════════════════════════════════════════
   REWARD RENDER HELPERS
   ══════════════════════════════════════════════════════════════ */

/**
 * Нормализует reward объект: определяет тип и возвращает картинку + данные.
 * Поддерживает форматы:
 *  - number (звёзды в копейках)
 *  - {type: 'stars', amount: N}
 *  - {type: 'ton', amount: N}
 *  - {type: 'gift', gift_id/gift_key/gift_image, gift_name}
 *  - {type: 'nft_gift', slug, number, name, image, price_ton}
 *  - {type: 'rocket', item_id}
 *  - {type: 'background', item_id}
 *  - {type: 'vip'}
 */
function normalizeReward(raw) {
    if (raw == null) return null;

    // Legacy: число = звёзды в копейках
    if (typeof raw === 'number') {
        return {
            kind: 'stars',
            amount_stars: raw,
            image: getTonSvg(raw / 100),
            label: formatTon(raw) + ' TON'
        };
    }

    if (typeof raw !== 'object') return null;

    var type = (raw.type || 'stars').toLowerCase();

    // NFT gift (Fragment)
    if (type === 'nft_gift' || (raw.slug && raw.number)) {
        var slug = raw.slug || '';
        var num = raw.number || 0;
        var image = raw.image
            || (slug && num ? 'https://nft.fragment.com/gift/' + slug + '-' + num + '.webp' : '')
            || '/static/img/gift.png';
        return {
            kind: 'nft_gift',
            slug: slug,
            number: num,
            name: raw.name || (slug ? slug + ' #' + num : 'NFT Подарок'),
            base_name: (raw.name || '').replace(/\s*#\d+$/, ''),
            image: image,
            price_ton: Number(raw.price_ton || 0),
            label: raw.name || ('NFT #' + num),
            attrs: raw.attrs || null
        };
    }

    // Обычный gift (id-based)
    if (type === 'gift') {
        var gImage = raw.gift_image || raw.image || '/static/img/gift.png';
        return {
            kind: 'gift',
            gift_id: raw.gift_id || raw.amount || raw.gift_key || '',
            name: raw.gift_name || raw.name || 'Подарок',
            image: gImage,
            value_stars: raw.gift_value || raw.value || 0,
            label: raw.gift_name || raw.name || 'Подарок'
        };
    }

    if (type === 'ton' || type === 'stars') {
        var amtStars = Number(raw.amount || 0);
        if (type === 'ton') amtStars = amtStars * 100;
        return {
            kind: 'stars',
            amount_stars: amtStars,
            image: getTonSvg(amtStars / 100),
            label: formatTon(amtStars) + ' TON'
        };
    }

    if (type === 'rocket') {
        return {
            kind: 'rocket',
            item_id: raw.item_id || raw.amount || '',
            name: raw.name || raw.item_id || 'Ракета',
            image: '/static/gifs/rockets/' + (raw.item_id || raw.amount || 'crash') + '.gif',
            label: raw.name || 'Ракета'
        };
    }

    if (type === 'background') {
        return {
            kind: 'background',
            item_id: raw.item_id || raw.amount || '',
            name: raw.name || raw.item_id || 'Фон',
            image: '/static/img/' + (raw.item_id || raw.amount || 'phone') + '.png',
            label: raw.name || 'Фон'
        };
    }

    if (type === 'vip') {
        return {
            kind: 'vip',
            name: 'Crash VIP',
            image: '/static/img/crown.png',
            label: 'VIP'
        };
    }

    // Fallback
    return {
        kind: 'unknown',
        name: raw.name || 'Награда',
        image: raw.image || '/static/img/gift.png',
        label: raw.name || 'Награда'
    };
}

/* ══════════════════════════════════════════════════════════════
   LOAD LEADERBOARD
   ══════════════════════════════════════════════════════════════ */
async function loadLeaderboard() {
    try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        _currentLeaderboardData = data;

        if (!data.success || !data.active) {
            $('podium').innerHTML = '';
            $('leadersList').innerHTML =
                '<div class="empty">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                        '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2z"/>' +
                    '</svg>' +
                    '<p>Лидерборд пока не активен</p>' +
                '</div>';
            return;
        }

        const config = data.config;
        const users = data.leaderboard || [];
        const rewards = config.rewards || {};

        if (config.period_end) {
            endTime = new Date(config.period_end).getTime();
            updateCountdown();
        }

        if (users.length === 0) {
            $('podium').innerHTML = '';
            $('leadersList').innerHTML =
                '<div class="empty">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                        '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2z"/>' +
                    '</svg>' +
                    '<p>Пока нет участников</p>' +
                '</div>';
            return;
        }

        /* ═══ PODIUM (top 3) — 2, 1, 3 по порядку, 1 в центре ═══ */
        const top3 = users.slice(0, Math.min(3, users.length));
        const podiumEl = $('podium');

        function renderSlot(u, rank, pClass) {
            const rawPrize = u.reward || rewards[String(rank)];
            const prize = normalizeReward(rawPrize);
            const turnover = formatTon(u.turnover);
            const displayName = u.first_name || u.username || 'Игрок';
            const avatar = u.photo_url || '/static/img/avatar-default.png';
            const placeGif = '/static/gifs/place/' + rank + '.gif';

            let prizeHtml = '';
            if (prize) {
                var isNft = prize.kind === 'nft_gift';
                prizeHtml = '<div class="podium-prize">'
                    + '<img src="' + escapeHtml(prize.image) + '" alt="" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'">'
                    + (isNft ? '<div class="nft-badge">NFT</div>' : '')
                    + '</div>';
            }

            return '<div class="podium-slot ' + pClass + '">' +
                '<div class="podium-name" onclick="event.stopPropagation();openProfileCard(' + (u.user_id || 0) + ')">' + escapeHtml(displayName) + '</div>' +
                '<div class="podium-avatar" onclick="event.stopPropagation();openProfileCard(' + (u.user_id || 0) + ')">' +
                    '<img src="' + avatar + '" alt="" onerror="this.src=\'/static/img/avatar-default.png\'">' +
                '</div>' +
                '<div class="podium-medal"><img src="' + placeGif + '" alt="' + rank + '"></div>' +
                '<div class="podium-pedestal" onclick="event.stopPropagation();openPrizeCard(' + rank + ')">' +
                    prizeHtml +
                    '<div class="podium-turnover">' + turnover + ' TON</div>' +
                '</div>' +
            '</div>';
        }

        if (top3.length >= 3) {
            podiumEl.innerHTML =
                renderSlot(top3[1], 2, 'p2') +
                renderSlot(top3[0], 1, 'p1') +
                renderSlot(top3[2], 3, 'p3');
        } else if (top3.length === 2) {
            podiumEl.innerHTML =
                renderSlot(top3[1], 2, 'p2') +
                renderSlot(top3[0], 1, 'p1') +
                '<div class="podium-slot p3 podium-empty"><div class="podium-pedestal"></div></div>';
        } else if (top3.length === 1) {
            podiumEl.innerHTML =
                '<div class="podium-slot p2 podium-empty"><div class="podium-pedestal"></div></div>' +
                renderSlot(top3[0], 1, 'p1') +
                '<div class="podium-slot p3 podium-empty"><div class="podium-pedestal"></div></div>';
        } else {
            podiumEl.innerHTML = '';
        }

        /* ═══ LIST (#4+) ═══ */
        const listStart = Math.min(3, top3.length);
        const rest = users.slice(listStart, 30);
        if (rest.length === 0) {
            $('leadersList').innerHTML = '';
        } else {
            $('leadersList').innerHTML = rest.map((u, i) => {
                const rank = u.position || (listStart + i + 1);
                const rawPrize = u.reward || rewards[String(rank)];
                const prize = normalizeReward(rawPrize);
                const turnover = formatTon(u.turnover);
                const displayName = u.first_name || u.username || 'Игрок';
                const avatar = u.photo_url || '/static/img/avatar-default.png';

                let prizeImg = '';
                if (prize) {
                    var isNft = prize.kind === 'nft_gift';
                    prizeImg = '<div class="leader-prize' + (isNft ? ' has-nft' : '') + '" onclick="event.stopPropagation();openPrizeCard(' + rank + ')">'
                        + '<img src="' + escapeHtml(prize.image) + '" alt="" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'">'
                        + '</div>';
                }

                return '<div class="leader-item">' +
                    '<div class="leader-rank">' + rank + '</div>' +
                    '<div class="leader-avatar" onclick="event.stopPropagation();openProfileCard(' + (u.user_id || 0) + ')">' +
                        '<img src="' + avatar + '" alt="" onerror="this.src=\'/static/img/avatar-default.png\'">' +
                    '</div>' +
                    '<div class="leader-info" onclick="event.stopPropagation();openProfileCard(' + (u.user_id || 0) + ')">' +
                        '<div class="leader-name">' + escapeHtml(displayName) + '</div>' +
                        '<div class="leader-turnover">' + turnover + ' TON</div>' +
                    '</div>' +
                    prizeImg +
                '</div>';
            }).join('');
        }

    } catch (e) {
        console.error('Leaderboard error:', e);
    }
}

/* ══════════════════════════════════════════════════════════════
   TIMER
   ══════════════════════════════════════════════════════════════ */
function updateCountdown() {
    const el = $('countdown-text');
    if (!endTime) { el.textContent = '--:--:--'; return; }
    const now = Date.now();
    const diff = Math.max(0, endTime - now);
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const hh = h.toString().padStart(2,'0');
    const mm = m.toString().padStart(2,'0');
    const ss = s.toString().padStart(2,'0');
    if (d > 0) el.textContent = 'Осталось ' + d + ' дн. ' + hh + ':' + mm + ':' + ss;
    else el.textContent = 'Осталось ' + hh + ':' + mm + ':' + ss;
}

/* ══════════════════════════════════════════════════════════════
   PRIZE CARD (Regular + NFT)
   ══════════════════════════════════════════════════════════════ */
(function(){
    var overlay = document.createElement('div');
    overlay.className = 'prize-overlay';
    overlay.id = 'prizeOverlay';
    overlay.innerHTML = '<div class="prize-card" id="prizeCard"></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) closePrizeCard(); });
})();

function openPrizeCard(rank){
    if(!_currentLeaderboardData || !_currentLeaderboardData.config) return;
    var rewards = _currentLeaderboardData.config.rewards || {};
    var rawPrize = rewards[String(rank)];
    var prize = normalizeReward(rawPrize);
    var card = $('prizeCard');
    if(!card) return;

    var placeClass = rank === 1 ? 'gold' : (rank === 2 ? 'silver' : (rank === 3 ? 'bronze' : 'other'));
    var placeLabel = rank === 1 ? '🥇 1 МЕСТО' : (rank === 2 ? '🥈 2 МЕСТО' : (rank === 3 ? '🥉 3 МЕСТО' : '#' + rank + ' МЕСТО'));
    var medalGif = rank <= 3 ? '/static/gifs/place/' + rank + '.gif' : null;

    var html = '';
    if(medalGif) html += '<div class="prize-medal"><img src="' + medalGif + '" alt=""></div>';
    html += '<div class="prize-place ' + placeClass + '">' + placeLabel + '</div>';
    html += '<div class="prize-subtitle">Награда за это место</div>';

    if(!prize){
        html += '<div class="prize-block ' + placeClass + '"><div class="prize-empty">Награда не назначена</div></div>';
        html += '<button class="prize-close-btn" onclick="closePrizeCard()">Понятно</button>';
        card.innerHTML = html;
        $('prizeOverlay').classList.add('show');
        return;
    }

    if(prize.kind === 'nft_gift'){
        // ─── NFT GIFT ───
        var slug = prize.slug;
        var num = prize.number;
        var name = prize.name || (slug + ' #' + num);
        var image = prize.image;

        html += '<div class="prize-block nft">'
            + '<div class="prize-block-label">NFT ПОДАРОК</div>'
            + '<div class="prize-img-wrap nft">'
            +   '<img id="nftPrizeImg" src="' + escapeHtml(image) + '" alt="" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'">'
            + '</div>'
            + '<div class="nft-number-badge">#' + escapeHtml(String(num)) + '</div>'
            + '<div class="prize-name">' + escapeHtml(name) + '</div>'
            + (prize.price_ton > 0
                ? '<div class="nft-price-badge"><img src="/static/img/ton.png">' + escapeHtml(Number(prize.price_ton).toFixed(2)) + ' TON</div>'
                : '')
            + '</div>';

        // Attrs block (загружается асинхронно)
        html += '<div class="nft-attrs-table" id="nftAttrsTable">'
            + '<div class="nft-attr-row loading" data-attr="model">'
            +   '<span class="nft-attr-label">Model</span>'
            +   '<div class="nft-attr-right"><span class="nft-attr-value" id="nftAttrModelVal">—</span>'
            +   '<span class="nft-attr-rarity empty" id="nftAttrModelRar"></span></div>'
            + '</div>'
            + '<div class="nft-attr-row loading" data-attr="backdrop">'
            +   '<span class="nft-attr-label">Backdrop</span>'
            +   '<div class="nft-attr-right"><span class="nft-attr-value" id="nftAttrBackdropVal">—</span>'
            +   '<span class="nft-attr-rarity empty" id="nftAttrBackdropRar"></span></div>'
            + '</div>'
            + '<div class="nft-attr-row loading" data-attr="symbol">'
            +   '<span class="nft-attr-label">Symbol</span>'
            +   '<div class="nft-attr-right"><span class="nft-attr-value" id="nftAttrSymbolVal">—</span>'
            +   '<span class="nft-attr-rarity empty" id="nftAttrSymbolRar"></span></div>'
            + '</div>'
            + '</div>';

    } else if(prize.kind === 'gift'){
        html += '<div class="prize-block ' + placeClass + '">'
            + '<div class="prize-block-label">ПОДАРОК</div>'
            + '<div class="prize-img-wrap gift"><img src="' + escapeHtml(prize.image) + '" onerror="this.src=\'/static/img/gift.png\'" alt=""></div>'
            + '<div class="prize-name">' + escapeHtml(prize.name) + '</div>'
            + (prize.value_stars > 0
                ? '<div class="prize-value"><img src="/static/img/ton.png" alt="">' + formatTon(prize.value_stars) + ' TON</div>'
                : '')
            + '</div>';

    } else if(prize.kind === 'stars'){
        html += '<div class="prize-block ' + placeClass + '">'
            + '<div class="prize-block-label">НАГРАДА В TON</div>'
            + '<div class="prize-img-wrap"><img src="' + escapeHtml(prize.image) + '" alt=""></div>'
            + '<div class="prize-value"><img src="/static/img/ton.png" alt="">' + formatTon(prize.amount_stars) + ' TON</div>'
            + '</div>';

    } else if(prize.kind === 'rocket' || prize.kind === 'background'){
        html += '<div class="prize-block ' + placeClass + '">'
            + '<div class="prize-block-label">' + (prize.kind === 'rocket' ? 'РАКЕТА' : 'ФОН') + '</div>'
            + '<div class="prize-img-wrap"><img src="' + escapeHtml(prize.image) + '" onerror="this.src=\'/static/img/gift.png\'" alt=""></div>'
            + '<div class="prize-name">' + escapeHtml(prize.name) + '</div>'
            + '</div>';

    } else if(prize.kind === 'vip'){
        html += '<div class="prize-block ' + placeClass + '">'
            + '<div class="prize-block-label">VIP СТАТУС</div>'
            + '<div class="prize-img-wrap"><img src="/static/img/crown.png" onerror="this.src=\'/static/img/gift.png\'" alt=""></div>'
            + '<div class="prize-name">Crash VIP</div>'
            + '</div>';

    } else {
        html += '<div class="prize-block ' + placeClass + '">'
            + '<div class="prize-block-label">НАГРАДА</div>'
            + '<div class="prize-img-wrap"><img src="' + escapeHtml(prize.image) + '" alt=""></div>'
            + '<div class="prize-name">' + escapeHtml(prize.name) + '</div>'
            + '</div>';
    }

    html += '<button class="prize-close-btn" onclick="closePrizeCard()">Понятно</button>';
    card.innerHTML = html;
    $('prizeOverlay').classList.add('show');

    // Для NFT — загружаем атрибуты
    if(prize.kind === 'nft_gift' && prize.slug && prize.number){
        loadNftAttrs(prize.slug, prize.number);
    }
}

async function loadNftAttrs(slug, number){
    var cacheKey = slug + '_' + number;
    if(_nftAttrsCache[cacheKey]){
        applyNftAttrs(_nftAttrsCache[cacheKey]);
        return;
    }
    try{
        var r = await fetch('/api/fragment-gift-details?slug=' + encodeURIComponent(slug) + '&number=' + number);
        var d = await r.json();
        if(d.success && d.attrs){
            _nftAttrsCache[cacheKey] = d.attrs;
            applyNftAttrs(d.attrs);
        } else {
            setNftAttrsFailed();
        }
    }catch(e){
        setNftAttrsFailed();
    }
}

function applyNftAttrs(attrs){
    setNftAttr('model', attrs.model);
    setNftAttr('backdrop', attrs.backdrop);
    setNftAttr('symbol', attrs.symbol);
}

function setNftAttr(key, data){
    var rowMap = { model: 'Model', backdrop: 'Backdrop', symbol: 'Symbol' };
    var capKey = rowMap[key];
    var valEl = $('nftAttr' + capKey + 'Val');
    var rarEl = $('nftAttr' + capKey + 'Rar');
    var rowEl = document.querySelector('.nft-attr-row[data-attr="' + key + '"]');
    if(rowEl) rowEl.classList.remove('loading');
    if(!data || !data.value){
        if(valEl) valEl.textContent = '—';
        if(rarEl){ rarEl.textContent = ''; rarEl.classList.add('empty'); }
        return;
    }
    if(valEl) valEl.textContent = data.value || '—';
    if(rarEl){
        if(data.rarity != null){
            rarEl.textContent = parseFloat(data.rarity).toFixed(1) + '%';
            rarEl.classList.remove('empty');
        } else {
            rarEl.textContent = '';
            rarEl.classList.add('empty');
        }
    }
}

function setNftAttrsFailed(){
    ['model','backdrop','symbol'].forEach(function(k){
        var capKey = k.charAt(0).toUpperCase() + k.slice(1);
        var rowEl = document.querySelector('.nft-attr-row[data-attr="' + k + '"]');
        if(rowEl) rowEl.classList.remove('loading');
        var valEl = $('nftAttr' + capKey + 'Val');
        if(valEl) valEl.textContent = '—';
    });
}

function closePrizeCard(){
    var o = $('prizeOverlay');
    if(o) o.classList.remove('show');
}

function closeProfileCard(){
    var o = $('profileOverlay');
    if(o) o.classList.remove('show');
}

var _pcLoading = false;
function openProfileCard(userId){
    if(!userId || userId <= 0){ return; }
    if(_pcLoading) return;
    _pcLoading = true;
    var o = $('profileOverlay');
    $('pcName').textContent = 'Загрузка…';
    $('pcStatRows').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,.4);font-size:12px">Загрузка данных…</div>';
    $('pcInvGrid').innerHTML = '';
    $('pcInvTitle').style.display = 'none';
    $('pcLevelFill').style.width = '0%';
    $('pcLevelText').textContent = '';
    $('pcLevelNum').textContent = '';
    $('pcLevelPct').textContent = '';
    o.classList.add('show');

    fetch('/api/user-profile/' + userId)
        .then(function(r){ return r.json(); })
        .then(function(d){
            _pcLoading = false;
            if(d.success && d.profile){
                renderProfileFromApi(d.profile);
            } else {
                $('pcName').textContent = 'Пользователь не найден';
                $('pcStatRows').innerHTML = '';
            }
        })
        .catch(function(e){
            _pcLoading = false;
            console.error('profile load', e);
            $('pcName').textContent = 'Ошибка загрузки';
            $('pcStatRows').innerHTML = '';
        });
}

function renderProfileFromApi(p){
    $('pcName').textContent = p.first_name || 'User';

    var pct = Math.min(Math.max(p.level_progress || 0, 0), 100);
    $('pcLevelNum').textContent = 'Ур. ' + (p.level || 1);
    $('pcLevelPct').textContent = Math.round(pct) + '%';
    $('pcLevelFill').style.width = pct + '%';

    var curLvlExp = p.current_level_exp || 0;
    var nxtLvlExp = p.next_level_exp || 0;
    var withinLevel = (p.experience || 0) - curLvlExp;
    var tierSize = nxtLvlExp - curLvlExp;
    var expCur = (Math.max(0, withinLevel) / 100).toFixed(1);
    var expNext = tierSize > 0 ? (tierSize / 100).toFixed(1) : 'MAX';
    $('pcLevelText').textContent = expCur + ' / ' + expNext + ' TON';

    var tonTotal = formatTon(p.total_volume);
    var tonMonth = formatTon(p.monthly_turnover);

    $('pcStatRows').innerHTML =
        '<div class="pc-stat-row">' +
            '<img src="/static/img/ton.png" alt="">' +
            '<span class="pc-stat-row-label">Общий оборот</span>' +
            '<span class="pc-stat-row-val">' + tonTotal + ' TON</span>' +
        '</div>' +
        '<div class="pc-stat-row">' +
            '<img src="/static/img/ton.png" alt="">' +
            '<span class="pc-stat-row-label">Оборот за месяц</span>' +
            '<span class="pc-stat-row-val">' + tonMonth + ' TON</span>' +
        '</div>' +
        '<div class="pc-stat-row">' +
            '<img src="/static/img/cup.png" alt="" style="width:22px;height:22px;object-fit:contain">' +
            '<span class="pc-stat-row-label">Место в рейтинге</span>' +
            '<span class="pc-stat-row-val">#' + (p.rank || '—') + '</span>' +
        '</div>';

    var inv = p.inventory || [];
    if(inv.length){
        $('pcInvTitle').style.display = '';
        var h = '';
        for(var i = 0; i < inv.length; i++){
            var it = inv[i];
            var price = (it.value / 100).toFixed(2);
            var cls = 'profile-inv-item' + (it.is_upgraded ? ' upgraded' : '');
            h += '<div class="' + cls + '">';
            var imgSrc = it.image || '/static/img/gift.png';
            h += '<img class="profile-inv-img" src="' + imgSrc + '" onerror="this.src=\'/static/img/gift.png\'" alt="">';
            if(!it.is_upgraded){
                h += '<div class="profile-inv-name">' + escapeHtml(it.name || '') + '</div>';
                h += '<div class="profile-inv-price">' + price + ' TON</div>';
            }
            h += '</div>';
        }
        $('pcInvGrid').innerHTML = h;
    }
}
