<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C2233">
<title>Rasswet Gifts - Лидерборд</title>
<link rel="icon" type="image/png" href="/static/img/logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<script type="module" src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#1b1f23;
    --surface:rgba(255,255,255,.04);
    --surface-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --text-2:rgba(255,255,255,.55);
    --text-3:rgba(255,255,255,.35);
    --gold:#FFD700;
    --silver:#C0C0C0;
    --bronze:#CD7F32;
    --blue:#3B82F6;
    --purple:#8B5CF6;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{
    height:100%;
    overflow-x:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#1b1f23;
    background-image:radial-gradient(ellipse 100% 55% at 50% 0%, #20272d 0%, #1b1f23 62%);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(59,130,246,.25);border-radius:3px}

/* ══════════════ MAIN ══════════════ */
.main{
    max-width:480px;
    margin:0 auto;
    padding:calc(var(--safe-top) + 46px) 12px calc(var(--safe-bottom) + 112px);
}

/* ══════════════ HELP TIP ══════════════ */
.help-tip{
    display:flex;align-items:center;gap:5px;
    justify-content:center;margin-bottom:8px;
    font-size:11px;color:var(--text-3);
    cursor:pointer;transition:color .2s;
}
.help-tip:active{color:var(--text-2)}
.help-tip svg{width:13px;height:13px;opacity:.5}

/* ══════════════ TIMER ══════════════ */
.season-timer{
    display:flex;align-items:center;gap:6px;justify-content:center;
    font-size:12px;font-weight:700;color:#FFD700;
    margin-bottom:12px;
    background:rgba(255,215,0,.08);
    border:1px solid rgba(255,215,0,.2);
    padding:6px 12px;border-radius:16px;
    width:fit-content;margin-left:auto;margin-right:auto;
}
.season-timer svg{width:13px;height:13px;opacity:.85}

/* ══════════════ PAGE TITLE ══════════════ */
.page-title{
    font-size:20px;font-weight:900;text-align:center;
    margin-bottom:6px;letter-spacing:-.4px;
}
.page-desc{
    text-align:center;color:var(--text-2);font-size:11px;
    line-height:1.4;margin-bottom:18px;
    max-width:320px;margin-left:auto;margin-right:auto;
    padding:0 6px;
}

/* ══════════════ TOP 3 / LEADERS ══════════════ */
.podium{display:none;flex-direction:column;gap:0;margin:0 0 12px;padding:0;position:relative;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.04);border-radius:22px;overflow:hidden}
.podium-slot{min-width:0;display:flex;align-items:center;gap:10px;padding:12px 14px;position:relative;cursor:pointer;background:transparent;transition:background .15s,transform .15s}
.podium-slot + .podium-slot{border-top:1px solid rgba(255,255,255,.07)}
.podium-slot:active{transform:scale(.99);background:rgba(255,255,255,.025)}
.podium-medal{width:22px;height:28px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
.podium-medal img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 3px 7px rgba(0,0,0,.45))}
.podium-slot.p1 .podium-medal img{width:28px;height:28px}
.podium-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.05);position:relative;flex:0 0 44px;border:1px solid rgba(255,255,255,.09)}
.podium-slot.p1 .podium-avatar{width:46px;height:46px;flex-basis:46px;border-color:rgba(59,130,246,.22)}
.podium-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.podium-main{flex:1;min-width:0}
.podium-name{font-size:12px;font-weight:800;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;margin-bottom:4px;line-height:1.2}
.podium-sub{display:flex;align-items:center;gap:8px;min-width:0}
.podium-sub-item{display:flex;align-items:center;gap:3px;min-width:0;color:rgba(255,255,255,.8);font-size:10px;font-weight:700;white-space:nowrap}
.podium-sub-item img{width:12px;height:12px;object-fit:contain;display:block}
.podium-sub-sep{color:rgba(255,255,255,.22);font-size:10px}
.podium-level-dot{width:12px;height:12px;flex:0 0 12px;display:inline-flex;align-items:center;justify-content:center}
.podium-level-dot svg{width:12px;height:12px;display:block}
.podium-prize{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.podium-slot.p1 .podium-prize{width:50px;height:50px;flex-basis:50px}
.podium-prize img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}
.podium-prize.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(255,255,255,.03));animation:pulseLoad 1.2s ease-in-out infinite}
.podium-pedestal,.podium-turnover{display:none}.podium-empty{display:none}
/* ══════════════ SEASON BANNER ══════════════ */
.season-banner{width:100%;height:218px;border-radius:22px;overflow:hidden;background:#087cf7;position:relative;border:1px solid rgba(255,255,255,.05);box-shadow:0 8px 24px rgba(0,0,0,.24);margin:0 0 12px}
.season-banner dotlottie-player{display:block;width:132% !important;height:132% !important;max-width:none !important;max-height:none !important;position:absolute;left:-16%;top:-16%;transform:none;transform-origin:center center}
.season-banner-label{position:absolute;top:12px;right:14px;z-index:3;font-size:12px;font-weight:900;color:#fff;background:rgba(0,0,0,.28);padding:5px 8px;border-radius:9px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap;line-height:1}
.season-wait{height:52px;border-radius:17px;background:#0b83ff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;margin:0 0 16px;padding:0 12px;overflow:hidden;position:relative;letter-spacing:-.1px}
.season-wait::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:8px 8px;opacity:.22}.season-wait span{position:relative;z-index:1}
/* ══════════════ LIST (#4+) ══════════════ */
.leaders-list{display:flex;flex-direction:column;gap:0;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.leader-item{display:flex;align-items:center;gap:9px;padding:11px 12px;background:transparent;border:none;border-radius:0;transition:background .18s,transform .18s;cursor:pointer;min-height:70px}
.leader-item + .leader-item{border-top:1px solid rgba(255,255,255,.065)}
.leader-item:active{transform:scale(.992);background:rgba(255,255,255,.035)}
.leader-rank{width:24px;height:30px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:rgba(255,255,255,.42)}
.leader-rank.medal img{width:25px;height:25px;object-fit:contain;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.45))}
.leader-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.04);flex:0 0 42px;border:1px solid rgba(255,255,255,.09)}
.leader-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.leader-info{flex:1;min-width:0}
.leader-name{font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;line-height:1.15}
.leader-meta{display:flex;align-items:center;gap:7px;min-width:0}
.leader-turnover{display:flex;align-items:center;gap:3px;font-size:10px;color:rgba(255,255,255,.76);font-weight:700;white-space:nowrap}
.leader-turnover img{width:12px;height:12px;object-fit:contain;display:block}
.leader-sep{color:rgba(255,255,255,.2);font-size:10px}
.leader-level{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(255,255,255,.58);font-weight:700;white-space:nowrap}
.leader-level svg{width:12px;height:12px;display:block;flex:0 0 12px}

/* ═══ PRIZE THUMBNAIL — фиксированный квадрат ═══ */
.leader-prize{
    width:44px;height:44px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    border-radius:10px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 6px rgba(0,0,0,.3);
    overflow:hidden;
    transition:transform .15s;
    position:relative;
}
.leader-prize:active{transform:scale(.92)}
.leader-prize img{
    width:100%;height:100%;
    object-fit:cover;display:block;
    border-radius:inherit;
}
.leader-prize.loading::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(99,102,241,.1));
    animation:pulseLoad 1.2s ease-in-out infinite;
}

.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty svg{width:48px;height:48px;margin-bottom:16px;opacity:.3}
.empty p{font-size:13px;font-weight:600}

/* ══════════════ BOTTOM NAV ══════════════ */
.bottom-nav{
    position:fixed;left:16px;right:16px;bottom:calc(12px + var(--safe-bottom));transform:none;
    z-index:4000;width:auto;max-width:430px;height:64px;margin:0 auto;
    padding:4px;
    background:rgba(28,32,36,.97);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.055);
    border-radius:32px;
    box-shadow:0 10px 28px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.025);
    display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-items:stretch;
}
.bnav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:3px 4px;border-radius:28px;
    background:transparent;border:none;color:rgba(255,255,255,.38);
    font-family:inherit;font-weight:700;cursor:pointer;transition:background .2s,color .2s,transform .15s;
    text-decoration:none;position:relative;min-width:0;height:54px;
}
.bnav-item svg{width:21px;height:21px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav-item span{font-size:10px;font-weight:700;line-height:1}
.bnav-item.active{background:rgba(59,146,255,.08);color:#3b92ff;box-shadow:none}
.bnav-item:active{transform:scale(.95)}

.page-transition-cover{position:fixed;inset:0;z-index:10000;background:rgba(9,14,20,.18);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);opacity:0;pointer-events:none;transition:opacity .22s ease;}
.page-transition-cover.show{opacity:1;}
/* ══════════════ MODAL COMMON ══════════════ */
.modal-overlay{
    position:fixed;inset:0;
    z-index:7500;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    opacity:0;visibility:hidden;
    transition:opacity .28s,visibility .28s;
    display:flex;align-items:flex-end;justify-content:center;
}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-overlay.center{align-items:center;padding:16px}

.modal-sheet{
    width:100%;max-width:480px;
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:22px 22px 0 0;
    padding:14px 16px calc(var(--safe-bottom) + 18px);
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.32,1,.23,1);
    position:relative;
    border-top:1px solid rgba(59,130,246,.2);
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}

.modal-center{
    width:100%;max-width:400px;
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:22px;
    padding:18px 16px;
    transform:scale(.9);
    transition:transform .3s cubic-bezier(.32,1.5,.5,1);
    border:1px solid rgba(59,130,246,.25);
    max-height:90vh;
    overflow-y:auto;
    position:relative;
}
.modal-overlay.show .modal-center{transform:scale(1)}

.modal-handle{
    width:36px;height:4px;
    background:rgba(255,255,255,.15);
    border-radius:2px;
    margin:0 auto 12px;
}
.modal-close-x{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;border-radius:10px;
    background:rgba(255,255,255,.06);
    border:none;color:rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;font-weight:700;
    transition:all .15s;
    z-index:10;
}
.modal-close-x:active{transform:scale(.9);background:rgba(255,255,255,.12)}

/* ══════════════ PRIZE MODAL ══════════════ */
.prize-header{
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
}
.prize-medal-sm{
    width:48px;height:48px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
}
.prize-medal-sm img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(255,215,0,.4));animation:medalBounce 2.5s ease-in-out infinite}
.prize-title-block{flex:1;min-width:0}
.prize-place-sm{
    font-size:14px;font-weight:900;letter-spacing:-.2px;
    margin-bottom:2px;
}
.prize-place-sm.gold{color:#FFD700}
.prize-place-sm.silver{color:#C0C0C0}
.prize-place-sm.bronze{color:#CD7F32}
.prize-place-sm.other{color:#7CAEFF}
.prize-sub-sm{
    font-size:11px;color:var(--text-3);font-weight:600;
}

.prize-body{
    display:flex;flex-direction:column;align-items:center;
    gap:10px;
}

/* NFT card */
.prize-card-nft{
    width:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:14px;
    border-radius:18px;
    background:linear-gradient(180deg,rgba(139,92,246,.1),rgba(99,102,241,.04));
    border:1px solid rgba(139,92,246,.3);
    gap:10px;
    position:relative;
}
.prize-nft-img{
    width:160px;height:160px;
    border-radius:18px;
    overflow:hidden;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 6px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
    position:relative;
    flex-shrink:0;
}
.prize-nft-img img{
    width:100%;height:100%;
    object-fit:cover;display:block;
    border-radius:18px;
}
/* Skeleton while loading fragment image */
.prize-nft-img.loading::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(139,92,246,.08),rgba(139,92,246,.2),rgba(139,92,246,.08));
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
}
@keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
}
.prize-nft-img.loading::after{
    content:'';position:absolute;top:50%;left:50%;
    width:32px;height:32px;
    margin:-16px 0 0 -16px;
    border:3px solid rgba(139,92,246,.2);
    border-top-color:#8B5CF6;
    border-radius:50%;
    animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.prize-nft-number{
    display:inline-flex;align-items:center;gap:3px;
    background:rgba(139,92,246,.18);
    border:1px solid rgba(139,92,246,.4);
    color:#C4B5FD;
    padding:3px 10px;border-radius:8px;
    font-size:11px;font-weight:800;
    letter-spacing:.3px;
}
.prize-nft-name{
    font-size:15px;font-weight:800;
    text-align:center;color:#fff;
    line-height:1.25;
    padding:0 4px;
}
.prize-nft-price{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(255,215,0,.12);
    border:1px solid rgba(255,215,0,.35);
    color:#FFD700;
    padding:4px 12px;border-radius:9px;
    font-size:13px;font-weight:900;
}
.prize-nft-price img{width:13px;height:13px}

/* NFT attrs chips */
.nft-attrs-chips{
    width:100%;
    display:flex;flex-direction:column;gap:5px;
    margin-top:2px;
}
.nft-attr-chip-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 11px;
    background:rgba(0,0,0,.22);
    border-radius:10px;
    border:1px solid rgba(255,255,255,.05);
    gap:8px;
    transition:background .15s;
    position:relative;
    overflow:hidden;
}
.nft-attr-chip-row.loading::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(139,92,246,.08),transparent);
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
}
.nft-attr-chip-label{
    font-size:10px;font-weight:800;
    color:rgba(255,255,255,.45);
    text-transform:uppercase;letter-spacing:.5px;
    flex-shrink:0;
    position:relative;z-index:1;
}
.nft-attr-chip-right{
    display:flex;align-items:center;gap:6px;
    min-width:0;flex:1;justify-content:flex-end;
    position:relative;z-index:1;
}
.nft-attr-chip-value{
    font-size:12px;color:#fff;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    max-width:130px;
}
.nft-attr-chip-rar{
    background:rgba(255,215,0,.12);
    border:1px solid rgba(255,215,0,.3);
    color:#FFD700;
    padding:1px 7px;border-radius:6px;
    font-size:10px;font-weight:800;
    flex-shrink:0;
    letter-spacing:.2px;
}
.nft-attr-chip-rar.empty{
    background:rgba(255,255,255,.04);
    border-color:rgba(255,255,255,.08);
    color:rgba(255,255,255,.3);
    display:none;
}

/* Regular gift card */
.prize-card-gift{
    width:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:14px;
    border-radius:18px;
    background:linear-gradient(180deg,rgba(59,130,246,.1),rgba(59,130,246,.03));
    border:1px solid rgba(59,130,246,.25);
    gap:8px;
}
.prize-gift-img{
    width:130px;height:130px;
    border-radius:16px;
    background:rgba(0,0,0,.3);
    padding:8px;
    border:1px solid rgba(255,255,255,.06);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    position:relative;
}
.prize-gift-img.loading::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(59,130,246,.15),transparent);
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
}
.prize-gift-img img{
    max-width:100%;max-height:100%;
    object-fit:contain;display:block;
    position:relative;z-index:1;
}
.prize-gift-name{
    font-size:14px;font-weight:800;
    color:#fff;text-align:center;
    padding:0 4px;line-height:1.25;
}
.prize-gift-price{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(59,130,246,.15);
    border:1px solid rgba(59,130,246,.35);
    color:#93C5FD;
    padding:4px 12px;border-radius:9px;
    font-size:13px;font-weight:900;
}
.prize-gift-price img{width:13px;height:13px}

/* TON prize */
.prize-card-ton{
    width:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 14px;
    border-radius:18px;
    background:linear-gradient(180deg,rgba(255,215,0,.12),rgba(255,180,0,.03));
    border:1px solid rgba(255,215,0,.35);
    gap:10px;
}
.prize-ton-img{
    width:100px;height:100px;
    display:flex;align-items:center;justify-content:center;
}
.prize-ton-img img{
    max-width:100%;max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 4px 14px rgba(255,215,0,.4));
}

<script>
/* ══════════════════════════════════════════════════════════════
   TELEGRAM WEBAPP INIT
   ══════════════════════════════════════════════════════════════ */
(function initTg(){

        tg.expand();
        if(tg.requestFullscreen){

        }

        try{ tg.setBackgroundColor('#1C2233'); }catch(e){}
    }catch(e){ console.warn('tg init', e); }
})();

/* ══════════════════════════════════════════════════════════════
   AUTH + BAN CHECK
   ══════════════════════════════════════════════════════════════ */
(async function initAuth() {
    try{
        var auth = await telegramAuth();
        if (auth && auth.id) {
            try {
                var br = await fetch('/api/check-ban?user_id=' + auth.id);
                var bd = await br.json();
                if (bd.banned) { window.location.href = '/ban'; return; }
            } catch(e) {}
        }
    }catch(e){}
})();

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
let endTime = null;
let _lbData = null;
const _nftAttrsCache = {};

function $(id){ return document.getElementById(id); }
function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
}
function formatGram(stars){
    return (Number(stars || 0) / 100).toFixed(2);
}
function getGramSvg(amount) {
    if (amount <= 25) return '/static/img/tons/ton_1.svg';
    if (amount <= 50) return '/static/img/tons/ton_2.svg';
    if (amount <= 100) return '/static/img/tons/ton_3.svg';
    if (amount <= 250) return '/static/img/tons/ton_4.svg';
    return '/static/img/tons/ton_5.svg';
}

/* ══════════════════════════════════════════════════════════════
   REWARD NORMALIZER
   ══════════════════════════════════════════════════════════════ */
function normalizeReward(raw){
    if(raw == null) return null;
    if(typeof raw === 'number'){
        return {
            kind: 'stars',
            amount_stars: raw,
            image: getGramSvg(raw / 100)
        };
    }
    if(typeof raw !== 'object') return null;

    var type = (raw.type || 'stars').toLowerCase();

    if(type === 'nft_gift' || (raw.slug && raw.number)){
        var slug = raw.slug || '';
        var num = raw.number || 0;
        // ★ Убираем "Fragment" из имени, оставляем "Plush Pepe #1234"
        var baseName = (raw.name || '').replace(/\s*Fragment\s*/gi, '').trim();
        if(!baseName && slug){
            baseName = slug.replace(/_/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
        }
        // Если имя уже содержит #number — не добавляем второй
        var fullName = baseName;
        if(num > 0 && !/#\d+/.test(fullName)){
            fullName = baseName + ' #' + num;
        }
        return {
            kind: 'nft_gift',
            slug: slug,
            number: num,
            name: fullName,
            base_name: baseName,
            image: raw.image || (slug && num ? 'https://nft.fragment.com/gift/' + slug + '-' + num + '.webp' : '/static/img/gift.png'),
            price_ton: Number(raw.price_ton || 0),
            attrs: raw.attrs || null
        };
    }
    if(type === 'gift'){
        return {
            kind: 'gift',
            name: raw.gift_name || raw.name || 'Подарок',
            image: raw.gift_image || raw.image || '/static/img/gift.png',
            value_stars: raw.gift_value || raw.value || 0
        };
    }
    if(type === 'ton' || type === 'stars'){
        var amtStars = Number(raw.amount || 0);
        if(type === 'ton') amtStars = amtStars * 100;
        return {
            kind: 'stars',
            amount_stars: amtStars,
            image: getGramSvg(amtStars / 100)
        };
    }
    if(type === 'vip'){
        return { kind:'vip', name:'Crash VIP', image:'/static/img/crown.png' };
    }
    return {
        kind: 'unknown',
        name: raw.name || 'Награда',
        image: raw.image || '/static/img/gift.png'
    };
}

/* ══════════════════════════════════════════════════════════════
   ★ УЛУЧШЕННАЯ КАРТИНКА ПОДАРКА ★
   - Если NFT (upgraded) — грузим с Fragment через spin, показываем спиннер
   - Все картинки одного размера, object-fit: cover, закругление
   - При ошибке — fallback
   ══════════════════════════════════════════════════════════════ */
function getPrizeImage(reward){
    if(!reward) return '/static/img/gift.png';
    var img = reward.image || '/static/img/gift.png';
    // Если не указано иное и это NFT — пробуем fragment
    if(reward.kind === 'nft_gift' && reward.slug && reward.number && !reward.image){
        img = 'https://nft.fragment.com/gift/' + reward.slug + '-' + reward.number + '.webp';
    }
    return img;
}

/**
 * Рендер картинки подарка в квадратном контейнере
 * @param reward - нормализованный reward
 * @param size - 'sm' | 'md' | 'lg'
 */
function renderPrizeThumb(reward, size){
    if(!reward) return '';
    var imgSrc = getPrizeImage(reward);
    var isNft = reward.kind === 'nft_gift';
    var cls = isNft ? ' loading' : '';
    var id = 'pi_' + Math.random().toString(36).slice(2, 9);
    var html = '<div class="podium-prize' + cls + '" id="' + id + '">'
        + '<img src="' + escapeHtml(imgSrc) + '" alt="" loading="lazy" '
        + 'onload="this.parentElement.classList.remove(\'loading\')" '
        + 'onerror="this.onerror=null;this.src=\'/static/img/gift.png\';this.parentElement.classList.remove(\'loading\')">'
        + '</div>';
    return html;
}

function renderLeaderPrizeThumb(reward){
    if(!reward) return '';
    var imgSrc = getPrizeImage(reward);
    var isNft = reward.kind === 'nft_gift';
    var cls = isNft ? ' loading' : '';
    var html = '<div class="leader-prize' + cls + '" '
        + 'onclick="event.stopPropagation();openPrizeModalForReward(' + encodeURIComponent(JSON.stringify(reward)) + ')">'
        + '<img src="' + escapeHtml(imgSrc) + '" alt="" loading="lazy" '
        + 'onload="this.parentElement.classList.remove(\'loading\')" '
        + 'onerror="this.onerror=null;this.src=\'/static/img/gift.png\';this.parentElement.classList.remove(\'loading\')">'
        + '</div>';
    return html;
}

/* ══════════════════════════════════════════════════════════════
   PODIUM RENDER
   ══════════════════════════════════════════════════════════════ */
function renderPodiumSlot(u, rank, pClass){
    var rewards = (_lbData.config && _lbData.config.rewards) || {};
    var rawPrize = u.reward || rewards[String(rank)];
    var prize = normalizeReward(rawPrize);
    var turnover = formatGram(u.turnover);
    var displayName = u.first_name || u.username || 'Игрок';
    var avatar = u.photo_url || '/static/img/avatar-default.png';
    var placeGif = '/static/gifs/place/' + rank + '.gif';
    var uid = u.user_id || 0;
    var prizeHtml = '';
    if(prize){
        prizeHtml = '<div class="podium-prize' + (prize.kind === 'nft_gift' ? ' loading' : '') + '" onclick="event.stopPropagation();openPrizeModalByRank(' + rank + ')">'
            + '<img src="' + escapeHtml(getPrizeImage(prize)) + '" alt="" loading="lazy" onload="this.parentElement.classList.remove(\'loading\')" onerror="this.onerror=null;this.src=\'/static/img/gift.png\';this.parentElement.classList.remove(\'loading\')">'
            + '</div>';
    }
    return '<div class="podium-slot ' + pClass + '" onclick="openProfileModal(' + uid + ')">'
        + '<div class="podium-medal"><img src="' + placeGif + '" alt="' + rank + '" loading="lazy"></div>'
        + '<div class="podium-avatar"><img src="' + escapeHtml(avatar) + '" alt="" loading="lazy" onerror="this.src=\'/static/img/avatar-default.png\'"></div>'
        + '<div class="podium-main"><div class="podium-name">' + escapeHtml(displayName) + '</div>'
        + '<div class="podium-sub"><span class="podium-sub-item"><img src="/static/img/gram.png" onerror="this.onerror=null;this.src=\'/static/img/ton.png\'">' + turnover + '</span><span class="podium-sub-sep">•</span>'
        + '<span class="podium-sub-item"><span class="podium-level-dot"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6C0 2.68629 2.68629 0 6 0C9.31371 0 12 2.68629 12 6C12 9.31371 9.31371 12 6 12C2.68629 12 0 9.31371 0 6Z" fill="#0B84FF"/><path d="M6 3.6a1.7 1.7 0 1 0 0 3.4a1.7 1.7 0 0 0 0-3.4Zm-3 5.7c.55-1.12 1.58-1.7 3-1.7s2.45.58 3 1.7" fill="none" stroke="#0B2A50" stroke-width=".85" stroke-linecap="round"/></svg></span>' + (u.level || 0) + ' уровень</span></div></div>'
        + prizeHtml + '</div>';
}
function renderPodium(top3){
    var el = $('podium'); if(!el) return;
    el.innerHTML = top3.map(function(u,i){ return renderPodiumSlot(u,i+1,'p'+(i+1)); }).join('');
}

/* ══════════════════════════════════════════════════════════════
   LIST RENDER (#4+)
   Справа от аватарки/ника — квадрат с призом.
   NFT — при клике открывается info.
   ══════════════════════════════════════════════════════════════ */
function renderList(items, startRank){
    var el = $('leadersList');
    if(!el) return;
    if(!items.length){ el.innerHTML = ''; return; }

    var rewards = (_lbData.config && _lbData.config.rewards) || {};
    el.innerHTML = items.map(function(u, i){
        var rank = Number(u.position || (startRank + i));
        var rawPrize = u.reward || rewards[String(rank)];
        var prize = normalizeReward(rawPrize);
        var turnover = formatGram(u.turnover);
        var displayName = u.first_name || u.username || 'Игрок';
        var avatar = u.photo_url || '/static/img/avatar-default.png';
        var uid = u.user_id || 0;
        var rankHtml = rank <= 3
            ? '<div class="leader-rank medal"><img src="/static/gifs/place/' + rank + '.gif" alt="' + rank + '"></div>'
            : '<div class="leader-rank">' + rank + '</div>';
        var prizeHtml = '';
        if(prize){
            var isNft = prize.kind === 'nft_gift';
            var cls = isNft ? ' loading' : '';
            prizeHtml = '<div class="leader-prize' + cls + '" onclick="event.stopPropagation();openPrizeModalByRank(' + rank + ')">'
                + '<img src="' + escapeHtml(getPrizeImage(prize)) + '" alt="" loading="lazy" '
                + 'onload="this.parentElement.classList.remove(\'loading\')" '
                + 'onerror="this.onerror=null;this.src=\'/static/img/gift.png\';this.parentElement.classList.remove(\'loading\')">'
                + '</div>';
        }
        return '<div class="leader-item" onclick="openProfileModal(' + uid + ')">'
            + rankHtml
            + '<div class="leader-avatar"><img src="' + escapeHtml(avatar) + '" alt="" loading="lazy" onerror="this.src=\'/static/img/avatar-default.png\'"></div>'
            + '<div class="leader-info"><div class="leader-name">' + escapeHtml(displayName) + '</div>'
            + '<div class="leader-meta">'
            + '<span class="leader-turnover"><img src="/static/img/gram.png" onerror="this.onerror=null;this.src=\'/static/img/ton.png\'">' + turnover + '</span>'
            + '<span class="leader-sep">•</span>'
            + '<span class="leader-level"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6C0 2.68629 2.68629 0 6 0C9.31371 0 12 2.68629 12 6C12 9.31371 9.31371 12 6 12C2.68629 12 0 9.31371 0 6Z" fill="#0B84FF"/><path d="M6 3.6a1.7 1.7 0 1 0 0 3.4a1.7 1.7 0 0 0 0-3.4Zm-3 5.7c.55-1.12 1.58-1.7 3-1.7s2.45.58 3 1.7" fill="none" stroke="#0B2A50" stroke-width=".85" stroke-linecap="round"/></svg>' + (u.level || 0) + ' уровень</span>'
            + '</div></div>'
            + prizeHtml + '</div>';
    }).join('');
}

/* ══════════════════════════════════════════════════════════════
   LOAD LEADERBOARD
   ══════════════════════════════════════════════════════════════ */
async function loadLeaderboard(){
    try{
        var res = await fetch('/api/leaderboard');
        var data = await res.json();
        _lbData = data;

        if(!data.success || !data.active){
            $('podium').innerHTML = '';
            $('leadersList').innerHTML = '<div class="empty"><p>Лидерборд пока не активен</p></div>';
            return;
        }

        var config = data.config || {};
        var users = data.leaderboard || [];
        var parsedEnd = config.period_end ? new Date(config.period_end).getTime() : NaN;
        endTime = Number.isFinite(parsedEnd) && parsedEnd > 0 ? parsedEnd : null;
        updateCountdown();

        if(users.length === 0){
            $('podium').innerHTML = '';
            $('leadersList').innerHTML = '<div class="empty"><p>Пока нет участников</p></div>';
            return;
        }

        var visibleUsers = users.slice(0, 30);
        $('podium').innerHTML = '';
        renderList(visibleUsers, 1);

    }catch(e){
        console.error('Leaderboard error:', e);
    }
}

/* ══════════════════════════════════════════════════════════════
   TIMER
   ══════════════════════════════════════════════════════════════ */
function updateCountdown(){
    var el = $('countdown-text');
    var banner = document.querySelector('.season-banner-label');
    var wait = $('season-wait-text');
    if(!endTime){
        if(banner) banner.textContent = 'завершено';
        if(wait) wait.textContent = 'Ожидание перезапуска';
        return;
    }
    var diff = endTime - Date.now();
    if(diff <= 0){
        if(el) el.textContent = '00:00:00';
        if(banner) banner.textContent = 'завершено';
        if(wait) wait.textContent = 'Ожидание перезапуска';
        return;
    }
    var d = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var sec = Math.floor((diff % 60000) / 1000);
    var hh = String(h).padStart(2,'0');
    var mm = String(m).padStart(2,'0');
    var ss = String(sec).padStart(2,'0');
    var text = d > 0 ? (d + ' дн. ' + hh + ':' + mm + ':' + ss) : (hh + ':' + mm + ':' + ss);
    if(el) el.textContent = text;
    if(banner) banner.textContent = text;
    if(wait) wait.textContent = 'Сезон активен';
}

/* ══════════════════════════════════════════════════════════════
   PRIZE MODAL
   ══════════════════════════════════════════════════════════════ */
function openPrizeModalByRank(rank){
    if(!_lbData || !_lbData.config) return;
    var rewards = _lbData.config.rewards || {};
    var rawPrize = rewards[String(rank)];
    var row = (_lbData.leaderboard || []).find(function(u){ return Number(u.position) === Number(rank); });
    if(row && row.reward) rawPrize = row.reward;
    openPrizeModal(rawPrize, rank);
}

function openPrizeModal(rawPrize, rank){
    var prize = normalizeReward(rawPrize);
    var cont = $('prizeContent');
    if(!cont) return;

    var html = '';
    if(rank){
        var placeClass = rank === 1 ? 'gold' : (rank === 2 ? 'silver' : (rank === 3 ? 'bronze' : 'other'));
        var placeLabel = rank === 1 ? '🥇 1 МЕСТО' : (rank === 2 ? '🥈 2 МЕСТО' : (rank === 3 ? '🥉 3 МЕСТО' : '#' + rank + ' МЕСТО'));
        var medalGif = rank <= 3 ? '/static/gifs/place/' + rank + '.gif' : null;

        html += '<div class="prize-header">';
        if(medalGif){
            html += '<div class="prize-medal-sm"><img src="' + medalGif + '" alt=""></div>';
        }
        html += '<div class="prize-title-block">'
            + '<div class="prize-place-sm ' + placeClass + '">' + placeLabel + '</div>'
            + '<div class="prize-sub-sm">Награда за место</div>'
            + '</div>'
            + '</div>';
    } else {
        html += '<div class="prize-header" style="justify-content:center">'
            + '<div class="prize-title-block" style="text-align:center">'
            + '<div class="prize-place-sm other">🎁 НАГРАДА</div>'
            + '</div>'
            + '</div>';
    }

    html += '<div class="prize-body">';

    if(!prize){
        html += '<div class="prize-empty">Награда не назначена</div>';
    } else if(prize.kind === 'nft_gift'){
        // ─── NFT GIFT ───
        var nftId = 'nftImg_' + Math.random().toString(36).slice(2, 9);
        html += '<div class="prize-card-nft">'
            + '<div class="prize-nft-img loading" id="' + nftId + '">'
            +   '<img src="' + escapeHtml(getPrizeImage(prize)) + '" alt="" '
            +     'onload="this.parentElement.classList.remove(\'loading\')" '
            +     'onerror="this.onerror=null;this.src=\'/static/img/gift.png\';this.parentElement.classList.remove(\'loading\')">'
            + '</div>'
            + (prize.number > 0 ? '<div class="prize-nft-number">#' + escapeHtml(String(prize.number)) + '</div>' : '')
            + '<div class="prize-nft-name">' + escapeHtml(prize.name) + '</div>'
            + (prize.price_ton > 0
                ? '<div class="prize-nft-price"><img src="/static/img/gram.png" onerror="this.onerror=null;this.src=\'/static/img/ton.png\'">' + Number(prize.price_ton).toFixed(2) + ' GRAM</div>'
                : '')
            + '</div>';

        // NFT attrs chips
        html += '<div class="nft-attrs-chips" id="nftAttrsChips">'
            + '<div class="nft-attr-chip-row loading" data-attr="model">'
            +   '<span class="nft-attr-chip-label">Model</span>'
            +   '<div class="nft-attr-chip-right">'
            +     '<span class="nft-attr-chip-value" id="chipModelVal">—</span>'
            +     '<span class="nft-attr-chip-rar empty" id="chipModelRar"></span>'
            +   '</div>'
            + '</div>'
            + '<div class="nft-attr-chip-row loading" data-attr="backdrop">'
            +   '<span class="nft-attr-chip-label">Backdrop</span>'
            +   '<div class="nft-attr-chip-right">'
            +     '<span class="nft-attr-chip-value" id="chipBackdropVal">—</span>'
            +     '<span class="nft-attr-chip-rar empty" id="chipBackdropRar"></span>'
            +   '</div>'
            + '</div>'
            + '<div class="nft-attr-chip-row loading" data-attr="symbol">'
            +   '<span class="nft-attr-chip-label">Symbol</span>'
            +   '<div class="nft-attr-chip-right">'
            +     '<span class="nft-attr-chip-value" id="chipSymbolVal">—</span>'
            +     '<span class="nft-attr-chip-rar empty" id="chipSymbolRar"></span>'
            +   '</div>'
            + '</div>'
            + '</div>';
    } else if(prize.kind === 'gift'){
        html += '<div class="prize-card-gift">'
            + '<div class="prize-gift-img"><img src="' + escapeHtml(prize.image) + '" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'" alt=""></div>'
            + '<div class="prize-gift-name">' + escapeHtml(prize.name) + '</div>'
            + (prize.value_stars > 0
                ? '<div class="prize-gift-price"><img src="/static/img/gram.png" onerror="this.onerror=null;this.src=\'/static/img/ton.png\'">' + formatGram(prize.value_stars) + ' GRAM</div>'
                : '')
            + '</div>';
    } else if(prize.kind === 'stars'){
        html += '<div class="prize-card-ton">'
            + '<div class="prize-ton-img"><img src="' + escapeHtml(prize.image) + '" alt=""></div>'
            + '<div class="prize-ton-value"><img src="/static/img/gram.png" onerror="this.onerror=null;this.src=\'/static/img/ton.png\'">' + formatGram(prize.amount_stars) + '</div>'
            + '</div>';
    } else {
        html += '<div class="prize-card-gift">'
            + '<div class="prize-gift-img"><img src="' + escapeHtml(prize.image) + '" alt=""></div>'
            + '<div class="prize-gift-name">' + escapeHtml(prize.name) + '</div>'
            + '</div>';
    }

    html += '</div>';
    html += '<button class="prize-close" onclick="closePrizeModal()">Понятно</button>';

    cont.innerHTML = html;
    $('prizeOverlay').classList.add('show');

    // Загрузка NFT атрибутов
    if(prize && prize.kind === 'nft_gift' && prize.slug && prize.number){
        loadNftAttrs(prize.slug, prize.number);
    }
}

function closePrizeModal(){
    var o = $('prizeOverlay');
    if(o) o.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   NFT ATTRS LOADING
   ══════════════════════════════════════════════════════════════ */
async function loadNftAttrs(slug, number){
    var key = slug + '_' + number;
    if(_nftAttrsCache[key]){
        applyNftAttrs(_nftAttrsCache[key]);
        return;
    }
    try{
        var r = await fetch('/api/fragment-gift-details?slug=' + encodeURIComponent(slug) + '&number=' + number);
        var d = await r.json();
        if(d.success && d.attrs){
            _nftAttrsCache[key] = d.attrs;
            applyNftAttrs(d.attrs);
        } else {
            setAttrsFailed();
        }
    }catch(e){
        setAttrsFailed();
    }
}

function applyNftAttrs(attrs){
    setChip('model', attrs.model);
    setChip('backdrop', attrs.backdrop);
    setChip('symbol', attrs.symbol);
}

function setChip(key, data){
    var cap = key.charAt(0).toUpperCase() + key.slice(1);
    var valEl = $('chip' + cap + 'Val');
    var rarEl = $('chip' + cap + 'Rar');
    var rowEl = document.querySelector('.nft-attr-chip-row[data-attr="' + key + '"]');
    if(rowEl) rowEl.classList.remove('loading');

    if(!data || !data.value){
        if(valEl) valEl.textContent = '—';
        if(rarEl){
            rarEl.textContent = '';
            rarEl.classList.add('empty');
        }
        return;
    }
    if(valEl) valEl.textContent = data.value;
    if(rarEl){
        if(data.rarity != null){
            var r = parseFloat(data.rarity);
            if(r > 60.0) r = r / 10;   // защита от ×10
            rarEl.textContent = r.toFixed(1) + '%';
            rarEl.classList.remove('empty');
        } else {
            rarEl.textContent = '';
            rarEl.classList.add('empty');
        }
    }
}

function setAttrsFailed(){
    ['model','backdrop','symbol'].forEach(function(k){
        var cap = k.charAt(0).toUpperCase() + k.slice(1);
        var rowEl = document.querySelector('.nft-attr-chip-row[data-attr="' + k + '"]');
        if(rowEl) rowEl.classList.remove('loading');
        var v = $('chip' + cap + 'Val');
        if(v) v.textContent = '—';
    });
}

/* ══════════════════════════════════════════════════════════════
   PROFILE MODAL
   ══════════════════════════════════════════════════════════════ */
var _pcLoading = false;
function openProfileModal(userId){
    if(!userId || userId <= 0) return;
    if(_pcLoading) return;
    _pcLoading = true;
    var cont = $('profileContent');
    if(!cont) return;

    cont.innerHTML = '<div class="nft-loading-inline">Загрузка</div>';
    $('profileOverlay').classList.add('show');

    fetch('/api/user-profile/' + userId)
        .then(function(r){ return r.json(); })
        .then(function(d){
            _pcLoading = false;
            if(d.success && d.profile){
                renderProfile(d.profile);
            } else {
                cont.innerHTML = '<div class="prize-empty">Пользователь не найден</div>'
                    + '<button class="prize-close" onclick="closeProfileModal()">Закрыть</button>';
            }
        })
        .catch(function(){
            _pcLoading = false;
            cont.innerHTML = '<div class="prize-empty">Ошибка загрузки</div>'
                + '<button class="prize-close" onclick="closeProfileModal()">Закрыть</button>';
        });
}

function renderProfile(p){
    var cont = $('profileContent');
    if(!cont) return;

    var name = p.first_name || 'User';
    var firstLetter = (name[0] || 'U').toUpperCase();
    var avatar = p.photo_url && p.photo_url.indexOf('default_avatar') === -1
        ? '<img src="' + escapeHtml(p.photo_url) + '" onerror="this.parentElement.innerHTML=\'<div class=&quot;fallback&quot;>' + firstLetter + '</div>\'">'
        : '<div class="fallback">' + firstLetter + '</div>';

    var pct = Math.min(Math.max(p.level_progress || 0, 0), 100);
    var curLvlExp = p.current_level_exp || 0;
    var nxtLvlExp = p.next_level_exp || 0;
    var withinLevel = (p.experience || 0) - curLvlExp;
    var tierSize = nxtLvlExp - curLvlExp;
    var expCur = (Math.max(0, withinLevel) / 100).toFixed(1);
    var expNext = tierSize > 0 ? (tierSize / 100).toFixed(1) : 'MAX';

    var html = '<div class="profile-body">'
        + '<div class="profile-avatar-lg">' + avatar + '</div>'
        + '<div class="profile-name-lg">' + escapeHtml(name) + '</div>'
        + '<div class="profile-level">'
        +   '<div class="profile-level-bar"><div class="profile-level-fill" style="width:' + pct + '%"></div></div>'
        +   '<div class="profile-level-text">'
        +     '<span>Ур. ' + (p.level || 1) + ' · ' + Math.round(pct) + '%</span>'
        +     '<span>' + expCur + ' / ' + expNext + ' GRAM</span>'
        +   '</div>'
        + '</div>'
        + '<div class="profile-stats-grid">'
        +   '<div class="profile-stat-mini">'
        +     '<div class="profile-stat-mini-label">Оборот</div>'
        +     '<div class="profile-stat-mini-value"><img src="/static/img/gram.png" onerror="this.onerror=null;this.src=\'/static/img/ton.png\'"><span>' + formatGram(p.total_volume) + '</span></div>'
        +   '</div>'
        +   '<div class="profile-stat-mini">'
        +     '<div class="profile-stat-mini-label">Месяц</div>'
        +     '<div class="profile-stat-mini-value"><img src="/static/img/gram.png" onerror="this.onerror=null;this.src=\'/static/img/ton.png\'"><span>' + formatGram(p.monthly_turnover) + '</span></div>'
        +   '</div>'
        +   '<div class="profile-stat-mini">'
        +     '<div class="profile-stat-mini-label">Кейсы</div>'
        +     '<div class="profile-stat-mini-value"><span>' + (p.cases_opened || 0) + '</span></div>'
        +   '</div>'
        +   '<div class="profile-stat-mini">'
        +     '<div class="profile-stat-mini-label">Рейтинг</div>'
        +     '<div class="profile-stat-mini-value"><span>#' + (p.rank || '—') + '</span></div>'
        +   '</div>'
        + '</div>';

    var inv = p.inventory || [];
    if(inv.length){
        html += '<div class="profile-inv-title">Инвентарь · ' + inv.length + '</div>';
        html += '<div class="profile-inv-grid">';
        inv.slice(0, 12).forEach(function(it){
            var cls = 'profile-inv-item' + (it.is_upgraded ? ' upgraded' : '');
            html += '<div class="' + cls + '">'
                + '<img src="' + escapeHtml(it.image || '/static/img/gift.png') + '" loading="lazy" onerror="this.onerror=null;this.src=\'/static/img/gift.png\'">'
                + '</div>';
        });
        html += '</div>';
    }

    html += '<button class="prize-close" onclick="closeProfileModal()">Закрыть</button>';
    html += '</div>';

    cont.innerHTML = html;
}

function closeProfileModal(){
    var o = $('profileOverlay');
    if(o) o.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   NAVIGATION TRANSITION
   Simple fade between pages; bottom nav stays fixed.
   ══════════════════════════════════════════════════════════════ */
(function initNavTransition(){
    var nav=document.querySelector('.bottom-nav'); if(!nav) return;
    nav.querySelectorAll('.bnav-item').forEach(function(link){
        link.addEventListener('click',function(ev){
            var href=link.getAttribute('href');
            if(!href || href===window.location.pathname || href==='#' || link.dataset.transitioning==='1') return;
            ev.preventDefault();
            link.dataset.transitioning='1';
            var cover=document.getElementById('pageTransitionCover');
            if(cover) cover.classList.add('show');
            document.documentElement.classList.add('nav-leaving');
            setTimeout(function(){ window.location.href=href; },220);
        });
    });
})();;
