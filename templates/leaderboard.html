<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C2233">
<title>Rasswet Gifts - Лидерборд</title>
<link rel="icon" type="image/png" href="/static/img/logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#1C2233;
    --bg-2:#1a2238;
    --surface:rgba(255,255,255,.04);
    --surface-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --text-2:rgba(255,255,255,.55);
    --text-3:rgba(255,255,255,.35);
    --gold:#FFD700;
    --gold-2:#FFA500;
    --gold-glow:rgba(255,215,0,.4);
    --silver:#C0C0C0;
    --silver-2:#8B8B8B;
    --bronze:#CD7F32;
    --bronze-2:#8B5A2B;
    --blue:#3B82F6;
    --blue-2:#2563EB;
    --safe-top:env(safe-area-inset-top,20px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(59,130,246,.25);border-radius:3px}

/* ══════════════ MAIN ══════════════ */
.main{
    max-width:480px;margin:0 auto;
    padding:calc(var(--safe-top) + 58px) 16px calc(var(--safe-bottom) + 96px);
}

/* ══════════════ HELP TIP ══════════════ */
.help-tip{
    display:flex;align-items:center;gap:6px;
    justify-content:center;margin-bottom:10px;
    font-size:12px;color:var(--text-3);
    cursor:pointer;
    transition:color .2s;
}
.help-tip:active{color:var(--text-2)}
.help-tip svg{width:14px;height:14px;opacity:.5}

/* ══════════════ TIMER ══════════════ */
.season-timer{
    display:flex;align-items:center;gap:6px;justify-content:center;
    font-size:13px;font-weight:700;
    color:#FFD700;
    margin-bottom:16px;
    background:rgba(255,215,0,.08);
    border:1px solid rgba(255,215,0,.2);
    padding:8px 14px;border-radius:20px;
    width:fit-content;margin-left:auto;margin-right:auto;
}
.season-timer svg{width:14px;height:14px;opacity:.85}

/* ══════════════ PAGE TITLE ══════════════ */
.page-title{
    font-size:24px;font-weight:900;text-align:center;
    margin-bottom:8px;letter-spacing:-.4px;
}
.page-desc{
    text-align:center;color:var(--text-2);font-size:12px;
    line-height:1.5;margin-bottom:24px;
    max-width:340px;margin-left:auto;margin-right:auto;
}

/* ══════════════ PODIUM ══════════════ */
.podium{
    display:grid;
    grid-template-columns:1fr 1.15fr 1fr;
    align-items:end;
    gap:6px;
    margin-bottom:32px;
    padding:0 4px;
    position:relative;
    min-height:290px;
}

.podium-slot{
    display:flex;flex-direction:column;align-items:center;
    position:relative;
    cursor:pointer;
    transition:transform .15s;
}
.podium-slot:active{transform:scale(.97)}

/* ── Name ── */
.podium-name{
    margin-bottom:6px;
    font-size:11px;font-weight:800;color:#fff;
    max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;
    text-align:center;
    padding:0 4px;
}
.podium-slot.p1 .podium-name{font-size:13px;color:#FFD700}

/* ── Avatar ── */
.podium-avatar{
    border-radius:50%;overflow:hidden;
    background:rgba(255,255,255,.04);
    position:relative;
    flex-shrink:0;
}
.podium-slot.p1 .podium-avatar{
    width:96px;height:96px;
    border:3px solid var(--gold);
    box-shadow:0 0 30px var(--gold-glow),0 0 60px rgba(255,215,0,.15);
}
.podium-slot.p2 .podium-avatar{
    width:72px;height:72px;
    border:3px solid var(--silver);
    box-shadow:0 0 18px rgba(192,192,192,.3);
}
.podium-slot.p3 .podium-avatar{
    width:72px;height:72px;
    border:3px solid var(--bronze);
    box-shadow:0 0 18px rgba(205,127,50,.3);
}
.podium-avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Medal GIF (overlapping avatar bottom) ── */
.podium-medal{
    margin-top:-16px;
    margin-bottom:-8px;
    position:relative;z-index:3;
    pointer-events:none;
}
.podium-medal img{
    width:56px;height:56px;object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.7));
    animation:medalBounce 2.5s ease-in-out infinite;
}
.podium-slot.p1 .podium-medal img{
    width:70px;height:70px;
    filter:drop-shadow(0 6px 20px rgba(255,215,0,.6));
}
@keyframes medalBounce{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-3px) scale(1.03)}
}

/* ── Pedestal (ровный, без искажений) ── */
.podium-pedestal{
    width:100%;
    border-radius:14px 14px 0 0;
    padding:14px 6px 16px;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;
    gap:4px;
    position:relative;
    overflow:hidden;
    margin-top:0;
}
.podium-pedestal::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent 10%,rgba(255,255,255,.4) 50%,transparent 90%);
    z-index:2;
}
.podium-slot.p1 .podium-pedestal{
    height:130px;
    background:linear-gradient(180deg,rgba(255,215,0,.28) 0%,rgba(255,180,0,.15) 40%,rgba(255,160,0,.06) 100%);
    border:1px solid rgba(255,215,0,.35);
    border-bottom:none;
    box-shadow:inset 0 4px 20px rgba(255,215,0,.15),0 -6px 30px rgba(255,215,0,.15);
}
.podium-slot.p2 .podium-pedestal{
    height:95px;
    background:linear-gradient(180deg,rgba(192,192,192,.22) 0%,rgba(160,160,160,.1) 40%,rgba(140,140,140,.03) 100%);
    border:1px solid rgba(192,192,192,.25);
    border-bottom:none;
    box-shadow:inset 0 3px 15px rgba(192,192,192,.1),0 -4px 20px rgba(192,192,192,.1);
}
.podium-slot.p3 .podium-pedestal{
    height:75px;
    background:linear-gradient(180deg,rgba(205,127,50,.22) 0%,rgba(180,110,45,.1) 40%,rgba(160,90,30,.03) 100%);
    border:1px solid rgba(205,127,50,.25);
    border-bottom:none;
    box-shadow:inset 0 3px 12px rgba(205,127,50,.1),0 -4px 18px rgba(205,127,50,.1);
}

/* Prize inside pedestal */
.podium-prize{
    margin-bottom:2px;position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;
}
.podium-prize img{
    width:40px;height:40px;object-fit:contain;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.podium-slot.p1 .podium-prize img{
    width:52px;height:52px;
    filter:drop-shadow(0 4px 14px rgba(255,215,0,.5));
}

/* Turnover */
.podium-turnover{
    font-size:10px;font-weight:800;color:rgba(255,255,255,.75);
    display:flex;align-items:center;gap:3px;
    white-space:nowrap;position:relative;z-index:1;
}
.podium-slot.p1 .podium-turnover{font-size:11px;color:rgba(255,255,255,.9)}
.podium-turnover img{width:10px;height:10px}
.podium-turnover .pm-txt{color:inherit}

/* Golden glow for #1 */
.podium-slot.p1::before{
    content:'';position:absolute;
    top:-20px;left:50%;transform:translateX(-50%);
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,0,.15) 0%,transparent 70%);
    z-index:-1;pointer-events:none;
    animation:goldPulse 3s ease-in-out infinite;
}
@keyframes goldPulse{
    0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.1)}
}

/* Empty slot */
.podium-empty{opacity:.15;pointer-events:none}
.podium-empty .podium-pedestal{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06)}

/* ══════════════ LIST (#4+) ══════════════ */
.leaders-list{display:flex;flex-direction:column;gap:8px}

.leader-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    transition:all .15s;
    cursor:pointer;
}
.leader-item:active{transform:scale(.98);background:var(--surface-2)}

.leader-rank{
    width:28px;flex-shrink:0;
    font-size:14px;font-weight:800;color:var(--text-2);
    text-align:center;
}
.leader-item:nth-child(1) .leader-rank{color:#FFD700}
.leader-item:nth-child(2) .leader-rank{color:#C0C0C0}
.leader-item:nth-child(3) .leader-rank{color:#CD7F32}

.leader-avatar{
    width:44px;height:44px;border-radius:50%;overflow:hidden;
    background:rgba(255,255,255,.04);flex-shrink:0;
    border:2px solid rgba(255,255,255,.1);
}
.leader-avatar img{width:100%;height:100%;object-fit:cover}

.leader-info{flex:1;min-width:0}
.leader-name{
    font-size:14px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;
}
.leader-turnover{
    display:flex;align-items:center;gap:4px;
    font-size:12px;color:var(--text-2);font-weight:600;
}
.leader-turnover img{width:12px;height:12px}

.leader-prize{
    width:40px;height:40px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
}
.leader-prize img{
    width:34px;height:34px;object-fit:contain;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));
}
.leader-prize:active{transform:scale(.9)}

/* Empty State */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty svg{width:48px;height:48px;margin-bottom:16px;opacity:.3}
.empty p{font-size:13px;font-weight:600}

/* ══════════════ BOTTOM NAV (как в краше) ══════════════ */
.bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    z-index:4000;width:100%;max-width:480px;height:76px;
    padding:0 8px calc(var(--safe-bottom) + 6px);
    background:rgba(28,34,51,.92);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-top:1px solid rgba(59,130,246,.08);
    display:flex;align-items:center;justify-content:space-around;
}
.bnav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:6px 14px;border-radius:12px;
    background:transparent;border:none;
    color:rgba(255,255,255,.4);
    font-family:inherit;font-weight:600;cursor:pointer;
    transition:all .3s;text-decoration:none;
    position:relative;min-height:56px;height:56px;margin:auto 0;
}
.bnav-item svg{width:22px;height:22px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav-item span{font-size:10px;font-weight:600;line-height:1}
.bnav-item.active{background:rgba(255,255,255,.08);color:#fff}
.bnav-item:active{transform:scale(.9)}

/* ══════════════ PROFILE MODAL ══════════════ */
.profile-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:7000;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
}
.profile-overlay.show{opacity:1;visibility:visible}
.profile-card{
    width:100%;max-width:480px;
    max-height:75vh;overflow-y:auto;
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px 24px;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.32,1,.23,1);
    position:relative;
    border-top:1px solid rgba(59,130,246,.2);
}
.profile-overlay.show .profile-card{transform:translateY(0)}
.profile-handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:10px auto 16px;flex-shrink:0}
.profile-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;text-align:center}
.pc-level-wrap{width:100%;max-width:280px;margin-top:8px;margin-bottom:20px}
.pc-level-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:rgba(255,255,255,.4);font-weight:600;margin-bottom:4px}
.pc-level-label span:first-child{color:rgba(255,255,255,.55);font-weight:700}
.pc-level-bg{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.pc-level-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3B82F6,#7CAEFF);transition:width .6s ease}
.pc-level-text{font-size:10px;color:rgba(255,255,255,.3);text-align:center;margin-top:3px}
.pc-stat-rows{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pc-stat-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 14px}
.pc-stat-row img{width:22px;height:22px;flex-shrink:0}
.pc-stat-row-label{font-size:12px;color:rgba(255,255,255,.45);font-weight:600}
.pc-stat-row-val{margin-left:auto;font-size:14px;font-weight:800;color:#fff}
.profile-inv-title{font-size:14px;font-weight:700;color:rgba(255,255,255,.5);margin-top:4px;margin-bottom:8px;text-align:left;width:100%}
.profile-inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.profile-inv-item{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;border:1.5px solid transparent}
.profile-inv-item.upgraded{border-color:rgba(255,215,0,.35);background:linear-gradient(180deg,rgba(255,215,0,.06) 0%,rgba(255,140,0,.04) 100%)}
.profile-inv-img{width:72px;height:72px;object-fit:contain;margin-bottom:4px}
.profile-inv-item.upgraded .profile-inv-img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px;margin:0}
.profile-inv-name{font-size:11px;color:rgba(255,255,255,.8);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;line-height:1.2}
.profile-inv-price{font-size:11px;color:#1EE44C;font-weight:700;margin-top:2px}
.profile-close-btn{width:100%;padding:12px;border:none;border-radius:12px;background:rgba(59,130,246,.15);color:#7CAEFF;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;flex-shrink:0;transition:background .2s;border:1px solid rgba(59,130,246,.3)}
.profile-close-btn:active{background:rgba(59,130,246,.25)}

/* ══════════════ PRIZE INFO MODAL ══════════════ */
.prize-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:7500;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
    padding:20px;
}
.prize-overlay.show{opacity:1;visibility:visible}
.prize-card{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px;
    width:100%;max-width:360px;
    padding:24px 20px 20px;
    display:flex;flex-direction:column;align-items:center;
    transform:scale(.9);
    transition:transform .3s cubic-bezier(.32,1,.23,1);
    border:1px solid rgba(59,130,246,.25);
    position:relative;
    overflow:hidden;
}
.prize-overlay.show .prize-card{transform:scale(1)}
.prize-medal{
    width:100px;height:100px;
    margin-bottom:12px;
    filter:drop-shadow(0 6px 20px rgba(255,215,0,.4));
    animation:medalBounce 2.5s ease-in-out infinite;
}
.prize-medal img{width:100%;height:100%;object-fit:contain}
.prize-place{
    font-size:24px;font-weight:900;
    margin-bottom:4px;
    text-align:center;
}
.prize-place.gold{color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.5)}
.prize-place.silver{color:#C0C0C0;text-shadow:0 0 15px rgba(192,192,192,.4)}
.prize-place.bronze{color:#CD7F32;text-shadow:0 0 15px rgba(205,127,50,.4)}
.prize-place.other{color:#7CAEFF}

.prize-subtitle{
    font-size:12px;color:var(--text-2);
    text-align:center;margin-bottom:20px;
    font-weight:600;
}

.prize-block{
    width:100%;padding:18px 16px;
    border-radius:18px;
    background:rgba(59,130,246,.06);
    border:1.5px solid rgba(59,130,246,.2);
    display:flex;flex-direction:column;align-items:center;
    gap:10px;
    margin-bottom:16px;
}
.prize-block.gold{
    background:linear-gradient(180deg,rgba(255,215,0,.1),rgba(255,180,0,.04));
    border-color:rgba(255,215,0,.35);
}
.prize-block.silver{
    background:linear-gradient(180deg,rgba(192,192,192,.08),rgba(160,160,160,.03));
    border-color:rgba(192,192,192,.3);
}
.prize-block.bronze{
    background:linear-gradient(180deg,rgba(205,127,50,.1),rgba(180,110,45,.04));
    border-color:rgba(205,127,50,.3);
}

.prize-block-label{
    font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:1.5px;
    color:var(--text-3);
}

.prize-img-wrap{
    width:96px;height:96px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.2);
    border-radius:20px;
    padding:10px;
    box-sizing:border-box;
}
.prize-img-wrap img{
    max-width:100%;max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.4));
}
.prize-img-wrap.gift{
    background:linear-gradient(180deg,rgba(59,130,246,.1),rgba(59,130,246,.02));
}

.prize-name{
    font-size:14px;font-weight:800;
    text-align:center;
    color:#fff;
    line-height:1.2;
}
.prize-value{
    font-size:13px;font-weight:700;
    color:#FFD700;
    display:flex;align-items:center;gap:5px;
}
.prize-value img{width:14px;height:14px}

.prize-empty{
    font-size:13px;color:var(--text-3);
    font-weight:700;
    padding:8px 0;
}

.prize-close-btn{
    width:100%;padding:14px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    color:#fff;font-size:14px;font-weight:800;
    cursor:pointer;transition:transform .15s;
    box-shadow:0 6px 18px rgba(59,130,246,.35);
}
.prize-close-btn:active{transform:scale(.97)}

/* ══════════════ LEAD INFO MODAL ══════════════ */
.lead-info-overlay{
    position:fixed;inset:0;z-index:8000;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
    padding:20px;
}
.lead-info-overlay.show{opacity:1;visibility:visible}
.lead-info-card{
    width:100%;max-width:400px;
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:20px;padding:24px 20px 20px;
    overflow:hidden;
    transform:scale(.9);transition:transform .3s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;align-items:center;gap:16px;
    border:1px solid rgba(59,130,246,.2);
}
.lead-info-overlay.show .lead-info-card{transform:scale(1)}
.lead-info-medals{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 0}
.lead-info-medal{width:64px;height:64px}
.lead-info-medal img{width:100%;height:100%;object-fit:contain}
.lead-info-title{font-size:20px;font-weight:800;text-align:center;color:#fff}
.lead-info-desc{font-size:13px;line-height:1.5;text-align:center;color:rgba(255,255,255,.55);padding:0 8px}
.lead-info-start{
    width:100%;padding:14px;
    border:none;border-radius:14px;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    color:#fff;font-size:15px;font-weight:800;cursor:pointer;
    transition:transform .15s;
    box-shadow:0 6px 18px rgba(59,130,246,.35);
    margin-top:4px;
}
.lead-info-start:active{transform:scale(.97)}

@media(max-width:380px){
    .podium{min-height:270px;gap:4px}
    .podium-slot.p1 .podium-avatar{width:84px;height:84px}
    .podium-slot.p2 .podium-avatar,
    .podium-slot.p3 .podium-avatar{width:64px;height:64px}
    .podium-medal img{width:48px;height:48px}
    .podium-slot.p1 .podium-medal img{width:60px;height:60px}
}
</style>
</head>
<body>

<main class="main">
    <div class="help-tip" onclick="openLeadInfo()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
        </svg>
        Как попасть в лидерборд?
    </div>

    <div class="season-timer" id="countdown">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span id="countdown-text">--:--:--</span>
    </div>

    <div class="page-title">🏆 Лидерборд игр</div>
    <div class="page-desc">Играйте в Краш, крутите кейсы и делайте Апгрейды. Топ-15 по сумме ставок за период получают призы в TON и подарки</div>

    <div class="podium" id="podium"></div>
    <div class="leaders-list" id="leadersList">
        <div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2z"/>
            </svg>
            <p>Загрузка лидерборда…</p>
        </div>
    </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a class="bnav-item" href="/games">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
        <span>Игры</span>
    </a>
    <a class="bnav-item" href="/upgrade">
        <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        <span>Апгрейды</span>
    </a>
    <a class="bnav-item active" href="/leaderboard">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
        <span>Топ</span>
    </a>
    <a class="bnav-item" href="/inventory">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Инвентарь</span>
    </a>
</nav>

<script>
/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
(async function initLeaderboard() {
    var auth = await telegramAuth();
    if (auth && auth.id) {
        try {
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if (bd.banned) { window.location.href = '/ban'; return; }
        } catch(e) {}
    }
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
        try {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#1C2233');
            tg.setBackgroundColor('#1C2233');
        } catch(e) {}
    }
})();

let endTime = null;
let _currentLeaderboardData = null;

function $(id){ return document.getElementById(id); }

function getTonSvg(amount) {
    if (amount <= 25) return '/static/img/tons/ton_1.svg';
    if (amount <= 50) return '/static/img/tons/ton_2.svg';
    if (amount <= 100) return '/static/img/tons/ton_3.svg';
    if (amount <= 250) return '/static/img/tons/ton_4.svg';
    return '/static/img/tons/ton_5.svg';
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function formatTon(stars) {
    return (Number(stars || 0) / 100).toFixed(2);
}

/* ══════════════════════════════════════════════════════════════
   LOAD LEADERBOARD
   ══════════════════════════════════════════════════════════════ */
async function loadLeaderboard() {
    try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        _currentLeaderboardData = data;

        if (!data.success || !data.active) {
            $('podium').innerHTML = '';
            $('leadersList').innerHTML = `
                <div class="empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2z"/>
                    </svg>
                    <p>Лидерборд пока не активен</p>
                </div>`;
            return;
        }

        const config = data.config;
        const users = data.leaderboard || [];
        const rewards = config.rewards || {};

        if (config.period_end) {
            endTime = new Date(config.period_end).getTime();
            updateCountdown();
        }

        if (users.length === 0) {
            $('podium').innerHTML = '';
            $('leadersList').innerHTML = `
                <div class="empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2z"/>
                    </svg>
                    <p>Пока нет участников</p>
                </div>`;
            return;
        }

        /* ═══ PODIUM (top 3) ═══ */
        const top3 = users.slice(0, Math.min(3, users.length));
        const podiumEl = $('podium');

        function renderSlot(u, rank, pClass) {
            const prize = u.reward || rewards[String(rank)];
            const turnover = formatTon(u.turnover);
            const displayName = u.first_name || u.username || 'Игрок';
            const avatar = u.photo_url || '/static/img/avatar-default.png';
            const placeGif = '/static/gifs/place/' + rank + '.gif';
            let prizeHtml = '';
            if (prize) {
                if (prize.type === 'gift' && prize.gift_image) {
                    prizeHtml = '<div class="podium-prize"><img src="' + prize.gift_image + '" alt=""></div>';
                } else {
                    const tonAmt = typeof prize === 'number' ? prize : ((prize.amount || 0) / 100);
                    prizeHtml = '<div class="podium-prize"><img src="' + getTonSvg(tonAmt) + '" alt=""></div>';
                }
            }
            return '<div class="podium-slot ' + pClass + '" data-rank="' + rank + '">'
                + '<div class="podium-name" onclick="event.stopPropagation(); openProfileCard(' + (u.user_id || 0) + ')">' + escapeHtml(displayName) + '</div>'
                + '<div class="podium-avatar" onclick="event.stopPropagation(); openProfileCard(' + (u.user_id || 0) + ')">'
                + '<img src="' + avatar + '" alt="" onerror="this.src=\'/static/img/avatar-default.png\'"></div>'
                + '<div class="podium-medal"><img src="' + placeGif + '" alt="' + rank + '"></div>'
                + '<div class="podium-pedestal" onclick="event.stopPropagation(); openPrizeCard(' + rank + ')">'
                + prizeHtml
                + '<div class="podium-turnover"><span class="pm-txt">' + turnover + ' TON</span></div>'
                + '</div></div>';
        }

        if (top3.length >= 3) {
            podiumEl.innerHTML =
                renderSlot(top3[1], 2, 'p2') +
                renderSlot(top3[0], 1, 'p1') +
                renderSlot(top3[2], 3, 'p3');
        } else if (top3.length === 2) {
            podiumEl.innerHTML =
                renderSlot(top3[1], 2, 'p2') +
                renderSlot(top3[0], 1, 'p1') +
                '<div class="podium-slot p3 podium-empty"><div class="podium-pedestal"></div></div>';
        } else if (top3.length === 1) {
            podiumEl.innerHTML =
                '<div class="podium-slot p2 podium-empty"><div class="podium-pedestal"></div></div>' +
                renderSlot(top3[0], 1, 'p1') +
                '<div class="podium-slot p3 podium-empty"><div class="podium-pedestal"></div></div>';
        } else {
            podiumEl.innerHTML = '';
        }

        /* ═══ LIST (#4+) ═══ */
        const listStart = Math.min(3, top3.length);
        const rest = users.slice(listStart, 20);
        if (rest.length === 0) {
            $('leadersList').innerHTML = '';
        } else {
            $('leadersList').innerHTML = rest.map((u, i) => {
                const rank = u.position || (listStart + i + 1);
                const prize = u.reward || rewards[String(rank)];
                const turnover = formatTon(u.turnover);
                const displayName = u.first_name || u.username || 'Игрок';
                const avatar = u.photo_url || '/static/img/avatar-default.png';

                let prizeImg = '';
                if (prize) {
                    if (prize.type === 'gift' && prize.gift_image) {
                        prizeImg = '<img src="' + prize.gift_image + '" alt="' + escapeHtml(prize.gift_name || '') + '">';
                    } else {
                        const tonAmount = typeof prize === 'number' ? prize : ((prize.amount || 0) / 100);
                        prizeImg = '<img src="' + getTonSvg(tonAmount) + '" alt="' + tonAmount + ' TON">';
                    }
                }

                return '<div class="leader-item">'
                    + '<div class="leader-rank">' + rank + '</div>'
                    + '<div class="leader-avatar" onclick="event.stopPropagation(); openProfileCard(' + (u.user_id || 0) + ')">'
                    + '<img src="' + avatar + '" alt="" onerror="this.src=\'/static/img/avatar-default.png\'"></div>'
                    + '<div class="leader-info" onclick="event.stopPropagation(); openProfileCard(' + (u.user_id || 0) + ')">'
                    + '<div class="leader-name">' + escapeHtml(displayName) + '</div>'
                    + '<div class="leader-turnover">' + turnover + ' TON</div>'
                    + '</div>'
                    + (prizeImg ? '<div class="leader-prize" onclick="event.stopPropagation(); openPrizeCard(' + rank + ')">' + prizeImg + '</div>' : '')
                    + '</div>';
            }).join('');
        }

    } catch (e) {
        console.error('Leaderboard error:', e);
    }
}

/* ══════════════════════════════════════════════════════════════
   TIMER
   ══════════════════════════════════════════════════════════════ */
function updateCountdown() {
    const el = $('countdown-text');
    if (!endTime) { el.textContent = '--:--:--'; return; }
    const now = Date.now();
    const diff = Math.max(0, endTime - now);
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const hh = h.toString().padStart(2,'0');
    const mm = m.toString().padStart(2,'0');
    const ss = s.toString().padStart(2,'0');
    if (d > 0) {
        el.textContent = 'Осталось ' + d + ' дн. ' + hh + ':' + mm + ':' + ss;
    } else {
        el.textContent = 'Осталось ' + hh + ':' + mm + ':' + ss;
    }
}

/* ══════════════════════════════════════════════════════════════
   PRIZE CARD — при клике на место в пьедестале или на приз в списке
   ══════════════════════════════════════════════════════════════ */
(function(){
    var overlay = document.createElement('div');
    overlay.className = 'prize-overlay';
    overlay.id = 'prizeOverlay';
    overlay.innerHTML = '<div class="prize-card" id="prizeCard"></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) closePrizeCard(); });
})();

function openPrizeCard(rank){
    if(!_currentLeaderboardData || !_currentLeaderboardData.config) return;
    var rewards = _currentLeaderboardData.config.rewards || {};
    var prize = rewards[String(rank)];
    var card = $('prizeCard');
    if(!card) return;

    var placeClass = rank === 1 ? 'gold' : (rank === 2 ? 'silver' : (rank === 3 ? 'bronze' : 'other'));
    var placeLabel = rank === 1 ? '🥇 1 МЕСТО' : (rank === 2 ? '🥈 2 МЕСТО' : (rank === 3 ? '🥉 3 МЕСТО' : '#' + rank + ' МЕСТО'));
    var medalGif = rank <= 3 ? '/static/gifs/place/' + rank + '.gif' : null;

    var html = '';
    if(medalGif){
        html += '<div class="prize-medal"><img src="' + medalGif + '" alt=""></div>';
    }
    html += '<div class="prize-place ' + placeClass + '">' + placeLabel + '</div>';
    html += '<div class="prize-subtitle">Награда за это место</div>';

    if(prize){
        if(prize.type === 'gift' && prize.gift_image){
            html += '<div class="prize-block ' + placeClass + '">'
                + '<div class="prize-block-label">ПОДАРОК</div>'
                + '<div class="prize-img-wrap gift"><img src="' + prize.gift_image + '" onerror="this.src=\'/static/img/gift.png\'" alt=""></div>'
                + '<div class="prize-name">' + escapeHtml(prize.gift_name || 'Подарок') + '</div>'
                + '</div>';
        } else {
            var tonAmt = typeof prize === 'number' ? (prize / 100) : ((prize.amount || 0) / 100);
            html += '<div class="prize-block ' + placeClass + '">'
                + '<div class="prize-block-label">НАГРАДА В TON</div>'
                + '<div class="prize-img-wrap"><img src="' + getTonSvg(tonAmt) + '" alt=""></div>'
                + '<div class="prize-value"><img src="/static/img/ton.png" alt="">' + tonAmt.toFixed(2) + ' TON</div>'
                + '</div>';
        }
    } else {
        html += '<div class="prize-block ' + placeClass + '">'
            + '<div class="prize-empty">Награда не назначена</div>'
            + '</div>';
    }

    html += '<button class="prize-close-btn" onclick="closePrizeCard()">Понятно</button>';
    card.innerHTML = html;

    $('prizeOverlay').classList.add('show');
}

function closePrizeCard(){
    var o = $('prizeOverlay');
    if(o) o.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   PROFILE CARD — при клике на человека
   ══════════════════════════════════════════════════════════════ */
(function(){
    var overlay = document.createElement('div');
    overlay.className = 'profile-overlay';
    overlay.id = 'profileOverlay';
    overlay.innerHTML =
        '<div class="profile-card">' +
            '<div class="profile-handle"></div>' +
            '<div class="profile-name" id="pcName">—</div>' +
            '<div class="pc-level-wrap">' +
                '<div class="pc-level-label"><span id="pcLevelNum">Ур. 1</span><span id="pcLevelPct">0%</span></div>' +
                '<div class="pc-level-bg"><div class="pc-level-fill" id="pcLevelFill" style="width:0%"></div></div>' +
                '<div class="pc-level-text" id="pcLevelText">0 / 100 TON</div>' +
            '</div>' +
            '<div class="pc-stat-rows" id="pcStatRows"></div>' +
            '<div class="profile-inv-title" id="pcInvTitle" style="display:none">Инвентарь</div>' +
            '<div class="profile-inv-grid" id="pcInvGrid"></div>' +
            '<button class="profile-close-btn" onclick="closeProfileCard()">Закрыть</button>' +
        '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) closeProfileCard(); });
})();

function closeProfileCard(){
    var o = $('profileOverlay');
    if(o) o.classList.remove('show');
}

var _pcLoading = false;
function openProfileCard(userId){
    if(!userId || userId <= 0 || _pcLoading) return;
    _pcLoading = true;
    var o = $('profileOverlay');
    $('pcName').textContent = 'Загрузка…';
    $('pcStatRows').innerHTML = '';
    $('pcInvGrid').innerHTML = '';
    $('pcInvTitle').style.display = 'none';
    $('pcLevelFill').style.width = '0%';
    $('pcLevelText').textContent = '';
    $('pcLevelNum').textContent = '';
    $('pcLevelPct').textContent = '';
    o.classList.add('show');

    fetch('/api/user-profile/' + userId)
        .then(function(r){ return r.json(); })
        .then(function(d){
            _pcLoading = false;
            if(!d.success || !d.profile){
                $('pcName').textContent = 'Не найден';
                return;
            }
            var p = d.profile;
            $('pcName').textContent = p.first_name || 'User';

            var pct = Math.min(Math.max(p.level_progress || 0, 0), 100);
            $('pcLevelNum').textContent = 'Ур. ' + p.level;
            $('pcLevelPct').textContent = Math.round(pct) + '%';
            $('pcLevelFill').style.width = pct + '%';
            var curLvlExp = p.current_level_exp || 0;
            var nxtLvlExp = p.next_level_exp || 0;
            var withinLevel = (p.experience || 0) - curLvlExp;
            var tierSize = nxtLvlExp - curLvlExp;
            var expCur = (Math.max(0, withinLevel) / 100).toFixed(1);
            var expNext = tierSize > 0 ? (tierSize / 100).toFixed(1) : 'MAX';
            $('pcLevelText').textContent = expCur + ' / ' + expNext + ' TON';

            var tonTotal = (p.total_volume / 100).toFixed(2);
            var tonMonth = (p.monthly_turnover / 100).toFixed(2);

            $('pcStatRows').innerHTML =
                '<div class="pc-stat-row">' +
                    '<img src="/static/img/ton.png" alt="">' +
                    '<span class="pc-stat-row-label">Общий оборот</span>' +
                    '<span class="pc-stat-row-val">' + tonTotal + ' TON</span>' +
                '</div>' +
                '<div class="pc-stat-row">' +
                    '<img src="/static/img/ton.png" alt="">' +
                    '<span class="pc-stat-row-label">Оборот за месяц</span>' +
                    '<span class="pc-stat-row-val">' + tonMonth + ' TON</span>' +
                '</div>' +
                '<div class="pc-stat-row">' +
                    '<img src="/static/img/cup.png" alt="" style="width:22px;height:22px;object-fit:contain">' +
                    '<span class="pc-stat-row-label">Место в рейтинге</span>' +
                    '<span class="pc-stat-row-val">#' + (p.rank || '—') + '</span>' +
                '</div>';

            var inv = p.inventory || [];
            if(inv.length){
                $('pcInvTitle').style.display = '';
                var h = '';
                for(var i = 0; i < inv.length; i++){
                    var it = inv[i];
                    var price = (it.value / 100).toFixed(2);
                    var cls = 'profile-inv-item' + (it.is_upgraded ? ' upgraded' : '');
                    h += '<div class="' + cls + '">';
                    var imgSrc = it.image || '/static/img/gift.png';
                    h += '<img class="profile-inv-img" src="' + imgSrc + '" onerror="this.src=\'/static/img/gift.png\'" alt="">';
                    if(!it.is_upgraded){
                        h += '<div class="profile-inv-name">' + escapeHtml(it.name || '') + '</div>';
                        h += '<div class="profile-inv-price">' + price + ' TON</div>';
                    }
                    h += '</div>';
                }
                $('pcInvGrid').innerHTML = h;
            }
        })
        .catch(function(){ _pcLoading = false; $('pcName').textContent = 'Ошибка'; });
}

/* ══════════════════════════════════════════════════════════════
   LEAD INFO MODAL
   ══════════════════════════════════════════════════════════════ */
(function(){
    var ov = document.createElement('div');
    ov.className = 'lead-info-overlay';
    ov.id = 'leadInfoOverlay';
    ov.innerHTML =
        '<div class="lead-info-card">' +
            '<div class="lead-info-medals">' +
                '<div class="lead-info-medal"><img src="/static/gifs/place/2.gif" alt="2"></div>' +
                '<div class="lead-info-medal"><img src="/static/gifs/place/1.gif" alt="1"></div>' +
                '<div class="lead-info-medal"><img src="/static/gifs/place/3.gif" alt="3"></div>' +
            '</div>' +
            '<div class="lead-info-title">Как попасть в лидеры?</div>' +
            '<div class="lead-info-desc">Играйте в Краш, открывайте Кейсы и делайте Апгрейды. Чем больше сумма ставок за период — тем выше вы в рейтинге. Топ-15 игроков получают призы в TON и подарки!</div>' +
            '<button class="lead-info-start" onclick="closeLeadInfo();location.href=\'/crash\'">Начать</button>' +
        '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) closeLeadInfo(); });
})();

function openLeadInfo(){ $('leadInfoOverlay').classList.add('show'); }
function closeLeadInfo(){ $('leadInfoOverlay').classList.remove('show'); }

/* ══════════════════════════════════════════════════════════════
   START
   ══════════════════════════════════════════════════════════════ */
loadLeaderboard();
setInterval(updateCountdown, 1000);
setInterval(loadLeaderboard, 30000);
</script>
</body>
</html>
