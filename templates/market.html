<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Маркет — Rasswet</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
    background:#0a0a0f;
    background-image:radial-gradient(ellipse 100% 50% at 50% 0%, #1a1a2e 0%, transparent 60%);
    color:#fff;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════ TOP BAR ══════════════ */
.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 10px;
    max-width:480px;
    margin:0 auto;
}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.top-avatar{
    width:36px;height:36px;border-radius:50%;object-fit:cover;
    border:2px solid rgba(255,255,255,.1);flex-shrink:0;
}
.top-nick{
    font-size:14px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;
}
.top-right{display:flex;align-items:center;gap:8px}
.top-balance{
    display:flex;align-items:center;gap:4px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:6px 10px;
    font-size:13px;font-weight:700;
}
.top-balance img{width:16px;height:16px}

/* ══════════════ CONTAINER ══════════════ */
.container{
    max-width:480px;
    margin:0 auto;
    padding:0 14px calc(env(safe-area-inset-bottom,0px) + 100px);
}

/* ══════════════ HEADER ══════════════ */
.page-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;padding:0 2px;
}
.page-title{font-size:22px;font-weight:800;color:#fff}

/* ══════════════ SEARCH & SORT ══════════════ */
.controls{
    display:flex;gap:8px;margin-bottom:14px;
}
.search-wrap{
    flex:1;position:relative;
}
.search-input{
    width:100%;
    padding:12px 16px 12px 42px;
    border-radius:14px;
    border:1.5px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:#fff;
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:all .2s;
}
.search-input:focus{
    border-color:rgba(139,92,246,.5);
    background:rgba(139,92,246,.06);
}
.search-input::placeholder{color:rgba(255,255,255,.3)}
.search-icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;
    stroke:rgba(255,255,255,.4);fill:none;stroke-width:2;
    pointer-events:none;
}
.sort-btn{
    width:46px;height:46px;border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1.5px solid rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;flex-shrink:0;
}
.sort-btn:active{transform:scale(.95)}
.sort-btn svg{width:18px;height:18px;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2}

/* ══════════════ GRID ══════════════ */
.gifts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.gift-card{
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border:1.5px solid rgba(255,255,255,.06);
    border-radius:18px;
    padding:10px;
    cursor:pointer;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    overflow:hidden;
}
.gift-card:active{transform:scale(.97)}
.gift-card:hover{
    border-color:rgba(139,92,246,.3);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
}

/* Wrap для картинки */
.gift-img-wrap{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    background:radial-gradient(circle at 50% 30%, rgba(139,92,246,.1), rgba(0,0,0,.3));
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
    position:relative;
}
.gift-img-wrap img{
    width:90%;
    height:90%;
    object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
}

/* Редкость */
.gift-rarity{
    position:absolute;
    top:6px;
    left:6px;
    padding:3px 8px;
    border-radius:8px;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    z-index:2;
}
.gift-rarity.common{background:rgba(148,163,184,.2);color:#94a3b8}
.gift-rarity.rare{background:rgba(59,130,246,.2);color:#60a5fa}
.gift-rarity.epic{background:rgba(168,85,247,.2);color:#c084fc}
.gift-rarity.legendary{background:rgba(245,158,11,.2);color:#fbbf24}

/* Инфо */
.gift-name{
    font-size:12px;
    font-weight:700;
    color:rgba(255,255,255,.9);
    text-align:center;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.2;
    margin-bottom:6px;
}

.gift-price{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:5px 12px;
    background:rgba(139,92,246,.12);
    border:1px solid rgba(139,92,246,.25);
    border-radius:10px;
    font-size:12px;
    font-weight:800;
    color:#c084fc;
    line-height:1;
}
.gift-price img{width:12px;height:12px}

/* Бейдж +10% */
.gift-markup{
    position:absolute;
    top:6px;
    right:6px;
    padding:3px 7px;
    background:rgba(239,68,68,.15);
    border:1px solid rgba(239,68,68,.3);
    border-radius:8px;
    font-size:9px;
    font-weight:800;
    color:#f87171;
    z-index:2;
}

/* ══════════════ EMPTY / LOADING ══════════════ */
.empty-msg{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:rgba(255,255,255,.3);
    font-size:14px;
    font-weight:600;
}
.loading{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:rgba(255,255,255,.4);
    font-size:14px;
    font-weight:600;
}
.loading::after{
    content:'';
    display:inline-block;
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,.1);
    border-top-color:rgba(139,92,246,.8);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-left:10px;
    vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════ BUY MODAL ══════════════ */
.buy-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:9000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s, visibility .25s;
}
.buy-overlay.show{opacity:1;visibility:visible}

.buy-modal{
    background:#0f0f15;
    border-radius:24px;
    padding:24px 20px;
    max-width:380px;
    width:100%;
    border:1px solid rgba(255,255,255,.08);
    transform:scale(.9);
    transition:transform .3s cubic-bezier(.175,.885,.32,1.275);
    text-align:center;
}
.buy-overlay.show .buy-modal{transform:scale(1)}

.buy-img-wrap{
    width:180px;
    height:180px;
    border-radius:24px;
    background:radial-gradient(circle at 50% 30%, rgba(139,92,246,.15), rgba(0,0,0,.4));
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    position:relative;
    overflow:hidden;
}
.buy-img-wrap img{
    width:85%;
    height:85%;
    object-fit:contain;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));
    animation:buyImgFloat 3s ease-in-out infinite;
}
@keyframes buyImgFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
}

.buy-name{
    font-size:18px;
    font-weight:800;
    color:#fff;
    margin-bottom:4px;
}
.buy-sub{
    font-size:12px;
    color:rgba(255,255,255,.4);
    margin-bottom:16px;
}

.buy-price-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 18px;
    background:linear-gradient(135deg, rgba(139,92,246,.15), rgba(139,92,246,.05));
    border:1.5px solid rgba(139,92,246,.3);
    border-radius:14px;
    font-size:22px;
    font-weight:900;
    color:#c084fc;
    margin-bottom:8px;
}
.buy-price-display img{width:22px;height:22px}

.buy-markup-note{
    font-size:11px;
    color:rgba(239,68,68,.7);
    font-weight:600;
    margin-bottom:18px;
}

.buy-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
    color:#fff;
    font-size:16px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s;
    margin-bottom:8px;
    box-shadow:0 8px 24px rgba(139,92,246,.4);
}
.buy-btn:not(:disabled):active{transform:scale(.96)}
.buy-btn:disabled{
    background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.3);
    cursor:not-allowed;
    box-shadow:none;
}

.buy-cancel{
    width:100%;
    padding:13px;
    border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color:rgba(255,255,255,.5);
    font-size:14px;
    font-weight:700;
    transition:all .15s;
}
.buy-cancel:active{transform:scale(.96)}

/* ══════════════ SUCCESS ══════════════ */
.success-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:9500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s, visibility .25s;
}
.success-overlay.show{opacity:1;visibility:visible}

.success-modal{
    background:#0f0f15;
    border-radius:24px;
    padding:28px 24px 24px;
    max-width:360px;
    width:100%;
    border:1px solid rgba(139,92,246,.25);
    text-align:center;
    transform:scale(.85);
    transition:transform .35s cubic-bezier(.175,.885,.32,1.275);
    box-shadow:0 20px 60px rgba(139,92,246,.3);
}
.success-overlay.show .success-modal{transform:scale(1)}

.success-icon{
    width:80px;
    height:80px;
    margin:0 auto 16px;
    border-radius:50%;
    background:linear-gradient(135deg, #24C38E, #10b981);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 40px rgba(36,195,142,.5);
    animation:successPop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes successPop{
    0%{transform:scale(0)}
    50%{transform:scale(1.1)}
    100%{transform:scale(1)}
}
.success-icon svg{
    width:40px;height:40px;
    stroke:#fff;stroke-width:3;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
}

.success-title{
    font-size:20px;
    font-weight:800;
    color:#fff;
    margin-bottom:8px;
}
.success-gift{
    font-size:14px;
    color:rgba(255,255,255,.6);
    margin-bottom:16px;
}

.success-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 16px;
    background:rgba(36,195,142,.08);
    border:1px solid rgba(36,195,142,.2);
    border-radius:12px;
    font-size:15px;
    font-weight:800;
    color:#24C38E;
    margin-bottom:18px;
}
.success-row img{width:16px;height:16px}

.success-ok{
    width:100%;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg, #24C38E, #10b981);
    color:#fff;
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    transition:transform .15s;
}
.success-ok:active{transform:scale(.96)}

/* ══════════════ TOAST ══════════════ */
.toast{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 70px);
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:rgba(20,20,30,.95);
    border:1px solid rgba(255,255,255,.1);
    padding:12px 20px;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    z-index:9999;
    opacity:0;
    visibility:hidden;
    transition:all .3s;
    max-width:90%;
    text-align:center;
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(36,195,142,.4);color:#24C38E}
.toast.err{border-color:rgba(255,48,100,.4);color:#FF3064}

/* ══════════════ BOTTOM NAV ══════════════ */
.bottom-nav{
    position:fixed;
    bottom:0;left:50%;
    transform:translateX(-50%);
    z-index:100;
    width:100%;max-width:480px;
    height:72px;
    padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px);
    background:rgba(10,10,15,.95);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-top:1px solid rgba(255,255,255,.06);
    display:flex;
    align-items:center;
    justify-content:space-around;
}
.bnav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 16px;
    border-radius:12px;
    color:rgba(255,255,255,.4);
    font-weight:600;
    transition:all .3s;
}
.bnav-item svg{
    width:24px;height:24px;
    stroke:currentColor;fill:none;
    transition:transform .3s;
}
.bnav-item span{font-size:10px;font-weight:600}
.bnav-item.active{
    background:linear-gradient(135deg, rgba(139,92,246,.2), rgba(76,29,149,.15));
    color:#a78bfa;
    box-shadow:inset 0 0 0 1px rgba(139,92,246,.3);
}
.bnav-item.active svg{transform:scale(1.1)}
.bnav-item:active{transform:scale(.9)}

/* ══════════════ АДАПТИВ ══════════════ */
@media(max-width:380px){
    .gift-name{font-size:11px}
    .gift-price{font-size:11px;padding:4px 10px}
    .buy-modal{padding:20px 16px}
    .buy-img-wrap{width:150px;height:150px}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="top-left">
        <img class="top-avatar" id="topAvatar" src="/static/img/default_avatar.png" alt="">
        <span class="top-nick" id="topNick">—</span>
    </div>
    <div class="top-right">
        <div class="top-balance">
            <img src="/static/img/ton.png" alt="">
            <span id="topBalance">0.00</span>
        </div>
    </div>
</div>

<div class="container">

    <div class="page-header">
        <div class="page-title">Маркет</div>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" class="search-input" id="searchInput"
                   placeholder="Поиск подарков..." oninput="filterGifts()">
        </div>
        <button class="sort-btn" onclick="toggleSort()">
            <svg viewBox="0 0 24 24">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="6" y1="12" x2="18" y2="12"/>
                <line x1="9" y1="18" x2="15" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="gifts-grid" id="giftsGrid">
        <div class="loading">Загрузка</div>
    </div>

</div>

<!-- BUY MODAL -->
<div class="buy-overlay" id="buyOverlay" onclick="if(event.target===this)closeBuy()">
    <div class="buy-modal">
        <div class="buy-img-wrap">
            <img id="buyImg" src="" alt="">
        </div>
        <div class="buy-name" id="buyName"></div>
        <div class="buy-sub">Random NFT</div>

        <div class="buy-price-display">
            <img src="/static/img/ton.png" alt="">
            <span id="buyPrice">0.00</span>
        </div>
        <div class="buy-markup-note">Цена с наценкой +10%</div>

        <button class="buy-btn" id="buyBtn" onclick="doBuy()">
            Купить
        </button>
        <button class="buy-cancel" onclick="closeBuy()">Отмена</button>
    </div>
</div>

<!-- SUCCESS -->
<div class="success-overlay" id="successOverlay">
    <div class="success-modal">
        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <div class="success-title">Успешно куплено!</div>
        <div class="success-gift" id="successGift"></div>
        <div class="success-row">
            <img src="/static/img/ton.png" alt="">
            <span id="successPrice">0.00</span>
        </div>
        <button class="success-ok" onclick="closeSuccess()">Отлично</button>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a class="bnav-item" href="/games">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="10" r="1" fill="currentColor"/><circle cx="18" cy="12" r="1" fill="currentColor"/></svg>
        <span>Игры</span>
    </a>
    <a class="bnav-item" href="/news">
        <svg viewBox="0 0 24 24"><path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2"/></svg>
        <span>Новости</span>
    </a>
    <a class="bnav-item active" href="/market">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13"/><path d="M3 12h18"/></svg>
        <span>Маркет</span>
    </a>
    <a class="bnav-item" href="/leaderboard">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
        <span>Топ</span>
    </a>
    <a class="bnav-item" href="/inventory">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Профиль</span>
    </a>
</nav>

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var tg = window.Telegram && window.Telegram.WebApp;
var userId = null;
var userData = null;
var allGifts = [];
var filteredGifts = [];
var selectedGift = null;
var sortDesc = true;
var searchQuery = '';

function $(id){ return document.getElementById(id); }

function showToast(msg, type){
    var t = $('toast');
    if(!t) return;
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function formatTon(stars){
    return (Number(stars || 0) / 100).toFixed(2);
}

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            userData = d.user;
            $('topNick').textContent = userData.first_name || userData.username || 'User';
            if(userData.photo_url) $('topAvatar').src = userData.photo_url;
            $('topBalance').textContent = formatTon(userData.balance_stars);
        }
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   LOAD GIFTS
   ══════════════════════════════════════════════════════════════ */
async function loadGifts(){
    var grid = $('giftsGrid');
    if(!grid) return;
    grid.innerHTML = '<div class="loading">Загрузка</div>';

    try{
        var r = await fetch('/api/market/gifts');
        var d = await r.json();
        if(d.success && d.gifts && d.gifts.length){
            allGifts = d.gifts;
            filterGifts();
        } else {
            grid.innerHTML = '<div class="empty-msg">Подарки не найдены</div>';
        }
    }catch(e){
        grid.innerHTML = '<div class="empty-msg">Ошибка загрузки</div>';
    }
}

/* ══════════════════════════════════════════════════════════════
   FILTER + RENDER
   ══════════════════════════════════════════════════════════════ */
function filterGifts(){
    searchQuery = ($('searchInput') ? $('searchInput').value : '').toLowerCase().trim();

    filteredGifts = allGifts.filter(function(g){
        if(!searchQuery) return true;
        return (g.name || '').toLowerCase().indexOf(searchQuery) !== -1;
    });

    filteredGifts.sort(function(a, b){
        return sortDesc ? (b.price_stars - a.price_stars) : (a.price_stars - b.price_stars);
    });

    renderGifts();
}

function toggleSort(){
    sortDesc = !sortDesc;
    showToast(sortDesc ? 'Сначала дорогие' : 'Сначала дешёвые', 'ok');
    filterGifts();
}

function getRarityByValue(stars){
    if(stars >= 50000) return 'legendary';
    if(stars >= 10000) return 'epic';
    if(stars >= 2000) return 'rare';
    return 'common';
}

function renderGifts(){
    var grid = $('giftsGrid');
    if(!grid) return;

    if(!filteredGifts.length){
        grid.innerHTML = '<div class="empty-msg">Ничего не найдено</div>';
        return;
    }

    var html = '';
    filteredGifts.forEach(function(g){
        var rarity = getRarityByValue(g.price_stars);
        var imgSrc = g.image || '/static/img/gift.png';
        // Для NFT - используем fragment URL с случайным номером
        if(g.slug){
            var rnd = Math.floor(Math.random() * 4999) + 1;
            imgSrc = 'https://nft.fragment.com/gift/' + g.slug.replace(/\s/g, '') + '-' + rnd + '.medium.jpg';
        }

        html += '<div class="gift-card" onclick="openBuy(' + g.id + ')">'
            + '<div class="gift-rarity ' + rarity + '">' + rarity.toUpperCase() + '</div>'
            + '<div class="gift-markup">+10%</div>'
            + '<div class="gift-img-wrap">'
            +   '<img src="' + imgSrc + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'' + (g.image || '/static/img/gift.png') + '\'">'
            + '</div>'
            + '<div class="gift-name">' + (g.name || 'Gift') + '</div>'
            + '<div class="gift-price">'
            +   '<img src="/static/img/ton.png">'
            +   '<span>' + g.price_ton + '</span>'
            + '</div>'
            + '</div>';
    });
    grid.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   BUY MODAL
   ══════════════════════════════════════════════════════════════ */
function openBuy(giftId){
    var gift = allGifts.find(function(g){ return g.id === giftId; });
    if(!gift){ showToast('Подарок не найден', 'err'); return; }

    selectedGift = gift;

    var imgSrc = gift.image || '/static/img/gift.png';
    if(gift.slug){
        var rnd = Math.floor(Math.random() * 4999) + 1;
        imgSrc = 'https://nft.fragment.com/gift/' + gift.slug.replace(/\s/g, '') + '-' + rnd + '.medium.jpg';
    }

    var img = $('buyImg');
    img.src = imgSrc;
    img.onerror = function(){ this.onerror = null; this.src = gift.image || '/static/img/gift.png'; };

    $('buyName').textContent = gift.name;
    $('buyPrice').textContent = gift.price_ton;

    $('buyOverlay').classList.add('show');
}

function closeBuy(){
    $('buyOverlay').classList.remove('show');
    selectedGift = null;
}

async function doBuy(){
    if(!selectedGift || !userId) return;

    var btn = $('buyBtn');
    btn.disabled = true;
    btn.innerHTML = '<span style="opacity:.6">Покупка...</span>';

    try{
        var r = await fetch('/api/market/buy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: userId,
                gift_id: selectedGift.id
            })
        });
        var d = await r.json();

        if(d.success){
            // Обновляем баланс
            if(d.new_balance !== undefined){
                userData.balance_stars = d.new_balance;
                $('topBalance').textContent = formatTon(d.new_balance);
            }

            closeBuy();
            showSuccess(d.gift_name, d.price_ton);
        } else {
            showToast(d.error || 'Ошибка покупки', 'err');
        }
    }catch(e){
        showToast('Ошибка сети', 'err');
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Купить';
    }
}

/* ══════════════════════════════════════════════════════════════
   SUCCESS
   ══════════════════════════════════════════════════════════════ */
function showSuccess(giftName, price){
    $('successGift').textContent = giftName || 'Подарок';
    $('successPrice').textContent = price + ' TON';
    $('successOverlay').classList.add('show');

    try{
        if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }catch(e){}
}

function closeSuccess(){
    $('successOverlay').classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
(async function init(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        if(tg){
            try{
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#0a0a0f');
                tg.setBackgroundColor('#0a0a0f');
            }catch(e){}
        }
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd.banned){ location.href = '/ban'; return; }
        }catch(e){}
    }
    await loadTopBar();
    await loadGifts();
})();
</script>
