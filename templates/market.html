<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1C2233">
<title>Маркет — Rasswet</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:'Inter Variable','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    color:#fff;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}
body::before{
    content:'';
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse 700px 400px at 50% -100px,rgba(59,130,246,.10) 0%,transparent 70%);
    pointer-events:none;
    z-index:0;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════ TOP BAR (как в краше) ══════════════ */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(env(safe-area-inset-top,20px) + 58px) 14px 10px;
    max-width:480px;
    margin:0 auto;
    position:relative;
    z-index:10;
}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{
    display:flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:20px;
    border:1.5px solid rgba(30,228,76,.45);
    background:rgba(30,228,76,.12);
    font-weight:700;font-size:13px;color:#1EE44C;
    backdrop-filter:blur(5px);
}
.online-pill svg{width:12px;height:12px}
.top-right-btns{display:flex;gap:8px;align-items:center}
.bal-pill-crash{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    font-weight:700;font-size:13px;color:#fff;
    backdrop-filter:blur(5px);
}
.bal-pill-crash img{width:16px;height:16px}
.bal-plus-crash{
    width:28px;height:28px;border-radius:50%;
    border:none;background:rgba(120,135,160,.3);
    color:#A0B0C4;font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    border:1px solid rgba(120,135,160,.45);
}
.bal-plus-crash:active{transform:scale(.9)}

/* ══════════════ CONTAINER ══════════════ */
.container{
    max-width:480px;
    margin:0 auto;
    padding:0 12px calc(env(safe-area-inset-bottom,0px) + 90px);
    position:relative;
    z-index:1;
}

/* ══════════════ HEADER ══════════════ */
.page-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;padding:0 2px;
}
.page-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px}

/* ══════════════ SEARCH & SORT ══════════════ */
.controls{
    display:flex;gap:8px;margin-bottom:14px;
}
.search-wrap{flex:1;position:relative}
.search-input{
    width:100%;
    padding:12px 16px 12px 42px;
    border-radius:14px;
    border:1.5px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:#fff;
    font-size:14px;
    font-family:inherit;
    font-weight:600;
    outline:none;
    transition:all .2s;
}
.search-input:focus{
    border-color:rgba(59,130,246,.5);
    background:rgba(59,130,246,.06);
}
.search-input::placeholder{color:rgba(255,255,255,.3);font-weight:500}
.search-icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;
    stroke:rgba(255,255,255,.4);fill:none;stroke-width:2;
    pointer-events:none;
}
.sort-btn{
    width:46px;height:46px;border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1.5px solid rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;flex-shrink:0;
}
.sort-btn:active{transform:scale(.95);background:rgba(255,255,255,.08)}
.sort-btn svg{width:18px;height:18px;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2}

/* ══════════════ GRID ══════════════ */
.gifts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.gift-card{
    position:relative;
    background:linear-gradient(160deg,rgba(59,130,246,.06),rgba(59,130,246,.02));
    border:1.5px solid rgba(59,130,246,.15);
    border-radius:16px;
    padding:10px;
    cursor:pointer;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
}
.gift-card:active{transform:scale(.97)}
.gift-card:hover{
    border-color:rgba(59,130,246,.4);
    background:linear-gradient(160deg,rgba(59,130,246,.12),rgba(59,130,246,.04));
}

.gift-img-wrap{
    width:100%;
    aspect-ratio:1/1;
    border-radius:12px;
    background:rgba(0,0,0,.2);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
    position:relative;
}
.gift-img-wrap img{
    width:88%;
    height:88%;
    object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
}

.gift-name{
    font-size:12px;
    font-weight:700;
    color:rgba(255,255,255,.9);
    text-align:center;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.2;
    margin-bottom:6px;
}

.gift-price{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:5px 12px;
    background:rgba(59,130,246,.12);
    border:1px solid rgba(59,130,246,.25);
    border-radius:10px;
    font-size:12px;
    font-weight:800;
    color:#3B82F6;
    line-height:1;
}
.gift-price img{width:12px;height:12px}

/* ══════════════ EMPTY / LOADING ══════════════ */
.empty-msg{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:rgba(255,255,255,.3);
    font-size:14px;
    font-weight:600;
}
.loading{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:rgba(255,255,255,.4);
    font-size:14px;
    font-weight:600;
}
.loading::after{
    content:'';
    display:inline-block;
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,.1);
    border-top-color:rgba(59,130,246,.8);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-left:10px;
    vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════ BUY MODAL ══════════════ */
.buy-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    z-index:9000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s, visibility .25s;
}
.buy-overlay.show{opacity:1;visibility:visible}

.buy-modal{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px 24px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom,0));
    max-width:480px;
    width:100%;
    border-top:1px solid rgba(59,130,246,.2);
    box-shadow:0 -8px 40px rgba(0,0,0,.6);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.34,.69,.7,1);
    text-align:center;
}
.buy-overlay.show .buy-modal{transform:translateY(0)}

.buy-handle{
    width:36px;height:4px;
    background:rgba(120,135,160,.25);
    border-radius:2px;
    margin:0 auto 18px;
}

.buy-img-wrap{
    width:160px;
    height:160px;
    border-radius:20px;
    background:rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 16px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(59,130,246,.15);
}
.buy-img-wrap img{
    width:85%;
    height:85%;
    object-fit:contain;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));
}

.buy-name{
    font-size:18px;
    font-weight:800;
    color:#fff;
    margin-bottom:4px;
}

.buy-price-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 18px;
    background:rgba(59,130,246,.08);
    border:1.5px solid rgba(59,130,246,.25);
    border-radius:14px;
    font-size:22px;
    font-weight:900;
    color:#3B82F6;
    margin:16px 0 18px;
}
.buy-price-display img{width:22px;height:22px}

.buy-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    color:#fff;
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s;
    margin-bottom:8px;
    box-shadow:0 8px 24px rgba(59,130,246,.3);
}
.buy-btn:not(:disabled):active{transform:scale(.96)}
.buy-btn:disabled{
    background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.3);
    cursor:not-allowed;
    box-shadow:none;
}

.buy-cancel{
    width:100%;
    padding:13px;
    border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color:rgba(255,255,255,.5);
    font-size:14px;
    font-weight:700;
    transition:all .15s;
}
.buy-cancel:active{transform:scale(.96)}

/* ══════════════ SUCCESS ══════════════ */
.success-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:9500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s, visibility .25s;
}
.success-overlay.show{opacity:1;visibility:visible}

.success-modal{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px;
    padding:28px 24px 24px;
    max-width:360px;
    width:100%;
    border:1px solid rgba(59,130,246,.25);
    text-align:center;
    transform:scale(.85);
    transition:transform .35s cubic-bezier(.175,.885,.32,1.275);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.success-overlay.show .success-modal{transform:scale(1)}

.success-icon{
    width:80px;
    height:80px;
    margin:0 auto 16px;
    border-radius:50%;
    background:linear-gradient(135deg,#24C38E,#10b981);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 40px rgba(36,195,142,.5);
    animation:successPop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes successPop{
    0%{transform:scale(0)}
    50%{transform:scale(1.1)}
    100%{transform:scale(1)}
}
.success-icon svg{
    width:40px;height:40px;
    stroke:#fff;stroke-width:3;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
}

.success-title{
    font-size:20px;
    font-weight:800;
    color:#fff;
    margin-bottom:8px;
}
.success-gift{
    font-size:14px;
    color:rgba(255,255,255,.6);
    margin-bottom:16px;
}

.success-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 16px;
    background:rgba(36,195,142,.08);
    border:1px solid rgba(36,195,142,.2);
    border-radius:12px;
    font-size:15px;
    font-weight:800;
    color:#24C38E;
    margin-bottom:18px;
}
.success-row img{width:16px;height:16px}

.success-ok{
    width:100%;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    color:#fff;
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    transition:transform .15s;
}
.success-ok:active{transform:scale(.96)}

/* ══════════════ DEPOSIT MODAL ══════════════ */
.deposit-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.85);
    z-index:9600;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{
    background:linear-gradient(180deg,#1E2538,#151B2D);
    border-radius:24px;
    width:90%;
    max-width:360px;
    padding:24px 20px;
    transform:scale(.9);
    transition:transform .3s;
    border:1px solid rgba(255,255,255,.1);
}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}
.deposit-title{font-weight:800;font-size:18px;color:#fff}
.deposit-close{
    width:32px;height:32px;border-radius:10px;
    background:rgba(249,105,153,.15);
    color:#F96999;font-size:18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
}
.deposit-methods{display:flex;gap:12px}
.deposit-method{
    flex:1;padding:20px 14px;border-radius:16px;
    background:rgba(255,255,255,.04);
    border:2px solid rgba(255,255,255,.06);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:pointer;transition:all .2s;
}
.deposit-method:active{transform:scale(.96)}
.deposit-method img{width:44px;height:44px;object-fit:contain}
.deposit-method span{font-weight:700;font-size:13px;color:#fff}

/* ══════════════ TOAST ══════════════ */
.toast{
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom,0px) + 90px);
    left:50%;
    transform:translateX(-50%) translateY(16px);
    background:rgba(20,20,30,.95);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    padding:12px 20px;
    border-radius:14px;
    font-weight:700;
    font-size:13px;
    z-index:9999;
    opacity:0;
    visibility:hidden;
    transition:all .3s;
    max-width:90%;
    text-align:center;
    color:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(36,195,142,.4);color:#24C38E}
.toast.err{border-color:rgba(255,48,100,.4);color:#FF3064}

/* ══════════════ BOTTOM NAV (как в краше) ══════════════ */
.bottom-nav{
    position:fixed;
    bottom:0;left:50%;
    transform:translateX(-50%);
    z-index:4000;
    width:100%;max-width:480px;
    height:72px;
    padding:0 8px calc(env(safe-area-inset-bottom,0) + 8px);
    background:rgba(28,34,51,.92);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-top:1px solid rgba(59,130,246,.08);
    display:flex;
    align-items:center;
    justify-content:space-around;
}
.bottom-nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:8px 16px;
    border-radius:12px;
    background:transparent;
    border:none;
    color:rgba(255,255,255,.4);
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    transition:all .3s;
    text-decoration:none;
    position:relative;
}
.bottom-nav-item svg{width:24px;height:24px;flex-shrink:0;stroke:currentColor;fill:none}
.bottom-nav-item span{font-size:10px;font-weight:600}
.bottom-nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.bottom-nav-item:active{transform:scale(.9)}

/* ══════════════ АДАПТИВ ══════════════ */
@media(max-width:380px){
    .gift-name{font-size:11px}
    .gift-price{font-size:11px;padding:4px 10px}
    .buy-modal{padding:20px 16px calc(20px + env(safe-area-inset-bottom,0))}
    .buy-img-wrap{width:140px;height:140px}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="top-left">
        <div class="online-pill">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span id="onlineCount">0</span>
        </div>
    </div>
    <div class="top-right-btns">
        <div class="bal-pill-crash">
            <img src="/static/img/ton.png" alt="TON">
            <span id="topBalance">0.00</span>
        </div>
        <button class="bal-plus-crash" onclick="openDeposit()">+</button>
    </div>
</div>

<div class="container">

    <div class="page-header">
        <div class="page-title">Маркет</div>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" class="search-input" id="searchInput"
                   placeholder="Поиск подарков..." oninput="filterGifts()">
        </div>
        <button class="sort-btn" onclick="toggleSort()">
            <svg viewBox="0 0 24 24">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="6" y1="12" x2="18" y2="12"/>
                <line x1="9" y1="18" x2="15" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="gifts-grid" id="giftsGrid">
        <div class="loading">Загрузка</div>
    </div>

</div>

<!-- BUY MODAL -->
<div class="buy-overlay" id="buyOverlay" onclick="if(event.target===this)closeBuy()">
    <div class="buy-modal">
        <div class="buy-handle"></div>
        <div class="buy-img-wrap">
            <img id="buyImg" src="" alt="">
        </div>
        <div class="buy-name" id="buyName"></div>

        <div class="buy-price-display">
            <img src="/static/img/ton.png" alt="">
            <span id="buyPrice">0.00</span>
        </div>

        <button class="buy-btn" id="buyBtn" onclick="doBuy()">
            Купить
        </button>
        <button class="buy-cancel" onclick="closeBuy()">Отмена</button>
    </div>
</div>

<!-- SUCCESS -->
<div class="success-overlay" id="successOverlay">
    <div class="success-modal">
        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <div class="success-title">Успешно куплено!</div>
        <div class="success-gift" id="successGift"></div>
        <div class="success-row">
            <img src="/static/img/ton.png" alt="">
            <span id="successPrice">0.00</span>
        </div>
        <button class="success-ok" onclick="closeSuccess()">Отлично</button>
    </div>
</div>

<!-- DEPOSIT -->
<div class="deposit-overlay" id="depositOverlay" onclick="if(event.target===this)closeDeposit()">
    <div class="deposit-modal">
        <div class="deposit-header">
            <div class="deposit-title">Пополнение</div>
            <button class="deposit-close" onclick="closeDeposit()">✕</button>
        </div>
        <div class="deposit-methods">
            <button class="deposit-method" onclick="closeDeposit();goTo('/crash')">
                <img src="/static/img/ton.png" alt="TON">
                <span>TON</span>
            </button>
            <button class="deposit-method" onclick="closeDeposit();goTo('/crash')">
                <img src="/static/img/star.png" alt="Stars">
                <span>Stars</span>
            </button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var tg = window.Telegram && window.Telegram.WebApp;
var userId = null;
var userData = null;
var allGifts = [];
var filteredGifts = [];
var selectedGift = null;
var sortDesc = true;
var searchQuery = '';
var _buyLocked = false;

function $(id){ return document.getElementById(id); }

function showToast(msg, type){
    var t = $('toast');
    if(!t) return;
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function formatTon(stars){
    return (Number(stars || 0) / 100).toFixed(2);
}

function goTo(url){
    try{
        if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }catch(e){}
    window.location.href = url;
}

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            userData = d.user;
            if(userData.photo_url) { /* нет аватара в этой версии */ }
            $('topBalance').textContent = formatTon(userData.balance_stars);
        }
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   LOAD GIFTS
   ══════════════════════════════════════════════════════════════ */
async function loadGifts(){
    var grid = $('giftsGrid');
    if(!grid) return;
    grid.innerHTML = '<div class="loading">Загрузка</div>';

    try{
        // Пробуем сначала market API
        var r = await fetch('/api/market/gifts');
        var d = await r.json();
        
        if(d.success && d.gifts && d.gifts.length){
            allGifts = d.gifts;
            filterGifts();
            return;
        }

        // Fallback: gifts-list
        var r2 = await fetch('/api/gifts-list?models=0');
        var d2 = await r2.json();
        if(d2.success && d2.gifts && d2.gifts.length){
            allGifts = d2.gifts.map(function(g){
                var val = g.value || 0;
                return {
                    id: g.id || g.gift_key || g.fragment_slug,
                    name: g.name || 'Gift',
                    slug: g.fragment_slug || '',
                    image: g.image || '',
                    original_stars: val,
                    price_stars: Math.round(val * 1.1),
                    price_ton: ((val * 1.1) / 100).toFixed(2)
                };
            });
            filterGifts();
        } else {
            grid.innerHTML = '<div class="empty-msg">Подарки не найдены</div>';
        }
    }catch(e){
        console.error('loadGifts error:', e);
        grid.innerHTML = '<div class="empty-msg">Ошибка загрузки</div>';
    }
}

/* ══════════════════════════════════════════════════════════════
   FILTER + RENDER
   ══════════════════════════════════════════════════════════════ */
function filterGifts(){
    searchQuery = ($('searchInput') ? $('searchInput').value : '').toLowerCase().trim();

    filteredGifts = allGifts.filter(function(g){
        if(!searchQuery) return true;
        return (g.name || '').toLowerCase().indexOf(searchQuery) !== -1;
    });

    filteredGifts.sort(function(a, b){
        var va = a.price_stars || 0;
        var vb = b.price_stars || 0;
        return sortDesc ? (vb - va) : (va - vb);
    });

    renderGifts();
}

function toggleSort(){
    sortDesc = !sortDesc;
    showToast(sortDesc ? 'Сначала дорогие' : 'Сначала дешёвые', 'ok');
    filterGifts();
}

function renderGifts(){
    var grid = $('giftsGrid');
    if(!grid) return;

    if(!filteredGifts.length){
        grid.innerHTML = '<div class="empty-msg">Ничего не найдено</div>';
        return;
    }

    var html = '';
    filteredGifts.forEach(function(g){
        var priceStars = g.price_stars || 0;
        var priceTon = (priceStars / 100).toFixed(2);
        var imgSrc = g.image || '/static/img/gift.png';

        // NFT image с случайным номером
        if(g.slug){
            var rnd = Math.floor(Math.random() * 4999) + 1;
            imgSrc = 'https://nft.fragment.com/gift/' + g.slug.replace(/\s/g, '') + '-' + rnd + '.medium.jpg';
        }

        html += '<div class="gift-card" onclick="openBuy(' + JSON.stringify(g.id).replace(/"/g, '&quot;') + ')">'
            + '<div class="gift-img-wrap">'
            +   '<img src="' + imgSrc + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'' + (g.image || '/static/img/gift.png') + '\'">'
            + '</div>'
            + '<div class="gift-name">' + (g.name || 'Gift') + '</div>'
            + '<div class="gift-price">'
            +   '<img src="/static/img/ton.png">'
            +   '<span>' + priceTon + '</span>'
            + '</div>'
            + '</div>';
    });
    grid.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   BUY MODAL
   ══════════════════════════════════════════════════════════════ */
function openBuy(giftId){
    var gift = allGifts.find(function(g){ return String(g.id) === String(giftId); });
    if(!gift){ showToast('Подарок не найден', 'err'); return; }

    selectedGift = gift;

    var imgSrc = gift.image || '/static/img/gift.png';
    if(gift.slug){
        var rnd = Math.floor(Math.random() * 4999) + 1;
        imgSrc = 'https://nft.fragment.com/gift/' + gift.slug.replace(/\s/g, '') + '-' + rnd + '.medium.jpg';
    }

    var img = $('buyImg');
    img.src = imgSrc;
    img.onerror = function(){ this.onerror = null; this.src = gift.image || '/static/img/gift.png'; };

    $('buyName').textContent = gift.name;

    var priceStars = gift.price_stars || 0;
    $('buyPrice').textContent = (priceStars / 100).toFixed(2);

    $('buyOverlay').classList.add('show');
}

function closeBuy(){
    $('buyOverlay').classList.remove('show');
    selectedGift = null;
}

async function doBuy(){
    if(_buyLocked) return;
    if(!selectedGift){
        showToast('Подарок не выбран', 'err');
        return;
    }
    if(!userId){
        showToast('Авторизация...', 'err');
        return;
    }

    _buyLocked = true;

    var btn = $('buyBtn');
    if(btn){
        btn.disabled = true;
        btn.innerHTML = '<span style="opacity:.6">Покупка...</span>';
    }

    try{
        var r = await fetch('/api/market/buy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: userId,
                gift_id: selectedGift.id
            })
        });
        var d = await r.json();

        if(d.success){
            if(d.new_balance !== undefined && userData){
                userData.balance_stars = d.new_balance;
                $('topBalance').textContent = formatTon(d.new_balance);
            }

            closeBuy();
            showSuccess(d.gift_name, d.price_ton);

            try{
                if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }catch(e){}
        } else {
            showToast(d.error || 'Ошибка покупки', 'err');
        }
    }catch(e){
        console.error('doBuy error:', e);
        showToast('Ошибка сети', 'err');
    } finally {
        _buyLocked = false;
        if(btn){
            btn.disabled = false;
            btn.innerHTML = 'Купить';
        }
    }
}

/* ══════════════════════════════════════════════════════════════
   SUCCESS
   ══════════════════════════════════════════════════════════════ */
function showSuccess(giftName, price){
    $('successGift').textContent = giftName || 'Подарок';
    $('successPrice').textContent = price + ' TON';
    $('successOverlay').classList.add('show');
}

function closeSuccess(){
    $('successOverlay').classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */
function openDeposit(){
    $('depositOverlay').classList.add('show');
}
function closeDeposit(){
    $('depositOverlay').classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   ONLINE COUNT
   ══════════════════════════════════════════════════════════════ */
async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var el = $('onlineCount');
        if(el && d.count !== undefined) el.textContent = d.count;
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
(async function init(){
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        if(tg){
            try{
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#1C2233');
                tg.setBackgroundColor('#1C2233');
            }catch(e){}
        }
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd.banned){ location.href = '/ban'; return; }
        }catch(e){}
    }
    await loadTopBar();
    await loadGifts();
    loadOnline();
    setInterval(loadOnline, 30000);
})();
</script>
