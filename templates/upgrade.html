<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rasswet - Апгрейд</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#0a0a0f;
    --text:#fff;
    --green:#24C38E;
    --red:#FF3064;
    --gold:#FFD700;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --tg-header:56px;
}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0a0a0f;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a1a2e 0%, #0a0a0f 60%);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-user-select:none;
    overflow:hidden;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════════════════════════════════════════════════════
   LOADING SCREEN
   ══════════════════════════════════════════════════════════════ */
.loading-screen{
    position:fixed;inset:0;background:#0a0a0f;z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    transition:opacity .5s ease, visibility .5s ease;
}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-wheel{width:180px;height:180px;position:relative;animation:loadingRotate 3s linear infinite}
@keyframes loadingRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.loading-wheel svg{width:100%;height:100%;display:block}
.loading-wheel .ld-ring{fill:none;stroke:#1a1a24;stroke-width:18}
.loading-wheel .ld-green{fill:none;stroke:url(#ldGreenGrad);stroke-width:18;stroke-linecap:round}
.loading-wheel .ld-tick{stroke:#fff;stroke-width:1.5;stroke-linecap:round}
.loading-wheel .ld-inner{fill:none;stroke:rgba(255,255,255,.04);stroke-width:1}
.loading-text{font-size:13px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase}
.loading-progress{width:220px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.loading-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#24C38E,#10b981);border-radius:2px;transition:width .3s ease}
.loading-arrow{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:10;filter:drop-shadow(0 4px 12px rgba(0,0,0,.8))}

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;padding-top:calc(var(--safe-top) + var(--tg-header));position:relative;z-index:10}
.top-left{display:flex;align-items:center;gap:8px}
.user-pill{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.04)}
.top-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.top-nick{font-size:13px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-right{display:flex;gap:8px;align-items:center}
.bal-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-weight:800;font-size:13px}
.bal-pill img{width:14px;height:14px}
.bal-plus{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s}
.bal-plus:active{transform:scale(.9);background:rgba(255,255,255,.12)}

/* ══════════════════════════════════════════════════════════════
   WRAPPER
   ══════════════════════════════════════════════════════════════ */
.upgrade-wrap{max-width:450px;margin:0 auto;padding:4px 16px calc(var(--safe-bottom) + 100px);display:flex;flex-direction:column;align-items:center;gap:12px}

/* ══════════════════════════════════════════════════════════════
   ПАНЕЛЬ ВЫБОРА
   ══════════════════════════════════════════════════════════════ */
.select-panel{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.select-card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;min-height:160px;justify-content:center;overflow:hidden}
.select-card:active{transform:scale(.97)}
.select-card.has-item{border-color:rgba(36,195,142,.35);background:linear-gradient(180deg,rgba(36,195,142,.06),rgba(36,195,142,.01))}
.select-card-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;text-align:center;line-height:1.2}
.select-empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.select-empty-icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3)}
.select-empty-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.5}
.select-empty-text{font-size:11px;color:rgba(255,255,255,.3);font-weight:600}
.select-filled{display:none;flex-direction:column;align-items:center;gap:6px;width:100%}
.select-card.has-item .select-empty{display:none}
.select-card.has-item .select-filled{display:flex;animation:cardPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.select-img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.select-name{font-size:11px;font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.select-price{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:rgba(255,255,255,.06);border-radius:10px;font-size:11px;font-weight:800;color:rgba(255,255,255,.7);line-height:1}
.select-price img{width:11px;height:11px}
.select-chance{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;background:rgba(36,195,142,.12);border:1px solid rgba(36,195,142,.3);border-radius:10px;font-size:13px;font-weight:900;color:var(--green);line-height:1;margin-top:4px}

/* ══════════════════════════════════════════════════════════════
   КОЛЕСО
   ══════════════════════════════════════════════════════════════ */
.wheel-section{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0;position:relative}
.wheel-wrap{position:relative;width:300px;height:300px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:10;width:44px;height:44px;pointer-events:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,.9))}
.wheel-pointer svg{width:100%;height:100%;display:block}

/* ═══ Золотая вспышка (когда появляется шанс) ═══ */
.gold-ring-hint{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:6;opacity:0;
    transition:opacity .4s;
}
.gold-ring-hint.show{
    opacity:1;
    animation:goldPulse 1.2s ease-in-out infinite;
}
@keyframes goldPulse{
    0%,100%{filter:drop-shadow(0 0 8px rgba(255,215,0,.5))}
    50%{filter:drop-shadow(0 0 28px rgba(255,215,0,.95))}
}

/* ═══ Результат: PNG в центре ═══ */
.wheel-result{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:180px;height:180px;z-index:20;pointer-events:none;opacity:0;
    transition:opacity .3s ease, transform .3s ease;
}
.wheel-result.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    animation:resultBounce .6s cubic-bezier(.34,1.56,.64,1);
}
.wheel-result img{
    width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 0 40px rgba(36,195,142,.6));
}
.wheel-result.fail img{
    filter:drop-shadow(0 0 40px rgba(255,48,100,.6));
    animation:failGlow 1.6s ease-in-out infinite;
}
.wheel-result.gold img{
    filter:drop-shadow(0 0 60px rgba(255,215,0,.95));
    animation:goldResultGlow 1.2s ease-in-out infinite;
}
@keyframes resultBounce{
    0%{transform:translate(-50%,-50%) scale(0)}
    50%{transform:translate(-50%,-50%) scale(1.15)}
    100%{transform:translate(-50%,-50%) scale(1)}
}
@keyframes failGlow{
    0%,100%{filter:drop-shadow(0 0 40px rgba(255,48,100,.6));transform:translate(-50%,-50%) scale(1)}
    50%{filter:drop-shadow(0 0 70px rgba(255,48,100,.95));transform:translate(-50%,-50%) scale(1.05)}
}
@keyframes goldResultGlow{
    0%,100%{filter:drop-shadow(0 0 50px rgba(255,215,0,.8));transform:translate(-50%,-50%) scale(1)}
    50%{filter:drop-shadow(0 0 90px rgba(255,215,0,1));transform:translate(-50%,-50%) scale(1.08)}
}

/* ═══ PNG ставки, летящий в центр (GOLD) ═══ */
.fly-item{
    position:absolute;
    width:80px;height:80px;
    z-index:18;pointer-events:none;
    opacity:0;
    transition:opacity .3s, transform .9s cubic-bezier(.5,-0.3,.7,1.4);
    filter:drop-shadow(0 0 20px rgba(255,215,0,.8));
}
.fly-item img{width:100%;height:100%;object-fit:contain}
.fly-item.flying{
    opacity:1;
    animation:flyToCenter 1.1s cubic-bezier(.5,-0.3,.7,1.4) forwards;
}
.fly-item.from-left{transform:translate(-140px,120px) scale(.6) rotate(-180deg)}
.fly-item.from-right{transform:translate(140px,120px) scale(.6) rotate(180deg)}
.fly-item.to-center{transform:translate(0,0) scale(1) rotate(0deg)}
@keyframes flyToCenter{
    0%{opacity:0}
    15%{opacity:1}
    80%{opacity:1}
    100%{opacity:1}
}

/* ═══ Вспышка ═══ */
.wheel-flash{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:300px;height:300px;border-radius:50%;
    pointer-events:none;z-index:15;opacity:0;
}
.wheel-flash.show{animation:flashAnim .8s ease-out}
@keyframes flashAnim{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
    50%{opacity:.8}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
}
.wheel-flash.win{background:radial-gradient(circle, rgba(36,195,142,.6) 0%, transparent 70%)}
.wheel-flash.fail{background:radial-gradient(circle, rgba(255,48,100,.5) 0%, transparent 70%)}
.wheel-flash.gold{background:radial-gradient(circle, rgba(255,215,0,.85) 0%, transparent 70%)}

/* ═══ Тряска при неудаче ═══ */
@keyframes wheelShake{
    0%,100%{transform:translateX(0)}
    10%,30%,50%,70%,90%{transform:translateX(-6px)}
    20%,40%,60%,80%{transform:translateX(6px)}
}
.wheel-wrap.shake{animation:wheelShake .55s ease-in-out}

/* ═══ "Взрыв" ставки при проигрыше (мягкий) ═══ */
.wheel-wrap.fail-explode .wheel-result img{
    animation:softExplode 1.2s ease-out forwards;
}
@keyframes softExplode{
    0%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 40px rgba(255,48,100,.6))}
    30%{transform:scale(1.15);filter:drop-shadow(0 0 80px rgba(255,48,100,.95)) brightness(1.5)}
    60%{transform:scale(1.05);opacity:1}
    100%{transform:scale(1.6);opacity:0;filter:drop-shadow(0 0 0 rgba(255,48,100,0)) blur(8px)}
}

/* ═══ Звёзды при победе ═══ */
.star-particle{
    position:absolute;width:24px;height:24px;pointer-events:none;
    z-index:25;opacity:0;transform:scale(0);
    animation:starPop 1.2s ease-out forwards;
}
.star-particle img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,215,0,.8))}
@keyframes starPop{
    0%{opacity:0;transform:scale(0) rotate(0deg)}
    20%{opacity:1;transform:scale(1.3) rotate(45deg)}
    100%{opacity:0;transform:scale(0) rotate(360deg) translateY(-50px)}
}

/* Базовое колесо */
.wheel-rotator{position:absolute;top:0;left:0;width:100%;height:100%;will-change:transform;transform-origin:50% 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0)}
.wheel-rotator svg{width:100%;height:100%;display:block}
.wheel-green-arc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;transform-origin:50% 50%;will-change:transform;transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden}

/* ═══ Золотая полоса (накладывается на зелёную) ═══ */
.wheel-gold-arc{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:2;
    transform-origin:50% 50%;will-change:transform;
    transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;
    opacity:0;transition:opacity .35s ease;
}
.wheel-gold-arc.visible{opacity:1}
.wheel-gold-arc.pulsing{animation:goldArcPulse 1s ease-in-out infinite}
@keyframes goldArcPulse{
    0%,100%{filter:drop-shadow(0 0 6px rgba(255,215,0,.7))}
    50%{filter:drop-shadow(0 0 22px rgba(255,215,0,1))}
}

.wheel-center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle, #15151c 0%, #0a0a0f 100%);
    border:2px solid rgba(255,255,255,.06);
    box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 0 6px rgba(10,10,15,.95);
    display:flex;align-items:center;justify-content:center;z-index:5;overflow:hidden;
    transition:box-shadow .3s ease;
}
.wheel-center.gold-glow{
    box-shadow:inset 0 0 40px rgba(255,215,0,.3),0 0 0 6px rgba(10,10,15,.95),0 0 40px rgba(255,215,0,.5);
}
.wheel-center-img{position:absolute;width:80px;height:80px;object-fit:contain;opacity:0;transition:opacity .3s ease;z-index:2;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.wheel-center-img.visible{opacity:1}
.wheel-center-pct{position:absolute;font-size:28px;font-weight:900;letter-spacing:-1px;color:#fff;opacity:0;transition:opacity .3s ease;z-index:3}
.wheel-center-pct.visible{opacity:1}

/* ══════════════════════════════════════════════════════════════
   КНОПКИ
   ══════════════════════════════════════════════════════════════ */
.actions-row{width:100%;display:flex;gap:10px}
.btn-main{flex:2;height:56px;border-radius:16px;background:linear-gradient(135deg, #24C38E 0%, #10b981 100%);border:1px solid rgba(36,195,142,.3);color:#fff;font-size:16px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;justify-content:center;transition:all .2s;letter-spacing:.5px;position:relative;overflow:hidden}
.btn-main:not(:disabled):active{transform:scale(.95)}
.btn-main:disabled{background:rgba(255,255,255,.03);color:rgba(255,255,255,.2);cursor:not-allowed;border-color:rgba(255,255,255,.04)}
.btn-main.gold-mode{
    background:linear-gradient(135deg,#FFD700 0%,#FFA500 100%);
    border-color:rgba(255,215,0,.5);
    box-shadow:0 0 24px rgba(255,215,0,.4);
    animation:goldBtnPulse 1.5s ease-in-out infinite;
}
@keyframes goldBtnPulse{
    0%,100%{box-shadow:0 0 24px rgba(255,215,0,.4)}
    50%{box-shadow:0 0 42px rgba(255,215,0,.85)}
}
.btn-demo{flex:1;height:56px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);font-size:14px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;justify-content:center;transition:all .2s;letter-spacing:.5px;cursor:not-allowed}
.btn-demo.enabled{background:linear-gradient(135deg, #2a2a35 0%, #1a1a24 100%);color:#fff;cursor:pointer}
.btn-demo.enabled:active{transform:scale(.95)}

/* ══════════════════════════════════════════════════════════════
   МОДАЛКИ
   ══════════════════════════════════════════════════════════════ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9000;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s, visibility .25s}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-sheet{background:#0f0f15;border-radius:24px 24px 0 0;width:100%;max-width:450px;max-height:85vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,1,.23,1);border-top:1px solid rgba(255,255,255,.06);overflow:hidden}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
.modal-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.modal-title img{width:20px;height:20px;object-fit:contain}
.modal-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.modal-close:active{transform:scale(.9)}
.modal-search-wrap{padding:12px 20px;flex-shrink:0;position:relative}
.modal-search{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:1.5px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#fff;font-size:14px;outline:none;transition:all .2s;font-family:inherit}
.modal-search:focus{border-color:rgba(36,195,142,.4);background:rgba(36,195,142,.04)}
.modal-search::placeholder{color:rgba(255,255,255,.3)}
.modal-search-icon{position:absolute;left:34px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:2;pointer-events:none}
.modal-body{flex:1;overflow-y:auto;padding:0 20px 20px;overscroll-behavior:contain}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(36,195,142,.2);border-radius:2px}
.modal-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px}
.modal-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;animation:itemIn .3s cubic-bezier(.4,0,.2,1) both}
@keyframes itemIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.modal-item:active{transform:scale(.96)}
.modal-item.selected{border-color:rgba(36,195,142,.6);background:rgba(36,195,142,.08)}
.modal-item.selected::after{content:'';position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center center no-repeat, #24C38E;background-size:12px 12px}
.modal-item-img{width:60px;height:60px;object-fit:contain;margin-bottom:5px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.modal-item-name{font-size:10px;font-weight:700;color:rgba(255,255,255,.85);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-item-price{font-size:10px;font-weight:800;color:rgba(255,255,255,.5);background:rgba(255,255,255,.05);padding:3px 8px;border-radius:7px;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.modal-item-price img{width:9px;height:9px}
.modal-item-chance{font-size:10px;font-weight:900;color:var(--green);background:rgba(36,195,142,.12);padding:3px 8px;border-radius:7px;margin-top:4px;border:1px solid rgba(36,195,142,.2)}
.modal-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:rgba(255,255,255,.3);font-size:13px;font-weight:600}
.modal-empty-icon{width:64px;height:64px;margin:0 auto 16px;opacity:.4}
.modal-empty-icon img{width:100%;height:100%;object-fit:contain}

/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */
.deposit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9600;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;backdrop-filter:blur(8px);transition:opacity .3s,visibility .3s}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{background:#0f0f15;border-radius:24px;width:90%;max-width:360px;padding:24px 20px;transform:scale(.9);transition:transform .3s;border:1px solid rgba(255,255,255,.06)}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.deposit-title{font-weight:800;font-size:18px}

.deposit-methods{display:flex;gap:10px}
.deposit-method{flex:1;padding:16px 10px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s}

.deposit-method img{width:36px;height:36px}
.deposit-method span{font-weight:700;font-size:13px;color:#fff}

/* ══════════════════════════════════════════════════════════════

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:100;width:100%;max-width:450px;height:72px;padding:0 8px calc(var(--safe-bottom) + 8px);background:rgba(10,10,15,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:space-around}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;border-radius:12px;color:rgba(255,255,255,.35);font-weight:600;text-decoration:none;transition:all .2s}

.bnav-item.active{background:rgba(36,195,142,.1);color:#24C38E}
.bnav-item.active svg{transform:scale(1.1)}

.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

.toast.ok{border-color:rgba(36,195,142,.3);color:#24C38E}
.toast.err{border-color:rgba(255,48,100,.3);color:#FF3064}

/* ══════════════════════════════════════════════════════════════

.gold-overlay{
    position:fixed;inset:0;z-index:9700;

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var tg = window.Telegram && window.Telegram.WebApp;
var userId = null;
var userInventory = [];
var selectedGift = null;
var targetGift = null;
var possibleTargets = [];
var isSpinning = false;
var currentChance = 0;
var _inventorySearchQ = '';
var _targetsSearchQ = '';

/* GOLD: шанс появления золотой полосы 10%, шанс выпадения золота 5% */
var GOLD_APPEAR_CHANCE = 0.10;   // 10% что золотая полоса появится
var GOLD_WIN_CHANCE = 0.05;      // 5% что выпадет золото (если полоса появилась)
var _goldActive = false;         // золотая полоса сейчас на колесе
var _goldWillWin = false;        // предрешено ли выпадение золота

function $(id){ return document.getElementById(id); }

function showTgAlert(msg, cb){
    if(tg && tg.showAlert){ tg.showAlert(msg, cb); }
    else { alert(msg); if(cb) cb(); }
}

function showToast(msg, type, iconUrl){
    var t = $('toast');
    if(!t) return;
    var icon = iconUrl ? '<img src="' + iconUrl + '" alt="">' : '';
    t.innerHTML = icon + '<span>' + msg + '</span>';
    t.className = 'toast show ' + (type || '');
    setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

/* ══════════════════════════════════════════════════════════════
   LOADING
   ══════════════════════════════════════════════════════════════ */
(function initLoadingWheel(){
    var group = document.getElementById('ldRisks');
    if(!group) return;
    var cx = 100, cy = 100, rOuter = 86;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 7 : 4;
        var width = isMajor ? 1.6 : 1;
        var opacity = isMajor ? 0.7 : 0.35;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 1);
        var y1 = cy + Math.sin(rad) * (rOuter - 1);
        var x2 = cx + Math.cos(rad) * (rOuter - 1 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 1 - len);
        html += '<line class="ld-tick" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="rgba(255,255,255,' + opacity + ')" stroke-width="' + width + '"/>';
    }
    group.innerHTML = html;
})();

var _ldP = 0;
function setLoadingProgress(pct){
    if(pct <= _ldP) return;
    _ldP = pct;
    var bar = $('loadingBar');
    var txt = $('loadingText');
    if(bar) bar.style.width = pct + '%';
    if(txt) txt.textContent = 'LOADING ' + Math.round(pct) + '%';
}
function hideLoadingScreen(){
    setLoadingProgress(100);
    setTimeout(function(){
        var ls = $('loadingScreen');
        if(ls){ ls.classList.add('hidden'); setTimeout(function(){ ls.style.display = 'none'; }, 500); }
    }, 200);
}
var _simInterval = setInterval(function(){
    if(_ldP >= 60){ clearInterval(_simInterval); return; }
    _ldP += 2;
    var bar = $('loadingBar');
    var txt = $('loadingText');
    if(bar) bar.style.width = _ldP + '%';
    if(txt) txt.textContent = 'LOADING ' + Math.round(_ldP) + '%';
}, 40);

/* ══════════════════════════════════════════════════════════════
   РИСКИ
   ══════════════════════════════════════════════════════════════ */
(function drawRisks(){
    var group = document.getElementById('risksGroup');
    if(!group) return;
    var cx = 120, cy = 120, rOuter = 104;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 8 : 5;
        var width = isMajor ? 1.8 : 1;
        var opacity = isMajor ? 0.7 : 0.3;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 1);
        var y1 = cy + Math.sin(rad) * (rOuter - 1);
        var x2 = cx + Math.cos(rad) * (rOuter - 1 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 1 - len);
        html += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="rgba(255,255,255,' + opacity + ')" stroke-width="' + width + '" stroke-linecap="round"/>';
    }
    group.innerHTML = html;
})();

/* ══════════════════════════════════════════════════════════════
   ЗЕЛЁНАЯ ЗОНА
   ══════════════════════════════════════════════════════════════ */
function drawGreenArc(chance){
    var path = $('greenPath');
    if(!path) return;
    if(!chance || chance <= 0){ path.setAttribute('d', ''); return; }
    var cx = 120, cy = 120, r = 104;
    var startAngle = -90;
    var endAngle = startAngle + (chance / 100) * 360;
    function polar(a){
        var rad = a * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }
    var start = polar(startAngle);
    var end = polar(endAngle);
    var largeArc = (chance > 50) ? 1 : 0;
    var d = 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + end.x.toFixed(2) + ' ' + end.y.toFixed(2);
    path.setAttribute('d', d);
}

/* ══════════════════════════════════════════════════════════════
   ЗОЛОТАЯ ПОЛОСА (появляется при апгрейде)
   ══════════════════════════════════════════════════════════════ */
function showGoldArc(){
    /* Золотая полоса появляется ПОВЕРХ зелёной, чуть смещена
       в начале — маленький сегмент (например 1/6 от верха) */
    var path = $('goldPath');
    if(!path) return;
    var cx = 120, cy = 120, r = 104;
    /* Небольшой золотой сегмент — 25 градусов */
    var startAngle = -90;
    var endAngle = startAngle + 25;
    function polar(a){
        var rad = a * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }
    var start = polar(startAngle);
    var end = polar(endAngle);
    var d = 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 0 1 ' + end.x.toFixed(2) + ' ' + end.y.toFixed(2);
    path.setAttribute('d', d);

    var arc = $('goldArc');
    var hint = $('goldRingHint');
    if(arc){ arc.classList.add('visible'); }
    if(hint){ hint.classList.add('show'); }

    /* Пульсация после появления */
    setTimeout(function(){
        if(arc) arc.classList.add('pulsing');
    }, 400);
}

function hideGoldArc(){
    var arc = $('goldArc');
    var hint = $('goldRingHint');
    if(arc){ arc.classList.remove('visible','pulsing'); }
    if(hint){ hint.classList.remove('show'); }
    _goldActive = false;
    _goldWillWin = false;
}

function pulseGoldArcStrong(){
    /* Когда выпало золото — усилить свечение */
    var arc = $('goldArc');
    if(arc){
        arc.classList.add('visible','pulsing');
        arc.style.filter = 'drop-shadow(0 0 30px rgba(255,215,0,1))';
    }
    var hint = $('goldRingHint');
    if(hint) hint.classList.add('show');
    var center = $('wheelCenter');
    if(center) center.classList.add('gold-glow');
}

async function loadPossibleTargets(){
    if(!selectedGift) return;
    try{
        var r = await fetch('/api/upgrade-possible-gifts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: userId, current_gift_id: selectedGift.id})
        });
        var d = await r.json();
        if(!d.success) return;
        possibleTargets = [];
        (d.possible_gifts || []).forEach(function(g){
            if(g.value > selectedGift.value && g.value <= selectedGift.value * 10){
                var ch = Math.max(10, Math.min((selectedGift.value / g.value) * 100, 100));
                g.upgrade_chance = Math.round(ch * 10) / 10;
                possibleTargets.push(g);
            }
        });
        possibleTargets.sort(function(a, b){ return a.value - b.value; });
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   СПИН
   ══════════════════════════════════════════════════════════════ */
async function doUpgrade(){
    if(isSpinning || !targetGift || !selectedGift) return;
    isSpinning = true;

    var btn = $('upgradeBtn');
    btn.disabled = true;
    $('upgradeBtnText').textContent = 'Крутим...';

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(!rotator || !greenArc) return;

    /* Откат назад перед разгоном */
    rotator.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    greenArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    if(goldArc) goldArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    rotator.style.transform = 'rotate(-20deg)';
    greenArc.style.transform = 'rotate(-20deg)';
    if(goldArc) goldArc.style.transform = 'rotate(-20deg)';

    /* GOLD: решаем появится ли золотая полоса (10%) и выиграет ли она (5% от появления) */
    var willShowGold = Math.random() < GOLD_APPEAR_CHANCE;
    var goldWillWin = willShowGold && (Math.random() < GOLD_WIN_CHANCE);

    /* Запрос к серверу */
    var result;
    try{
        var r = await fetch('/api/upgrade-multi', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: userId,
                inventory_ids: [selectedGift.id],
                target_gift_id: targetGift.fragment_slug || targetGift.id
            })
        });
        result = await r.json();
    }catch(e){
        result = {success: false, error: 'Ошибка сети'};
    }

    if(!result.success){
        rotator.style.transition = 'transform 0.5s ease';
        greenArc.style.transition = 'transform 0.5s ease';
        rotator.style.transform = 'rotate(0deg)';
        greenArc.style.transform = 'rotate(0deg)';
        if(goldArc) goldArc.style.transform = 'rotate(0deg)';
        btn.disabled = false;
        $('upgradeBtnText').textContent = 'Апгрейд';
        isSpinning = false;
        showTgAlert(result.error || 'Ошибка');
        return;
    }

    /* GOLD перезаписывает исход: если золото выигрывает — считаем как WIN с золотой анимацией */
    var finalWin = goldWillWin ? true : result.upgrade_success;

    spinWheel(result.chance, finalWin, false, willShowGold, goldWillWin);
}

function doDemo(){
    if(isSpinning) return;
    if(!selectedGift || !targetGift){
        showToast('Выберите подарок и цель', 'err', '/static/img/gift.png');
        return;
    }
    isSpinning = true;
    var willShowGold = Math.random() < GOLD_APPEAR_CHANCE;
    var goldWillWin = willShowGold && (Math.random() < GOLD_WIN_CHANCE);
    var isWin = goldWillWin ? true : (Math.random() * 100 < currentChance);
    spinWheel(currentChance, isWin, true, willShowGold, goldWillWin);
}

/* ══════════════════════════════════════════════════════════════
   СПИН КОЛЕСА
   ══════════════════════════════════════════════════════════════ */
function spinWheel(chance, isWin, isDemo, willShowGold, goldWillWin){
    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(!rotator || !greenArc) return;

    /* Откат назад */
    rotator.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    greenArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    if(goldArc) goldArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    rotator.style.transform = 'rotate(-20deg)';
    greenArc.style.transform = 'rotate(-20deg)';
    if(goldArc) goldArc.style.transform = 'rotate(-20deg)';

    /* Угол приземления */
    var landAngle;
    if(goldWillWin){
        /* Приземление в золотой сегмент (-90° начало, ширина 25°) */
        landAngle = 90 + 5 + Math.random() * 15; /* внутри 25° сегмента */
    } else if(isWin){
        landAngle = (chance * 0.15) + Math.random() * (chance * 0.7);
    } else {
        /* Если золото показано, но не выиграло — не попадаем в золотой сегмент */
        if(willShowGold){
            var goldStart = 90;
            var goldEnd = 90 + 25;
            do {
                landAngle = chance + Math.random() * (360 - chance);
            } while(landAngle >= goldStart - 10 && landAngle <= goldEnd + 10);
        } else {
            landAngle = chance + Math.random() * (360 - chance);
        }
    }

    var totalSpin = 360 * (10 + Math.floor(Math.random() * 5)) + (360 - landAngle);
    var spinDuration = goldWillWin ? 9500 : 7500;

    /* Через 400мс после отката — показываем золотую полосу (если должна) */
    if(willShowGold){
        setTimeout(function(){
            showGoldArc();
            _goldActive = true;
            _goldWillWin = goldWillWin;
            /* Вспышка, когда появилась */
            var flash = $('wheelFlash');
            if(flash){
                flash.classList.remove('win','fail','gold','show');
                void flash.offsetWidth;
                flash.classList.add('gold','show');
            }
            showToast('✨ GOLD CHANCE! ✨', 'gold');
            try{
                if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            }catch(e){}
        }, 350);
    }

    setTimeout(function(){
        var trans = 'transform ' + spinDuration + 'ms cubic-bezier(.15,.7,.15,1)';
        rotator.style.transition = trans;
        greenArc.style.transition = trans;
        if(goldArc) goldArc.style.transition = trans;
        rotator.style.transform = 'rotate(' + totalSpin + 'deg)';
        greenArc.style.transform = 'rotate(' + totalSpin + 'deg)';
        if(goldArc) goldArc.style.transform = 'rotate(' + totalSpin + 'deg)';

        /* Если золото выигрывает — замедляем в конце и пульсируем */
        if(goldWillWin){
            var slowdownTime = spinDuration - 1500;
            setTimeout(function(){
                /* Усилить свечение золотой полосы */
                pulseGoldArcStrong();
                showToast('✨ ЗОЛОТО! ✨', 'gold');
            }, slowdownTime);
        }

        setTimeout(function(){
            showSpinResult(isWin, isDemo, goldWillWin);
        }, spinDuration);
    }, 500);
}

/* ══════════════════════════════════════════════════════════════
   РЕЗУЛЬТАТ — анимации
   ══════════════════════════════════════════════════════════════ */
function showSpinResult(isWin, isDemo, isGold){
    var flash = $('wheelFlash');
    var result = $('wheelResult');
    var resultImg = $('wheelResultImg');
    var wheelWrap = $('wheelWrap');

    /* Вспышка */
    if(flash){
        flash.classList.remove('win','fail','gold','show');
        void flash.offsetWidth;
        flash.classList.add(isGold ? 'gold' : (isWin ? 'win' : 'fail'));
        flash.classList.add('show');
    }

    /* Тряска при проигрыше */
    if(!isWin && !isGold && wheelWrap){
        wheelWrap.classList.remove('shake');
        void wheelWrap.offsetWidth;
        wheelWrap.classList.add('shake');
        setTimeout(function(){ wheelWrap.classList.remove('shake'); }, 600);
    }

    /* PNG результата */
    if(result && resultImg){
        result.classList.remove('show','fail','gold');

        if(isGold){
            /* GOLD WIN: сначала PNG ставки + PNG желаемого летят в центр */
            startGoldFlyAnimation(function(){
                /* После прилёта — показываем ПОДАРОК ЦЕЛИ в центре */
                resultImg.src = targetGift.image || '/static/img/star2.png';
                resultImg.onerror = function(){
                    this.onerror = null;
                    this.src = '/static/img/star2.png';
                };
                result.classList.add('show','gold');
                /* Конфетти и звёзды */
                spawnStars();
                launchConfetti();
                /* Оверлей GOLD */
                setTimeout(showGoldOverlay, 1200);
            });
        } else if(isWin){
            /* Обычная победа: PNG выигранного подарка в центре */
            resultImg.src = targetGift.image || '/static/img/star2.png';
            resultImg.onerror = function(){
                this.onerror = null;
                this.src = '/static/img/star2.png';
            };
            result.classList.add('show');
            spawnStars();
            launchConfetti();
        } else {
            /* Проигрыш: PNG ставки в центре, мягко светится и "взрывается" */
            resultImg.src = selectedGift.image || '/static/img/gift.png';
            resultImg.onerror = function(){
                this.onerror = null;
                this.src = '/static/img/gift.png';
            };
            result.classList.add('show','fail');
            /* Через 1 сек — мягкий "взрыв" */
            setTimeout(function(){
                if(wheelWrap){
                    wheelWrap.classList.add('fail-explode');
                    setTimeout(function(){ wheelWrap.classList.remove('fail-explode'); }, 1400);
                }
            }, 1000);
        }
    }

    /* Вибрация */
    try{
        if(tg && tg.HapticFeedback){
            tg.HapticFeedback.notificationOccurred((isWin || isGold) ? 'success' : 'error');
        }
    }catch(e){}

    /* Тосты */
    var toastMsg, toastType, toastIcon;
    if(isDemo){
        toastMsg = isGold ? 'DEMO: GOLD!' : (isWin ? 'Демо: победа!' : 'Демо: неудача');
        toastType = (isWin || isGold) ? 'ok' : 'err';
    } else {
        toastMsg = isGold ? '✨ GOLD WIN! ✨' : (isWin ? 'Апгрейд успешен!' : 'Апгрейд не удался');
        toastType = isGold ? 'gold' : ((isWin) ? 'ok' : 'err');
    }
    toastIcon = (isWin || isGold) ? '/static/gifs/win.gif' : '/static/gifs/lose.gif';
    showToast(toastMsg, toastType, toastIcon);

    /* Сброс */
    var resetDelay = isGold ? 4500 : 2500;
    setTimeout(function(){
        hideResult();
        if(isDemo){
            isSpinning = false;
            var rotator = $('wheelRotator');
            var greenArc = $('greenArc');
            var goldArc = $('goldArc');
            if(rotator){ rotator.style.transition = 'transform 0.6s ease'; rotator.style.transform = 'rotate(0deg)'; }
            if(greenArc){ greenArc.style.transition = 'transform 0.6s ease'; greenArc.style.transform = 'rotate(0deg)'; }
            if(goldArc){ goldArc.style.transition = 'transform 0.6s ease'; goldArc.style.transform = 'rotate(0deg)'; }
            var btn = $('upgradeBtn'); if(btn) btn.disabled = false;
            var btnText = $('upgradeBtnText'); if(btnText) btnText.textContent = 'Апгрейд';
            hideGoldArc();
            drawGreenArc(currentChance);
            updateWheel();
        } else {
            resetAfterSpin();
            loadInventory();
            loadTopBar();
        }
    }, resetDelay);
}

/* ══════════════════════════════════════════════════════════════
   GOLD: анимация полёта PNG в центр
   ══════════════════════════════════════════════════════════════ */
function startGoldFlyAnimation(callback){
    var flyLeft = $('flyLeft');
    var flyRight = $('flyRight');
    var flyLeftImg = $('flyLeftImg');
    var flyRightImg = $('flyRightImg');

    if(!flyLeft || !flyRight || !flyLeftImg || !flyRightImg){
        if(callback) callback();
        return;
    }

    /* PNG слева — ставка */
    flyLeftImg.src = selectedGift.image || '/static/img/gift.png';
    flyLeftImg.onerror = function(){ this.onerror = null; this.src = '/static/img/gift.png'; };
    /* PNG справа — желаемый подарок */
    flyRightImg.src = targetGift.image || '/static/img/star2.png';
    flyRightImg.onerror = function(){ this.onerror = null; this.src = '/static/img/star2.png'; };

    /* Сброс */
    flyLeft.classList.remove('flying');
    flyRight.classList.remove('flying');
    void flyLeft.offsetWidth;
    void flyRight.offsetWidth;

    /* Запуск */
    flyLeft.classList.add('flying');
    flyRight.classList.add('flying');

    /* Через 1.2 сек — колбэк (PNG цели в центре) */
    setTimeout(function(){
        flyLeft.classList.remove('flying');
        flyRight.classList.remove('flying');
        if(callback) callback();
    }, 1200);
}

/* ══════════════════════════════════════════════════════════════
   GOLD OVERLAY (финальное окно)
   ══════════════════════════════════════════════════════════════ */
function showGoldOverlay(){
    var ov = $('goldOverlay');
    var img = $('goldGiftImg');
    var name = $('goldGiftName');
    var val = $('goldGiftValue');

    if(img){
        img.src = targetGift.image || '/static/img/star2.png';
        img.onerror = function(){ this.onerror = null; this.src = '/static/img/star2.png'; };
    }
    if(name) name.textContent = targetGift.name || 'GOLD GIFT';
    if(val){
        /* Стоимость = ставка + выигрыш */
        var total = (selectedGift.value || 0) + (targetGift.value || 0);
        val.textContent = (total / 100).toFixed(2);
    }
    if(ov) ov.classList.add('show');
}

function closeGoldOverlay(){
    var ov = $('goldOverlay');
    if(ov) ov.classList.remove('show');
}

function hideResult(){
    var flash = $('wheelFlash');
    var result = $('wheelResult');
    if(flash) flash.classList.remove('show','win','fail','gold');
    if(result) result.classList.remove('show','fail','gold');
}

/* ══════════════════════════════════════════════════════════════
   ЗВЁЗДОЧКИ ПРИ ПОБЕДЕ
   ══════════════════════════════════════════════════════════════ */
function spawnStars(){
    var wheel = $('wheelWrap');
    if(!wheel) return;
    var N = 14;
    for(var i = 0; i < N; i++){
        (function(idx){
            setTimeout(function(){
                var star = document.createElement('div');
                star.className = 'star-particle';
                var angle = (idx / N) * 360;
                var radius = 120 + Math.random() * 40;
                var rad = angle * Math.PI / 180;
                var x = Math.cos(rad) * radius;
                var y = Math.sin(rad) * radius;
                star.style.left = 'calc(50% + ' + x + 'px)';
                star.style.top = 'calc(50% + ' + y + 'px)';
                star.innerHTML = '<img src="/static/img/star.png" alt="">';
                wheel.appendChild(star);
                setTimeout(function(){ star.remove(); }, 1500);
            }, idx * 40);
        })(i);
    }
}

/* ══════════════════════════════════════════════════════════════
   СБРОС
   ══════════════════════════════════════════════════════════════ */
function resetAfterSpin(){
    isSpinning = false;
    selectedGift = null;
    targetGift = null;
    currentChance = 0;

    $('leftCard').classList.remove('has-item');
    $('rightCard').classList.remove('has-item');
    $('rightChance').style.display = 'none';
    $('chancePct').textContent = '0.00%';
    $('upgradeBtn').disabled = true;
    $('upgradeBtnText').textContent = 'Апгрейд';

    var demoBtn = $('demoBtn');
    if(demoBtn){ demoBtn.disabled = true; demoBtn.classList.remove('enabled'); }

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(rotator){ rotator.style.transition = 'transform 0.6s ease'; rotator.style.transform = 'rotate(0deg)'; }
    if(greenArc){ greenArc.style.transition = 'transform 0.6s ease'; greenArc.style.transform = 'rotate(0deg)'; }
    if(goldArc){ goldArc.style.transition = 'transform 0.6s ease'; goldArc.style.transform = 'rotate(0deg)'; }

    var center = $('wheelCenter');
    if(center) center.classList.remove('gold-glow');

    hideResult();
    hideGoldArc();
    drawGreenArc(0);
}

/* ══════════════════════════════════════════════════════════════
   КОНФЕТТИ
   ══════════════════════════════════════════════════════════════ */
function launchConfetti(){
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;z-index:9998;pointer-events:none';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var particles = [];
    var colors = ['#24C38E','#10b981','#FFD700','#FF6B9D','#4ade80','#FFA500'];
    for(var i = 0; i < 130; i++){
        particles.push({
            x: canvas.width / 2 + (Math.random() - .5) * 100,
            y: canvas.height / 2,
            vx: (Math.random() - .5) * 14,
            vy: -Math.random() * 16 - 4,
            w: Math.random() * 8 + 3,
            h: Math.random() * 6 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * 360,
            rv: (Math.random() - .5) * 12,
            life: 1
        });
    }
    function draw(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var alive = false;
        particles.forEach(function(p){
            if(p.life <= 0) return;
            alive = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rot += p.rv;
            p.life -= 0.01;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot * Math.PI / 180);
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
        });
        if(alive) requestAnimationFrame(draw);
        else canvas.remove();
    }
    draw();
}
