<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rasswet - Апгрейд</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#0a0a0f;
    --text:#fff;
    --blue:#2844FB;
    --blue-light:#4B81F5;
    --green:#24C38E;
    --red:#FF3064;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --tg-header:56px;
}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0a0a0f;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a1a2e 0%, #0a0a0f 60%);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-user-select:none;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ═══════════ TOP BAR ═══════════ */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 16px;
    padding-top:calc(var(--safe-top) + var(--tg-header));
    position:relative;
    z-index:10;
}
.top-left{display:flex;align-items:center;gap:8px}
.user-pill{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 10px 4px 4px;
    border-radius:20px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.04);
}
.top-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.top-nick{
    font-size:13px;
    font-weight:600;
    max-width:90px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.top-right{display:flex;gap:8px;align-items:center}
.bal-pill{
    display:flex;
    align-items:center;
    gap:5px;
    padding:6px 12px;
    border-radius:20px;
    background:rgba(40,68,251,.15);
    border:1px solid rgba(75,129,245,.3);
    font-weight:800;
    font-size:13px;
    color:#fff;
}
.bal-pill img{width:14px;height:14px}
.bal-plus{
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(40,68,251,.2);
    border:1px solid rgba(75,129,245,.4);
    color:#4B81F5;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .2s;
}
.bal-plus:active{transform:scale(.9);background:rgba(40,68,251,.35)}

/* ═══════════ WRAPPER ═══════════ */
.upgrade-wrap{
    max-width:450px;
    margin:0 auto;
    padding:4px 16px calc(var(--safe-bottom) + 100px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

/* ═══════════ ПАНЕЛЬ ВЫБОРА ═══════════ */
.select-panel{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:8px;
}
.select-card{
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative;
    min-height:160px;
    justify-content:center;
    overflow:hidden;
}
.select-card:active{transform:scale(.97)}
.select-card.has-item{
    border-color:rgba(40,68,251,.4);
    background:linear-gradient(180deg, rgba(40,68,251,.08), rgba(40,68,251,.01));
}
.select-card-title{
    font-size:12px;
    font-weight:700;
    color:rgba(255,255,255,.5);
    text-transform:uppercase;
    letter-spacing:.5px;
    text-align:center;
    line-height:1.2;
}
.select-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}
.select-empty-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:rgba(255,255,255,.04);
    border:2px dashed rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    color:rgba(255,255,255,.3);
}
.select-empty-text{
    font-size:11px;
    color:rgba(255,255,255,.3);
    font-weight:600;
}
.select-filled{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:6px;
    width:100%;
}
.select-card.has-item .select-empty{display:none}
.select-card.has-item .select-filled{display:flex;animation:cardPop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardPop{
    0%{transform:scale(.7);opacity:0}
    60%{transform:scale(1.08)}
    100%{transform:scale(1);opacity:1}
}
.select-img{
    width:70px;
    height:70px;
    object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
}
.select-name{
    font-size:11px;
    font-weight:700;
    color:#fff;
    text-align:center;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.select-price{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:3px 10px;
    background:rgba(40,68,251,.12);
    border-radius:10px;
    font-size:11px;
    font-weight:800;
    color:#60A5FA;
    line-height:1;
}
.select-price img{width:11px;height:11px}
.select-chance{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 12px;
    background:rgba(36,195,142,.12);
    border:1px solid rgba(36,195,142,.3);
    border-radius:10px;
    font-size:13px;
    font-weight:900;
    color:var(--green);
    line-height:1;
    margin-top:4px;
}

/* ═══════════ КОЛЕСО ═══════════ */
.wheel-section{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 0;
    position:relative;
}
.wheel-wrap{
    position:relative;
    width:300px;
    height:300px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Стрелка сверху */
.wheel-pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    width:44px;
    height:44px;
    pointer-events:none;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.8));
}
.wheel-pointer svg{
    width:100%;
    height:100%;
    display:block;
}

/* ★ БАЗОВЫЙ КРУГ — часть колеса */
.wheel-rotator{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    will-change:transform;
    transform-origin:50% 50%;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform:translateZ(0);
}
.wheel-rotator svg{
    width:100%;
    height:100%;
    display:block;
}

/* ★ ЗЕЛЁНАЯ ЗОНА — тоже часть колеса, крутится вместе с ним */
.wheel-green-arc{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
    transform-origin:50% 50%;
    will-change:transform;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

/* Центр колеса */
.wheel-center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:130px;
    height:130px;
    border-radius:50%;
    background:radial-gradient(circle, #15151c 0%, #0a0a0f 100%);
    border:2px solid rgba(255,255,255,.06);
    box-shadow:
        inset 0 0 30px rgba(0,0,0,.9),
        0 0 0 6px rgba(10,10,15,.95);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    overflow:hidden;
    transition:all .3s ease;
}
.wheel-center-img{
    position:absolute;
    width:80px;
    height:80px;
    object-fit:contain;
    opacity:0;
    transition:opacity .3s ease;
    z-index:2;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.wheel-center-img.visible{opacity:1}
.wheel-center-pct{
    position:absolute;
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
    color:#fff;
    opacity:0;
    transition:opacity .3s ease;
    z-index:3;
}
.wheel-center-pct.visible{opacity:1}

/* ═══════════ КНОПКИ ═══════════ */
.actions-row{
    width:100%;
    display:flex;
    gap:10px;
}
.btn-main{
    flex:2;
    height:56px;
    border-radius:16px;
    background:linear-gradient(90deg,#2844FB,#4B81F5);
    color:#fff;
    font-size:16px;
    font-weight:800;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s;
    letter-spacing:.5px;
}
.btn-main:not(:disabled):active{transform:scale(.95)}
.btn-main:disabled{
    background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.25);
    cursor:not-allowed;
}
.btn-demo{
    flex:1;
    height:56px;
    border-radius:16px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
    font-size:14px;
    font-weight:800;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s;
    letter-spacing:.5px;
}
.btn-demo:active{transform:scale(.95)}

/* ═══════════ МОДАЛКИ ═══════════ */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:9000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s, visibility .25s;
}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-sheet{
    background:#0f0f15;
    border-radius:24px 24px 0 0;
    width:100%;
    max-width:450px;
    max-height:85vh;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.32,1,.23,1);
    border-top:1px solid rgba(255,255,255,.06);
    overflow:hidden;
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 12px;
    border-bottom:1px solid rgba(255,255,255,.04);
    flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:800;color:#fff}
.modal-close{
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,48,100,.12);
    color:var(--red);
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s;
}
.modal-close:active{transform:scale(.9)}
.modal-search-wrap{
    padding:12px 20px;
    flex-shrink:0;
    position:relative;
}
.modal-search{
    width:100%;
    padding:12px 16px 12px 42px;
    border-radius:14px;
    border:1.5px solid rgba(255,255,255,.06);
    background:rgba(255,255,255,.03);
    color:#fff;
    font-size:14px;
    outline:none;
    transition:all .2s;
    font-family:inherit;
}
.modal-search:focus{
    border-color:rgba(40,68,251,.5);
    background:rgba(40,68,251,.05);
}
.modal-search::placeholder{color:rgba(255,255,255,.3)}
.modal-search-icon{
    position:absolute;
    left:34px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    stroke:rgba(255,255,255,.35);
    fill:none;
    stroke-width:2;
    pointer-events:none;
}
.modal-body{
    flex:1;
    overflow-y:auto;
    padding:0 20px 20px;
    overscroll-behavior:contain;
}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(40,68,251,.2);border-radius:2px}
.modal-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
}
.modal-item{
    background:rgba(255,255,255,.03);
    border:1.5px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:10px 6px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    transition:all .2s;
    position:relative;
    overflow:hidden;
    animation:itemIn .3s cubic-bezier(.4,0,.2,1) both;
}
@keyframes itemIn{
    0%{opacity:0;transform:scale(.9)}
    100%{opacity:1;transform:scale(1)}
}
.modal-item:active{transform:scale(.96)}
.modal-item.selected{
    border-color:var(--blue);
    background:rgba(40,68,251,.1);
}
.modal-item.selected::after{
    content:'✓';
    position:absolute;
    top:5px;
    right:5px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--blue);
    color:#fff;
    font-size:11px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
}
.modal-item-img{
    width:60px;
    height:60px;
    object-fit:contain;
    margin-bottom:5px;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));
}
.modal-item-name{
    font-size:10px;
    font-weight:700;
    color:rgba(255,255,255,.85);
    text-align:center;
    width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.modal-item-price{
    font-size:10px;
    font-weight:800;
    color:#60A5FA;
    background:rgba(40,68,251,.1);
    padding:3px 8px;
    border-radius:7px;
    margin-top:4px;
    display:inline-flex;
    align-items:center;
    gap:3px;
}
.modal-item-price img{width:9px;height:9px}
.modal-item-chance{
    font-size:10px;
    font-weight:900;
    color:var(--green);
    background:rgba(36,195,142,.12);
    padding:3px 8px;
    border-radius:7px;
    margin-top:4px;
    border:1px solid rgba(36,195,142,.2);
}
.modal-empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px 20px;
    color:rgba(255,255,255,.3);
    font-size:13px;
    font-weight:600;
}
.modal-empty::before{
    content:'📭';
    display:block;
    font-size:32px;
    margin-bottom:12px;
    opacity:.5;
}

/* ═══════════ DEPOSIT ═══════════ */
.deposit-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:9600;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    backdrop-filter:blur(8px);
    transition:opacity .3s,visibility .3s;
}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{
    background:#0f0f15;
    border-radius:24px;
    width:90%;
    max-width:360px;
    padding:24px 20px;
    transform:scale(.9);
    transition:transform .3s;
    border:1px solid rgba(255,255,255,.06);
}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}
.deposit-title{font-weight:800;font-size:18px}
.deposit-close{
    width:32px;
    height:32px;
    border-radius:10px;
    background:rgba(255,48,100,.1);
    color:var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}
.deposit-methods{display:flex;gap:10px}
.deposit-method{
    flex:1;
    padding:16px 10px;
    border-radius:16px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.05);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:transform .15s;
}
.deposit-method:active{transform:scale(.96)}
.deposit-method img{width:36px;height:36px}
.deposit-method span{font-weight:700;font-size:13px;color:#fff}

/* ═══════════ BOTTOM NAV ═══════════ */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    width:100%;
    max-width:450px;
    height:72px;
    padding:0 8px calc(var(--safe-bottom) + 8px);
    background:rgba(10,10,15,.95);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.04);
    display:flex;
    align-items:center;
    justify-content:space-around;
}
.bnav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 16px;
    border-radius:12px;
    color:rgba(255,255,255,.35);
    font-weight:600;
    text-decoration:none;
    transition:all .2s;
}
.bnav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.bnav-item span{font-size:10px}
.bnav-item.active{background:rgba(40,68,251,.12);color:#4B81F5}
.bnav-item.active svg{transform:scale(1.1)}
.bnav-item:active{transform:scale(.9)}

/* ═══════════ TOAST ═══════════ */
.toast{
    position:fixed;
    top:80px;
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:rgba(20,20,30,.95);
    border:1px solid rgba(255,255,255,.08);
    padding:12px 20px;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    z-index:9999;
    opacity:0;
    visibility:hidden;
    transition:all .3s;
    max-width:90%;
    text-align:center;
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(36,195,142,.3);color:var(--green)}
.toast.err{border-color:rgba(255,48,100,.3);color:var(--red)}

/* ═══════════ АДАПТИВ ═══════════ */
@media(max-width:380px){
    .wheel-wrap{width:270px;height:270px}
    .wheel-center{width:110px;height:110px}
    .wheel-center-img{width:66px;height:66px}
    .wheel-center-pct{font-size:24px}
    .select-card{min-height:150px;padding:12px 10px}
    .select-img{width:60px;height:60px}
    .wheel-pointer{width:40px;height:40px;top:-4px}
}
@media(max-width:340px){
    .wheel-wrap{width:240px;height:240px}
    .wheel-center{width:100px;height:100px}
    .wheel-center-img{width:58px;height:58px}
    .wheel-center-pct{font-size:22px}
    .wheel-pointer{width:36px;height:36px;top:-2px}
}
</style>
</head>
<body>

<div class="top-bar">
    <div class="top-left">
        <div class="user-pill">
            <img class="top-avatar" id="topAvatar" src="/static/img/default_avatar.png" alt="">
            <span class="top-nick" id="topNick">—</span>
        </div>
    </div>
    <div class="top-right">
        <div class="bal-pill">
            <img src="/static/img/ton.png" alt="">
            <span id="balVal">0.00</span>
        </div>
        <button class="bal-plus" onclick="openDeposit()">+</button>
    </div>
</div>

<div class="upgrade-wrap">

    <div class="select-panel">
        <div class="select-card" id="leftCard" onclick="openInventoryModal()">
            <div class="select-card-title">Ваша ставка</div>
            <div class="select-empty">
                <div class="select-empty-icon">+</div>
                <div class="select-empty-text">Добавить</div>
            </div>
            <div class="select-filled">
                <img class="select-img" id="leftGiftImg" src="/static/img/gift.png" alt="">
                <div class="select-name" id="leftGiftName"></div>
                <div class="select-price">
                    <img src="/static/img/ton.png"><span id="leftGiftValue">0.00</span>
                </div>
            </div>
        </div>

        <div class="select-card" id="rightCard" onclick="openTargetsModal()">
            <div class="select-card-title">Желаемый<br>подарок</div>
            <div class="select-empty">

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var tg = window.Telegram && window.Telegram.WebApp;
var userId = null;
var userInventory = [];
var selectedGift = null;
var targetGift = null;
var possibleTargets = [];
var isSpinning = false;
var currentChance = 0;
var _inventorySearchQ = '';
var _targetsSearchQ = '';

function $(id){ return document.getElementById(id); }

function showTgAlert(msg, cb){
    if(tg && tg.showAlert){ tg.showAlert(msg, cb); }
    else { alert(msg); if(cb) cb(); }
}

function showToast(msg, type){
    var t = $('toast');
    if(!t) return;
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

/* ══════════════════════════════════════════════════════════════
   РИСКИ НА КОЛЕСЕ
   ══════════════════════════════════════════════════════════════ */
(function drawRisks(){
    var group = document.getElementById('risksGroup');
    if(!group) return;
    var cx = 120, cy = 120;
    var rOuter = 104;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 8 : 5;
        var width = isMajor ? 1.8 : 1;
        var opacity = isMajor ? 0.7 : 0.3;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 1);
        var y1 = cy + Math.sin(rad) * (rOuter - 1);
        var x2 = cx + Math.cos(rad) * (rOuter - 1 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 1 - len);
        html += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1)
              + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1)
              + '" stroke="rgba(255,255,255,' + opacity + ')"'
              + ' stroke-width="' + width + '" stroke-linecap="round"/>';
    }
    group.innerHTML = html;
})();

/* ══════════════════════════════════════════════════════════════
   ★ ЗЕЛЁНАЯ ЗОНА — рисуем на том же кольце что и риски
   ══════════════════════════════════════════════════════════════ */
function drawGreenArc(chance){
    var path = $('greenPath');
    if(!path) return;

    if(!chance || chance <= 0){
        path.setAttribute('d', '');
        return;
    }

    var cx = 120, cy = 120;
    var r = 104;
    var startAngle = -90;
    var endAngle = startAngle + (chance / 100) * 360;

    function polar(angleDeg){
        var rad = angleDeg * Math.PI / 180;
        return {
            x: cx + r * Math.cos(rad),
            y: cy + r * Math.sin(rad)
        };
    }

    var start = polar(startAngle);
    var end = polar(endAngle);
    var largeArc = (chance > 50) ? 1 : 0;

    var d = 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2)
          + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 '
          + end.x.toFixed(2) + ' ' + end.y.toFixed(2);

    path.setAttribute('d', d);
}

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            var u = d.user;
            $('topNick').textContent = u.first_name || u.username || 'User';
            if(u.photo_url) $('topAvatar').src = u.photo_url;
            $('balVal').textContent = ((u.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   ИНВЕНТАРЬ
   ══════════════════════════════════════════════════════════════ */
async function loadInventory(){
    if(!userId) return;
    try{
        var r = await fetch('/api/inventory/' + userId);
        var d = await r.json();
        if(d.success){
            userInventory = (d.inventory || []).filter(function(it){
                return !it.is_withdrawing && !it.challenge_locked;
            });
        }
    }catch(e){}
}

function openInventoryModal(){
    if(isSpinning) return;
    var m = $('inventoryModal');
    if(m) m.classList.add('show');
    $('inventorySearch').value = '';
    _inventorySearchQ = '';
    renderInventoryModal();
}

function closeInventoryModal(){
    var m = $('inventoryModal');
    if(m) m.classList.remove('show');
}

function filterInventory(){
    _inventorySearchQ = $('inventorySearch').value.toLowerCase().trim();
    renderInventoryModal();
}

function renderInventoryModal(){
    var grid = $('inventoryGrid');
    if(!grid) return;
    grid.innerHTML = '';
    var items = userInventory.filter(function(it){
        if(!_inventorySearchQ) return true;
        return (it.gift_name || '').toLowerCase().indexOf(_inventorySearchQ) !== -1;
    });
    if(items.length === 0){
        grid.innerHTML = '<div class="modal-empty">Ничего нет</div>';
        return;
    }
    items.forEach(function(it){
        var isSelected = selectedGift && selectedGift.id === it.id;
        var div = document.createElement('div');
        div.className = 'modal-item' + (isSelected ? ' selected' : '');
        var imgSrc = it.gift_image || '/static/img/gift.png';
        div.innerHTML =
            '<img class="modal-item-img" src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="modal-item-name">' + (it.gift_name || 'Gift') + '</div>'
            + '<div class="modal-item-price"><img src="/static/img/ton.png">' + ((it.gift_value || 0) / 100).toFixed(2) + '</div>';
        div.onclick = function(){ _selectGift(it); };
        grid.appendChild(div);
    });
}

function _selectGift(it){
    selectedGift = {
        id: it.id,
        name: it.gift_name,
        image: it.gift_image,
        value: it.gift_value,
        gift_id: it.gift_id
    };
    $('leftCard').classList.add('has-item');
    $('leftGiftImg').src = it.gift_image;
    $('leftGiftName').textContent = it.gift_name;
    $('leftGiftValue').textContent = ((it.gift_value || 0) / 100).toFixed(2);

    if(targetGift){
        targetGift = null;
        $('rightCard').classList.remove('has-item');
        $('rightChance').style.display = 'none';
        drawGreenArc(0);
    }
    updateWheel();
    closeInventoryModal();

    setTimeout(function(){
        loadPossibleTargets().then(function(){
            openTargetsModal();
        });
    }, 300);
}

/* ══════════════════════════════════════════════════════════════
   ЖЕЛАЕМЫЕ
   ══════════════════════════════════════════════════════════════ */
async function loadPossibleTargets(){
    if(!selectedGift) return;
    try{
        var r = await fetch('/api/upgrade-possible-gifts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: userId, current_gift_id: selectedGift.id})
        });
        var d = await r.json();
        if(!d.success) return;
        possibleTargets = [];
        (d.possible_gifts || []).forEach(function(g){
            if(g.value > selectedGift.value && g.value <= selectedGift.value * 10){
                var ch = Math.max(10, Math.min((selectedGift.value / g.value) * 100, 100));
                g.upgrade_chance = Math.round(ch * 10) / 10;
                possibleTargets.push(g);
            }
        });
        possibleTargets.sort(function(a, b){ return a.value - b.value; });
    }catch(e){}
}

function openTargetsModal(){
    if(isSpinning) return;
    if(!selectedGift){
        showTgAlert('Сначала выбери свой подарок');
        return;
    }
    if(possibleTargets.length === 0){
        loadPossibleTargets().then(function(){
            var m = $('targetsModal');
            if(m) m.classList.add('show');
            $('targetsSearch').value = '';
            _targetsSearchQ = '';
            renderTargetsModal();
        });
        return;
    }
    var m = $('targetsModal');
    if(m) m.classList.add('show');
    $('targetsSearch').value = '';
    _targetsSearchQ = '';
    renderTargetsModal();
}

function closeTargetsModal(){
    var m = $('targetsModal');
    if(m) m.classList.remove('show');
}

function filterTargets(){
    _targetsSearchQ = $('targetsSearch').value.toLowerCase().trim();
    renderTargetsModal();
}

function renderTargetsModal(){
    var grid = $('targetsGrid');
    if(!grid) return;
    grid.innerHTML = '';
    var items = possibleTargets.filter(function(g){
        if(!_targetsSearchQ) return true;
        return (g.name || '').toLowerCase().indexOf(_targetsSearchQ) !== -1;
    });
    if(items.length === 0){
        grid.innerHTML = '<div class="modal-empty">Ничего нет</div>';
        return;
    }
    items.forEach(function(g){
        var isSelected = targetGift && (targetGift.id === g.id || targetGift.fragment_slug === g.fragment_slug);
        var div = document.createElement('div');
        div.className = 'modal-item' + (isSelected ? ' selected' : '');
        var imgSrc = g.image || '/static/img/gift.png';
        div.innerHTML =
            '<img class="modal-item-img" src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="modal-item-name">' + (g.name || 'Gift') + '</div>'
            + '<div class="modal-item-price"><img src="/static/img/ton.png">' + ((g.value || 0) / 100).toFixed(2) + '</div>'
            + '<div class="modal-item-chance">' + g.upgrade_chance + '%</div>';
        div.onclick = function(){ _selectTarget(g); };
        grid.appendChild(div);
    });
}

function _selectTarget(g){
    targetGift = g;
    currentChance = g.upgrade_chance;
    $('rightCard').classList.add('has-item');
    $('rightGiftImg').src = g.image;
    $('rightGiftName').textContent = g.name;
    $('rightGiftValue').textContent = ((g.value || 0) / 100).toFixed(2);
    var chEl = $('rightChance');
    chEl.textContent = g.upgrade_chance + '%';
    chEl.style.display = 'inline-flex';

    /* Рисуем зелёную зону */
    drawGreenArc(currentChance);
    updateWheel();
    closeTargetsModal();
}

/* ══════════════════════════════════════════════════════════════
   КОЛЕСО
   ══════════════════════════════════════════════════════════════ */
function updateWheel(){
    var btn = $('upgradeBtn');
    var pct = $('chancePct');
    if(!targetGift || !selectedGift){
        pct.textContent = '0.00%';
        btn.disabled = true;
        $('upgradeBtnText').textContent = 'Апгрейд';
        drawGreenArc(0);
        return;
    }
    pct.textContent = currentChance.toFixed(2) + '%';
    btn.disabled = false;
    $('upgradeBtnText').textContent = 'Апгрейд';
}

/* ══════════════════════════════════════════════════════════════
   СПИН — крутим ОБА слоя одновременно (кольцо + зелёная зона)
   ══════════════════════════════════════════════════════════════ */
async function doUpgrade(){
    if(isSpinning || !targetGift || !selectedGift) return;
    isSpinning = true;

    var btn = $('upgradeBtn');
    btn.disabled = true;
    $('upgradeBtnText').textContent = 'Крутим...';

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    if(!rotator || !greenArc) return;

    /* 1. Небольшой откат влево */
    rotator.style.transition = 'transform 0.4s cubic-bezier(.4,0,.6,1)';
    greenArc.style.transition = 'transform 0.4s cubic-bezier(.4,0,.6,1)';
    rotator.style.transform = 'rotate(-15deg)';
    greenArc.style.transform = 'rotate(-15deg)';

    /* 2. Запрос на сервер */
    var result;
    try{
        var r = await fetch('/api/upgrade-multi', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: userId,
                inventory_ids: [selectedGift.id],
                target_gift_id: targetGift.fragment_slug || targetGift.id
            })
        });
        result = await r.json();
    }catch(e){
        result = {success: false, error: 'Ошибка сети'};
    }

    if(!result.success){
        rotator.style.transition = 'transform 0.4s ease';
        greenArc.style.transition = 'transform 0.4s ease';
        rotator.style.transform = 'rotate(0deg)';
        greenArc.style.transform = 'rotate(0deg)';
        btn.disabled = false;
        $('upgradeBtnText').textContent = 'Апгрейд';
        isSpinning = false;
        showTgAlert(result.error || 'Ошибка');
        return;
    }

    /* 3. Спин */
    var chance = result.chance;
    var landAngle;
    if(result.upgrade_success){
        landAngle = (chance * 0.15) + Math.random() * (chance * 0.7);
    } else {
        landAngle = chance + Math.random() * (360 - chance);
    }

    var totalSpin = 360 * (6 + Math.floor(Math.random() * 4)) + (360 - landAngle);
    var spinDuration = 5500;

    setTimeout(function(){
        var trans = 'transform ' + spinDuration + 'ms cubic-bezier(.1,.6,.2,1)';
        rotator.style.transition = trans;
        greenArc.style.transition = trans;
        rotator.style.transform = 'rotate(' + totalSpin + 'deg)';
        greenArc.style.transform = 'rotate(' + totalSpin + 'deg)';

        setTimeout(function(){
            if(result.upgrade_success){
                showToast('🎉 Победа!', 'ok');
                launchConfetti();
                if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                showToast('😢 Неудача', 'err');
                if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
            setTimeout(function(){
                resetAfterSpin();
                loadInventory();
                loadTopBar();
            }, 2000);
        }, spinDuration);
    }, 400);
}

/* ══════════════════════════════════════════════════════════════
   ДЕМО
   ══════════════════════════════════════════════════════════════ */
function doDemo(){
    if(isSpinning) return;
    isSpinning = true;

    var btn = $('upgradeBtn');
    btn.disabled = true;

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    if(!rotator || !greenArc) return;

    var demoChance = 20 + Math.random() * 60;
    drawGreenArc(demoChance);

    var pct = $('chancePct');
    if(pct){
        pct.textContent = demoChance.toFixed(2) + '%';
        pct.classList.add('visible');
    }

    rotator.style.transition = 'transform 0.4s cubic-bezier(.4,0,.6,1)';
    greenArc.style.transition = 'transform 0.4s cubic-bezier(.4,0,.6,1)';
    rotator.style.transform = 'rotate(-15deg)';
    greenArc.style.transform = 'rotate(-15deg)';

    var totalSpin = 360 * (6 + Math.floor(Math.random() * 4)) + Math.random() * 360;
    var spinDuration = 5000;

    setTimeout(function(){
        var trans = 'transform ' + spinDuration + 'ms cubic-bezier(.1,.6,.2,1)';
        rotator.style.transition = trans;
        greenArc.style.transition = trans;
        rotator.style.transform = 'rotate(' + totalSpin + 'deg)';
        greenArc.style.transform = 'rotate(' + totalSpin + 'deg)';

        setTimeout(function(){
            showToast('🎮 Демо завершено', 'ok');

            setTimeout(function(){
                isSpinning = false;
                btn.disabled = false;

                rotator.style.transition = 'transform 0.5s ease';
                greenArc.style.transition = 'transform 0.5s ease';
                rotator.style.transform = 'rotate(0deg)';
                greenArc.style.transform = 'rotate(0deg)';

                if(targetGift && selectedGift){
                    drawGreenArc(currentChance);
                    pct.textContent = currentChance.toFixed(2) + '%';
                } else {
                    drawGreenArc(0);
                    pct.textContent = '0.00%';
                }
            }, 1000);
        }, spinDuration);
    }, 400);
}

function resetAfterSpin(){
    isSpinning = false;
    selectedGift = null;
    targetGift = null;
    currentChance = 0;

    $('leftCard').classList.remove('has-item');
    $('rightCard').classList.remove('has-item');
    $('rightChance').style.display = 'none';
    $('chancePct').textContent = '0.00%';
    $('upgradeBtn').disabled = true;
    $('upgradeBtnText').textContent = 'Апгрейд';

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    if(rotator){
        rotator.style.transition = 'transform 0.5s ease';
        rotator.style.transform = 'rotate(0deg)';
    }
    if(greenArc){
        greenArc.style.transition = 'transform 0.5s ease';
        greenArc.style.transform = 'rotate(0deg)';
    }

    drawGreenArc(0);
}

/* ══════════════════════════════════════════════════════════════
   КОНФЕТТИ
   ══════════════════════════════════════════════════════════════ */
function launchConfetti(){
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var particles = [];
    var colors = ['#24C38E','#2844FB','#FFD700','#FF6B9D','#4B81F5'];
    for(var i = 0; i < 100; i++){
        particles.push({
            x: canvas.width / 2 + (Math.random() - .5) * 100,
            y: canvas.height / 2,
            vx: (Math.random() - .5) * 12,
            vy: -Math.random() * 14 - 4,
            w: Math.random() * 8 + 3,
            h: Math.random() * 6 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * 360,
            rv: (Math.random() - .5) * 10,
            life: 1
        });
    }
    function draw(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var alive = false;
        particles.forEach(function(p){
            if(p.life <= 0) return;
            alive = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rot += p.rv;
            p.life -= 0.01;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot * Math.PI / 180);
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
        });
        if(alive) requestAnimationFrame(draw);
        else canvas.remove();
    }
    draw();
}

            if(bd.banned){ location.href = '/ban'; return; }
        }catch(e){}

    loadTopBar();
    loadInventory();
    updateWheel();
})();
