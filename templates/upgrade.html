<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rasswet - Апгрейд</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#0d1117;
    --card:#161b22;
    --text:#fff;
    --text2:rgba(255,255,255,.5);
    --blue:#2563eb;
    --green:#1EE44C;
    --red:#F96999;
    /* ★ Отступ сверху — оптимизирован под Telegram Mini App */
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    /* ★ Фиксированная высота хедера Telegram */
    --tg-header:52px;
}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}

/* ══════════════════════════════════════════════════════════════
   TOP BAR — сдвинут ровно под Telegram хедер
   ══════════════════════════════════════════════════════════════ */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 16px;
    padding-top:calc(var(--safe-top) + var(--tg-header) + 8px);
    position:relative;
    z-index:10;
}
.top-left{display:flex;align-items:center;gap:8px}
.user-pill{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 10px 4px 4px;
    border-radius:18px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    backdrop-filter:blur(5px);
}
.top-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.top-nick{font-size:13px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-right-btns{display:flex;gap:6px;align-items:center}
.bal-pill{
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px 10px;
    border-radius:18px;
    background:rgba(120,135,160,.1);
    border:1px solid rgba(120,135,160,.25);
    font-weight:700;
    font-size:12px;
    backdrop-filter:blur(5px);
}
.bal-pill img{width:14px;height:14px;flex-shrink:0}
.bal-plus{
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid rgba(120,135,160,.45);
    background:rgba(120,135,160,.3);
    color:#A0B0C4;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

/* ══════════════════════════════════════════════════════════════
   WRAPPER — компактный
   ══════════════════════════════════════════════════════════════ */
.upgrade-wrap{
    max-width:480px;
    margin:0 auto;
    padding:4px 16px calc(var(--safe-bottom) + 90px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}
.page-title{
    font-size:22px;
    font-weight:900;
    padding:4px 0 2px;
    background:linear-gradient(135deg, #fff, #93c5fd);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    letter-spacing:-.5px;
    text-align:center;
    width:100%;
}

/* ══════════════════════════════════════════════════════════════
   КОЛЕСО
   ══════════════════════════════════════════════════════════════ */
.wheel-section{
    padding:4px 0 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.wheel-container{
    position:relative;
    width:210px;
    height:210px;
    margin:0 auto;
    filter:drop-shadow(0 0 30px rgba(59,130,246,.15));
    transition:filter .4s ease;
}
.wheel-container.spinning{
    filter:drop-shadow(0 0 60px rgba(245,158,11,.35)) drop-shadow(0 0 100px rgba(245,158,11,.2));
}
.wheel-container.win{
    filter:drop-shadow(0 0 60px rgba(30,228,76,.5)) drop-shadow(0 0 100px rgba(30,228,76,.25));
}
.wheel-container.fail{
    filter:drop-shadow(0 0 50px rgba(249,105,153,.4));
}
.wheel-container::before{
    content:'';
    position:absolute;
    inset:-18px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(59,130,246,.12) 0%, transparent 70%);
    z-index:-1;
    animation:wheelGlowPulse 3s ease-in-out infinite;
    pointer-events:none;
}
.wheel-container.spinning::before{
    background:radial-gradient(circle, rgba(245,158,11,.25) 0%, transparent 70%);
    animation:wheelGlowSpin 1.2s ease-in-out infinite;
}
.wheel-container.win::before{
    background:radial-gradient(circle, rgba(30,228,76,.3) 0%, transparent 70%);
    animation:wheelGlowWin 1.5s ease-in-out infinite;
}
.wheel-container.fail::before{
    background:radial-gradient(circle, rgba(249,105,153,.25) 0%, transparent 70%);
}
@keyframes wheelGlowPulse{
    0%,100%{ transform:scale(1); opacity:.6; }
    50%{ transform:scale(1.08); opacity:1; }
}
@keyframes wheelGlowSpin{
    0%,100%{ transform:scale(1.05); opacity:.8; }
    50%{ transform:scale(1.15); opacity:1; }
}
@keyframes wheelGlowWin{
    0%,100%{ transform:scale(1); opacity:.9; }
    50%{ transform:scale(1.15); opacity:1; }
}
.wheel-container::after{
    content:'';
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:2px dashed rgba(59,130,246,.15);
    animation:wheelRingRotate 20s linear infinite;
    pointer-events:none;
}
.wheel-container.spinning::after{
    border-color:rgba(245,158,11,.35);
    animation-duration:2s;
}
@keyframes wheelRingRotate{
    to{ transform:rotate(360deg); }
}
.wheel-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    filter:drop-shadow(0 4px 16px rgba(0,0,0,.6));
}
.wheel-green-arc{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}
.wheel-center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:96px;
    height:96px;
    border-radius:50%;
    background:radial-gradient(circle, #1a2030 0%, #0d1117 100%);
    border:2px solid rgba(59,130,246,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    overflow:hidden;
    box-shadow:
        inset 0 0 20px rgba(59,130,246,.15),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 30px rgba(59,130,246,.2);
    transition:all .3s ease;
}
.wheel-center img,
.wheel-center .chance-pct{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    transition:opacity .35s ease, transform .35s ease;
}
.wheel-center img{
    width:60px;
    height:60px;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.wheel-center img.hidden,
.wheel-center .chance-pct.hidden{
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
    pointer-events:none;
    z-index:1;
}
.wheel-center img.visible,
.wheel-center .chance-pct.visible{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    z-index:2;
    animation:centerSwap .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes centerSwap{
    0%{ transform:translate(-50%,-50%) scale(.7); opacity:0; }
    50%{ transform:translate(-50%,-50%) scale(1.1); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
}
.chance-pct{
    font-size:24px;
    font-weight:900;
    background:linear-gradient(135deg, #3B82F6, #60A5FA);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    letter-spacing:-.5px;
}
.wheel-center.flash-green{
    animation:flashGreen .5s ease 4;
    border-color:rgba(30,228,76,.6);
    box-shadow:
        inset 0 0 30px rgba(30,228,76,.25),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 50px rgba(30,228,76,.5);
}
.wheel-center.flash-red{
    animation:flashRed .5s ease 4;
    border-color:rgba(249,105,153,.6);
    box-shadow:
        inset 0 0 30px rgba(249,105,153,.25),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 50px rgba(249,105,153,.5);
}
.wheel-center.alternating{
    animation:centerAlternate 1.5s ease-in-out infinite;
    border-color:rgba(245,158,11,.5);
}
@keyframes flashGreen{
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    50%{ transform:translate(-50%,-50%) scale(1.1); }
}
@keyframes flashRed{
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    50%{ transform:translate(-50%,-50%) scale(1.08); }
}
@keyframes centerAlternate{
    0%,100%{
        box-shadow:
            inset 0 0 20px rgba(59,130,246,.15),
            0 0 0 4px rgba(13,17,23,.8),
            0 0 30px rgba(59,130,246,.2);
    }
    50%{
        box-shadow:
            inset 0 0 30px rgba(59,130,246,.3),
            0 0 0 4px rgba(13,17,23,.8),
            0 0 50px rgba(59,130,246,.5);
    }
}
.wheel-result-icon{
    display:none;
    width:32px;
    height:32px;
}
.wheel-result-icon.show{display:block}
.wheel-pointer-wrap{
    position:absolute;
    top:50%;
    left:50%;
    width:0;
    height:0;
    z-index:10;
    transform-origin:center center;
}
.wheel-pointer{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%) translateY(-138px);
    width:24px;
    height:28px;
}
.wheel-pointer img{
    width:100%;
    height:100%;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.8)) drop-shadow(0 0 8px rgba(245,158,11,.4));
}
.wheel-glow{
    position:absolute;
    inset:0;
    border-radius:50%;
    pointer-events:none;
    opacity:0;
    transition:opacity .3s;
}
.wheel-glow.spinning{
    opacity:1;
    animation:glowPulse .8s infinite;
}
@keyframes glowPulse{
    0%,100%{ box-shadow:0 0 15px rgba(245,158,11,.15); }
    50%{ box-shadow:0 0 35px rgba(245,158,11,.35); }
}

/* ══════════════════════════════════════════════════════════════
   КНОПКА UPGRADE
   ══════════════════════════════════════════════════════════════ */
.upgrade-btn{
    width:100%;
    height:52px;
    border-radius:16px;
    border:none;
    background:linear-gradient(135deg, #2563eb, #3b82f6);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(37,99,235,.35);
    transition:all .3s cubic-bezier(.4,0,.2,1);
    letter-spacing:.3px;
}
.upgrade-btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    transition:left .6s;
}
.upgrade-btn:not(:disabled):hover::before{
    left:100%;
}
.upgrade-btn:not(:disabled):hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(37,99,235,.5), 0 0 0 1px rgba(59,130,246,.3);
}
.upgrade-btn:not(:disabled):active{
    transform:translateY(0) scale(.98);
}
.upgrade-btn:disabled{
    background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.3);
    cursor:not-allowed;
    box-shadow:none;
}
.upgrade-btn.win{
    background:linear-gradient(135deg, #059669, #10b981) !important;
    box-shadow:0 8px 32px rgba(16,185,129,.5), 0 0 0 2px rgba(16,185,129,.4) !important;
    animation:btnWinPulse 1s ease-in-out infinite;
}
.upgrade-btn.fail{
    background:linear-gradient(135deg, #dc2626, #ef4444) !important;
    box-shadow:0 8px 32px rgba(239,68,68,.5), 0 0 0 2px rgba(239,68,68,.4) !important;
    animation:btnFailShake .5s ease;
}
@keyframes btnWinPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.02); }
}
@keyframes btnFailShake{
    0%,100%{ transform:translateX(0); }
    20%,60%{ transform:translateX(-6px); }
    40%,80%{ transform:translateX(6px); }
}

/* ══════════════════════════════════════════════════════════════
   КАРТОЧКИ — подарок В ячейке
   ══════════════════════════════════════════════════════════════ */
.cards-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:2px;
}
.card{
    position:relative;
    background:linear-gradient(160deg, rgba(22,27,34,.95), rgba(15,20,27,.95));
    border:1.5px solid rgba(255,255,255,.08);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:150px;
    min-height:150px;
    max-height:150px;
    padding:12px 8px;
    cursor:pointer;
    overflow:hidden;
    box-sizing:border-box;
    transition:all .3s cubic-bezier(.4,0,.2,1);
}
.card::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 0%, rgba(59,130,246,.08) 0%, transparent 70%);
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}
.card:hover{
    transform:translateY(-3px);
    border-color:rgba(59,130,246,.3);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(59,130,246,.1);
}
.card:hover::before{ opacity:1; }
.card:active{ transform:scale(.98); }
.card.has-gift{
    border-style:solid;
    border-color:rgba(59,130,246,.4);
    background:linear-gradient(160deg, rgba(59,130,246,.08), rgba(15,20,27,.95));
    box-shadow:0 0 0 1px rgba(59,130,246,.2), 0 8px 24px rgba(0,0,0,.4);
}
.card.has-gift::after{
    content:'';
    position:absolute;
    top:8px;
    right:8px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#10b981;
    box-shadow:0 0 12px #10b981;
    animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.6; transform:scale(.85); }
}
.card .card-placeholder{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    padding:0 10px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:opacity .3s ease;
    z-index:1;
}
.card:hover .card-icon{
    opacity:.9;
    transform:scale(1.08) rotate(-5deg);
    filter:drop-shadow(0 0 12px rgba(59,130,246,.4));
}
.card-icon{
    width:46px;
    height:46px;
    opacity:.5;
    transition:all .3s ease;
}
.card-icon img{width:100%;height:100%;object-fit:contain}
.card-text{
    font-size:11px;
    font-weight:600;
    color:rgba(255,255,255,.45);
    text-align:center;
    line-height:1.35;
    transition:color .3s ease;
}
.card:hover .card-text{ color:rgba(255,255,255,.7); }

.card .gift-preview{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    padding:0 8px;
    box-sizing:border-box;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    z-index:2;
}
.card.has-gift .card-placeholder{opacity:0;pointer-events:none;}
.card.has-gift .gift-preview{
    display:flex;
    animation:giftAppear .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes giftAppear{
    0%{ transform:translate(-50%,-50%) scale(.5) rotate(-10deg); opacity:0; }
    60%{ transform:translate(-50%,-50%) scale(1.1) rotate(3deg); }
    100%{ transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; }
}
.gift-preview img{
    width:64px;
    height:64px;
    object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
    animation:giftFloat 3s ease-in-out infinite;
}
@keyframes giftFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
}
.gift-preview-name{
    font-size:11px;
    font-weight:700;
    color:#fff;
    text-align:center;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    line-height:1.2;
}
.gift-preview-value{
    font-size:11px;
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:3px 9px;
    background:rgba(59,130,246,.15);
    border:1px solid rgba(59,130,246,.25);
    border-radius:10px;
    font-weight:800;
    color:#60A5FA;
    line-height:1;
}
.gift-preview-value img{
    width:12px !important;
    height:12px !important;
    max-width:12px !important;
    max-height:12px !important;
    animation:none !important;
    object-fit:contain;
    filter:none;
    display:inline-block;
}

/* ══════════════════════════════════════════════════════════════
   КНОПКИ ВЫБОРА
   ══════════════════════════════════════════════════════════════ */
.btns-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.select-btn{
    height:44px;
    border-radius:14px;
    border:1.5px solid rgba(255,255,255,.08);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative;
    overflow:hidden;
}
.select-btn:first-child{
    background:linear-gradient(135deg, #1e3a5f, #1e40af);
    color:#fff;
    border-color:rgba(59,130,246,.3);
}
.select-btn:last-child{
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.65);
}
.select-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.select-btn:active{ transform:scale(.97); }
.select-btn.active{
    box-shadow:0 0 0 2px #3B82F6, 0 8px 24px rgba(59,130,246,.35);
    border-color:#3B82F6;
    color:#fff;
}
.select-btn.active:last-child{
    background:linear-gradient(135deg, #3B82F6, #2563EB);
}

/* ══════════════════════════════════════════════════════════════
   INLINE СЕКЦИИ
   ══════════════════════════════════════════════════════════════ */
.inline-section{
    width:100%;
    display:none;
    margin-top:8px;
    animation:sectionSlide .35s cubic-bezier(.4,0,.2,1);
}
.inline-section.show{ display:block; }
@keyframes sectionSlide{
    0%{ opacity:0; transform:translateY(-10px); }
    100%{ opacity:1; transform:translateY(0); }
}
.section-title{
    font-size:12px;
    font-weight:700;
    color:rgba(255,255,255,.5);
    margin-bottom:10px;
    padding-left:2px;
    display:flex;
    align-items:center;
    gap:8px;
    text-transform:uppercase;
    letter-spacing:.5px;
}
.section-title::before{
    content:'';
    width:3px;
    height:14px;
    background:linear-gradient(180deg, #3B82F6, #2563EB);
    border-radius:2px;
}

/* ИНВЕНТАРЬ — 3 в ряд */
#inventoryGrid,
.inline-grid{
    display:grid !important;
    grid-template-columns:repeat(3, 1fr) !important;
    gap:8px !important;
    max-height:400px !important;
    overflow-y:auto !important;
    padding:2px !important;
    width:100% !important;
    box-sizing:border-box !important;
}
#inventoryGrid::-webkit-scrollbar,
.inline-grid::-webkit-scrollbar{ width:4px; }
#inventoryGrid::-webkit-scrollbar-thumb,
.inline-grid::-webkit-scrollbar-thumb{ background:rgba(59,130,246,.3); border-radius:2px; }

.inline-item{
    border-radius:14px;
    border:1.5px solid rgba(255,255,255,.08);
    background:linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    padding:8px 4px 6px;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    position:relative;
    overflow:hidden;
    width:100%;
    box-sizing:border-box;
    animation:itemAppear .35s cubic-bezier(.4,0,.2,1) both;
}
@keyframes itemAppear{
    0%{ opacity:0; transform:translateY(8px) scale(0.95); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
}
.inline-item::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(59,130,246,.15) 0%, transparent 70%);
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}
.inline-item:hover{
    transform:translateY(-3px);
    border-color:rgba(59,130,246,.4);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.inline-item:hover::before{ opacity:1; }
.inline-item.selected{
    border-color:#3B82F6;
    background:linear-gradient(160deg, rgba(59,130,246,.15), rgba(59,130,246,.05));
    animation:itemSelectedGlow 1.5s ease-in-out infinite;
}
@keyframes itemSelectedGlow{
    0%,100%{ box-shadow:0 0 0 1px #3B82F6, 0 8px 20px rgba(59,130,246,.3); }
    50%{ box-shadow:0 0 0 1px #3B82F6, 0 8px 30px rgba(59,130,246,.6), 0 0 40px rgba(59,130,246,.3); }
}
.inline-item.selected::after{
    content:'✓';
    position:absolute;
    top:4px;
    right:4px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:linear-gradient(135deg, #3B82F6, #2563EB);
    color:#fff;
    font-size:11px;
    font-weight:800;
    display:flex;
    align-items:center;

    box-shadow:0 2px 8px rgba(59,130,246,.5);

    z-index:2;
}
@keyframes checkPop{
    0%{ transform:scale(0); }

}
.inline-item img{

.inline-item-value{

/* ══════════════════════════════════════════════════════════════
   ★ ТУРБО НЕ УБИВАЕТ UPGRADE АНИМАЦИИ
   ══════════════════════════════════════════════════════════════ */
body.turbo-mode *:not(.upgrade-wrap):not(.upgrade-wrap *),
html.turbo-mode *:not(.upgrade-wrap):not(.upgrade-wrap *){
    animation:none !important;
    transition:none !important;
    box-shadow:none !important;
    filter:none !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    text-shadow:none !important;
}
body.turbo-mode .upgrade-wrap .wheel-container::before,
html.turbo-mode .upgrade-wrap .wheel-container::before{animation:wheelGlowPulse 3s ease-in-out infinite !important;}
body.turbo-mode .upgrade-wrap .wheel-container::after,
html.turbo-mode .upgrade-wrap .wheel-container::after{animation:wheelRingRotate 20s linear infinite !important;}
body.turbo-mode .upgrade-wrap .wheel-center.alternating,
html.turbo-mode .upgrade-wrap .wheel-center.alternating{animation:centerAlternate 1.5s ease-in-out infinite !important;}
body.turbo-mode .upgrade-wrap .wheel-center img.visible,
html.turbo-mode .upgrade-wrap .wheel-center img.visible,
body.turbo-mode .upgrade-wrap .wheel-center .chance-pct.visible,
html.turbo-mode .upgrade-wrap .wheel-center .chance-pct.visible{animation:centerSwap 0.4s cubic-bezier(.34,1.56,.64,1) !important;}
body.turbo-mode .upgrade-wrap .gift-preview img,
html.turbo-mode .upgrade-wrap .gift-preview img{animation:giftFloat 4s ease-in-out infinite !important;}
body.turbo-mode .upgrade-wrap .inline-item,
html.turbo-mode .upgrade-wrap .inline-item,
body.turbo-mode .upgrade-wrap .target-row,
html.turbo-mode .upgrade-wrap .target-row{animation:itemAppear 0.4s cubic-bezier(.4,0,.2,1) both !important;}


/* ══════════════════════════════════════════════════════════════
   ★ ЦВЕТ СВЕЧЕНИЯ ПО КОЭФФИЦИЕНТУ (риск)
   ══════════════════════════════════════════════════════════════ */

/* По умолчанию (нет цели) — серый/нейтральный */
.wheel-container::before{
    background:radial-gradient(circle, rgba(120,135,160,.08) 0%, transparent 70%) !important;
    animation:wheelGlowNeutral 3s ease-in-out infinite !important;
}
@keyframes wheelGlowNeutral{
    0%,100%{ transform:scale(1); opacity:.4; }
    50%{ transform:scale(1.05); opacity:.7; }
}

/* 🟢 ЗЕЛЁНЫЙ — коэф 1.1x – 1.7x (низкий риск) */
.wheel-container.risk-low::before{
    background:radial-gradient(circle, rgba(30,228,76,.22) 0%, transparent 70%) !important;
    animation:wheelGlowGreen 3s ease-in-out infinite !important;
}
.wheel-container.risk-low{
    filter:drop-shadow(0 0 40px rgba(30,228,76,.25)) !important;
}
.wheel-container.risk-low::after{
    border-color:rgba(30,228,76,.3) !important;
}
.wheel-container.risk-low .wheel-center{
    border-color:rgba(30,228,76,.5) !important;
    box-shadow:
        inset 0 0 25px rgba(30,228,76,.2),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 40px rgba(30,228,76,.3) !important;
}
.wheel-container.risk-low .chance-pct{
    background:linear-gradient(135deg, #1EE44C, #10b981) !important;
    -webkit-background-clip:text !important;
    -webkit-text-fill-color:transparent !important;
    background-clip:text !important;
}
.wheel-container.risk-low.spinning{
    filter:drop-shadow(0 0 70px rgba(30,228,76,.5)) drop-shadow(0 0 120px rgba(30,228,76,.3)) !important;
}
@keyframes wheelGlowGreen{
    0%,100%{ transform:scale(1); opacity:.7; }
    50%{ transform:scale(1.08); opacity:1; }
}

/* 🔵 ГОЛУБОЙ — коэф 1.7x – 2.2x (средний риск) */
.wheel-container.risk-mid::before{
    background:radial-gradient(circle, rgba(59,130,246,.25) 0%, transparent 70%) !important;
    animation:wheelGlowBlue 3s ease-in-out infinite !important;
}
.wheel-container.risk-mid{
    filter:drop-shadow(0 0 40px rgba(59,130,246,.3)) !important;
}
.wheel-container.risk-mid::after{
    border-color:rgba(59,130,246,.35) !important;
}
.wheel-container.risk-mid .wheel-center{
    border-color:rgba(59,130,246,.55) !important;
    box-shadow:
        inset 0 0 25px rgba(59,130,246,.25),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 40px rgba(59,130,246,.35) !important;
}
.wheel-container.risk-mid .chance-pct{
    background:linear-gradient(135deg, #3B82F6, #60A5FA) !important;
    -webkit-background-clip:text !important;
    -webkit-text-fill-color:transparent !important;
    background-clip:text !important;
}
.wheel-container.risk-mid.spinning{
    filter:drop-shadow(0 0 70px rgba(59,130,246,.6)) drop-shadow(0 0 120px rgba(59,130,246,.35)) !important;
}
@keyframes wheelGlowBlue{
    0%,100%{ transform:scale(1); opacity:.75; }
    50%{ transform:scale(1.08); opacity:1; }
}

/* 🟣 ФИОЛЕТОВЫЙ — коэф 2.2x – 5.0x (высокий риск) */
.wheel-container.risk-high::before{
    background:radial-gradient(circle, rgba(168,85,247,.28) 0%, transparent 70%) !important;
    animation:wheelGlowPurple 3s ease-in-out infinite !important;
}
.wheel-container.risk-high{
    filter:drop-shadow(0 0 45px rgba(168,85,247,.35)) !important;
}
.wheel-container.risk-high::after{
    border-color:rgba(168,85,247,.4) !important;
}
.wheel-container.risk-high .wheel-center{
    border-color:rgba(168,85,247,.6) !important;
    box-shadow:
        inset 0 0 30px rgba(168,85,247,.3),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 50px rgba(168,85,247,.4) !important;
}
.wheel-container.risk-high .chance-pct{
    background:linear-gradient(135deg, #a855f7, #c084fc) !important;
    -webkit-background-clip:text !important;
    -webkit-text-fill-color:transparent !important;
    background-clip:text !important;
}
.wheel-container.risk-high.spinning{
    filter:drop-shadow(0 0 80px rgba(168,85,247,.65)) drop-shadow(0 0 130px rgba(168,85,247,.4)) !important;
}
@keyframes wheelGlowPurple{
    0%,100%{ transform:scale(1); opacity:.8; }
    50%{ transform:scale(1.1); opacity:1; }
}

/* 🟠 ОРАНЖЕВЫЙ — коэф 5.0x+ (мега-риск) */
.wheel-container.risk-mega::before{
    background:radial-gradient(circle, rgba(245,158,11,.32) 0%, transparent 70%) !important;
    animation:wheelGlowOrange 2s ease-in-out infinite !important;
}
.wheel-container.risk-mega{
    filter:drop-shadow(0 0 55px rgba(245,158,11,.45)) !important;
}
.wheel-container.risk-mega::after{
    border-color:rgba(245,158,11,.5) !important;
    animation-duration:1.5s !important;
}
.wheel-container.risk-mega .wheel-center{
    border-color:rgba(245,158,11,.7) !important;
    box-shadow:
        inset 0 0 35px rgba(245,158,11,.35),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 60px rgba(245,158,11,.5) !important;
}
.wheel-container.risk-mega .chance-pct{
    background:linear-gradient(135deg, #f59e0b, #fbbf24) !important;
    -webkit-background-clip:text !important;
    -webkit-text-fill-color:transparent !important;
    background-clip:text !important;
    animation:chanceMegaPulse 1.2s ease-in-out infinite;
}
.wheel-container.risk-mega.spinning{
    filter:drop-shadow(0 0 100px rgba(245,158,11,.75)) drop-shadow(0 0 160px rgba(245,158,11,.5)) !important;
}
@keyframes wheelGlowOrange{
    0%,100%{ transform:scale(1); opacity:.85; }
    50%{ transform:scale(1.12); opacity:1; }
}
@keyframes chanceMegaPulse{
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    50%{ transform:translate(-50%,-50%) scale(1.08); }
}

/* В турбо/оптимизации — все равно показываем цвета */
body.turbo-mode .wheel-container.risk-low::before,
body.turbo-mode .wheel-container.risk-mid::before,
body.turbo-mode .wheel-container.risk-high::before,
body.turbo-mode .wheel-container.risk-mega::before,
html.turbo-mode .wheel-container.risk-low::before,
html.turbo-mode .wheel-container.risk-mid::before,
html.turbo-mode .wheel-container.risk-high::before,
html.turbo-mode .wheel-container.risk-mega::before{
    animation:wheelGlowNeutral 3s ease-in-out infinite !important;
    animation-name:wheelGlowPulse !important;
}

/* ══════════════════════════════════════════════════════════════
   ★ ЦЕНТР — ВСЕГДА ПОКАЗЫВАЕТ ПРОЦЕНТ
   ══════════════════════════════════════════════════════════════ */

.wheel-center .chance-pct{
    display:block !important;
    opacity:1 !important;
    z-index:3 !important;
}

/* Картинка центра — только когда явно показана */
.wheel-center img{
    opacity:0;
    z-index:2;
    pointer-events:none;
}
.wheel-center img.visible{
    opacity:1;
}

/* Убираем чередование полностью — процент ВСЕГДА виден */
.wheel-center .chance-pct.hidden{
    opacity:1 !important;
    transform:translate(-50%,-50%) scale(1) !important;
    z-index:3 !important;
}



/* ══════════════════════════════════════════════════════════════
   ★ ОПТИМИЗАЦИЯ ПОД ТЕЛЕФОН
   ══════════════════════════════════════════════════════════════ */

/* GPU-ускорение колеса */
.wheel-container{
    will-change: filter;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}
.wheel-container::before,
.wheel-container::after{
    will-change: transform, opacity;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}
.wheel-center{
    will-change: transform, box-shadow;
    transform: translate(-50%, -50%) translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}
.wheel-svg,
.wheel-green-arc{
    will-change: auto;

/* ══════════════════════════════════════════════════════════════
   ★ КОЛЕСО (как на скриншоте) — риски по кругу
   ══════════════════════════════════════════════════════════════ */

.wheel-container{
    position:relative;
    width:290px;
    height:290px;
    margin:0 auto;
    filter:drop-shadow(0 0 30px rgba(59,130,246,.15));
    transition:filter .4s ease;
    will-change: filter;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* Внешний тёмный круг с рисками (как на фото) */
.wheel-risks{
    position:absolute;
    inset:0;
    border-radius:50%;
    z-index:1;
    pointer-events:none;
}
.wheel-risks svg{
    width:100%;
    height:100%;
    display:block;
}

/* Внутренний круг — тёмный фон */
.wheel-inner-circle{
    position:absolute;
    top:14%;
    left:14%;
    width:72%;
    height:72%;
    border-radius:50%;
    background:#1a1d24;
    border:2px solid rgba(255,255,255,.04);
    box-shadow:
        inset 0 0 40px rgba(0,0,0,.6),
        0 0 20px rgba(0,0,0,.3);
    z-index:2;
    pointer-events:none;
}

/* Свечение вокруг колеса */
.wheel-container::before{
    content:'';
    position:absolute;
    inset:-20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(120,135,160,.15) 0%, transparent 70%);
    z-index:0;
    animation:wheelGlowPulse 3s ease-in-out infinite;
    pointer-events:none;
    will-change: transform, opacity;
}

/* Стрелка СВЕРХУ В ЦЕНТРЕ (не снаружи, а внутри колеса) */
.wheel-pointer-center{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    z-index:6;
    width:0;
    height:0;
    pointer-events:none;
}
.wheel-pointer-center svg{
    width:32px;
    height:40px;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));
    display:block;
    margin-left:-16px;
}

/* Зелёная зона (эффект) */
.wheel-green-arc{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:3;
}

/* Центр — процент */
.wheel-center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:130px;
    height:130px;
    border-radius:50%;
    background:radial-gradient(circle, #1a2030 0%, #0d1117 100%);
    border:2px solid rgba(59,130,246,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    overflow:hidden;
    box-shadow:
        inset 0 0 20px rgba(59,130,246,.15),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 30px rgba(59,130,246,.2);
    transition:all .3s ease;
    will-change: transform, box-shadow;
    transform: translate(-50%, -50%) translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.wheel-center img,
.wheel-center .chance-pct{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    transition:opacity .35s ease, transform .35s ease;
    will-change: opacity, transform;
}
.wheel-center img{
    width:80px;
    height:80px;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
}
.wheel-center img.hidden,
.wheel-center .chance-pct.hidden{
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
    pointer-events:none;
    z-index:1;
}
.wheel-center img.visible,
.wheel-center .chance-pct.visible{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    z-index:2;
    animation:centerSwap .4s cubic-bezier(.34,1.56,.64,1);
}
.chance-pct{
    font-size:32px;
    font-weight:900;
    background:linear-gradient(135deg, #3B82F6, #60A5FA);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    letter-spacing:-1px;
}
@keyframes centerSwap{
    0%{ transform:translate(-50%,-50%) scale(.7); opacity:0; }
    50%{ transform:translate(-50%,-50%) scale(1.1); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
}
@keyframes wheelGlowPulse{
    0%,100%{ transform:scale(1); opacity:.5; }
    50%{ transform:scale(1.05); opacity:.9; }
}

/* Цвет по риску */
.wheel-container.risk-low::before{
    background:radial-gradient(circle, rgba(30,228,76,.25) 0%, transparent 70%);
}
.wheel-container.risk-low .wheel-center{
    border-color:rgba(30,228,76,.6);
    box-shadow:
        inset 0 0 25px rgba(30,228,76,.25),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 50px rgba(30,228,76,.4);
}
.wheel-container.risk-low .chance-pct{
    background:linear-gradient(135deg, #1EE44C, #10b981);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
.wheel-container.risk-mid::before{
    background:radial-gradient(circle, rgba(59,130,246,.3) 0%, transparent 70%);
}
.wheel-container.risk-mid .wheel-center{
    border-color:rgba(59,130,246,.6);
    box-shadow:
        inset 0 0 25px rgba(59,130,246,.25),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 50px rgba(59,130,246,.4);
}
.wheel-container.risk-high::before{
    background:radial-gradient(circle, rgba(168,85,247,.35) 0%, transparent 70%);
}
.wheel-container.risk-high .wheel-center{
    border-color:rgba(168,85,247,.65);
    box-shadow:
        inset 0 0 30px rgba(168,85,247,.3),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 55px rgba(168,85,247,.45);
}
.wheel-container.risk-high .chance-pct{
    background:linear-gradient(135deg, #a855f7, #c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
.wheel-container.risk-mega::before{
    background:radial-gradient(circle, rgba(245,158,11,.4) 0%, transparent 70%);
}
.wheel-container.risk-mega .wheel-center{
    border-color:rgba(245,158,11,.7);
    box-shadow:
        inset 0 0 35px rgba(245,158,11,.35),
        0 0 0 4px rgba(13,17,23,.8),
        0 0 60px rgba(245,158,11,.5);
}
.wheel-container.risk-mega .chance-pct{
    background:linear-gradient(135deg, #f59e0b, #fbbf24);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}

/* ★ Точка отсчёта — белая метка сверху центра */
.wheel-marker{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    z-index:7;
    width:0;
    height:0;
    pointer-events:none;
}

/* ★ Убираем старую стрелку-обёртку (мы её заменим на wheel-pointer-center) */
.wheel-pointer-wrap,
.wheel-pointer{
    display:none !important;
}

<script>
/* ══════════════════════════════════════════════════════════════
   GLOBAL STATE
   ══════════════════════════════════════════════════════════════ */
var tg = window.Telegram && window.Telegram.WebApp;
var userId = null;
var userInventory = [];
var selectedGift = null;
var targetGift = null;
var possibleTargets = [];
var isSpinning = false;
var currentChance = 0;
var activeSection = null;

function $(id){ return document.getElementById(id); }

function showTgAlert(msg, cb){
    if(tg && tg.showAlert){ tg.showAlert(msg, cb); }
    else { alert(msg); if(cb) cb(); }
}

/* ══════════════════════════════════════════════════════════════
   КОЛЕСО — зелёная зона
   ══════════════════════════════════════════════════════════════ */
function polarToCartesian(cx, cy, r, angle){
    var rad = (angle - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function drawGreenArc(chance){
    var path = $('greenPath');
    if(!path) return;
    if(!chance || chance <= 0){ path.setAttribute('d', ''); return; }
    var cx = 110, cy = 110, r = 106;
    var startAngle = 0;
    var endAngle = startAngle + (chance / 100) * 360;
    var start = polarToCartesian(cx, cy, r, startAngle);
    var end = polarToCartesian(cx, cy, r, endAngle);
    var largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
    path.setAttribute('d', 'M ' + start.x + ' ' + start.y + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + end.x + ' ' + end.y);
}

/* ══════════════════════════════════════════════════════════════
   ЧЕРЕДОВАНИЕ PNG ↔ ПРОЦЕНТ
   ══════════════════════════════════════════════════════════════ */
/* ★ Чередование убрано — процент ВСЕГДА виден */
var _centerInterval = null;

function _startCenterAlternate(gift){
    /* Просто убеждаемся что процент виден */
    _stopCenterAlternate();
    var center = $('wheelCenter');
    var img = $('wheelCenterImg');
    var pct = $('chancePct');
    if(!center || !img || !pct) return;

    /* Скрываем картинку, показываем процент */
    img.classList.remove('visible');
    pct.classList.remove('hidden');
    pct.classList.add('visible');
    pct.style.opacity = '1';
    pct.style.transform = 'translate(-50%,-50%) scale(1)';
    pct.style.zIndex = '3';
}

function _stopCenterAlternate(){
    if(_centerInterval){
        clearInterval(_centerInterval);
        _centerInterval = null;
    }
    var center = $('wheelCenter');
    if(center) center.classList.remove('alternating');
}

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            var u = d.user;
            $('topNick').textContent = u.first_name || u.username || 'User';
            if(u.photo_url) $('topAvatar').src = u.photo_url;
            $('balVal').textContent = ((u.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   ИНВЕНТАРЬ
   ══════════════════════════════════════════════════════════════ */
async function loadInventory(){
    if(!userId) return;
    try{
        var r = await fetch('/api/inventory/' + userId);
        var d = await r.json();
        if(d.success){
            userInventory = (d.inventory || []).filter(function(it){
                return !it.is_withdrawing && !it.challenge_locked;
            });
            renderInventoryGrid();
        }
    }catch(e){}
}

function renderInventoryGrid(){
    var grid = $('inventoryGrid');
    if(!grid) return;
    grid.innerHTML = '';
    if(userInventory.length === 0){
        grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1">Ничего нет</div>';
        return;
    }
    userInventory.forEach(function(it){
        var isSelected = selectedGift && selectedGift.id === it.id;
        var div = document.createElement('div');
        div.className = 'inline-item' + (isSelected ? ' selected' : '');
        var imgSrc = it.gift_image || '/static/img/gift.png';
        div.innerHTML =
            '<img src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="inline-item-name">' + (it.gift_name || 'Gift') + '</div>'
            + '<div class="inline-item-value"><img src="/static/img/ton.png">' + ((it.gift_value || 0) / 100).toFixed(2) + '</div>';
        div.onclick = function(){ selectGift(it); };
        grid.appendChild(div);
    });
}

function selectGift(g){
    selectedGift = {
        id: g.id,
        name: g.gift_name,
        image: g.gift_image,
        value: g.gift_value,
        gift_id: g.gift_id
    };
    $('leftCard').classList.add('has-gift');
    $('leftGiftImg').src = g.gift_image;
    $('leftGiftName').textContent = g.gift_name;
    $('leftGiftValue').textContent = ((g.gift_value || 0) / 100).toFixed(2);

    if(targetGift) resetTarget();
    renderInventoryGrid();
    updateWheel();

    $('inventorySection').classList.remove('show');
    $('btnInventory').classList.remove('active');

    setTimeout(function(){
        try{ $('leftCard').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        catch(e){}
    }, 100);

    setTimeout(function(){
        var tarSec = $('targetsSection');
        var btnTar = $('btnTargets');
        if(tarSec && btnTar){
            tarSec.classList.add('show');
            btnTar.classList.add('active');
            activeSection = 'targets';
            loadPossibleTargets();
        }
    }, 400);
}

function resetTarget(){
    targetGift = null;
    currentChance = 0;
    $('rightCard').classList.remove('has-gift');
    $('wheelCenterImg').classList.remove('visible');
    $('wheelCenterImg').classList.add('hidden');
    $('chancePct').classList.remove('hidden');
    $('chancePct').classList.add('visible');
    drawGreenArc(0);
}

/* ══════════════════════════════════════════════════════════════
   ВКЛАДКИ
   ══════════════════════════════════════════════════════════════ */
function toggleInventory(){
    if(isSpinning) return;
    var invSec = $('inventorySection');
    var tarSec = $('targetsSection');
    var btnInv = $('btnInventory');
    var btnTar = $('btnTargets');

    if(activeSection === 'inventory'){
        invSec.classList.remove('show');
        btnInv.classList.remove('active');
        activeSection = null;
    } else {
        invSec.classList.add('show');
        tarSec.classList.remove('show');
        btnInv.classList.add('active');
        btnTar.classList.remove('active');
        activeSection = 'inventory';
        renderInventoryGrid();
    }
}

function toggleTargets(){
    if(isSpinning) return;
    if(!selectedGift){
        showTgAlert('Сначала выбери подарок для апгрейда');
        return;
    }
    var invSec = $('inventorySection');
    var tarSec = $('targetsSection');
    var btnInv = $('btnInventory');
    var btnTar = $('btnTargets');

    if(activeSection === 'targets'){
        tarSec.classList.remove('show');
        btnTar.classList.remove('active');
        activeSection = null;
    } else {
        tarSec.classList.add('show');
        invSec.classList.remove('show');
        btnTar.classList.add('active');
        btnInv.classList.remove('active');
        activeSection = 'targets';
        loadPossibleTargets();
    }
}

/* ══════════════════════════════════════════════════════════════
   ЖЕЛАЕМЫЕ
   ══════════════════════════════════════════════════════════════ */
async function loadPossibleTargets(){
    var list = $('targetsList');
    if(!list) return;
    list.innerHTML = '<div class="empty-msg" style="grid-column:1/-1">Загрузка...</div>';
    try{
        var r = await fetch('/api/upgrade-possible-gifts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, current_gift_id: selectedGift.id })
        });
        var d = await r.json();
        if(!d.success){
            list.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;color:var(--red)">' + (d.error || 'Ошибка') + '</div>';
            return;
        }
        possibleTargets = [];
        (d.possible_gifts || []).forEach(function(g){
            if(g.value > selectedGift.value && g.value <= selectedGift.value * 10){
                var chance = Math.max(10, Math.min((selectedGift.value / g.value) * 100, 100));
                g.upgrade_chance = Math.round(chance * 10) / 10;
                possibleTargets.push(g);
            }
        });
        possibleTargets.sort(function(a, b){ return a.value - b.value; });
        renderTargetsList();
    }catch(e){
        list.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;color:var(--red)">Ошибка загрузки</div>';
    }
}

function renderTargetsList(){
    var list = $('targetsList');
    if(!list) return;
    list.innerHTML = '';
    if(possibleTargets.length === 0){
        list.innerHTML = '<div class="empty-msg" style="grid-column:1/-1">Ничего нет</div>';
        return;
    }
    possibleTargets.forEach(function(g){
        var isSelected = targetGift && (targetGift.id === g.id || targetGift.fragment_slug === g.fragment_slug);
        var div = document.createElement('div');
        div.className = 'target-row' + (isSelected ? ' selected' : '');
        var imgSrc = g.image || '/static/img/gift.png';
        div.innerHTML =
            '<img src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="target-row-info">'
            +   '<div class="target-row-name">' + (g.name || 'Gift') + '</div>'
            +   '<div class="target-row-price"><img src="/static/img/ton.png">' + ((g.value || 0) / 100).toFixed(2) + '</div>'
            + '</div>'
            + '<div class="target-row-chance">' + g.upgrade_chance + '%</div>';
        div.onclick = function(){ selectTarget(g); };
        list.appendChild(div);
    });
}

function selectTarget(g){
    targetGift = g;
    currentChance = g.upgrade_chance;
    $('rightCard').classList.add('has-gift');
    $('rightGiftImg').src = g.image;
    $('rightGiftName').textContent = g.name;
    $('rightGiftValue').textContent = ((g.value || 0) / 100).toFixed(2);

    $('wheelCenterImg').src = g.image;
    $('wheelCenterImg').classList.remove('visible');
    $('wheelCenterImg').classList.add('hidden');
    $('chancePct').classList.remove('hidden');
    $('chancePct').classList.add('visible');

    drawGreenArc(currentChance);
    renderTargetsList();
    updateWheel();

    $('targetsSection').classList.remove('show');
    $('btnTargets').classList.remove('active');
    activeSection = null;
}

/* ══════════════════════════════════════════════════════════════
   КНОПКА UPGRADE
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   ★ УСТАНОВКА ЦВЕТА ПО КОЭФФИЦИЕНТУ РИСКА
   ══════════════════════════════════════════════════════════════ */

function _updateRiskColor(coeff){
    var cont = document.querySelector('.wheel-container');
    if(!cont) return;

    /* Убираем старые классы */
    cont.classList.remove('risk-low', 'risk-mid', 'risk-high', 'risk-mega');

    /* Если коэф не задан — ничего не ставим */
    if(!coeff || coeff <= 0){
        return;
    }

    /* Определяем цвет по диапазону */
    if(coeff >= 1.1 && coeff < 1.7){
        cont.classList.add('risk-low');        /* 🟢 зелёный */
    } else if(coeff >= 1.7 && coeff < 2.2){
        cont.classList.add('risk-mid');        /* 🔵 голубой */
    } else if(coeff >= 2.2 && coeff < 5.0){
        cont.classList.add('risk-high');       /* 🟣 фиолетовый */
    } else if(coeff >= 5.0){
        cont.classList.add('risk-mega');       /* 🟠 оранжевый */
    }
}

function updateWheel(){
    var btn = $('upgradeBtn');
    var chancePct = $('chancePct');

    if(!targetGift || !selectedGift){
        chancePct.textContent = '0.00%';
        btn.disabled = true;
        drawGreenArc(0);
        _stopCenterAlternate();
        chancePct.classList.remove('hidden');
        chancePct.classList.add('visible');
        /* ★ Сброс цвета */
        var cont = document.querySelector('.wheel-container');
        if(cont) cont.classList.remove('risk-low', 'risk-mid', 'risk-high', 'risk-mega');
        return;
    }

    var chance = Math.max(10, Math.min((selectedGift.value / targetGift.value) * 100, 100));
    chance = Math.round(chance * 10) / 10;
    currentChance = chance;
    drawGreenArc(chance);

    /* ★ Устанавливаем цвет свечения по коэффициенту */
    var coeff = targetGift.value / selectedGift.value;
    _updateRiskColor(coeff);

    if(selectedGift.value < targetGift.value && targetGift.value <= selectedGift.value * 10){
        btn.disabled = false;
    } else {
        btn.disabled = true;
    }
    btn.classList.remove('win', 'fail');
    $('upgradeBtnText').textContent = 'Апгрейд';
}

/* ══════════════════════════════════════════════════════════════
   СПИН
   ══════════════════════════════════════════════════════════════ */
async function doUpgrade(){
    if(isSpinning || !targetGift || !selectedGift) return;
    isSpinning = true;

    var btn = $('upgradeBtn');
    btn.disabled = true;
    $('upgradeBtnText').textContent = 'Крутим...';
    $('resultSad').classList.remove('show');
    $('resultHappy').classList.remove('show');

    /* ★ Запускаем чередование PNG ↔ % */
    _startCenterAlternate(targetGift);

    try{
        var r = await fetch('/api/upgrade-multi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: userId,
                inventory_ids: [selectedGift.id],
                target_gift_id: targetGift.fragment_slug || targetGift.id
            })
        });
        var d = await r.json();

        if(!d.success){
            _stopCenterAlternate();
            btn.disabled = false;
            $('upgradeBtnText').textContent = 'Апгрейд';
            showTgAlert(d.error || 'Ошибка');
            resetAfterSpin();
            return;
        }

        /* ★ Крутим колесо */
        _spinWheel(d.upgrade_success, d.chance);

    }catch(e){
        _stopCenterAlternate();
        btn.disabled = false;
        $('upgradeBtnText').textContent = 'Апгрейд';
        showTgAlert('Ошибка сети');
        resetAfterSpin();
    }
}


function showResult(d){
    var center = $('wheelCenter');
    var btn = $('upgradeBtn');

    /* ★ Останавливаем чередование */
    _stopCenterAlternate();

    /* ★ Показываем ТОЛЬКО процент */
    var imgEl = $('wheelCenterImg');
    var pctEl = $('chancePct');
    if(imgEl){
        imgEl.classList.remove('visible');
        imgEl.classList.add('hidden');
    }
    if(pctEl){
        pctEl.classList.remove('hidden');
        pctEl.classList.add('visible');
        pctEl.style.opacity = '1';
        pctEl.style.transform = 'translate(-50%,-50%) scale(1)';
    }

    if(d.upgrade_success){
        center.classList.add('flash-green');
        $('resultHappy').classList.add('show');
        btn.classList.add('win');
        $('upgradeBtnText').textContent = 'Победа!';
        var wc = document.querySelector('.wheel-container');
        if(wc) wc.classList.add('win');
        launchConfetti();
    } else {
        center.classList.add('flash-red');
        $('resultSad').classList.add('show');
        btn.classList.add('fail');
        $('upgradeBtnText').textContent = 'Неудача';
        var wc2 = document.querySelector('.wheel-container');
        if(wc2) wc2.classList.add('fail');
    }

    setTimeout(function(){
        center.classList.remove('flash-red', 'flash-green');
        resetAfterSpin();
        loadInventory();
        loadTopBar();
    }, 3500);
}


function resetAfterSpin(){
    isSpinning = false;
    _stopCenterAlternate();

    selectedGift = null;
    targetGift = null;
    currentChance = 0;

    $('leftCard').classList.remove('has-gift');
    $('rightCard').classList.remove('has-gift');
    $('wheelCenterImg').classList.remove('visible');
    $('wheelCenterImg').classList.add('hidden');
    $('chancePct').classList.remove('hidden');
    $('chancePct').classList.add('visible');
    $('chancePct').style.opacity = '1';
    $('chancePct').style.transform = 'translate(-50%,-50%) scale(1)';
    $('chancePct').textContent = '0.00%';
    $('resultSad').classList.remove('show');
    $('resultHappy').classList.remove('show');

    /* ★ Сбрасываем трансформацию колеса */
    var container = document.querySelector('.wheel-container');
    if(container){
        container.style.transition = 'transform 0.5s ease';
        container.style.transform = 'rotate(0deg)';

    var invSec = $('inventorySection');

}



/* ══════════════════════════════════════════════════════════════
   КОНФЕТТИ
   ══════════════════════════════════════════════════════════════ */
function launchConfetti(){
    var canvas = $('confettiCanvas');
    if(!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    var ctx = canvas.getContext('2d');
    var particles = [];
    var colors = ['#1EE44C', '#06B6D4', '#3B82F6', '#00b4ff', '#FDA100', '#fff'];
    for(var i = 0; i < 120; i++){
        particles.push({
            x: canvas.width / 2 + (Math.random() - .5) * 100,
            y: canvas.height / 2,
            vx: (Math.random() - .5) * 12,
            vy: -Math.random() * 14 - 4,
            w: Math.random() * 8 + 3,
            h: Math.random() * 6 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * 360,
            rv: (Math.random() - .5) * 10,
            life: 1
        });
    }
    function draw(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var alive = false;
        particles.forEach(function(p){
            if(p.life <= 0) return;
            alive = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rot += p.rv;
            p.life -= 0.008;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot * Math.PI / 180);
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
        });
        if(alive) requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    draw();
}

/* ══════════════════════════════════════════════════════════════
   ★ РИСКИ ПО КРУГУ (как на фото)
   ══════════════════════════════════════════════════════════════ */
(function drawRisks(){
    var group = document.getElementById('risksGroup');
    if(!group) return;
    var cx = 145, cy = 145;
    var rOuter = 140;
    var total = 60;
    var html = '';
    for(var i = 0; i < total; i++){
        var angle = (i / total) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 10 : 6;
        var width = isMajor ? 2 : 1.2;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 2);
        var y1 = cy + Math.sin(rad) * (rOuter - 2);
        var x2 = cx + Math.cos(rad) * (rOuter - 2 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 2 - len);
        var opacity = isMajor ? 0.55 : 0.3;
        html += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="rgba(255,255,255,' + opacity + ')" stroke-width="' + width + '" stroke-linecap="round"/>';
    }
    group.innerHTML = html;
})();

/* ══════════════════════════════════════════════════════════════
   ★ ЧЕРЕДОВАНИЕ PNG ↔ ПРОЦЕНТ (вернули!)
   ══════════════════════════════════════════════════════════════ */
var _centerInterval = null;

function _startCenterAlternate(gift){
    _stopCenterAlternate();
    var center = $('wheelCenter');
    var img = $('wheelCenterImg');
    var pct = $('chancePct');
    if(!center || !img || !pct) return;

    if(gift && gift.image){
        img.src = gift.image;
        img.onerror = function(){
            this.onerror = null;
            this.src = '/static/img/gift.png';
        };
    } else {
        img.src = '/static/img/gift.png';
    }

    img.classList.add('visible');
    img.classList.remove('hidden');
    pct.classList.add('hidden');
    pct.classList.remove('visible');

    var showingImg = true;
    _centerInterval = setInterval(function(){
        if(showingImg){
            img.classList.remove('visible');
            img.classList.add('hidden');
            pct.classList.remove('hidden');
            void pct.offsetWidth;
            pct.classList.add('visible');
        } else {
            pct.classList.remove('visible');
            pct.classList.add('hidden');
            img.classList.remove('hidden');
            void img.offsetWidth;
            img.classList.add('visible');
        }
        showingImg = !showingImg;
    }, 700);
}

function _stopCenterAlternate(){
    if(_centerInterval){
        clearInterval(_centerInterval);
        _centerInterval = null;
    }
}

/* ══════════════════════════════════════════════════════════════
   ★ СПИН КОЛЕСА — сначала в одну сторону, потом в другую
   ══════════════════════════════════════════════════════════════ */

function _spinWheel(success, chance){
    var container = document.querySelector('.wheel-container');
    if(!container) return;

    /* Добавляем класс spin-обратно */
    container.style.transition = 'transform 0.4s cubic-bezier(.4,0,.6,1)';
    container.style.transform = 'rotate(-12deg)';

    /* Через 400мс — основной спин */
    setTimeout(function(){
        var greenAngle = (chance / 100) * 360;
        var landAngle;

        if(success){
            /* Успех — приземляемся в зелёной зоне */
            landAngle = Math.random() * greenAngle * 0.6 + greenAngle * 0.2;
        } else {
            /* Неудача — приземляемся в красной зоне */
            var redSize = 360 - greenAngle;
            landAngle = greenAngle + Math.random() * redSize * 0.3 + redSize * 0.05;
        }

        /* Много оборотов */
        var totalSpin = 360 * (6 + Math.floor(Math.random() * 4)) + landAngle;

        container.style.transition = 'transform 5.5s cubic-bezier(.1, .6, .2, 1)';
        container.style.transform = 'rotate(' + totalSpin + 'deg)';

        /* Через 5.5с — результат */
        setTimeout(function(){
            showResult({ upgrade_success: success, chance: chance });
        }, 5500);

    }, 400);
}

}

function closeInventoryModal(){

}

function openTargetsModal(){
    if(!selectedGift){
        showTgAlert('Сначала выбери подарок');
        return;
    }
    var m = document.getElementById('targetsModal');
    if(m) m.classList.add('show');
    document.getElementById('targetsSearch').value = '';
    _targetsSearchQ = '';
    renderTargetsModal();
}

function closeTargetsModal(){

    if(m) m.classList.remove('show');
}

function filterInventory(){
    _inventorySearchQ = document.getElementById('inventorySearch').value.toLowerCase().trim();
    renderInventoryModal();
}

function filterTargets(){
    _targetsSearchQ = document.getElementById('targetsSearch').value.toLowerCase().trim();
    renderTargetsModal();
}

function renderInventoryModal(){
    var grid = document.getElementById('inventoryGrid');
    if(!grid) return;
    grid.innerHTML = '';

    var items = userInventory.filter(function(it){
        if(!_inventorySearchQ) return true;
        return (it.gift_name || '').toLowerCase().indexOf(_inventorySearchQ) !== -1;
    });

    if(items.length === 0){
        grid.innerHTML = '<div class="modal-empty">Ничего нет</div>';
        return;
    }

    items.forEach(function(it){
        var isSelected = selectedGift && selectedGift.id === it.id;
        var div = document.createElement('div');
        div.className = 'modal-item' + (isSelected ? ' selected' : '');
        var imgSrc = it.gift_image || '/static/img/gift.png';
        div.innerHTML =
            '<img class="modal-item-img" src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="modal-item-name">' + (it.gift_name || 'Gift') + '</div>'
            + '<div class="modal-item-price"><img src="/static/img/ton.png">' + ((it.gift_value || 0) / 100).toFixed(2) + '</div>';
        div.onclick = function(){
            _selectGiftFromModal(it);
        };
        grid.appendChild(div);
    });
}

function renderTargetsModal(){
    var grid = document.getElementById('targetsGrid');
    if(!grid) return;
    grid.innerHTML = '';

    var items = possibleTargets.filter(function(g){
        if(!_targetsSearchQ) return true;
        return (g.name || '').toLowerCase().indexOf(_targetsSearchQ) !== -1;
    });

    if(items.length === 0){
        grid.innerHTML = '<div class="modal-empty">Ничего нет</div>';
        return;
    }

    items.forEach(function(g){
        var isSelected = targetGift && (targetGift.id === g.id || targetGift.fragment_slug === g.fragment_slug);
        var div = document.createElement('div');
        div.className = 'modal-item' + (isSelected ? ' selected' : '');
        var imgSrc = g.image || '/static/img/gift.png';
        div.innerHTML =
            '<img class="modal-item-img" src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="modal-item-name">' + (g.name || 'Gift') + '</div>'
            + '<div class="modal-item-price"><img src="/static/img/ton.png">' + ((g.value || 0) / 100).toFixed(2) + '</div>'
            + '<div class="modal-item-chance">' + g.upgrade_chance + '%</div>';
        div.onclick = function(){
            _selectTargetFromModal(g);
        };
        grid.appendChild(div);
    });
}

function _selectGiftFromModal(it){
    selectedGift = {
        id: it.id,
        name: it.gift_name,
        image: it.gift_image,
        value: it.gift_value,
        gift_id: it.gift_id
    };
    document.getElementById('leftCard').classList.add('has-gift');
    document.getElementById('leftGiftImg').src = it.gift_image;
    document.getElementById('leftGiftName').textContent = it.gift_name;
    document.getElementById('leftGiftValue').textContent = ((it.gift_value || 0) / 100).toFixed(2);

    if(targetGift) resetTarget();
    renderInventoryModal();
    updateWheel();

    /* Закрываем модалку инвентаря, открываем желаемое */
    closeInventoryModal();
    setTimeout(function(){
        loadPossibleTargets().then(function(){
            openTargetsModal();
        });
    }, 300);
}

function _selectTargetFromModal(g){
    targetGift = g;
    currentChance = g.upgrade_chance;
    document.getElementById('rightCard').classList.add('has-gift');
    document.getElementById('rightGiftImg').src = g.image;
    document.getElementById('rightGiftName').textContent = g.name;
    document.getElementById('rightGiftValue').textContent = ((g.value || 0) / 100).toFixed(2);

    document.getElementById('wheelCenterImg').src = g.image;
    document.getElementById('wheelCenterImg').classList.remove('visible');
    document.getElementById('wheelCenterImg').classList.add('hidden');
    document.getElementById('chancePct').classList.remove('hidden');
    document.getElementById('chancePct').classList.add('visible');
    document.getElementById('chancePct').style.opacity = '1';
    document.getElementById('chancePct').style.transform = 'translate(-50%,-50%) scale(1)';

    drawGreenArc(currentChance);
    renderTargetsModal();
    updateWheel();

    closeTargetsModal();
}

/* ══════════════════════════════════════════════════════════════
   ★ ОБНОВЛЕНИЕ ЗЕЛЁНОЙ АРКИ (для нового viewBox 290x290)
   ══════════════════════════════════════════════════════════════ */
function polarToCartesianNew(cx, cy, r, angle){
    var rad = (angle - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

/* Перебиваем drawGreenArc */
window.drawGreenArc = function(chance){
    var path = document.getElementById('greenPath');
    if(!path) return;
    if(!chance || chance <= 0){ path.setAttribute('d', ''); return; }
    var cx = 145, cy = 145, r = 138;
    var startAngle = 0;
    var endAngle = startAngle + (chance / 100) * 360;
    var start = polarToCartesianNew(cx, cy, r, startAngle);
    var end = polarToCartesianNew(cx, cy, r, endAngle);
    var largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
    path.setAttribute('d', 'M ' + start.x.toFixed(1) + ' ' + start.y.toFixed(1) + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + end.x.toFixed(1) + ' ' + end.y.toFixed(1));
};
