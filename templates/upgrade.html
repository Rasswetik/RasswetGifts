<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rasswet - Апгрейд</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#1C2233;
    --panel:#0B1120;
    --panel-2:#0d1424;
    --border:rgba(99,160,255,.12);
    --border-2:rgba(99,160,255,.22);
    --text:#fff;
    --text-2:#8CA0BE;
    --text-3:rgba(140,160,190,.6);
    --green:#24C38E;
    --red:#FF3064;
    --gold:#FFD700;
    --blue:#3B82F6;
    --blue-2:#2563EB;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --tg-header:56px;
}
html{height:100%}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-user-select:none;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior-y:contain;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ══════════════════════════════════════════════════════════════
   LOADING
   ══════════════════════════════════════════════════════════════ */
.loading-screen{position:fixed;inset:0;background:#1C2233;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s ease, visibility .5s ease}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-wheel{width:180px;height:180px;position:relative;animation:loadingRotate 3s linear infinite}
@keyframes loadingRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.loading-wheel svg{width:100%;height:100%;display:block}
.loading-wheel .ld-ring{fill:none;stroke:#0d1424;stroke-width:18}
.loading-wheel .ld-green{fill:none;stroke:url(#ldGreenGrad);stroke-width:18;stroke-linecap:round}
.loading-wheel .ld-tick{stroke:#fff;stroke-width:1.5;stroke-linecap:round}
.loading-wheel .ld-inner{fill:none;stroke:rgba(255,255,255,.04);stroke-width:1}
.loading-text{font-size:13px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase}
.loading-progress{width:220px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.loading-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#24C38E,#10b981);border-radius:2px;transition:width .3s ease}
.loading-arrow{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:10;filter:drop-shadow(0 4px 12px rgba(0,0,0,.8))}

/* ══════════════════════════════════════════════════════════════
   TOP BAR (как в краше)
   ══════════════════════════════════════════════════════════════ */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-top) + 58px) 14px 10px;max-width:480px;margin:0 auto;position:relative;z-index:10}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1.5px solid rgba(30,228,76,.45);background:rgba(30,228,76,.12);font-family:inherit;font-weight:700;font-size:13px;color:#1EE44C;backdrop-filter:blur(5px)}
.online-pill svg{width:12px;height:12px}
.top-right-btns{display:flex;gap:8px;align-items:center}
.bal-pill-crash{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:rgba(120,135,160,.1);border:1px solid rgba(120,135,160,.25);font-weight:700;font-size:13px;color:#fff;backdrop-filter:blur(5px)}
.bal-pill-crash img{width:16px;height:16px}
.bal-plus-crash{width:28px;height:28px;border-radius:50%;border:none;background:rgba(120,135,160,.3);color:#A0B0C4;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;border:1px solid rgba(120,135,160,.45)}
.bal-plus-crash:active{transform:scale(.9)}

/* ══════════════════════════════════════════════════════════════
   WRAPPER
   ══════════════════════════════════════════════════════════════ */
.upgrade-wrap{max-width:480px;margin:0 auto;padding:4px 14px calc(var(--safe-bottom) + 92px);display:flex;flex-direction:column;align-items:center;gap:12px}

/* ══════════════════════════════════════════════════════════════
   ПАНЕЛЬ ВЫБОРА (в стиле краша)
   ══════════════════════════════════════════════════════════════ */
.select-panel{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.select-card{
    background:linear-gradient(180deg,rgba(99,160,255,.05),rgba(99,160,255,.01));
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative;
    min-height:160px;
    justify-content:center;
    overflow:hidden;
}
.select-card:active{transform:scale(.97)}
.select-card.has-item{
    border-color:rgba(59,130,246,.4);
    background:linear-gradient(180deg,rgba(59,130,246,.08),rgba(59,130,246,.02));
    box-shadow:0 0 0 1px rgba(59,130,246,.15),0 8px 24px rgba(59,130,246,.15);
}
.select-card-title{
    font-size:11px;
    font-weight:800;
    color:var(--text-2);
    text-transform:uppercase;
    letter-spacing:.6px;
    text-align:center;
    line-height:1.2;
}
.select-empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.select-empty-icon{
    width:56px;height:56px;border-radius:16px;
    background:rgba(99,160,255,.06);
    border:1.5px dashed rgba(99,160,255,.25);
    display:flex;align-items:center;justify-content:center;
    color:rgba(99,160,255,.6);
}
.select-empty-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5}
.select-empty-text{font-size:11px;color:var(--text-3);font-weight:600}
.select-filled{display:none;flex-direction:column;align-items:center;gap:6px;width:100%}
.select-card.has-item .select-empty{display:none}
.select-card.has-item .select-filled{display:flex;animation:cardPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.select-img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.select-name{font-size:11px;font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.select-price{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 10px;
    background:rgba(99,160,255,.08);
    border:1px solid rgba(99,160,255,.18);
    border-radius:10px;
    font-size:11px;font-weight:800;
    color:#A0B0C4;
    line-height:1;
}
.select-price img{width:11px;height:11px}
.select-chance{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 12px;
    background:rgba(59,130,246,.15);
    border:1px solid rgba(59,130,246,.35);
    border-radius:10px;
    font-size:13px;font-weight:900;
    color:#3B82F6;
    line-height:1;margin-top:4px;
}

/* ══════════════════════════════════════════════════════════════
   КОЛЕСО
   ══════════════════════════════════════════════════════════════ */
.wheel-section{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 4px;position:relative}
.wheel-wrap{position:relative;width:290px;height:290px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.wheel-pointer{
    position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    z-index:10;width:42px;height:42px;pointer-events:none;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.9));
}
.wheel-pointer svg{width:100%;height:100%;display:block}

/* Золотая полоса — спавн на рандоме */
.wheel-gold-arc{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:2;
    transform-origin:50% 50%;will-change:transform;
    transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;
    opacity:0;transition:opacity .35s ease;
}
.wheel-gold-arc.visible{opacity:1}
.wheel-gold-arc.pulsing{animation:goldArcPulse 1s ease-in-out infinite}
@keyframes goldArcPulse{
    0%,100%{filter:drop-shadow(0 0 6px rgba(255,215,0,.7))}
    50%{filter:drop-shadow(0 0 22px rgba(255,215,0,1))}
}

/* Результат PNG в центре */
.wheel-result{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:170px;height:170px;z-index:20;
    pointer-events:none;opacity:0;
    transition:opacity .3s ease, transform .3s ease;
}
.wheel-result.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    animation:resultBounce .6s cubic-bezier(.34,1.56,.64,1);
}
.wheel-result img{
    width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 0 40px rgba(36,195,142,.6));
}
.wheel-result.fail img{
    filter:drop-shadow(0 0 40px rgba(255,48,100,.6));
}
@keyframes resultBounce{
    0%{transform:translate(-50%,-50%) scale(0)}
    50%{transform:translate(-50%,-50%) scale(1.15)}
    100%{transform:translate(-50%,-50%) scale(1)}
}

/* Вспышка */
.wheel-flash{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:290px;height:290px;border-radius:50%;
    pointer-events:none;z-index:15;opacity:0;
}
.wheel-flash.show{animation:flashAnim .8s ease-out}
@keyframes flashAnim{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
    50%{opacity:.8}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
}
.wheel-flash.win{background:radial-gradient(circle, rgba(36,195,142,.6) 0%, transparent 70%)}
.wheel-flash.fail{background:radial-gradient(circle, rgba(255,48,100,.5) 0%, transparent 70%)}
.wheel-flash.gold{background:radial-gradient(circle, rgba(255,215,0,.85) 0%, transparent 70%)}

/* Тряска */
@keyframes wheelShake{
    0%,100%{transform:translateX(0)}
    10%,30%,50%,70%,90%{transform:translateX(-6px)}
    20%,40%,60%,80%{transform:translateX(6px)}
}
.wheel-wrap.shake{animation:wheelShake .55s ease-in-out}

/* Звёзды при победе */
.star-particle{
    position:absolute;width:24px;height:24px;
    pointer-events:none;z-index:25;opacity:0;transform:scale(0);
    animation:starPop 1.2s ease-out forwards;
}
.star-particle img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,215,0,.8))}
@keyframes starPop{
    0%{opacity:0;transform:scale(0) rotate(0deg)}
    20%{opacity:1;transform:scale(1.3) rotate(45deg)}
    100%{opacity:0;transform:scale(0) rotate(360deg) translateY(-50px)}
}

/* Колесо */
.wheel-rotator{
    position:absolute;top:0;left:0;width:100%;height:100%;
    will-change:transform;transform-origin:50% 50%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    transform:translateZ(0);
}
.wheel-rotator svg{width:100%;height:100%;display:block}
.wheel-green-arc{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:1;
    transform-origin:50% 50%;will-change:transform;
    transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.wheel-center{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, #0d1424 0%, #0a0f1c 100%);
    border:2px solid rgba(99,160,255,.15);
    box-shadow:
        inset 0 0 30px rgba(0,0,0,.9),
        0 0 0 5px rgba(11,17,32,.95);
    display:flex;align-items:center;justify-content:center;
    z-index:5;overflow:hidden;
    transition:all .3s ease;
}
.wheel-center-img{position:absolute;width:76px;height:76px;object-fit:contain;opacity:0;transition:opacity .3s ease;z-index:2;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.wheel-center-img.visible{opacity:1}
.wheel-center-pct{position:absolute;font-size:26px;font-weight:900;letter-spacing:-1px;color:#fff;opacity:0;transition:opacity .3s ease;z-index:3}
.wheel-center-pct.visible{opacity:1}

/* ══════════════════════════════════════════════════════════════
   КНОПКИ (в стиле краша)
   ══════════════════════════════════════════════════════════════ */
.actions-row{width:100%;display:flex;gap:10px;margin-top:4px}
.btn-main{
    flex:1;
    height:56px;
    border-radius:16px;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    border:2px solid rgba(59,130,246,.35);
    color:#fff;
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .2s;
    letter-spacing:.5px;
    box-shadow:0 8px 25px rgba(59,130,246,.25);
}
.btn-main:not(:disabled):active{transform:scale(.96)}
.btn-main:disabled{
    background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.25);
    cursor:not-allowed;
    border-color:rgba(255,255,255,.06);
    box-shadow:none;
}

/* Квадратная кнопка с молнией (замена Demo) */
.btn-bolt{
    width:56px;
    height:56px;
    flex:0 0 56px;
    border-radius:16px;
    background:rgba(99,160,255,.06);
    border:2px solid rgba(99,160,255,.18);
    color:#8CA0BE;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    padding:0;
    position:relative;
    overflow:hidden;
}
.btn-bolt svg{
    width:26px;
    height:26px;
    stroke:currentColor;
    fill:none;
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .3s;
    position:relative;
    z-index:1;
}
.btn-bolt:active{transform:scale(.94)}
.btn-bolt:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none !important;
}
.btn-bolt.enabled{
    color:#FFD700;
    border-color:rgba(255,215,0,.4);
    background:rgba(255,215,0,.08);
    box-shadow:0 0 16px rgba(255,215,0,.15);
}
.btn-bolt.active{
    color:#fff;
    background:linear-gradient(135deg,#FFD700,#FFA500);
    border-color:rgba(255,215,0,.7);
    box-shadow:0 0 24px rgba(255,215,0,.6);
}
.btn-bolt.active svg{
    stroke:#000;
    filter:drop-shadow(0 0 4px rgba(255,215,0,.8));
    animation:boltPulse .6s ease-in-out infinite;
}
@keyframes boltPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
}

/* ══════════════════════════════════════════════════════════════
   МОДАЛКИ
   ══════════════════════════════════════════════════════════════ */
.modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:9000;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;
    transition:opacity .25s, visibility .25s;
}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-sheet{
    background:linear-gradient(180deg,#0d1424 0%,#0a0f1c 100%);
    border-radius:24px 24px 0 0;
    width:100%;max-width:480px;max-height:85vh;
    display:flex;flex-direction:column;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.32,1,.23,1);
    border-top:1px solid rgba(99,160,255,.2);
    overflow:hidden;
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
.modal-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.modal-title img{width:20px;height:20px;object-fit:contain}
.modal-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.modal-close:active{transform:scale(.9)}
.modal-search-wrap{padding:12px 20px;flex-shrink:0;position:relative}
.modal-search{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:1.5px solid rgba(99,160,255,.1);background:rgba(99,160,255,.04);color:#fff;font-size:14px;outline:none;transition:all .2s;font-family:inherit}
.modal-search:focus{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.06)}
.modal-search::placeholder{color:rgba(255,255,255,.3)}
.modal-search-icon{position:absolute;left:34px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:2;pointer-events:none}
.modal-body{flex:1;overflow-y:auto;padding:0 20px 20px;overscroll-behavior:contain}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}
.modal-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px}
.modal-item{
    background:rgba(99,160,255,.04);
    border:1.5px solid rgba(99,160,255,.08);
    border-radius:14px;
    padding:10px 6px 8px;
    display:flex;flex-direction:column;align-items:center;
    cursor:pointer;transition:all .2s;
    position:relative;overflow:hidden;
    animation:itemIn .3s cubic-bezier(.4,0,.2,1) both;
}
@keyframes itemIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.modal-item:active{transform:scale(.96)}
.modal-item.selected{border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.12)}
.modal-item.selected::after{content:'';position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center center no-repeat, #3B82F6;background-size:12px 12px}
.modal-item-img{width:60px;height:60px;object-fit:contain;margin-bottom:5px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.modal-item-name{font-size:10px;font-weight:700;color:rgba(255,255,255,.85);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-item-price{font-size:10px;font-weight:800;color:#8CA0BE;background:rgba(99,160,255,.08);padding:3px 8px;border-radius:7px;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.modal-item-price img{width:9px;height:9px}
.modal-item-chance{font-size:10px;font-weight:900;color:#3B82F6;background:rgba(59,130,246,.15);padding:3px 8px;border-radius:7px;margin-top:4px;border:1px solid rgba(59,130,246,.25)}
.modal-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:rgba(255,255,255,.3);font-size:13px;font-weight:600}
.modal-empty-icon{width:64px;height:64px;margin:0 auto 16px;opacity:.4}
.modal-empty-icon img{width:100%;height:100%;object-fit:contain}

/* ══════════════════════════════════════════════════════════════
   DEPOSIT
   ══════════════════════════════════════════════════════════════ */
.deposit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9600;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;backdrop-filter:blur(8px);transition:opacity .3s,visibility .3s}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{background:linear-gradient(180deg,#0d1424,#0a0f1c);border-radius:24px;width:90%;max-width:360px;padding:24px 20px;transform:scale(.9);transition:transform .3s;border:1px solid rgba(99,160,255,.15)}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.deposit-title{font-weight:800;font-size:18px}
.deposit-close{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:16px}
.deposit-methods{display:flex;gap:10px}
.deposit-method{flex:1;padding:16px 10px;border-radius:16px;background:rgba(99,160,255,.04);border:1px solid rgba(99,160,255,.1);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s}
.deposit-method:active{transform:scale(.96)}
.deposit-method img{width:36px;height:36px}

/* ══════════════════════════════════════════════════════════════
   BOTTOM NAV — по центру (как в краше)
   ══════════════════════════════════════════════════════════════ */
.bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    z-index:4000;width:100%;max-width:480px;
    height:76px;
    padding:0 8px calc(var(--safe-bottom) + 6px);
    background:rgba(28,34,51,.92);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-top:1px solid rgba(59,130,246,.08);
    display:flex;align-items:center;justify-content:space-around;
}
.bnav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;
    padding:6px 14px;
    border-radius:12px;
    background:transparent;border:none;
    color:rgba(255,255,255,.4);
    font-family:inherit;font-weight:600;
    cursor:pointer;transition:all .3s;
    text-decoration:none;position:relative;
    min-height:56px;height:56px;margin:auto 0;
}
.bnav-item svg{width:22px;height:22px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
.bnav-item span{font-size:10px;font-weight:600;line-height:1}
.bnav-item.active{background:rgba(255,255,255,.08);color:#fff}
.bnav-item:active{transform:scale(.9)}

/* ══════════════════════════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════════════════════════ */
.toast{
    position:fixed;bottom:calc(var(--safe-bottom) + 92px);
    left:50%;transform:translateX(-50%) translateY(16px);
    background:rgba(11,17,32,.96);
    border:1px solid rgba(99,160,255,.2);
    backdrop-filter:blur(10px);
    padding:12px 20px;border-radius:14px;
    font-size:13px;font-weight:700;
    z-index:9999;opacity:0;visibility:hidden;
    transition:all .3s;max-width:90%;
    text-align:center;
    display:flex;align-items:center;gap:8px;justify-content:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast img{width:20px;height:20px;object-fit:contain}
.toast.ok{border-color:rgba(36,195,142,.4);color:#24C38E}
.toast.err{border-color:rgba(255,48,100,.4);color:#FF3064}
.toast.gold{border-color:rgba(255,215,0,.5);color:#FFD700}

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var tg = window.Telegram && window.Telegram.WebApp;
var userId = null;
var userInventory = [];
var selectedGift = null;
var targetGift = null;
var possibleTargets = [];
var isSpinning = false;
var currentChance = 0;
var _inventorySearchQ = '';
var _targetsSearchQ = '';

/* Turbo mode — ускоряет анимацию */
var turboMode = localStorage.getItem('upgrade_turbo') === 'on';

/* GOLD:
   10% — полоса появится на колесе (в рандомном месте зелёной зоны)
   5%  — выпадет золото (при попадании в полосу)
   Если золото выпало — выдаётся 2 предмета вместо 1 */
var GOLD_APPEAR_CHANCE = 0.10;
var GOLD_WIN_CHANCE = 0.05;

/* Позиция золотой полосы в градусах от начала зелёной зоны.
   Заполняется при спавне. */
var _goldAngle = -1;
var _goldWidth = 25; /* ширина золотого сегмента в градусах */

function $(id){ return document.getElementById(id); }

function showTgAlert(msg, cb){
    if(tg && tg.showAlert){ tg.showAlert(msg, cb); }
    else { alert(msg); if(cb) cb(); }
}

function showToast(msg, type, iconUrl){
    var t = $('toast');
    if(!t) return;
    var icon = iconUrl ? '<img src="' + iconUrl + '" alt="">' : '';
    t.innerHTML = icon + '<span>' + msg + '</span>';
    t.className = 'toast show ' + (type || '');
    setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

/* ══════════════════════════════════════════════════════════════
   LOADING
   ══════════════════════════════════════════════════════════════ */
(function initLoadingWheel(){
    var group = document.getElementById('ldRisks');
    if(!group) return;
    var cx = 100, cy = 100, rOuter = 86;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 7 : 4;
        var width = isMajor ? 1.6 : 1;
        var opacity = isMajor ? 0.7 : 0.35;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 1);
        var y1 = cy + Math.sin(rad) * (rOuter - 1);
        var x2 = cx + Math.cos(rad) * (rOuter - 1 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 1 - len);
        html += '<line class="ld-tick" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="rgba(255,255,255,' + opacity + ')" stroke-width="' + width + '"/>';
    }
    group.innerHTML = html;
})();

var _ldP = 0;
function setLoadingProgress(pct){
    if(pct <= _ldP) return;
    _ldP = pct;
    var bar = $('loadingBar');
    var txt = $('loadingText');
    if(bar) bar.style.width = pct + '%';
    if(txt) txt.textContent = 'LOADING ' + Math.round(pct) + '%';
}
function hideLoadingScreen(){
    setLoadingProgress(100);
    setTimeout(function(){
        var ls = $('loadingScreen');
        if(ls){ ls.classList.add('hidden'); setTimeout(function(){ ls.style.display = 'none'; }, 500); }
    }, 200);
}
var _simInterval = setInterval(function(){
    if(_ldP >= 60){ clearInterval(_simInterval); return; }
    _ldP += 2;
    var bar = $('loadingBar');
    var txt = $('loadingText');
    if(bar) bar.style.width = _ldP + '%';
    if(txt) txt.textContent = 'LOADING ' + Math.round(_ldP) + '%';
}, 40);

/* ══════════════════════════════════════════════════════════════
   RISKS
   ══════════════════════════════════════════════════════════════ */
(function drawRisks(){
    var group = document.getElementById('risksGroup');
    if(!group) return;
    var cx = 120, cy = 120, rOuter = 104;
    var html = '';
    for(var i = 0; i < 60; i++){
        var angle = (i / 60) * 360;
        var isMajor = (i % 5 === 0);
        var len = isMajor ? 8 : 5;
        var width = isMajor ? 1.8 : 1;
        var opacity = isMajor ? 0.6 : 0.25;
        var rad = (angle - 90) * Math.PI / 180;
        var x1 = cx + Math.cos(rad) * (rOuter - 1);
        var y1 = cy + Math.sin(rad) * (rOuter - 1);
        var x2 = cx + Math.cos(rad) * (rOuter - 1 - len);
        var y2 = cy + Math.sin(rad) * (rOuter - 1 - len);
        html += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="rgba(140,160,190,' + opacity + ')" stroke-width="' + width + '" stroke-linecap="round"/>';
    }
    group.innerHTML = html;
})();

/* ══════════════════════════════════════════════════════════════
   ARCS
   ══════════════════════════════════════════════════════════════ */
function drawGreenArc(chance){
    var path = $('greenPath');
    if(!path) return;
    if(!chance || chance <= 0){ path.setAttribute('d', ''); return; }
    var cx = 120, cy = 120, r = 104;
    var startAngle = -90;
    var endAngle = startAngle + (chance / 100) * 360;
    function polar(a){
        var rad = a * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }
    var start = polar(startAngle);
    var end = polar(endAngle);
    var largeArc = (chance > 50) ? 1 : 0;
    var d = 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + end.x.toFixed(2) + ' ' + end.y.toFixed(2);
    path.setAttribute('d', d);
}

/* Показать золотую полосу в рандомном месте зелёной зоны */
function showGoldArcAtRandom(chance){
    var path = $('goldPath');
    if(!path) return;
    var cx = 120, cy = 120, r = 104;

    /* Ширина золотого сегмента ~25° (или меньше если green < 25°) */
    var width = Math.min(_goldWidth, Math.max(8, chance * 3.6 * 0.6));

    /* Рандомный старт внутри зелёной зоны, оставляя место для ширины */
    var greenDeg = (chance / 100) * 360;
    var maxOffset = Math.max(0, greenDeg - width);
    var offsetDeg = Math.random() * maxOffset;

    /* Начало зелёной зоны -90° */
    var startAngle = -90 + offsetDeg;
    var endAngle = startAngle + width;

    _goldAngle = startAngle;
    _goldWidth = width;

    function polar(a){
        var rad = a * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }
    var start = polar(startAngle);
    var end = polar(endAngle);
    var largeArc = (width > 180) ? 1 : 0;
    var d = 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2)
          + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 '
          + end.x.toFixed(2) + ' ' + end.y.toFixed(2);
    path.setAttribute('d', d);

    var arc = $('goldArc');
    if(arc){ arc.classList.add('visible'); }
}
function hideGoldArc(){
    var arc = $('goldArc');
    if(arc){ arc.classList.remove('visible','pulsing'); }
    _goldAngle = -1;
}
function pulseGoldArcStrong(){
    var arc = $('goldArc');
    if(arc){
        arc.classList.add('visible','pulsing');
        arc.style.filter = 'drop-shadow(0 0 30px rgba(255,215,0,1))';
    }
}

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
async function loadTopBar(){
    if(!userId) return;
    try{
        var r = await fetch('/api/user/' + userId);
        var d = await r.json();
        if(d.success && d.user){
            var u = d.user;
            $('balVal').textContent = ((u.balance_stars || 0) / 100).toFixed(2);
        }
    }catch(e){}
}
async function loadOnline(){
    try{
        var r = await fetch('/api/online-count');
        var d = await r.json();
        var el = $('onlineCount');
        if(el && d.count !== undefined) el.textContent = d.count;
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   TURBO MODE
   ══════════════════════════════════════════════════════════════ */
function toggleTurbo(){
    turboMode = !turboMode;
    localStorage.setItem('upgrade_turbo', turboMode ? 'on' : 'off');
    syncTurboButton();
    showToast(turboMode ? '⚡ Ускорение включено' : 'Ускорение выключено', turboMode ? 'gold' : 'ok');
}
function syncTurboButton(){
    var btn = $('boltBtn');
    if(!btn) return;
    btn.classList.remove('enabled','active');
    if(selectedGift && targetGift){
        btn.disabled = false;
        btn.classList.add(turboMode ? 'active' : 'enabled');
    } else {
        btn.disabled = true;
    }
}

/* ══════════════════════════════════════════════════════════════
   INVENTORY
   ══════════════════════════════════════════════════════════════ */
async function loadInventory(){
    if(!userId) return;
    try{
        var r = await fetch('/api/inventory/' + userId);
        var d = await r.json();
        if(d.success){
            userInventory = (d.inventory || []).filter(function(it){
                return !it.is_withdrawing && !it.challenge_locked;
            });
        }
    }catch(e){}
}
function openInventoryModal(){
    if(isSpinning) return;
    var m = $('inventoryModal');
    if(m) m.classList.add('show');
    $('inventorySearch').value = '';
    _inventorySearchQ = '';
    renderInventoryModal();
}
function closeInventoryModal(){ var m = $('inventoryModal'); if(m) m.classList.remove('show'); }
function filterInventory(){ _inventorySearchQ = $('inventorySearch').value.toLowerCase().trim(); renderInventoryModal(); }
function renderInventoryModal(){
    var grid = $('inventoryGrid');
    if(!grid) return;
    grid.innerHTML = '';
    var items = userInventory.filter(function(it){
        if(!_inventorySearchQ) return true;
        return (it.gift_name || '').toLowerCase().indexOf(_inventorySearchQ) !== -1;
    });
    if(items.length === 0){
        grid.innerHTML = '<div class="modal-empty"><div class="modal-empty-icon"><img src="/static/img/gift.png" alt=""></div>Ничего нет</div>';
        return;
    }
    items.forEach(function(it){
        var isSelected = selectedGift && selectedGift.id === it.id;
        var div = document.createElement('div');
        div.className = 'modal-item' + (isSelected ? ' selected' : '');
        var imgSrc = it.gift_image || '/static/img/gift.png';
        div.innerHTML =
            '<img class="modal-item-img" src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="modal-item-name">' + (it.gift_name || 'Gift') + '</div>'
            + '<div class="modal-item-price"><img src="/static/img/ton.png">' + ((it.gift_value || 0) / 100).toFixed(2) + '</div>';
        div.onclick = function(){ _selectGift(it); };
        grid.appendChild(div);
    });
}
function _selectGift(it){
    selectedGift = {
        id: it.id,
        name: it.gift_name,
        image: it.gift_image,
        value: it.gift_value,
        gift_id: it.gift_id
    };
    $('leftCard').classList.add('has-item');
    $('leftGiftImg').src = it.gift_image;
    $('leftGiftName').textContent = it.gift_name;
    $('leftGiftValue').textContent = ((it.gift_value || 0) / 100).toFixed(2);

    if(targetGift){
        targetGift = null;
        $('rightCard').classList.remove('has-item');
        $('rightChance').style.display = 'none';
        drawGreenArc(0);
    }
    hideGoldArc();
    updateWheel();
    closeInventoryModal();

    setTimeout(function(){
        loadPossibleTargets().then(function(){ openTargetsModal(); });
    }, 300);
}

/* ══════════════════════════════════════════════════════════════
   TARGETS
   ══════════════════════════════════════════════════════════════ */
async function loadPossibleTargets(){
    if(!selectedGift) return;
    try{
        var r = await fetch('/api/upgrade-possible-gifts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: userId, current_gift_id: selectedGift.id})
        });
        var d = await r.json();
        if(!d.success) return;
        possibleTargets = [];
        (d.possible_gifts || []).forEach(function(g){
            if(g.value > selectedGift.value && g.value <= selectedGift.value * 10){
                var ch = Math.max(10, Math.min((selectedGift.value / g.value) * 100, 100));
                g.upgrade_chance = Math.round(ch * 10) / 10;
                possibleTargets.push(g);
            }
        });
        possibleTargets.sort(function(a, b){ return a.value - b.value; });
    }catch(e){}
}
function openTargetsModal(){
    if(isSpinning) return;
    if(!selectedGift){
        showTgAlert('Сначала выбери свой подарок');
        return;
    }
    if(possibleTargets.length === 0){
        loadPossibleTargets().then(function(){
            var m = $('targetsModal');
            if(m) m.classList.add('show');
            $('targetsSearch').value = '';
            _targetsSearchQ = '';
            renderTargetsModal();
        });
        return;
    }
    var m = $('targetsModal');
    if(m) m.classList.add('show');
    $('targetsSearch').value = '';
    _targetsSearchQ = '';
    renderTargetsModal();
}
function closeTargetsModal(){ var m = $('targetsModal'); if(m) m.classList.remove('show'); }
function filterTargets(){ _targetsSearchQ = $('targetsSearch').value.toLowerCase().trim(); renderTargetsModal(); }
function renderTargetsModal(){
    var grid = $('targetsGrid');
    if(!grid) return;
    grid.innerHTML = '';
    var items = possibleTargets.filter(function(g){
        if(!_targetsSearchQ) return true;
        return (g.name || '').toLowerCase().indexOf(_targetsSearchQ) !== -1;
    });
    if(items.length === 0){
        grid.innerHTML = '<div class="modal-empty"><div class="modal-empty-icon"><img src="/static/img/gift.png" alt=""></div>Ничего нет</div>';
        return;
    }
    items.forEach(function(g){
        var isSelected = targetGift && (targetGift.id === g.id || targetGift.fragment_slug === g.fragment_slug);
        var div = document.createElement('div');
        div.className = 'modal-item' + (isSelected ? ' selected' : '');
        var imgSrc = g.image || '/static/img/gift.png';
        div.innerHTML =
            '<img class="modal-item-img" src="' + imgSrc + '" alt="" onerror="this.src=\'/static/img/gift.png\'">'
            + '<div class="modal-item-name">' + (g.name || 'Gift') + '</div>'
            + '<div class="modal-item-price"><img src="/static/img/ton.png">' + ((g.value || 0) / 100).toFixed(2) + '</div>'
            + '<div class="modal-item-chance">' + g.upgrade_chance + '%</div>';
        div.onclick = function(){ _selectTarget(g); };
        grid.appendChild(div);
    });
}
function _selectTarget(g){
    targetGift = g;
    currentChance = g.upgrade_chance;
    $('rightCard').classList.add('has-item');
    $('rightGiftImg').src = g.image;
    $('rightGiftName').textContent = g.name;
    $('rightGiftValue').textContent = ((g.value || 0) / 100).toFixed(2);
    var chEl = $('rightChance');
    chEl.textContent = g.upgrade_chance + '%';
    chEl.style.display = 'inline-flex';

    hideGoldArc();
    drawGreenArc(currentChance);
    updateWheel();
    closeTargetsModal();
}

/* ══════════════════════════════════════════════════════════════
   WHEEL STATE
   ══════════════════════════════════════════════════════════════ */
function updateWheel(){
    var btn = $('upgradeBtn');
    var pct = $('chancePct');
    if(!targetGift || !selectedGift){
        pct.textContent = '0.00%';
        pct.classList.add('visible');
        btn.disabled = true;
        $('upgradeBtnText').textContent = 'Апгрейд';
        drawGreenArc(0);
        syncTurboButton();
        return;
    }
    pct.textContent = currentChance.toFixed(2) + '%';
    pct.classList.add('visible');
    btn.disabled = false;
    $('upgradeBtnText').textContent = 'Апгрейд';
    syncTurboButton();
}

/* ══════════════════════════════════════════════════════════════
   UPGRADE
   ══════════════════════════════════════════════════════════════ */
async function doUpgrade(){
    if(isSpinning || !targetGift || !selectedGift) return;
    isSpinning = true;

    var btn = $('upgradeBtn');
    var bolt = $('boltBtn');
    btn.disabled = true;
    bolt.disabled = true;
    $('upgradeBtnText').textContent = 'Крутим...';

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(!rotator || !greenArc) return;

    /* Откат */
    rotator.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    greenArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    if(goldArc) goldArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    rotator.style.transform = 'rotate(-20deg)';
    greenArc.style.transform = 'rotate(-20deg)';
    if(goldArc) goldArc.style.transform = 'rotate(-20deg)';

    /* Запрос к серверу */
    var result;
    try{
        var r = await fetch('/api/upgrade-multi', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: userId,
                inventory_ids: [selectedGift.id],
                target_gift_id: targetGift.fragment_slug || targetGift.id
            })
        });
        result = await r.json();
    }catch(e){
        result = {success: false, error: 'Ошибка сети'};
    }

    if(!result.success){
        rotator.style.transition = 'transform 0.5s ease';
        greenArc.style.transition = 'transform 0.5s ease';
        rotator.style.transform = 'rotate(0deg)';
        greenArc.style.transform = 'rotate(0deg)';
        if(goldArc) goldArc.style.transform = 'rotate(0deg)';
        btn.disabled = false;
        bolt.disabled = false;
        $('upgradeBtnText').textContent = 'Апгрейд';
        isSpinning = false;
        showTgAlert(result.error || 'Ошибка');
        return;
    }

    /* Определяем что произойдёт:
       - willShowGold: 10% шанс что полоса появится
       - goldWin: только если сервер дал WIN и рандом попал (5%) */
    var serverWin = !!result.upgrade_success;
    var willShowGold = Math.random() < GOLD_APPEAR_CHANCE;
    var goldRoll = Math.random() < GOLD_WIN_CHANCE;
    var goldWin = willShowGold && goldRoll && serverWin;

    spinWheel(result.chance, serverWin, false, willShowGold, goldWin);
}

/* Спин колеса */
function spinWheel(chance, isWin, isDemo, willShowGold, goldWin){
    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(!rotator || !greenArc) return;

    /* Откат назад */
    rotator.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    greenArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    if(goldArc) goldArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    rotator.style.transform = 'rotate(-20deg)';
    greenArc.style.transform = 'rotate(-20deg)';
    if(goldArc) goldArc.style.transform = 'rotate(-20deg)';

    /* Показываем золотую полосу если decided */
    if(willShowGold){
        setTimeout(function(){
            showGoldArcAtRandom(chance);
            var flash = $('wheelFlash');
            if(flash){
                flash.classList.remove('win','fail','gold','show');
                void flash.offsetWidth;
                flash.classList.add('gold','show');
            }
            showToast('✨ GOLD! ✨', 'gold');
            try{
                if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            }catch(e){}
        }, 350);
    }

    /* Целевой угол:
       Если goldWin — целимся в золотой сегмент
       Иначе если isWin — целимся в зелёную зону но НЕ в золотую
       Иначе — целимся за пределы зелёной */
    var landAngle;
    var goldStart = _goldAngle;
    var goldEnd = _goldAngle + _goldWidth;

    if(goldWin && goldStart >= 0){
        /* Целимся в середину золота */
        landAngle = goldStart + _goldWidth / 2;
    } else if(isWin){
        /* В зелёной зоне, но вне золотого сегмента */
        var greenStart = -90;
        var greenEnd = -90 + (chance / 100) * 360;
        for(var t = 0; t < 20; t++){
            var candidate = greenStart + Math.random() * (greenEnd - greenStart);
            if(goldStart < 0 || candidate < goldStart - 3 || candidate > goldEnd + 3){
                landAngle = candidate;
                break;
            }
        }
        if(landAngle === undefined){
            /* fallback если не смогли найти */
            landAngle = greenStart + Math.random() * ((goldStart - greenStart) * 0.7 || 20);
        }
    } else {
        /* Вне зелёной зоны */
        var gEnd = -90 + (chance / 100) * 360;
        var gap = 360 - (chance / 100) * 360;
        var minAng = gEnd + 5;
        var maxAng = 360 - 95;
        if(maxAng <= minAng) maxAng = minAng + 30;
        landAngle = minAng + Math.random() * (maxAng - minAng);
    }

    /* Целевой финальный угол в системе отсчёта колеса (стрелка сверху = 0°) */
    var targetRotation = 360 - (landAngle + 90) + 90; /* выравнивание к -90 = верху */

    /* Проверяем что приземление действительно в нужном месте */
    var baseSpin = 360 * (10 + Math.floor(Math.random() * 5));
    /* Итоговый угол поворота колеса = baseSpin + 360 - landAngle */
    var totalSpin = baseSpin + (360 - landAngle);

    var turboFactor = turboMode ? 0.35 : 1;
    var spinDuration = Math.round(7500 * turboFactor);

    setTimeout(function(){
        var trans = 'transform ' + spinDuration + 'ms cubic-bezier(.15,.7,.15,1)';
        rotator.style.transition = trans;
        greenArc.style.transition = trans;
        if(goldArc) goldArc.style.transition = trans;
        rotator.style.transform = 'rotate(' + totalSpin + 'deg)';
        greenArc.style.transform = 'rotate(' + totalSpin + 'deg)';
        if(goldArc) goldArc.style.transform = 'rotate(' + totalSpin + 'deg)';

        if(goldWin){
            setTimeout(function(){
                pulseGoldArcStrong();
                showToast('✨ ЗОЛОТО ВЫПАЛО! ✨', 'gold');
            }, Math.max(200, spinDuration - Math.round(1500 * turboFactor)));
        }

        setTimeout(function(){
            showSpinResult(isWin, isDemo, goldWin);
        }, spinDuration + 50);
    }, 500);
}

/* ══════════════════════════════════════════════════════════════
   RESULT
   ══════════════════════════════════════════════════════════════ */
function showSpinResult(isWin, isDemo, isGold){
    var flash = $('wheelFlash');
    var result = $('wheelResult');
    var resultImg = $('wheelResultImg');
    var wheelWrap = $('wheelWrap');

    if(flash){
        flash.classList.remove('win','fail','gold','show');
        void flash.offsetWidth;
        flash.classList.add(isGold ? 'gold' : (isWin ? 'win' : 'fail'));
        flash.classList.add('show');
    }

    if(!isWin && !isGold && wheelWrap){
        wheelWrap.classList.remove('shake');
        void wheelWrap.offsetWidth;
        wheelWrap.classList.add('shake');
        setTimeout(function(){ wheelWrap.classList.remove('shake'); }, 600);
    }

    if(result && resultImg){
        resultImg.src = isGold ? (targetGift.image || '/static/img/star2.png')
                       : (isWin ? (targetGift.image || '/static/img/star2.png')
                                : (selectedGift.image || '/static/img/gift.png'));
        resultImg.onerror = function(){
            this.onerror = null;
            this.src = isWin || isGold ? '/static/img/star2.png' : '/static/img/gift.png';
        };
        result.classList.remove('show','fail');
        void result.offsetWidth;
        if(!isWin && !isGold) result.classList.add('fail');
        result.classList.add('show');
    }

    if(isWin || isGold) spawnStars();

    try{
        if(tg && tg.HapticFeedback){
            tg.HapticFeedback.notificationOccurred((isWin || isGold) ? 'success' : 'error');
        }
    }catch(e){}

    var toastMsg, toastType, toastIcon;
    if(isDemo){
        toastMsg = isGold ? 'Демо: ЗОЛОТО (2 предмета)!' : (isWin ? 'Демо: победа!' : 'Демо: неудача');
        toastType = (isWin || isGold) ? 'ok' : 'err';
    } else {
        toastMsg = isGold ? '✨ GOLD WIN! (2 предмета) ✨' : (isWin ? 'Апгрейд успешен!' : 'Апгрейд не удался');
        toastType = isGold ? 'gold' : ((isWin) ? 'ok' : 'err');
    }
    toastIcon = (isWin || isGold) ? '/static/gifs/win.gif' : '/static/gifs/lose.gif';
    showToast(toastMsg, toastType, toastIcon);

    var resetDelay = isGold ? 4200 : 2600;
    setTimeout(function(){
        hideResult();
        if(isDemo){
            isSpinning = false;
            var rotator = $('wheelRotator');
            var greenArc = $('greenArc');
            var goldArc = $('goldArc');
            if(rotator){ rotator.style.transition = 'transform 0.6s ease'; rotator.style.transform = 'rotate(0deg)'; }
            if(greenArc){ greenArc.style.transition = 'transform 0.6s ease'; greenArc.style.transform = 'rotate(0deg)'; }
            if(goldArc){ goldArc.style.transition = 'transform 0.6s ease'; goldArc.style.transform = 'rotate(0deg)'; }
            var btn = $('upgradeBtn'); if(btn) btn.disabled = false;
            var bolt = $('boltBtn'); if(bolt) bolt.disabled = false;
            var btnText = $('upgradeBtnText'); if(btnText) btnText.textContent = 'Апгрейд';
            hideGoldArc();
            drawGreenArc(currentChance);
            updateWheel();
        } else {
            resetAfterSpin();
            loadInventory();
            loadTopBar();
        }
    }, resetDelay);
}

function hideResult(){
    var flash = $('wheelFlash');
    var result = $('wheelResult');
    if(flash) flash.classList.remove('show','win','fail','gold');
    if(result) result.classList.remove('show','fail');
}

/* Звёзды */
function spawnStars(){
    var wheel = $('wheelWrap');
    if(!wheel) return;
    var N = 12;
    for(var i = 0; i < N; i++){
        (function(idx){
            setTimeout(function(){
                var star = document.createElement('div');
                star.className = 'star-particle';
                var angle = (idx / N) * 360;
                var radius = 110 + Math.random() * 40;
                var rad = angle * Math.PI / 180;
                var x = Math.cos(rad) * radius;
                var y = Math.sin(rad) * radius;
                star.style.left = 'calc(50% + ' + x + 'px)';
                star.style.top = 'calc(50% + ' + y + 'px)';
                star.innerHTML = '<img src="/static/img/star.png" alt="">';
                wheel.appendChild(star);
                setTimeout(function(){ star.remove(); }, 1500);
            }, idx * 40);
        })(i);
    }
}

/* Сброс после спина */
function resetAfterSpin(){
    isSpinning = false;
    selectedGift = null;
    targetGift = null;
    currentChance = 0;

    $('leftCard').classList.remove('has-item');
    $('rightCard').classList.remove('has-item');
    $('rightChance').style.display = 'none';
    $('chancePct').textContent = '0.00%';
    $('chancePct').classList.add('visible');
    $('upgradeBtn').disabled = true;
    $('upgradeBtnText').textContent = 'Апгрейд';

    var bolt = $('boltBtn');
    if(bolt){ bolt.disabled = true; bolt.classList.remove('enabled','active'); }

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(rotator){ rotator.style.transition = 'transform 0.6s ease'; rotator.style.transform = 'rotate(0deg)'; }
    if(greenArc){ greenArc.style.transition = 'transform 0.6s ease'; greenArc.style.transform = 'rotate(0deg)'; }
    if(goldArc){ goldArc.style.transition = 'transform 0.6s ease'; goldArc.style.transform = 'rotate(0deg)'; }

    hideResult();
    hideGoldArc();
    drawGreenArc(0);
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
(async function init(){
    setLoadingProgress(5);
    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        if(tg){
            try{
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#1C2233');
                tg.setBackgroundColor('#1C2233');
            }catch(e){}
        }
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd.banned){ location.href = '/ban'; return; }
        }catch(e){}
    }
    setLoadingProgress(30);
    await loadTopBar();
    loadOnline();
    setInterval(loadOnline, 30000);
    setLoadingProgress(50);
    await loadInventory();
    setLoadingProgress(80);
    updateWheel();
    syncTurboButton();
    setLoadingProgress(100);
    clearInterval(_simInterval);
    hideLoadingScreen();
})();
</script>
