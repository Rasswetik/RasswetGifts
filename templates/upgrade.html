<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rasswet - Апгрейд</title>
<link rel="icon" href="/static/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --bg:#1C2233;
    --text:#fff;
    --text-2:#8CA0BE;
    --text-3:rgba(140,160,190,.6);
    --green:#24C38E;
    --gold:#FFD700;
    --blue:#3B82F6;
    --safe-top:env(safe-area-inset-top, 20px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
}
html{height:100%}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-feature-settings:'cv11','ss01','ss02','tnum';
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    letter-spacing:-.011em;
    background:#1C2233;
    background-image:radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
    color:var(--text);
    min-height:100vh;
    user-select:none;-webkit-user-select:none;
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior-y:contain;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:#1C2233;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s,visibility .5s}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-wheel{width:180px;height:180px;position:relative;animation:loadingRotate 3s linear infinite}
@keyframes loadingRotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.loading-wheel svg{width:100%;height:100%;display:block}
.loading-wheel .ld-ring{fill:none;stroke:#0d1424;stroke-width:18}
.loading-wheel .ld-green{fill:none;stroke:url(#ldGreenGrad);stroke-width:18;stroke-linecap:round}
.loading-wheel .ld-tick{stroke:#fff;stroke-width:1.5;stroke-linecap:round}
.loading-wheel .ld-inner{fill:none;stroke:rgba(255,255,255,.04);stroke-width:1}
.loading-text{font-size:13px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase}
.loading-progress{width:220px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.loading-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#24C38E,#10b981);border-radius:2px;transition:width .3s ease}
.loading-arrow{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:10;filter:drop-shadow(0 4px 12px rgba(0,0,0,.8))}

/* TOP BAR */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-top) + 58px) 14px 10px;max-width:480px;margin:0 auto;position:relative;z-index:10}
.top-left{display:flex;align-items:center;gap:8px}
.online-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1.5px solid rgba(30,228,76,.45);background:rgba(30,228,76,.12);font-weight:700;font-size:13px;color:#1EE44C;backdrop-filter:blur(5px);font-variant-numeric:tabular-nums}
.online-pill svg{width:12px;height:12px}
.top-right-btns{display:flex;gap:8px;align-items:center}
.bal-pill-crash{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:rgba(120,135,160,.1);border:1px solid rgba(120,135,160,.25);font-weight:800;font-size:14px;color:#fff;backdrop-filter:blur(5px);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bal-pill-crash img{width:16px;height:16px}

.settings-btn{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.12);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;color:#7CAEFF;
}
.settings-btn:active{transform:scale(.9)}
.settings-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* WRAPPER */
.upgrade-wrap{max-width:480px;margin:0 auto;padding:4px 14px calc(var(--safe-bottom) + 92px);display:flex;flex-direction:column;align-items:center;gap:12px}

/* SELECT PANEL */
.select-panel{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.select-card{
    background:linear-gradient(180deg,rgba(99,160,255,.06),rgba(99,160,255,.02));
    border:1.5px solid rgba(99,160,255,.18);
    border-radius:22px;padding:14px 12px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative;min-height:160px;justify-content:center;overflow:hidden;
}
.select-card:active{transform:scale(.97)}
.select-card.has-item{
    border-color:rgba(59,130,246,.5);
    background:linear-gradient(180deg,rgba(59,130,246,.12),rgba(59,130,246,.03));
    box-shadow:0 0 0 1px rgba(59,130,246,.2),0 8px 24px rgba(59,130,246,.18);
}
.select-card-title{font-size:11px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;text-align:center;line-height:1.2}
.select-empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.select-empty-icon{
    width:56px;height:56px;border-radius:18px;
    background:rgba(99,160,255,.08);
    border:1.5px dashed rgba(99,160,255,.35);
    display:flex;align-items:center;justify-content:center;
    color:rgba(99,160,255,.8);
}
.select-empty-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5}
.select-empty-text{font-size:11px;color:var(--text-3);font-weight:600}
.select-filled{display:none;flex-direction:column;align-items:center;gap:6px;width:100%}
.select-card.has-item .select-empty{display:none}
.select-card.has-item .select-filled{display:flex;animation:cardPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.select-img-wrap{
    width:72px;height:72px;border-radius:18px;overflow:hidden;
    position:relative;background:linear-gradient(180deg,#0d1220,#0a0f1a);
    border:1px solid rgba(99,160,255,.18);
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
}
.select-img-wrap img{width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box;display:block}
.select-img-wrap.upgraded img{object-fit:cover;padding:0;filter:none}
.select-img-wrap.gram-icon{background:linear-gradient(180deg,#0f2035,#0a1824);border-color:rgba(124,174,255,.4)}
.select-img-wrap.gram-icon img{padding:14px;object-fit:contain}
.select-name{font-size:11px;font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.select-price{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(99,160,255,.08);border:1px solid rgba(99,160,255,.18);border-radius:10px;font-size:11px;font-weight:800;color:#A0B0C4;line-height:1;font-variant-numeric:tabular-nums}
.select-price img{width:11px;height:11px}
.select-chance{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);border-radius:10px;font-size:13px;font-weight:900;color:#3B82F6;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* WHEEL */
.wheel-section{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 4px;position:relative}
.wheel-wrap{position:relative;width:290px;height:290px;margin:0 auto;display:flex;align-items:center;justify-content:center;transition:filter .5s ease}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:10;width:42px;height:42px;pointer-events:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,.9));transition:filter .5s}
.wheel-pointer svg{width:100%;height:100%;display:block}

/* ═══════════════════════════════════════════════════════
   ★ EPIC MODE — только затемнение фона, БЕЗ тяжёлых фильтров
   ═══════════════════════════════════════════════════════ */
body.epic-mode{
    background-image:
        radial-gradient(ellipse at center,
            rgba(36,195,142,.15) 0%,
            rgba(10,15,25,.7) 50%,
            rgba(10,15,25,.9) 100%),
        radial-gradient(ellipse 100% 60% at 50% 0%, #1a2238 0%, #1C2233 60%);
}
body.epic-mode .wheel-wrap{
    filter:drop-shadow(0 0 30px rgba(36,195,142,.6));
}
body.epic-mode .top-bar,
body.epic-mode .select-panel,
body.epic-mode .actions-row{
    filter:brightness(.6);
    transition:filter .5s ease;
}
body.epic-mode .wheel-pointer{
    filter:drop-shadow(0 0 15px rgba(36,195,142,.9)) drop-shadow(0 4px 12px rgba(0,0,0,.9));
}
body.epic-mode .wheel-green-arc{
    filter:drop-shadow(0 0 15px rgba(36,195,142,.8));
}

.wheel-gold-arc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;transform-origin:50% 50%;opacity:0;transition:opacity .35s ease}
.wheel-gold-arc.visible{opacity:1}

.wheel-rotator{position:absolute;top:0;left:0;width:100%;height:100%;will-change:transform;transform-origin:50% 50%}
.wheel-rotator svg{width:100%;height:100%;display:block}

.wheel-green-arc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;transform-origin:50% 50%;transition:filter .5s}

.wheel-center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, #0d1424 0%, #0a0f1c 100%);
    border:2px solid rgba(99,160,255,.18);
    box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 0 5px rgba(11,17,32,.95);
    display:flex;align-items:center;justify-content:center;
    z-index:5;overflow:hidden;
    transition:box-shadow .3s ease;
}
.wheel-center-pct{
    position:absolute;
    font-size:26px;font-weight:900;letter-spacing:-1.2px;
    color:#fff;opacity:0;transition:opacity .25s ease;z-index:1;
    font-variant-numeric:tabular-nums;
}
.wheel-center-pct.visible{opacity:1}
.wheel-center.hidden-pct .wheel-center-pct{opacity:0}

.wheel-center.winning{
    box-shadow:inset 0 0 60px rgba(36,195,142,.9),
               0 0 0 5px rgba(11,17,32,.95),
               0 0 80px rgba(36,195,142,1);
    border-color:rgba(36,195,142,1);
}

.center-result{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:104px;height:104px;z-index:5;
    pointer-events:none;opacity:0;
    transition:opacity .2s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;border-radius:50%;
}
.center-result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.center-result img{width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box;display:block}
.center-result.upgraded img{object-fit:cover;padding:0;border-radius:50%}
.center-result.win img{filter:drop-shadow(0 0 18px rgba(36,195,142,.85));animation:winPulse 1.2s ease-in-out infinite}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.center-result.gold img{filter:drop-shadow(0 0 20px rgba(255,215,0,.9));animation:goldPulseRes 1s ease-in-out infinite}
@keyframes goldPulseRes{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.center-result.fail{
    width:96px;height:96px;font-size:60px;line-height:1;
    color:#FF3064;text-shadow:0 0 30px rgba(255,48,100,.6);
    animation:failFade 2s ease-out forwards;
}
@keyframes failFade{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
    30%{transform:translate(-50%,-50%) scale(1);opacity:1}
    85%{transform:translate(-50%,-50%) scale(1);opacity:.9}
    100%{transform:translate(-50%,-50%) scale(.9);opacity:0}
}

.wheel-flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:290px;height:290px;border-radius:50%;pointer-events:none;z-index:15;opacity:0}
.wheel-flash.show{animation:flashAnim .8s ease-out}
@keyframes flashAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}50%{opacity:.8}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.wheel-flash.win{background:radial-gradient(circle, rgba(36,195,142,.65) 0%, transparent 70%)}
.wheel-flash.fail{background:radial-gradient(circle, rgba(255,48,100,.45) 0%, transparent 70%)}
.wheel-flash.gold{background:radial-gradient(circle, rgba(255,215,0,.8) 0%, transparent 70%)}
.wheel-flash.epic{background:radial-gradient(circle, rgba(36,195,142,1) 0%, rgba(36,195,142,.5) 30%, transparent 70%)}

@keyframes wheelShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-6px)}20%,40%,60%,80%{transform:translateX(6px)}}
.wheel-wrap.shake{animation:wheelShake .5s ease-in-out}

/* CONFETTI */
.confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99999;display:none}
.confetti-canvas.show{display:block}

/* ACTIONS */
.actions-row{width:100%;display:flex;gap:10px;margin-top:4px}
.btn-main{
    flex:1;height:56px;border-radius:18px;
    background:linear-gradient(135deg,#3B82F6,#2563EB);
    border:2px solid rgba(59,130,246,.4);
    color:#fff;font-size:15px;font-weight:800;
    text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;letter-spacing:.5px;
    box-shadow:0 8px 25px rgba(59,130,246,.35);
}
.btn-main:not(:disabled):active{transform:scale(.96)}
.btn-main:disabled{background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);cursor:not-allowed;border-color:rgba(255,255,255,.08);box-shadow:none}

.btn-bolt{
    width:56px;height:56px;flex:0 0 56px;
    border-radius:18px;
    background:rgba(140,160,190,.1);
    border:2px solid rgba(140,160,190,.2);
    color:#8CA0BE;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s;padding:0;
}
.btn-bolt svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.btn-bolt:active{transform:scale(.94)}
.btn-bolt:disabled{opacity:.35;cursor:not-allowed;transform:none !important}
.btn-bolt.enabled{color:#8CA0BE;border-color:rgba(140,160,190,.4);background:rgba(140,160,190,.15)}
.btn-bolt.active{color:#FFD700;background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.5);box-shadow:0 0 18px rgba(255,215,0,.3)}
.btn-bolt.active svg{animation:boltSpin .7s linear infinite}
@keyframes boltSpin{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:9000;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-sheet{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px 24px 0 0;
    width:100%;max-width:480px;
    max-height:90vh;
    display:flex;flex-direction:column;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.32,1,.23,1);
    border-top:1px solid rgba(99,160,255,.25);
    overflow:hidden;
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:12px auto 14px;flex-shrink:0}
.modal-title{font-size:17px;font-weight:800;text-align:center;margin-bottom:14px;color:#fff;flex-shrink:0;letter-spacing:-.02em}
.modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 12px;
    border-bottom:1px solid rgba(255,255,255,.06);
    flex-shrink:0;
    gap:8px;
}
.modal-title-inline{
    font-size:16px;font-weight:800;
    display:flex;align-items:center;gap:8px;
    flex:1;min-width:0;
    overflow:hidden;
    letter-spacing:-.02em;
}
.modal-title-inline img{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.modal-title-inline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-header-btns{display:flex;gap:6px;flex-shrink:0}
.modal-close{
    width:34px;height:34px;border-radius:12px;
    background:rgba(249,105,153,.15);color:#F96999;
    font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:none;cursor:pointer;
    transition:transform .15s;
}
.modal-close:active{transform:scale(.9)}

/* BET MODAL tabs */
.bet-tabs{display:flex;gap:4px;margin:0 16px 16px;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;flex-shrink:0}
.bet-tab{
    flex:1;padding:11px;border-radius:9px;border:none;
    background:transparent;color:rgba(255,255,255,.4);
    font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;
}
.bet-tab.active{
    background:rgba(59,130,246,.18);color:#7CAEFF;
    box-shadow:inset 0 0 0 1px rgba(59,130,246,.35);
}
.bet-tab img{width:14px;height:14px;object-fit:contain}

/* GRAM section */
.bet-gram-section{padding:0 16px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.bet-balance-card{padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(59,130,246,.04));border:1.5px solid rgba(59,130,246,.3);display:flex;align-items:center;justify-content:space-between;gap:12px}
.bet-balance-left{display:flex;flex-direction:column;gap:4px}
.bet-balance-label{font-size:11px;color:rgba(255,255,255,.55);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.bet-balance-value{font-size:26px;font-weight:900;color:#fff;display:flex;align-items:center;gap:6px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bet-balance-value img{width:24px;height:24px}
.bet-balance-icon{width:44px;height:44px;border-radius:12px;background:rgba(59,130,246,.2);display:flex;align-items:center;justify-content:center;font-size:22px}

.bet-amount-input-wrap{position:relative;display:flex;flex-direction:column;gap:8px}
.bet-amount-label{font-size:12px;color:rgba(255,255,255,.55);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.bet-amount-input{width:100%;padding:18px 90px 18px 20px;border-radius:16px;border:2px solid rgba(59,130,246,.3);background:rgba(59,130,246,.08);color:#fff;font-size:22px;font-weight:900;outline:none;font-family:inherit;transition:all .15s;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bet-amount-input:focus{border-color:rgba(59,130,246,.7);background:rgba(59,130,246,.14)}
.bet-amount-input::placeholder{color:rgba(255,255,255,.25);font-weight:600;font-size:16px}
.bet-amount-suffix{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:#7CAEFF;pointer-events:none;margin-top:14px;letter-spacing:-.02em}
.bet-amount-suffix img{width:18px;height:18px}

.bet-presets-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bet-preset-sm{
    flex:1;min-width:0;
    padding:11px 4px;border-radius:10px;
    border:1.5px solid rgba(99,160,255,.2);
    background:rgba(99,160,255,.06);
    color:#A0B0C4;
    font-size:12px;font-weight:800;
    cursor:pointer;transition:all .15s;
    font-family:inherit;
    letter-spacing:.2px;
    display:flex;align-items:center;justify-content:center;gap:3px;
}
.bet-preset-sm:active{transform:scale(.94);background:rgba(59,130,246,.2);color:#7CAEFF;border-color:rgba(59,130,246,.5)}
.bet-preset-sm svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bet-preset-sm.preset-min{border-color:rgba(36,195,142,.3);color:#24C38E}
.bet-preset-sm.preset-max{border-color:rgba(255,215,0,.3);color:#FFD700}

.bet-place-btn{width:100%;padding:18px;border-radius:16px;border:none;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-weight:900;font-size:16px;cursor:pointer;transition:all .15s;box-shadow:0 8px 24px rgba(59,130,246,.4);text-transform:uppercase;letter-spacing:.8px;font-family:inherit}
.bet-place-btn:active:not(:disabled){transform:scale(.97)}
.bet-place-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* INVENTORY section */
.bet-inv-section{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}

.modal-search-wrap{padding:0 16px 12px;position:relative;flex-shrink:0}
.modal-search{width:100%;padding:12px 16px 12px 44px;border-radius:12px;border:1.5px solid rgba(99,160,255,.25);background:rgba(59,130,246,.08);color:#fff;font-size:14px;outline:none;transition:all .15s;font-family:inherit;box-sizing:border-box}
.modal-search:focus{border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.14)}
.modal-search::placeholder{color:rgba(255,255,255,.35)}
.modal-search-icon{
    position:absolute;
    left:28px;
    top:50%;
    transform:translateY(-50%);
    width:16px;height:16px;
    stroke:rgba(255,255,255,.4);
    fill:none;
    stroke-width:2;
    pointer-events:none;
}

.modal-body{flex:1;overflow-y:auto;padding:0 16px 16px;overscroll-behavior:contain}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}

.modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.modal-item{
    background:linear-gradient(180deg,rgba(59,130,246,.12) 0%,rgba(59,130,246,.05) 100%);
    border:1.5px solid rgba(59,130,246,.25);
    border-radius:16px;padding:8px 6px 8px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    cursor:pointer;transition:all .2s;
    position:relative;overflow:hidden;
    animation:itemIn .3s cubic-bezier(.4,0,.2,1) both;
}
@keyframes itemIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.modal-item:active{transform:scale(.96)}
.modal-item.selected{
    border-color:rgba(59,130,246,.9);
    background:linear-gradient(180deg,rgba(59,130,246,.28) 0%,rgba(59,130,246,.15) 100%);
    box-shadow:0 0 0 1px rgba(59,130,246,.4),0 0 20px rgba(59,130,246,.3);
}
.modal-item.selected::after{
    content:'';position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center center no-repeat, #3B82F6;
    background-size:12px 12px;
    z-index:3;
}
.modal-item-img-wrap{
    width:64px;height:64px;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,rgba(59,130,246,.15),rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.25);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.35);
    position:relative;
    flex-shrink:0;
}
.modal-item-img-wrap img{width:100%;height:100%;object-fit:contain;padding:6px;box-sizing:border-box;display:block;position:relative;z-index:2}
.modal-item-img-wrap.upgraded img{object-fit:cover;padding:0}
.modal-item-img-wrap.placeholder::before{
    content:'🎁';position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;opacity:.4;z-index:1;
}
.modal-item-name{font-size:10px;font-weight:700;color:rgba(255,255,255,.95);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1;padding:0 2px}
.modal-item-price{
    font-size:10px;font-weight:800;color:#7CAEFF;
    background:rgba(59,130,246,.18);
    padding:3px 8px;border-radius:7px;
    display:inline-flex;align-items:center;gap:3px;
    border:1px solid rgba(59,130,246,.3);
    line-height:1;
    font-variant-numeric:tabular-nums;
}
.modal-item-price img{width:9px;height:9px}
.modal-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:rgba(255,255,255,.35);font-size:13px;font-weight:600}
.modal-empty-icon{width:64px;height:64px;margin:0 auto 16px;opacity:.4}
.modal-empty-icon img{width:100%;height:100%;object-fit:contain}

/* SETTINGS */
.settings-overlay{
    position:fixed;inset:0;z-index:9500;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
    padding:20px;
}
.settings-overlay.show{opacity:1;visibility:visible}
.settings-modal{
    background:linear-gradient(180deg,#2a3544 0%,#1f2a38 100%);
    border-radius:24px;width:100%;max-width:380px;
    padding:24px 22px;border:1px solid rgba(59,130,246,.25);
    transform:scale(.9);transition:transform .3s;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.settings-overlay.show .settings-modal{transform:scale(1)}
.settings-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.settings-title{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.02em}
.settings-close{width:34px;height:34px;border-radius:12px;border:none;background:rgba(249,105,153,.15);color:#F96999;cursor:pointer;font-size:16px;font-weight:700}

.sound-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px;border-radius:16px;
    background:rgba(59,130,246,.08);
    border:1.5px solid rgba(59,130,246,.2);
    gap:14px;
}
.sound-row-info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.sound-row-label{
    font-size:14px;font-weight:800;color:#fff;
    display:flex;align-items:center;gap:8px;
}
.sound-row-label svg{width:18px;height:18px;stroke:#7CAEFF;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sound-row-desc{font-size:11px;color:rgba(255,255,255,.5);font-weight:600}
.sound-row-desc span{color:#7CAEFF;font-weight:800}

.ios-switch{
    position:relative;width:52px;height:32px;min-width:52px;
    background:rgba(120,120,128,.32);
    border-radius:16px;cursor:pointer;
    transition:background .3s ease;
    flex-shrink:0;
}
.ios-switch::after{
    content:'';position:absolute;
    top:2px;left:2px;
    width:28px;height:28px;border-radius:50%;
    background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
    transition:transform .3s cubic-bezier(.4,.4,.25,1.3);
}
.ios-switch.on{background:#24C38E}
.ios-switch.on::after{transform:translateX(20px)}
.ios-switch:active::after{width:32px}

/* DEPOSIT */
.deposit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9600;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;backdrop-filter:blur(8px);transition:opacity .3s,visibility .3s;padding:20px}
.deposit-overlay.show{opacity:1;visibility:visible}
.deposit-modal{background:linear-gradient(180deg,#2a3544,#1f2a38);border-radius:24px;width:100%;max-width:360px;padding:24px 20px;transform:scale(.9);transition:transform .3s;border:1px solid rgba(99,160,255,.2)}
.deposit-overlay.show .deposit-modal{transform:scale(1)}
.deposit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.deposit-title{font-weight:800;font-size:18px;color:#fff;letter-spacing:-.02em}
.deposit-close{width:32px;height:32px;border-radius:12px;background:rgba(249,105,153,.15);color:#F96999;display:flex;align-items:center;justify-content:center;font-size:16px;border:none;cursor:pointer}
.deposit-methods{display:flex;gap:10px}
.deposit-method{flex:1;padding:16px 10px;border-radius:18px;background:rgba(99,160,255,.08);border:1.5px solid rgba(99,160,255,.15);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;color:#fff;font-family:inherit}
.deposit-method:active{transform:scale(.96)}
.deposit-method img{width:36px;height:36px}
.deposit-method span{font-weight:700;font-size:13px;color:#fff}

/* ═══════════════════════════════════════════════════════
   BOTTOM NAV — 4 ровные кнопки: Игры, Краш, Топ, Профиль
   ═══════════════════════════════════════════════════════ */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    z-index:4000;
    width:100%;
    max-width:480px;
    height:76px;
    padding:0 8px calc(var(--safe-bottom) + 6px);
    background:rgba(28,34,51,.95);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid rgba(59,130,246,.08);
    display:flex;
    align-items:center;
    justify-content:space-around;
    gap:0;
}
.bnav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:6px 4px;
    border-radius:12px;
    background:transparent;
    border:none;
    color:rgba(255,255,255,.4);
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    transition:all .2s;
    text-decoration:none;
    min-height:56px;
    height:56px;
    max-width:96px;
}
.bnav-item svg{
    width:22px;height:22px;
    flex-shrink:0;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.bnav-item span{
    font-size:10px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
}
.bnav-item.active{background:rgba(255,255,255,.08);color:#fff}
.bnav-item:active{transform:scale(.9)}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--safe-bottom) + 92px);left:50%;transform:translateX(-50%) translateY(16px);background:rgba(11,17,32,.96);border:1px solid rgba(99,160,255,.25);backdrop-filter:blur(10px);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:9999;opacity:0;visibility:hidden;transition:all .3s;max-width:90%;text-align:center;display:flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast img{width:20px;height:20px;object-fit:contain}
.toast.ok{border-color:rgba(36,195,142,.5);color:#24C38E}
.toast.err{border-color:rgba(255,48,100,.5);color:#FF3064}

@media(max-width:380px){
    .wheel-wrap{width:265px;height:265px}
    .wheel-center{width:105px;height:105px}
    .wheel-center-pct{font-size:22px}
    .center-result{width:92px;height:92px}
    .center-result.fail{font-size:52px;width:86px;height:86px}
    .wheel-pointer{width:38px;height:38px;top:-6px}
    .select-card{min-height:150px;padding:12px 10px}
    .select-img-wrap{width:64px;height:64px}
    .modal-item-img-wrap{width:56px;height:56px}
    .bet-amount-input{font-size:20px;padding-right:80px}
    .bnav-item span{font-size:9px}
}

/* RASSWET VISUAL POLISH v2 */
:root{--accent:#58a6ff;--accent2:#7c4dff;--win:#24c38e;--danger:#ff477e}

function ensureAudio(){
    if(!audioCtx){
        try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
    return audioCtx;
}
function playTone(freq, duration, type, volume, when, endFreq){
    if(!soundEnabled) return;
    var ctx = ensureAudio(); if(!ctx) return;
    try{
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        var t = when == null ? ctx.currentTime : when;
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        if(endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq), t + duration);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(volume || 0.04, t + Math.min(0.012,duration*0.2));
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + duration + 0.02);
    }catch(e){}
}
function playRouletteStart(){
    if(!soundEnabled) return;
    var ctx = ensureAudio(); if(!ctx) return;
    var t = ctx.currentTime;
    playTone(180,0.22,'sawtooth',0.045,t,720);
    playTone(360,0.18,'triangle',0.03,t+0.05,900);
    playTone(720,0.12,'sine',0.025,t+0.12,1200);
}
function playTick(){
    if(!soundEnabled) return;
    var ctx = ensureAudio(); if(!ctx) return;
    var t = ctx.currentTime;
    playTone(1100,0.028,'square',0.022,t,820);
    playTone(620,0.045,'triangle',0.012,t+0.006,500);
}
function playRouletteStop(){
    if(!soundEnabled) return;
    var ctx = ensureAudio(); if(!ctx) return;
    var t = ctx.currentTime;
    [880,700,560].forEach(function(f,i){ playTone(f,0.08,'triangle',0.025,t+i*0.045,f*0.85); });
}

}

(function initLoadingWheel(){

        html += '<line class="ld-tick" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="rgba(255,255,255,' + opacity + ')" stroke-width="' + width + '"/>';

/* ══════════════════════════════════════════════════════════════
   GREEN ARC
   ══════════════════════════════════════════════════════════════ */
var CIRCLE_LEN = 2 * Math.PI * 104;

function drawGreenArc(chance, animate){
    var path = $('greenPath');
    if(!path) return;

    if(_greenAnimRaf){
        cancelAnimationFrame(_greenAnimRaf);
        _greenAnimRaf = null;
    }

    if(!chance || chance <= 0){
        path.setAttribute('d', '');
        path.style.strokeDasharray = '';
        path.style.strokeDashoffset = '';
        return;
    }

    var cx = 120, cy = 120, r = 104;
    var startAngle = -90;
    var endAngle = startAngle + (chance / 100) * 360;

    function polar(a){
        var rad = a * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    var start = polar(startAngle);
    var end = polar(endAngle);
    var largeArc = (chance > 50) ? 1 : 0;
    var arcLen = (chance / 100) * CIRCLE_LEN;

    var d = 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2) +
            ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' +
            end.x.toFixed(2) + ' ' + end.y.toFixed(2);
    path.setAttribute('d', d);

    if(animate){
        path.style.strokeDasharray = '0 ' + CIRCLE_LEN;
        path.style.strokeDashoffset = '0';

        var startTime = performance.now();
        var duration = 700;

        function anim(now){
            var t = Math.min((now - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - t, 3);
            var curLen = arcLen * eased;
            path.style.strokeDasharray = curLen.toFixed(2) + ' ' + (CIRCLE_LEN - curLen).toFixed(2);
            if(t < 1) _greenAnimRaf = requestAnimationFrame(anim);
            else {
                _greenAnimRaf = null;
                path.style.strokeDasharray = arcLen.toFixed(2) + ' ' + (CIRCLE_LEN - arcLen).toFixed(2);
            }
        }
        _greenAnimRaf = requestAnimationFrame(anim);
    } else {
        path.style.strokeDasharray = arcLen.toFixed(2) + ' ' + (CIRCLE_LEN - arcLen).toFixed(2);
        path.style.strokeDashoffset = '0';
    }
}

/* ══════════════════════════════════════════════════════════════
   GOLD ARC
   ══════════════════════════════════════════════════════════════ */
function showGoldArcAtRandom(chance){
    var path = $('goldPath');
    if(!path) return;
    var cx = 120, cy = 120, r = 104;
    var width = Math.min(_goldWidth, Math.max(8, chance * 3.6 * 0.6));
    var greenDeg = (chance / 100) * 360;
    var maxOffset = Math.max(0, greenDeg - width);
    var offsetDeg = Math.random() * maxOffset;
    var startAngle = -90 + offsetDeg;
    var endAngle = startAngle + width;
    _goldAngle = startAngle;
    _goldWidth = width;
    function polar(a){ var rad = a * Math.PI / 180; return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }; }
    var start = polar(startAngle);
    var end = polar(endAngle);
    var largeArc = (width > 180) ? 1 : 0;
    var d = 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + end.x.toFixed(2) + ' ' + end.y.toFixed(2);
    path.setAttribute('d', d);
    var arc = $('goldArc');
    if(arc) arc.classList.add('visible');
}
function hideGoldArc(){
    var arc = $('goldArc');
    if(arc){ arc.classList.remove('visible'); arc.style.filter = ''; }

function setGramPreset(mode){
    var inp = $('gramBetInput');
    if(!inp) return;

    var balStars = (userData && userData.balance_stars) ? userData.balance_stars : 0;
    var balGram = balStars / 100;

    if(mode === 'min'){
        var minValue = 0.2;
        inp.value = formatPresetValue(minValue);
    } else if(mode === 'div2'){
        var cur = parseFloat(String(inp.value || '').replace(',', '.'));
        if(!cur || cur <= 0) cur = balGram / 2;
        var newVal = Math.max(0.1, cur / 2);
        inp.value = formatPresetValue(newVal);
    } else if(mode === 'mul2'){
        var cur2 = parseFloat(String(inp.value || '').replace(',', '.'));
        if(!cur2 || cur2 <= 0) cur2 = 0.1;
        var newVal2 = Math.min(balGram, cur2 * 2);
        inp.value = formatPresetValue(newVal2);
    } else if(mode === 'max'){
        inp.value = formatPresetValue(balGram);
    }
    updateGramConfirmBtn();
}

function formatPresetValue(v){
    if(v >= 100) return Math.floor(v).toString();
    if(v >= 10) return v.toFixed(1).replace(/\.0$/, '');
    if(v >= 1) return (Math.round(v * 100) / 100).toString().replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
    return v.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
}

function updateGramConfirmBtn(){
    var inp = $('gramBetInput');
    var btn = $('gramConfirmBtn');
    if(!inp || !btn) return;
    var gram = parseFloat(String(inp.value || '').replace(',', '.'));
    if(!gram || gram <= 0){ btn.disabled = true; return; }
    var stars = Math.round(gram * 100);
    var bal = (userData && userData.balance_stars) ? userData.balance_stars : 0;
    btn.disabled = (stars > bal || stars < 10);

async function loadPossibleTargets(){
    if(!selectedGift) return;
    try{
        if(selectedGift.type === 'gram'){
            var r = await fetch('/api/gifts-list?models=0');
            var d = await r.json();
            if(d.success && d.gifts){
                possibleTargets = [];
                var minVal = selectedGift.value * 1.2;
                var maxVal = selectedGift.value * 100;
                d.gifts.forEach(function(g){
                    var gv = g.value || 0;
                    if(gv > minVal && gv <= maxVal){
                        possibleTargets.push(g);
                    }
                });
                possibleTargets.sort(function(a, b){ return (a.value || 0) - (b.value || 0); });
                possibleTargets = possibleTargets.slice(0, 100);
            }
            return;
        }
        var r2 = await fetch('/api/upgrade-possible-gifts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: userId, current_gift_id: selectedGift.id})
        });
        var d2 = await r2.json();
        if(!d2.success) return;
        possibleTargets = [];
        (d2.possible_gifts || []).forEach(function(g){
            if(g.value > selectedGift.value && g.value <= selectedGift.value * 100){
                possibleTargets.push(g);
            }
        });
        possibleTargets.sort(function(a, b){ return a.value - b.value; });
    }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   ★ EPIC MODE — ОСОБАЯ АНИМАЦИЯ ТОЛЬКО ПРИ ВЫИГРЫШЕ
   
   Условия активации:
   - Ставка >= 50 GRAM И цель >= 150 GRAM
   - ИЛИ шанс <= 5%
   
   Анимация:
   - Фон затемняется
   - Колесо светится зелёным
   - ДЛИТЕЛЬНОСТЬ: строго ограничена, не зацикливается!
   ══════════════════════════════════════════════════════════════ */
function isEpicCondition(){
    if(!selectedGift || !targetGift) return false;
    var betGram = (selectedGift.value || 0) / 100;
    var targetGram = (targetGift.value || 0) / 100;
    // Условие 1: крупная ставка и крупная цель
    if(betGram >= EPIC_BET_GRAM && targetGram >= EPIC_TARGET_GRAM) return true;
    // Условие 2: низкий шанс
    if(currentChance <= EPIC_LOW_CHANCE) return true;
    return false;
}

function enableEpicMode(){
    // Отменяем предыдущий таймер, если был
    if(_epicModeTimer){
        clearTimeout(_epicModeTimer);
        _epicModeTimer = null;
    }
    document.body.classList.add('epic-mode');
}

function disableEpicMode(){
    // Отменяем таймер
    if(_epicModeTimer){
        clearTimeout(_epicModeTimer);
        _epicModeTimer = null;
    }
    document.body.classList.remove('epic-mode');
}

                })

    var isEpic = serverWin && isEpicCondition();

}

/* ══════════════════════════════════════════════════════════════
   SPIN WHEEL
   ══════════════════════════════════════════════════════════════ */
function spinWheel(chance, isWin, willShowGold, goldWin, isEpic){
    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(!rotator || !greenArc) return;

    rotator.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    greenArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    if(goldArc) goldArc.style.transition = 'transform 0.5s cubic-bezier(.4,0,.6,1)';
    rotator.style.transform = 'rotate(-20deg)';
    greenArc.style.transform = 'rotate(-20deg)';
    if(goldArc) goldArc.style.transform = 'rotate(-20deg)';

    if(willShowGold){
        setTimeout(function(){
            showGoldArcAtRandom(chance);
            var flash = $('wheelFlash');
            if(flash){
                flash.classList.remove('win','fail','gold','epic','show');
                void flash.offsetWidth;
                flash.classList.add('gold','show');
            }
        }, 350);
    }

    var greenStart = 0;
    var greenEnd = (chance / 100) * 360;
    var landAngle;

    if(goldWin && _goldAngle >= 0){
        var goldCenter = _goldAngle + _goldWidth / 2;
        landAngle = ((goldCenter + 90) % 360 + 360) % 360;
    } else if(isWin){
        if(_goldAngle < 0){
            landAngle = greenStart + Math.random() * (greenEnd - greenStart);
        } else {
            var gStart12 = ((_goldAngle + 90) % 360 + 360) % 360;
            var gEnd12 = gStart12 + _goldWidth;
            if(gEnd12 > 360) gEnd12 -= 360;
            var candidates = [];
            if(gEnd12 > gStart12){
                if(gStart12 - 5 > greenStart) candidates.push([greenStart, gStart12 - 5]);
                if(gEnd12 + 5 < greenEnd) candidates.push([gEnd12 + 5, greenEnd]);
            } else {
                if(gStart12 - 5 > greenStart) candidates.push([greenStart, gStart12 - 5]);
            }
            if(candidates.length === 0){
                landAngle = greenStart + Math.random() * Math.max(5, greenEnd - greenStart);
            } else {
                var totalW = 0;
                candidates.forEach(function(c){ totalW += (c[1] - c[0]); });
                var pick = Math.random() * totalW;
                var acc = 0;
                for(var i = 0; i < candidates.length; i++){
                    var w = candidates[i][1] - candidates[i][0];
                    if(pick <= acc + w){ landAngle = candidates[i][0] + (pick - acc); break; }
                    acc += w;
                }
                if(landAngle === undefined) landAngle = candidates[0][0];
            }
        }
    } else {
        var minAng = greenEnd + 10;
        var maxAng = 355;
        if(minAng >= maxAng){ minAng = Math.max(greenEnd + 5, 350); maxAng = Math.min(minAng + 10, 359); }
        landAngle = minAng + Math.random() * (maxAng - minAng);
    }

    var targetRotation = 360 - landAngle;
    var baseSpin = 360 * (8 + Math.floor(Math.random() * 5));
    var totalSpin = baseSpin + targetRotation;

    var spinDuration = turboMode ? 2600 : (optimizationLevel === 0 ? 4200 : (optimizationLevel === 1 ? 5600 : 7200));
    var ease = 'cubic-bezier(.15,.7,.15,1)';

    if(turboMode){
        ease = 'cubic-bezier(.45,0,.35,1)';
    } else if(isEpic){
        /* ★ Epic — замедленная остановка, НО с ограниченной длительностью (10000мс) */
        ease = 'cubic-bezier(.02,.96,.06,1)';
        spinDuration = 10000;
    }

    var tickStartTime = performance.now() + 500;
    var tickEndTime = tickStartTime + spinDuration - 100;
    var lastTickAt = 0;
    var tickInterval = 60;

    function tickLoop(){
        var now = performance.now();
        if(now > tickEndTime + 500) return;
        if(now >= tickStartTime && now <= tickEndTime){
            var progress = (now - tickStartTime) / spinDuration;
            var currentInterval = tickInterval + progress * progress * 400;
            if(isEpic && progress > 0.6){
                currentInterval = tickInterval + Math.pow(progress, 4) * 700;
            }
            if(now - lastTickAt > currentInterval){
                playTick();
                lastTickAt = now;
            }
        }
        if(now < tickEndTime + 500) requestAnimationFrame(tickLoop);
    }
    requestAnimationFrame(tickLoop);

    setTimeout(function(){
        var trans = 'transform ' + spinDuration + 'ms ' + ease;
        rotator.style.transition = trans;
        greenArc.style.transition = trans;
        if(goldArc) goldArc.style.transition = trans;
        rotator.style.transform = 'rotate(' + totalSpin + 'deg)';
        greenArc.style.transform = 'rotate(' + totalSpin + 'deg)';
        if(goldArc) goldArc.style.transform = 'rotate(' + totalSpin + 'deg)';

        setTimeout(function(){
            playRouletteStop();
            showSpinResult(isWin, goldWin, isEpic);
        }, spinDuration + 60);
    }, 500);
}

/* ══════════════════════════════════════════════════════════════
   SHOW RESULT
   ══════════════════════════════════════════════════════════════ */
function showSpinResult(isWin, isGold, isEpic){
    var flash = $('wheelFlash');
    var centerResult = $('centerResult');
    var wheelCenter = $('wheelCenter');
    var wheelWrap = $('wheelWrap');

    if(wheelCenter) wheelCenter.classList.add('hidden-pct');

    if(flash){
        flash.classList.remove('win','fail','gold','epic','show');
        void flash.offsetWidth;
        if(isEpic && isWin){
            flash.classList.add('epic');
        } else {
            flash.classList.add(isGold ? 'gold' : (isWin ? 'win' : 'fail'));
        }
        flash.classList.add('show');
    }

    if(!isWin && wheelWrap){
        wheelWrap.classList.remove('shake');
        void wheelWrap.offsetWidth;
        wheelWrap.classList.add('shake');
        setTimeout(function(){ wheelWrap.classList.remove('shake'); }, 600);
    }

    if(isWin && wheelCenter){
        wheelCenter.classList.add('winning');
        // ★ Снимаем класс winning СТРОГО через определённое время
        setTimeout(function(){
            if(wheelCenter) wheelCenter.classList.remove('winning');
        }, isEpic ? 5000 : 3500);
    }

    if(isGold) playGoldSound();
    else if(isWin) playWinSound();
    else playFailSound();

    /* ★ Confetti — разные интенсивности */
    if(isWin && isEpic){
        startConfetti('epic');
    } else if(isWin && isGold){
        startConfetti('huge');
    } else if(isWin){
        var betStars = selectedGift ? (selectedGift.value || 0) : 0;
        var betGram = betStars / 100;
        var intensity = 'normal';
        if(betGram >= 100) intensity = 'huge';
        else if(betGram >= 50) intensity = 'big';
        startConfetti(intensity);
    }

    if(centerResult){
        centerResult.className = 'center-result';
        centerResult.innerHTML = '';
        void centerResult.offsetWidth;

        if(isGold || isWin){
            var gift = targetGift;
            if(!gift || !gift.image){
                var img = document.createElement('img');
                img.src = '/static/img/star2.png';
                centerResult.appendChild(img);
            } else {
                var upgraded = isUpgradedGift(gift);
                var img = document.createElement('img');
                img.src = gift.image;
                img.onerror = function(){ this.onerror = null; this.src = '/static/img/star2.png'; };
                centerResult.appendChild(img);
                if(upgraded) centerResult.classList.add('upgraded');
            }
            centerResult.classList.add(isGold ? 'gold' : 'win');
        } else {
            centerResult.classList.add('fail');
            centerResult.innerHTML = '😢';
        }
        centerResult.classList.add('show');
    }

    try{
        if(tg && tg.HapticFeedback){
            tg.HapticFeedback.notificationOccurred((isWin || isGold) ? 'success' : 'error');
        }
    }catch(e){}

    /* ★ ВАЖНО: ограниченная длительность сброса */
    var resetDelay = isEpic ? 3200 : (isGold ? 2500 : (isWin ? 1900 : 1400));
    setTimeout(function(){
        hideCenterResult();
        disableEpicMode();
        resetAfterSpin();
        loadInventory(true).catch(function(){});
        loadTopBar().catch(function(){});
    }, resetDelay);
}

function hideCenterResult(){
    var centerResult = $('centerResult');
    if(centerResult){
        centerResult.className = 'center-result';
        centerResult.innerHTML = '';
    }
    var center = $('wheelCenter');
    if(center) center.classList.remove('hidden-pct');
    var pct = $('chancePct');
    if(pct && selectedGift && targetGift) pct.classList.add('visible');
}

/* ══════════════════════════════════════════════════════════════
   RESET ПОСЛЕ СПИНА
   ══════════════════════════════════════════════════════════════ */
function resetAfterSpin(){
    isSpinning = false;

    // Для ставки подарком после завершения раунда обязательно сбрасываем ставку и цель.
    // Для GRAM сохраняем выбор, чтобы следующий апгрейд можно было повторить быстрее.
    if(selectedGift && selectedGift.type === 'gift'){
        selectedGift = null;
        targetGift = null;
        _lastBetValue = 0;
        _lastBetGiftRef = null;
        _lastTargetGift = null;
        possibleTargets = [];
        var lc = $('leftCard'); if(lc) lc.classList.remove('has-item');
        var rc = $('rightCard'); if(rc) rc.classList.remove('has-item');
        var li = $('leftGiftImg'); if(li) li.src = '/static/img/gram.png';
        var ln = $('leftGiftName'); if(ln) ln.textContent = 'GRAM';
        var lv = $('leftGiftValue'); if(lv) lv.textContent = '0.00';
        var ri = $('rightGiftImg'); if(ri) ri.src = '/static/img/gift.png';
        var rn = $('rightGiftName'); if(rn) rn.textContent = '';
        var rv = $('rightGiftValue'); if(rv) rv.textContent = '0.00';
        var ch = $('rightChance'); if(ch){ ch.style.display='none'; ch.textContent='0%'; }
    }

    var bolt = $('boltBtn');
    var ub = $('upgradeBtn');
    var ubt = $('upgradeBtnText');

    var rotator = $('wheelRotator');
    var greenArc = $('greenArc');
    var goldArc = $('goldArc');
    if(rotator){ rotator.style.transition = 'transform 0.6s ease'; rotator.style.transform = 'rotate(0deg)'; }
    if(greenArc){ greenArc.style.transition = 'transform 0.6s ease'; greenArc.style.transform = 'rotate(0deg)'; }
    if(goldArc){ goldArc.style.transition = 'transform 0.6s ease'; goldArc.style.transform = 'rotate(0deg)'; }

    hideCenterResult();
    hideGoldArc();

    if(selectedGift && targetGift){
        currentChance = calcChance(selectedGift.value, targetGift.value);
        drawGreenArc(currentChance, false);
        updateWheel();
        if(ub) ub.disabled = false;
        if(ubt) ubt.textContent = 'Апгрейд';
        if(bolt){
            bolt.disabled = false;
            bolt.classList.remove('enabled','active');
            bolt.classList.add(turboMode ? 'active' : 'enabled');
        }
    } else {
        if(ub) ub.disabled = true;
        if(ubt) ubt.textContent = 'Апгрейд';
        if(bolt){ bolt.disabled = true; bolt.classList.remove('enabled','active'); }
        drawGreenArc(0, false);
    }

    syncTurboButtons();
}

function syncTurboButtons(){
    var btn = $('boltBtn');
    if(!btn) return;
    btn.classList.remove('enabled','active');
    if(selectedGift && targetGift){
        btn.disabled = false;
        btn.classList.add(turboMode ? 'active' : 'enabled');
    } else {
        btn.disabled = true;
    }
}

/* ══════════════════════════════════════════════════════════════
   CONFETTI — оптимизированная версия
   ══════════════════════════════════════════════════════════════ */
var _confettiParticles = [];
var _confettiRaf = null;
var _confettiEndTime = 0;

function startConfetti(intensity){
    var canvas = $('confettiCanvas');
    if(!canvas) return;
    canvas.classList.add('show');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);  // ограничиваем 2
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    _confettiParticles = [];
    var colors = ['#FFD700', '#FFA500', '#24C38E', '#3B82F6', '#7CAEFF', '#FFFFFF'];
    var W = window.innerWidth;
    var H = window.innerHeight;

    /* ★ Снижено количество частиц для производительности */
    var count = optimizationLevel === 0 ? 55 : (optimizationLevel === 1 ? 85 : 120);
    var duration = optimizationLevel === 0 ? 1400 : (optimizationLevel === 1 ? 1900 : 2400);
    if(intensity === 'big'){ count += 35; duration += 300; }
    else if(intensity === 'huge'){ count += 70; duration += 450; }
    else if(intensity === 'epic'){ count += 100; duration += 650; }

    for(var i = 0; i < count; i++){
        _confettiParticles.push({
            x: W/2 + (Math.random() - 0.5) * 200,
            y: H/2,
            vx: (Math.random() - 0.5) * 22,
            vy: -Math.random() * 22 - 5,
            size: 5 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - 0.5) * 0.4,
            life: 1.0,
            shape: Math.random() < 0.5 ? 'rect' : 'circle'
        });
    }
    _confettiEndTime = performance.now() + duration;
    if(_confettiRaf) cancelAnimationFrame(_confettiRaf);

    function loop(now){
        var remaining = _confettiEndTime - now;
        ctx.clearRect(0, 0, W, H);

        var alive = 0;
        for(var i = 0; i < _confettiParticles.length; i++){
            var p = _confettiParticles[i];
            if(p.life <= 0) continue;
            alive++;
            p.vy += 0.45;
            p.vx *= 0.995;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            p.life -= 0.005;

            if(p.y > H + 50) p.life = 0;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            if(p.shape === 'circle'){
                ctx.beginPath();
                ctx.arc(0, 0, p.size/2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
            }
            ctx.restore();
        }

        if(remaining > 0 && alive > 0){
            _confettiRaf = requestAnimationFrame(loop);
        } else {
            ctx.clearRect(0, 0, W, H);
            canvas.classList.remove('show');
            _confettiRaf = null;
        }
    }
    _confettiRaf = requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════════════

function openDeposit(){ var o = $('depositOverlay'); if(o) o.classList.add('show'); }
function closeDeposit(){ var o = $('depositOverlay'); if(o) o.classList.remove('show'); }

(async function init(){
    setLoadingProgress(5);
    updateSoundSwitch();

    var auth = await telegramAuth();
    if(auth && auth.id){
        userId = auth.id;
        if(tg){
            try{
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#1C2233');
                tg.setBackgroundColor('#1C2233');
            }catch(e){}
        }
        try{
            var br = await fetch('/api/check-ban?user_id=' + auth.id);
            var bd = await br.json();
            if(bd.banned){ location.href = '/ban'; return; }
        }catch(e){}
    }
    setLoadingProgress(30);
    await loadTopBar();
    loadOnline();
    setInterval(loadOnline, 30000);
    setLoadingProgress(50);
    await loadInventory(true);
    setLoadingProgress(80);
    updateWheel();
    syncTurboButton();
    setLoadingProgress(100);
    clearInterval(_simInterval);
    hideLoadingScreen();
})();
