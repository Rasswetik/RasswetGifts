<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Witch Hat Party</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090d19;--panel:#0e1625;--line:rgba(112,149,191,.18);--purple:#b36cff;--cyan:#20b8ff;--text:#f7f9fd;--muted:#8e9db5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;min-height:100dvh;background:linear-gradient(180deg,#090d19,#0a0f1b);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:calc(8px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}.wrap{width:min(100%,1180px);margin:0 auto}.head{height:54px;display:flex;align-items:center;gap:12px;position:relative}.back{width:42px;height:42px;border-radius:13px;border:1px solid rgba(128,164,203,.2);background:#101a2b;color:#fff;font-size:26px;line-height:1}.title{font-size:20px;font-weight:950;letter-spacing:-.3px}.party-mark{margin-left:auto;width:46px;height:46px;border-radius:14px;object-fit:contain;background:rgba(174,99,255,.1);border:1px solid rgba(179,108,255,.24);padding:5px;filter:drop-shadow(0 6px 18px rgba(150,70,240,.25))}.loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#090d19;transition:opacity .25s ease}.loading.hide{opacity:0;pointer-events:none}.loading img{width:90px;height:90px;object-fit:contain}.loading-text{position:absolute;margin-top:135px;color:#8797b0;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.hero{position:relative;margin-top:10px;padding:26px;border-radius:25px;overflow:hidden;background:radial-gradient(circle at 75% 15%,rgba(179,108,255,.22),transparent 35%),linear-gradient(145deg,#141c2c,#0d1422);border:1px solid rgba(125,160,202,.17);box-shadow:0 20px 70px rgba(0,0,0,.28)}.hero:after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(179,108,255,.07),transparent 52%);animation:pulse 5s ease-in-out infinite;pointer-events:none}.hero h1{font-size:clamp(31px,5vw,54px);line-height:.98;font-weight:1000;letter-spacing:-1.8px;position:relative;z-index:1}.hero p{margin-top:10px;color:var(--muted);font-size:13px;font-weight:700;position:relative;z-index:1}.timer{margin-top:18px;display:flex;align-items:center;gap:10px;position:relative;z-index:1}.timer-box{min-width:110px;padding:12px 14px;border-radius:15px;background:rgba(179,108,255,.09);border:1px solid rgba(179,108,255,.2)}.timer-label{font-size:9px;color:#8e7aa8;text-transform:uppercase;letter-spacing:1.1px;font-weight:900}.timer-value{margin-top:3px;font-size:23px;font-weight:950;color:#e9d8ff;font-variant-numeric:tabular-nums}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section-title{font-size:18px;font-weight:950;letter-spacing:-.4px}.section-count{font-size:11px;color:#71829d;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.case-card,.market-card{position:relative;border-radius:20px;background:linear-gradient(145deg,#111a2a,#0c1422);border:1px solid var(--line);overflow:hidden;transition:.18s ease}.case-card{padding:15px;text-align:center;cursor:pointer}.case-card:hover,.market-card:hover{transform:translateY(-2px);border-color:rgba(179,108,255,.35)}.case-img{width:min(100%,210px);aspect-ratio:1/1;object-fit:contain;margin:0 auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.35))}.case-name{font-size:14px;font-weight:900;margin-top:3px}.case-price,.market-price{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:950}.case-price img,.market-price img{width:16px;height:16px;object-fit:contain}.market-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.market-card{padding:11px}.market-img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:13px;background:rgba(255,255,255,.025)}.market-name{font-size:11px;font-weight:850;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dbe4f1}.empty{padding:25px;border-radius:18px;text-align:center;background:rgba(255,255,255,.025);border:1px solid var(--line);color:#71829d;font-size:12px;font-weight:750}.error{color:#ff8099}.fade-up{animation:up .45s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.05);opacity:1}}
@media(max-width:700px){body{padding-top:calc(8px + 10vh + env(safe-area-inset-top));padding-left:11px;padding-right:11px}.head{height:54px}.hero{padding:21px 18px;border-radius:21px}.hero h1{font-size:32px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.case-card{padding:10px;border-radius:16px}.case-img{width:100%}.case-name{font-size:12px}.case-price{font-size:11px}.market-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.market-card{padding:9px;border-radius:16px}.market-name{font-size:10px}.market-price{font-size:11px}.timer-box{min-width:100px}}
@media(min-width:701px){.hero{padding:32px}.case-img{max-width:220px}}
</style>
</head>
<body>
<div class="loading" id="loading"><img id="loadingGif" src="/static/img/loading.gif" alt=""><div class="loading-text">Загрузка</div></div>
<div class="wrap">
<header class="head"><button class="back" onclick="history.back()" aria-label="Назад">‹</button><div class="title" id="eventTitle">Witch Hat Party</div><img class="party-mark" id="partyMark" src="/static/img/witchhat.png" alt="Party"></header>
<section class="hero"><h1>Witch Hat Party</h1><p>Специальное событие</p><div class="timer"><div class="timer-box"><div class="timer-label">Ивент идёт</div><div class="timer-value" id="timer">00:00:00</div></div></div></section>
<main id="content"></main>
</div>
<script>
const $=id=>document.getElementById(id);
let eventData=null, left=0;
function fmt(sec){sec=Math.max(0,Number(sec||0));let d=Math.floor(sec/86400);let h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return (d?d+'д ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function imgSrc(v){return v||'/static/img/gift.png'}
function price(v){return Number(v||0).toFixed(2)}
function resolveLoading(name){let n=String(name||'loading.gif').trim();if(!n)n='loading.gif';if(n.startsWith('/'))return n;if(n.includes('/'))return '/static/'+n.replace(/^\/+/, '');return '/static/img/'+n}
function renderSections(sections){const root=$('content');root.innerHTML='';let delay=0;for(const sec of (sections||[])){const wrap=document.createElement('section');wrap.className='section fade-up';wrap.style.animationDelay=(delay++)*60+'ms';const h=document.createElement('div');h.className='section-head';h.innerHTML='<div class="section-title"></div>';h.querySelector('.section-title').textContent=sec.title||'Раздел';wrap.appendChild(h);const grid=document.createElement('div');if(sec.type==='cases'){grid.className='cards';const ids=(sec.case_ids||[]).map(String);const loadCases=ids.map(id=>fetch('/api/cases/'+encodeURIComponent(id)).then(r=>r.json()).catch(()=>null));Promise.all(loadCases).then(ds=>{grid.innerHTML='';for(const d of ds){const c=d&&d.success?d.case:null;if(!c)continue;const card=document.createElement('button');card.className='case-card';card.innerHTML='<img class="case-img"><div class="case-name"></div><div class="case-price"><img src="/static/img/ton.png"><span></span></div>';card.querySelector('.case-img').src=imgSrc(c.image||c.png);card.querySelector('.case-name').textContent=c.name||'Кейс';card.querySelector('.case-price span').textContent=(Number(c.cost||0)).toLocaleString('ru-RU');card.onclick=()=>location.href='/cases?case='+encodeURIComponent(c.id);grid.appendChild(card)}})}else{grid.className='market-grid';fetch('/api/events/witch-hat-party/market').then(r=>r.json()).then(d=>{grid.innerHTML='';const items=d.items||[];if(!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Подарки пока не найдены</div>';return}items.forEach(it=>{const card=document.createElement('div');card.className='market-card';card.innerHTML='<img class="market-img"><div class="market-name"></div><div class="market-price"><img src="/static/img/ton.png"><span></span></div>';card.querySelector('.market-img').src=imgSrc(it.image);card.querySelector('.market-name').textContent=it.name;card.querySelector('.market-price span').textContent=price(it.price_ton)+' GRAM';grid.appendChild(card)})}).catch(()=>grid.innerHTML='<div class="empty error" style="grid-column:1/-1">Не удалось загрузить маркет</div>')}wrap.appendChild(grid);root.appendChild(wrap)}}
async function load(){try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{if(typeof Telegram.WebApp.requestFullscreen==='function')Telegram.WebApp.requestFullscreen()}catch(e){}}const r=await fetch('/api/events/witch-hat-party?ts='+Date.now());const d=await r.json();eventData=d.event||{};if(eventData.name)$('eventTitle').textContent=eventData.name;if(eventData.image)$('partyMark').src=eventData.image;left=Number(eventData.remaining_seconds||0);if(eventData.loading_gif)$('loadingGif').src=resolveLoading(eventData.loading_gif);$('timer').textContent=fmt(left);if(!eventData.active){$('content').innerHTML='<section class="section"><div class="empty">Ивент сейчас не активен</div></section>'}else{renderSections(eventData.sections||[])}setTimeout(()=>$('loading').classList.add('hide'),180)}catch(e){$('content').innerHTML='<section class="section"><div class="empty error">Не удалось загрузить ивент</div></section>';setTimeout(()=>$('loading').classList.add('hide'),300)}}
setInterval(()=>{if(left>0){left--;if($('timer'))$('timer').textContent=fmt(left)}},1000);load();
</script>
</body></html>
