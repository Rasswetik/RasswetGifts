<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Witch Hat Party</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/js/telegram-auth.js"></script>
<style>
:root{--bg:#070914;--panel:#101426;--panel2:#151a30;--line:rgba(255,255,255,.09);--text:#f8f8ff;--muted:#8f98b4;--violet:#a66cff;--violet2:#7047e8;--gold:#ffd76a;--green:#41d69b;--danger:#ff6485}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:radial-gradient(circle at 50% -10%,#1c1230 0,#090b18 38%,#070914 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:calc(8px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}.wrap{width:min(1180px,100%);margin:auto}.top{height:52px;display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.045);color:#fff;font-size:28px;line-height:1;cursor:pointer}.title{font-size:18px;font-weight:950;letter-spacing:-.4px}.mark{margin-left:auto;width:42px;height:42px;border-radius:13px;object-fit:contain;background:rgba(166,108,255,.1);border:1px solid rgba(166,108,255,.25);padding:5px}.hero{position:relative;min-height:280px;margin-top:10px;border:1px solid rgba(193,139,255,.28);border-radius:28px;overflow:hidden;background:linear-gradient(90deg,rgba(8,5,15,.93) 0%,rgba(11,7,19,.72) 42%,rgba(12,7,20,.2) 100%),url('/static/img/banner_witchparty.webp') center/cover;box-shadow:0 28px 80px rgba(61,24,100,.35);animation:heroPulse 6s ease-in-out infinite}.hero:after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(190,111,255,.14),transparent 48%);animation:orb 7s ease-in-out infinite;pointer-events:none}.hero-copy{position:absolute;left:28px;bottom:28px;z-index:3;max-width:58%}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:#d3b5ff;font-weight:900}.hero h1{font-size:clamp(34px,5vw,60px);line-height:.94;letter-spacing:-2px;margin-top:8px;font-weight:1000;text-shadow:0 8px 30px rgba(0,0,0,.5)}.hero p{margin-top:10px;color:rgba(255,255,255,.68);font-size:13px;font-weight:750}.timer{margin-top:18px;display:inline-flex;padding:10px 13px;border-radius:16px;background:rgba(7,6,15,.52);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px)}.timer small{display:block;color:#a69ab7;text-transform:uppercase;font-size:8px;font-weight:900;letter-spacing:1.2px}.timer b{display:block;margin-top:3px;font-size:22px;font-variant-numeric:tabular-nums}.hamsters{position:absolute;right:2%;bottom:0;width:43%;height:100%;z-index:2;pointer-events:none}.hamsters img{position:absolute;width:clamp(100px,13vw,160px);filter:drop-shadow(0 15px 20px rgba(0,0,0,.55))}.h1{right:48%;bottom:2%;animation:floatA 4.2s ease-in-out infinite}.h2{right:5%;bottom:1%;animation:floatB 4.8s ease-in-out infinite -1.5s}.section{margin-top:24px;animation:rise .45s ease both}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:11px}.section-head h2{font-size:19px;font-weight:950;letter-spacing:-.5px}.section-head span{font-size:10px;color:#69738d;font-weight:800}.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mode{position:relative;min-height:145px;border:1px solid rgba(255,255,255,.09);border-radius:20px;overflow:hidden;background:#111526;cursor:pointer;text-align:left;isolation:isolate;transition:transform .25s,box-shadow .25s}.mode:before{content:"";position:absolute;inset:0;background:var(--img) center/cover;z-index:-2;transition:transform .45s}.mode:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(3,4,10,.88) 100%);z-index:-1}.mode:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.3)}.mode:hover:before{transform:scale(1.05)}.mode-copy{position:absolute;left:15px;right:10px;bottom:14px}.mode-name{font-size:21px;font-weight:950;line-height:1}.mode-sub{font-size:9px;color:rgba(255,255,255,.6);margin-top:6px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.locked{filter:grayscale(.7);opacity:.7;cursor:not-allowed}.lock{position:absolute;top:9px;right:9px;padding:5px 7px;border-radius:9px;background:rgba(0,0,0,.5);font-size:9px;font-weight:900}.case-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.case{background:transparent;border:0;box-shadow:none;text-align:center;cursor:default;padding:0 4px}.case img{width:100%;aspect-ratio:1;object-fit:contain;display:block;filter:drop-shadow(0 13px 22px rgba(0,0,0,.35));transition:transform .35s}.case:hover img{transform:translateY(-4px) scale(1.025)}.case-name{font-size:14px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.case-price{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:950}.case-price img,.market-price img{width:16px;height:16px;object-fit:contain}.market-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.market{border:1px solid rgba(255,255,255,.08);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border-radius:18px;padding:10px;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s}.market:hover{transform:translateY(-3px);border-color:rgba(166,108,255,.38)}.market img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:13px;background:rgba(255,255,255,.025)}.market-name{margin-top:8px;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.market-price{margin-top:6px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:950}.empty{padding:28px;border:1px dashed rgba(255,255,255,.1);border-radius:18px;text-align:center;color:#6f7891;font-size:12px;font-weight:750;grid-column:1/-1}.loader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#070914;transition:.35s}.loader.hide{opacity:0;visibility:hidden}.spinner{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--violet);animation:spin .8s linear infinite}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.22s}.modal.show{opacity:1;visibility:visible}.sheet{width:min(520px,100%);padding:16px 16px calc(18px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:linear-gradient(180deg,#20263b,#111627);border:1px solid rgba(255,255,255,.1);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.modal.show .sheet{transform:none}.media{height:270px;border-radius:19px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.media img{max-width:100%;max-height:100%;object-fit:contain}.media .anim{position:absolute;width:100%;height:100%;object-fit:contain;opacity:.8}.m-title{font-size:20px;font-weight:950;margin-top:14px}.m-desc{margin-top:5px;color:#808aa2;font-size:11px}.m-price{text-align:center;margin-top:14px;font-size:18px;font-weight:950}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{height:46px;border-radius:14px;border:0;font:inherit;font-weight:900;cursor:pointer}.buy{background:linear-gradient(135deg,#a66cff,#7047e8);color:#fff}.close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)!important;color:#dfe4f0}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes heroPulse{0%,100%{box-shadow:0 28px 80px rgba(61,24,100,.28)}50%{box-shadow:0 32px 95px rgba(112,45,155,.42)}}@keyframes orb{0%,100%{transform:translate(-5%,-3%) scale(.9)}50%{transform:translate(5%,4%) scale(1.08)}}@keyframes floatA{0%,100%{transform:translateY(4px) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}@keyframes floatB{0%,100%{transform:translateY(2px) rotate(2deg)}50%{transform:translateY(-11px) rotate(-2deg)}}
@media(max-width:700px){body{padding-left:10px;padding-right:10px;padding-top:calc(8px + 7vh + env(safe-area-inset-top))}.hero{min-height:218px;border-radius:22px}.hero-copy{left:17px;bottom:17px;max-width:62%}.hero h1{font-size:31px}.hero p{font-size:11px;margin-top:7px}.timer{margin-top:11px;padding:8px 10px}.timer b{font-size:17px}.hamsters{width:53%}.hamsters img{width:92px}.h1{right:43%}.h2{right:-1%}.mode-grid{grid-template-columns:1fr 1fr;gap:9px}.mode{min-height:112px;border-radius:16px}.mode-copy{left:12px;bottom:11px}.mode-name{font-size:17px}.case-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.case-name{font-size:12px}.case-price{font-size:11px}.market-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.market{border-radius:15px;padding:8px}.market-name{font-size:10px}.market-price{font-size:10px}.section{margin-top:19px}}
@media(min-width:701px){.case-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="spinner"></div></div>
<div class="wrap">
<header class="top"><button class="back" onclick="history.back()" aria-label="Назад">‹</button><div class="title" id="title">Witch Hat Party</div><img class="mark" id="mark" src="/static/img/witchhat.png" alt=""></header>
<section class="hero"><div class="hero-copy"><div class="eyebrow">Halloween Event</div><h1 id="heroTitle">Witch Hat Party</h1><p>Особое событие · режимы, кейсы и коллекционные подарки</p><div class="timer"><div><small>До конца</small><b id="timer">00:00:00</b></div></div></div><div class="hamsters" aria-hidden="true"><img class="h1" src="/static/img/hamster1.png"><img class="h2" src="/static/img/hamster2.png"></div></section>
<main id="content"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="media" id="media"></div><div class="m-title" id="mTitle"></div><div class="m-desc" id="mDesc"></div><div class="m-price" id="mPrice"></div><div class="actions"><button class="close" onclick="closeModal()">Закрыть</button><button class="buy" id="buyBtn" onclick="buyGift()">Купить</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let state={remaining:0,event:null,current:null};
const fmt=s=>{s=Math.max(0,Number(s||0));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
const src=v=>v||'/static/img/gift.png';
async function json(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||('HTTP '+r.status));return d}
async function caseData(id){const u=String(id)==='seasonal'?'/api/cases/by-slug/seasonal':'/api/cases/'+encodeURIComponent(id);return json(u,{cache:'no-store'})}
function casePrice(c){const n=Number(c?.cost||0);return c?.seasonal?n:(c?.cost_type==='ton'?n:n/100)}
function section(root,title,meta){const s=document.createElement('section');s.className='section';const h=document.createElement('div');h.className='section-head';h.innerHTML='<h2></h2><span></span>';h.children[0].textContent=title||'Раздел';h.children[1].textContent=meta||'';s.appendChild(h);root.appendChild(s);return s}
async function render(ev){const root=$('content');root.innerHTML='';if(!ev.active){const s=section(root,'Witch Hat Party');s.append(Object.assign(document.createElement('div'),{className:'empty',textContent:'Ивент сейчас не активен'}));return}
 let sections=Array.isArray(ev.sections)?ev.sections:[];sections=[...sections].sort((a,b)=>{const rank=x=>x.type==='mode'?0:x.type==='cases'?1:x.type==='market'?2:3;return rank(a)-rank(b)});
 for(const sec of sections){if(!sec||sec.visible===false)continue;if(sec.type==='mode'){const s=section(root,sec.title||'Особые режимы');const grid=document.createElement('div');grid.className='mode-grid';let items=Array.isArray(sec.items)?sec.items.filter(x=>x&&x.visible!==false):[];if(!items.length){grid.innerHTML='<div class="empty">Режимы пока не добавлены</div>'}for(const it of items){const b=document.createElement('button');b.className='mode';b.type='button';b.style.setProperty('--img',`url(${JSON.stringify(src(it.image))})`);const unlock=it.unlock_at?new Date(it.unlock_at):null;const locked=!!unlock&&!isNaN(unlock)&&unlock.getTime()>Date.now();if(locked)b.classList.add('locked');b.innerHTML='<div class="mode-copy"><div class="mode-name"></div><div class="mode-sub">Особый режим</div></div>';b.querySelector('.mode-name').textContent=it.name||'Режим';if(locked){const x=document.createElement('span');x.className='lock';x.textContent='Откроется через '+fmt(Math.ceil((unlock-Date.now())/1000));b.appendChild(x)}b.onclick=()=>{if(!locked&&it.path)location.href=it.path};grid.appendChild(b)}s.appendChild(grid)}
 else if(sec.type==='cases'){const s=section(root,sec.title||'Кейсы события',(sec.case_ids||[]).length+' шт.');const grid=document.createElement('div');grid.className='case-grid';s.appendChild(grid);const ids=[...(sec.case_ids||[])].map(String);if(!ids.length){grid.innerHTML='<div class="empty">Кейсы события пока не добавлены</div>';continue}const results=await Promise.allSettled(ids.map(caseData));let count=0;results.forEach(res=>{if(res.status!=='fulfilled')return;const c=res.value?.case;if(!c)return;count++;const b=document.createElement('button');b.type='button';b.className='case';b.innerHTML='<img loading="lazy"><div class="case-name"></div><div class="case-price"><img src="/static/img/ton.png"><span></span> GRAM</div>';b.querySelector('img').src=src(c.image||c.png);b.querySelector('.case-name').textContent=c.name||'Кейс';b.querySelector('.case-price span').textContent=casePrice(c).toFixed(2);grid.appendChild(b)});if(!count)grid.innerHTML='<div class="empty">Не удалось загрузить кейсы</div>'}
 else if(sec.type==='market'){const s=section(root,sec.title||'Маркет');const grid=document.createElement('div');grid.className='market-grid';s.appendChild(grid);try{const d=await json('/api/events/witch-hat-party/market?ts='+Date.now(),{cache:'no-store'});const items=d.items||[];if(!items.length){grid.innerHTML='<div class="empty">Подарки пока не добавлены</div>';continue}items.forEach(it=>{const b=document.createElement('button');b.type='button';b.className='market';b.innerHTML='<img loading="lazy"><div class="market-name"></div><div class="market-price"><img src="/static/img/ton.png"><span></span></div>';b.querySelector('img').src=src(it.image||it.png);b.querySelector('.market-name').textContent=it.name||'Подарок';b.querySelector('.market-price span').textContent=Number(it.price_gram||0).toFixed(2)+' GRAM';b.onclick=()=>openGift(it);grid.appendChild(b)})}catch(e){grid.innerHTML='<div class="empty">Не удалось загрузить маркет</div>'}}
 }}
function openGift(it){state.current=it;$('mTitle').textContent=it.name||'Подарок';$('mDesc').textContent='Коллекционный подарок · в наличии 1 шт.';$('mPrice').textContent=Number(it.price_gram||0).toFixed(2)+' GRAM';const m=$('media');m.innerHTML='';const img=document.createElement('img');img.src=src(it.png||it.image);m.appendChild(img);if(it.animation_webp||it.animation){const a=document.createElement('img');a.className='anim';a.src=it.animation_webp||it.animation;m.appendChild(a)}$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');state.current=null}
async function buyGift(){const it=state.current;if(!it)return;let user=null;try{user=await telegramAuth()}catch(e){};const tg=window.Telegram?.WebApp;user=user||tg?.initDataUnsafe?.user;const initData=tg?.initData||'';if(!user?.id||!initData){alert('Откройте приложение через Telegram');return}const btn=$('buyBtn');btn.disabled=true;btn.textContent='Покупка…';try{const d=await json('/api/events/witch-hat-party/market/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.id,gift_url:it.url||it.gift_url,initData})});closeModal();alert('Подарок куплен и добавлен в инвентарь');await load()}catch(e){alert(e.message||'Ошибка покупки')}finally{btn.disabled=false;btn.textContent='Купить'}}
async function load(){try{if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{Telegram.WebApp.requestFullscreen?.()}catch(e){}}const d=await json('/api/events/witch-hat-party?ts='+Date.now(),{cache:'no-store'});state.event=d.event||{};state.remaining=Number(state.event.remaining_seconds||0);$('title').textContent=state.event.name||'Witch Hat Party';$('heroTitle').textContent=state.event.name||'Witch Hat Party';if(state.event.image)$('mark').src=state.event.image;$('timer').textContent=fmt(state.remaining);await render(state.event);$('loader').classList.add('hide')}catch(e){$('content').innerHTML='<section class="section"><div class="empty">Не удалось загрузить ивент. Попробуйте ещё раз.</div></section>';$('loader').classList.add('hide')}}
setInterval(()=>{if(state.remaining>0){state.remaining--;if($('timer'))$('timer').textContent=fmt(state.remaining)}},1000);setInterval(()=>{if(document.visibilityState==='visible')load()},20000);load();
</script>
</body></html>
