<style id="witch-hat-party-final-polish">

@keyframes giftIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.gift-name{margin-top:14px;font-size:23px;font-weight:1000;letter-spacing:-.5px;text-align:center}
.gift-number{margin-top:4px;text-align:center;font-size:13px;font-weight:900;color:#b98cff;letter-spacing:.6px}
.gift-sub{margin-top:9px;text-align:center;font-size:11px;font-weight:850;color:rgba(255,255,255,.5)}
.gift-attr-table{margin-top:15px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);overflow:hidden}
.gift-attr-row{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.055)}
.gift-attr-row:last-child{border-bottom:0}
.gift-attr-row .k{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.9px;color:rgba(255,255,255,.44)}
.gift-attr-row .v{font-size:14px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift-attr-row .p{font-size:12px;font-weight:950;color:#b98cff;font-variant-numeric:tabular-nums}
.gift-attr-loading{padding:14px;text-align:center;color:rgba(255,255,255,.4);font-size:11px;font-weight:800}
@media(max-width:700px){.gift-stage{height:250px}.gift-name{font-size:19px}.gift-attr-row{grid-template-columns:74px 1fr auto;padding:10px 12px}.gift-attr-row .v{font-size:13px}}

/* покупка */
.buy-success{padding:30px 34px!important;gap:14px!important}
.buy-gift-pop{position:fixed;inset:0;z-index:99998;display:none;align-items:center;justify-content:center;background:rgba(4,6,12,.78);backdrop-filter:blur(10px)}
.buy-gift-pop.show{display:flex}
.buy-gift-card{position:relative;width:min(340px,86vw);padding:26px 24px 24px;border-radius:26px;background:linear-gradient(180deg,#1d1330,#130d21);border:1px solid rgba(179,108,255,.32);box-shadow:0 30px 90px rgba(0,0,0,.55);text-align:center;overflow:hidden;animation:buyCardIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes buyCardIn{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
.buy-gift-card:before{content:"";position:absolute;left:50%;top:-40%;width:180%;height:180%;transform:translateX(-50%);background:conic-gradient(from 0deg,rgba(179,108,255,.18) 0 7deg,transparent 7deg 26deg);animation:giftRays 18s linear infinite;pointer-events:none}
.buy-gift-img{position:relative;z-index:2;width:160px;height:160px;object-fit:contain;clip-path:inset(9% round 22px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.5));animation:buyGiftIn .6s cubic-bezier(.16,1,.3,1) both}
@keyframes buyGiftIn{0%{opacity:0;transform:scale(.4) rotate(-14deg)}60%{opacity:1;transform:scale(1.08) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.buy-gift-check{position:relative;z-index:3;margin:-24px auto 0;width:44px;height:44px;border-radius:50%;background:#24C38E;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(36,195,142,.45);animation:buyCheckIn .4s cubic-bezier(.16,1,.3,1) .28s both}
@keyframes buyCheckIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.buy-gift-check svg{width:24px;height:24px;fill:none;stroke:#04150e;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:buyCheckDraw .3s ease .52s forwards}
@keyframes buyCheckDraw{to{stroke-dashoffset:0}}
.buy-gift-title{position:relative;z-index:2;margin-top:14px;font-size:18px;font-weight:1000}
.buy-gift-sub{position:relative;z-index:2;margin-top:7px;font-size:12px;font-weight:800;color:rgba(255,255,255,.55);line-height:1.45}
.buy-gift-btn{position:relative;z-index:2;margin-top:18px;width:100%;height:44px;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font:inherit;font-weight:900;cursor:pointer}
.buy-spark{position:absolute;z-index:1;width:7px;height:7px;border-radius:50%;background:#d7b5ff;opacity:0;pointer-events:none}
</style>

<body>
<div class="loading" id="loading"><img id="loadingGif" src="/static/img/loading.gif" alt=""><div class="loading-text">Загрузка</div></div>
<div class="wrap">
<header class="head"><button class="back" onclick="history.back()" aria-label="Назад">‹</button><div class="title" id="eventTitle">Witch Hat Party</div><img class="party-mark" id="partyMark" src="/static/img/witchhat.png" alt="Party"></header>
<section class="hero"><h1>Witch Hat Party</h1><p>Специальное событие</p><div class="timer"><div class="timer-box"><div class="timer-label">До конца</div><div class="timer-value" id="timer">00:00:00</div></div></div><div class="witch-hamsters" aria-hidden="true"><img class="witch-hamster witch-hamster-1" src="/static/img/hamster1.png" alt=""><img class="witch-hamster witch-hamster-2" src="/static/img/hamster2.png" alt=""></div></section>
<main id="content"></main>
</div>
<script>
const $=id=>document.getElementById(id);
let eventData=null, left=0;
function fmt(sec){sec=Math.max(0,Number(sec||0));let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function imgSrc(v){return v||'/static/img/gift.png'}
function fmtLeft(sec){
  sec=Math.max(0,Math.ceil(Number(sec||0)));
  var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(d>0)return d+' д '+h+' ч';
  if(h>0)return h+' ч '+m+' мин';
  if(m>0)return m+' мин '+s+' сек';
  return s+' сек';
}
function unlockUntil(obj){
  if(!obj)return 0;
  if(typeof obj.unlock_in==='number'&&obj.unlock_in>0)return Date.now()+obj.unlock_in*1000;
  if(obj.unlock_at){var t=new Date(obj.unlock_at).getTime();if(!isNaN(t))return t}
  return 0;
}
var lockTickers=[];
function registerLock(el,until,prefix){if(!el||!until)return;lockTickers.push({el:el,until:until,prefix:prefix===undefined?'Откроется через ':prefix});el.textContent=(prefix===undefined?'Откроется через ':prefix)+fmtLeft((until-Date.now())/1000);}
setInterval(function(){
  var now=Date.now(),reload=false;
  lockTickers=lockTickers.filter(function(t){
    if(!t.el||!t.el.isConnected)return false;
    var left=(t.until-now)/1000;
    if(left<=0){reload=true;return false}
    t.el.textContent=t.prefix+fmtLeft(left);return true;
  });
  if(reload)load();
},1000);
function price(v){return Number(v||0).toFixed(2)}
function resolveLoading(name){let n=String(name||'loading.gif').trim();if(!n)n='loading.gif';if(n.startsWith('/'))return n;if(n.includes('/'))return '/static/'+n.replace(/^\/+/, '');return '/static/img/'+n}
function caseApi(id){
  var sid=String(id);
  var url=(sid==='seasonal')?('/api/cases/by-slug/seasonal'):('/api/cases/'+encodeURIComponent(sid));
  return fetch(url,{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return {success:false}});
}
/* Кейсы события грузятся одним пакетным запросом; если он недоступен
   (старый бэкенд/сеть), падаем на поштучную загрузку и показываем
   ровно те кейсы, которые удалось получить. */
function loadEventCases(ids){
  var list=(ids||[]).map(String).filter(Boolean);
  if(!list.length)return Promise.resolve([]);
  var url='/api/cases/batch?ids='+encodeURIComponent(list.join(','))+'&ts='+Date.now();
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    if(!d||!d.success||!Array.isArray(d.cases))throw new Error('bad payload');
    var byRef={};
    d.cases.forEach(function(c){
      if(!c)return;
      [c.requested_id,c.id,c.slug].forEach(function(k){if(k!==undefined&&k!==null)byRef[String(k).toLowerCase()]=c});
    });
    var out=list.map(function(id){return byRef[String(id).toLowerCase()]||null});
    if(out.some(function(x){return !x}))return fallbackEventCases(list,out);
    return out;
  }).catch(function(){
    return fallbackEventCases(list,list.map(function(){return null}));
  });
}
/* Запасные пути: общий список /api/cases, затем поштучные запросы. */
function fallbackEventCases(list,partial){
  var res=(partial||list.map(function(){return null})).slice();
  return fetch('/api/cases?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(d){
      var all=(d&&d.cases)||[];
      list.forEach(function(id,i){
        if(res[i])return;
        var t=String(id).toLowerCase();
        var hit=all.find(function(c){
          return String(c.id).toLowerCase()===t
            || String(c.slug||'').toLowerCase()===t
            || String(c.name||'').toLowerCase().replace(/\s+/g,'-')===t;
        });
        if(hit)res[i]=hit;
      });
      return res;
    })
    .catch(function(){return res})
    .then(function(res2){
      return Promise.all(res2.map(function(c,i){
        if(c)return c;
        return caseApi(list[i]).then(function(d){return d&&d.success?d.case:null});
      }));
    });
}
function casePrice(c){
  var raw=Number(c&&c.cost||0);
  if(c&&c.seasonal) return raw;
  return c&&c.cost_type==='ton' ? raw : raw/100;
}
function renderSections(sections){
  const root=$('content');root.innerHTML='';let delay=0;
  const list=Array.isArray(sections)?sections.slice():[];
  // Event content is fully administrator-controlled; no hardcoded Ghost Road fallback.
  // Keep only the intended Event order: special modes -> cases -> market -> other configured sections.
  list.sort(function(a,b){var rank=function(x){var t=String(x&&x.type||'');return t==='mode'?0:(t==='cases'?1:(t==='market'?2:3))};return rank(a)-rank(b)});
  for(const sec of list){
    if(!sec || sec.visible===false) continue;
    const hasItems = sec.type==='mode' ? (sec.items||[]).some(function(x){return x&&x.visible!==false}) : (sec.type==='cases' ? (sec.case_ids||[]).length>0 : (sec.type==='market' ? (sec.items||[]).length>0 : ((sec.items||[]).length>0 || (sec.case_ids||[]).length>0)));
    if(!hasItems) continue;
    const wrap=document.createElement('section');wrap.className='section fade-up';wrap.style.animationDelay=(delay++)*60+'ms';
    const sectionUntil=unlockUntil(sec);
    const sectionLocked=!!sectionUntil&&sectionUntil>Date.now();
    if(sectionLocked)wrap.classList.add('is-locked-section');
    const h=document.createElement('div');h.className='section-head';h.innerHTML='<div class="section-title"></div>';h.querySelector('.section-title').textContent=sec.title||'Раздел';
    if(sectionLocked){const chip=document.createElement('div');chip.className='section-lock-chip';h.appendChild(chip);registerLock(chip,sectionUntil,'🔒 Откроется через ');}
    wrap.appendChild(h);
    const grid=document.createElement('div');
    if(sec.type==='mode'){
      grid.className='special-mode-grid';
      const items=(sec.items||[]).filter(function(x){return x&&x.visible!==false});
      items.forEach(function(it){
        const card=document.createElement('button');card.type='button';card.className='special-mode-card size-'+(it.size||'medium');
        card.innerHTML='<div class="special-mode-copy"><div class="special-mode-name"></div><div class="special-mode-sub"></div></div>';
        if(it.image) card.style.setProperty('--mode-image', "url(" + JSON.stringify(imgSrc(it.image)) + ")");
        card.querySelector('.special-mode-name').textContent=it.name||'Кнопка';
        card.querySelector('.special-mode-sub').textContent=it.subtitle||'';
        const until=unlockUntil(it); const locked=sectionLocked||(!!until&&until>Date.now());
        if(locked){
          card.classList.add('is-locked');
          card.disabled=true;
          const badge=document.createElement('div');badge.className='special-mode-lock';badge.textContent='🔒 Закрыто';card.appendChild(badge);
          // Вместо нижней подписи показываем, сколько осталось до открытия.
          const sub=card.querySelector('.special-mode-sub');
          if(until>Date.now())registerLock(sub,until,'Откроется через ');
          else if(sub)sub.textContent='Раздел ещё закрыт';
        }
        card.onclick=function(){if(locked)return;const path=String(it.path||'').trim();if(path&&path!=='#')location.href=path;};
        grid.appendChild(card);
      });
    }else if(sec.type==='cases'){
      grid.className='cards';
      const ids=(sec.case_ids||[]).map(String).filter(Boolean);
      if(!ids.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Кейсы события пока не добавлены</div>';}
      else{
        grid.innerHTML='<div class="empty" style="grid-column:1/-1">Загрузка кейсов…</div>';
        var attempt=function(tries){
          return loadEventCases(ids).then(function(cases){
            var got=(cases||[]).filter(Boolean).length;
            if(!got&&tries>0)return new Promise(function(res){setTimeout(function(){res(attempt(tries-1))},700)});
            return cases;
          });
        };
        attempt(1).then(function(cases){
          grid.innerHTML='';
          var missing=0;
          (cases||[]).forEach(function(c){
            if(!c){missing++;return}
            const card=document.createElement('button');card.className='case-card';card.type='button';
            card.setAttribute('aria-label',c.name||'Кейс');
            card.innerHTML='<div class="case-name"></div><img class="case-img" loading="lazy"><div class="case-price"><img src="/static/img/ton.png"><span></span> GRAM</div>';
            card.querySelector('.case-img').src=imgSrc(c.image||c.png);
            card.querySelector('.case-img').onerror=function(){this.onerror=null;this.src='/static/img/gift.png'};
            card.querySelector('.case-name').textContent=c.name||'Кейс';
            card.querySelector('.case-price span').textContent=price(casePrice(c));
            card.style.cursor=sectionLocked?'not-allowed':'pointer';
            card.onclick=function(){if(sectionLocked)return;var slug=c.slug||c.id;if(slug)location.href='/case/'+encodeURIComponent(slug)};
            grid.appendChild(card);
          });
          if(!grid.children.length){
            grid.innerHTML='<div class="empty error" style="grid-column:1/-1">Не удалось загрузить кейсы события<br><button type="button" class="event-retry">Повторить</button></div>';
            var rb=grid.querySelector('.event-retry');
            if(rb){rb.style.cssText='margin-top:10px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-weight:800;cursor:pointer';rb.onclick=function(){load()}}
          }else if(missing>0){
            var note=document.createElement('div');note.className='empty';note.style.gridColumn='1/-1';
            note.textContent='Часть кейсов события недоступна ('+missing+' шт.) — проверьте их в админ-панели.';
            grid.appendChild(note);
          }
        });
      }
    }else if(sec.type==='market'){
      grid.className='market-grid';
      fetch('/api/events/witch-hat-party/market?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
        grid.innerHTML='';const items=d.items||[];
        if(!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Подарки пока не найдены</div>';return;}
        items.forEach(function(it){
          const card=document.createElement('button');card.type='button';card.className='market-card';
          card.innerHTML='<img class="market-img" loading="lazy"><div class="market-name"></div><div class="market-price"><img src="/static/img/ton.png"><span></span></div><div class="event-market-note">1 шт. · Подробнее</div>';
          card.querySelector('.market-img').src=imgSrc(it.image);card.querySelector('.market-name').textContent=it.name||'Подарок';card.querySelector('.market-price span').textContent=price(it.price_gram||it.price_ton)+' GRAM';
          card.onclick=function(){if(sectionLocked)return;openEventGiftModal(it)};grid.appendChild(card);
        });
      }).catch(function(){grid.innerHTML='<div class="empty error" style="grid-column:1/-1">Не удалось загрузить маркет</div>'});
    }else{
      grid.className='market-grid';
    }
    wrap.appendChild(grid);root.appendChild(wrap);
  }
}

function getTelegramInitData(){
  try{
    if(window.Telegram&&Telegram.WebApp){
      var direct=String(Telegram.WebApp.initData||'').trim();
      if(direct)return direct;
    }
  }catch(e){}
  try{
    var qs=new URLSearchParams(location.search);
    var q=qs.get('tgWebAppData')||qs.get('initData')||'';
    if(q)return q;
  }catch(e){}
  try{
    var h=String(location.hash||'');
    var m=h.match(/(?:^|[&#])tgWebAppData=([^&]+)/);
    if(m)return decodeURIComponent(m[1]);
  }catch(e){}
  return '';
}
function giftNumberOf(item){
  var n=Number(item&&item.number||0);
  if(n)return n;
  var m=String(item&&item.name||'').match(/#\s*(\d+)/);
  return m?Number(m[1]):0;
}
function giftCleanName(item){
  return String(item&&item.name||'Подарок').replace(/\s*#\s*\d+\s*$/,'').trim()||'Подарок';
}
function attrRow(label,data){
  var val=(data&&data.value)?String(data.value):'—';
  var pct=(data&&data.rarity!==null&&data.rarity!==undefined&&data.rarity!=='')?(Number(data.rarity)+'%'):'';
  var esc=function(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
  return '<div class="gift-attr-row"><span class="k">'+esc(label)+'</span><span class="v">'+esc(val)+'</span><span class="p">'+esc(pct)+'</span></div>';
}
function setGiftAttrs(attrs){
  var box=$('eventGiftAttrs');if(!box)return;
  attrs=attrs||{};
  box.innerHTML=attrRow('Модель',attrs.model)+attrRow('Символ',attrs.symbol)+attrRow('Фон',attrs.backdrop);
}
async function loadEventGiftAttrs(item){
  var box=$('eventGiftAttrs');if(!box)return;
  var slug=String(item.fragment_slug||'').trim();var number=giftNumberOf(item);
  if(!slug||!number){setGiftAttrs({});return}
  box.innerHTML='<div class="gift-attr-loading">Загрузка данных Fragment…</div>';
  try{
    var r=await fetch('/api/fragment-gift-details?slug='+encodeURIComponent(slug)+'&number='+encodeURIComponent(number)+'&ts='+Date.now(),{cache:'no-store'});
    var d=await r.json();
    if(!r.ok||!d.success)throw Error(d.error||'Ошибка');
    setGiftAttrs(d.attrs||{});
    if(d.image){var p=document.querySelector('#eventGiftModalMedia .gift-hero');if(p)p.src=d.image;}
  }catch(e){box.innerHTML='<div class="gift-attr-loading">Не удалось загрузить данные Fragment</div>';}
}
function openEventGiftModal(item){
  var overlay=$('eventGiftModal');if(!overlay)return;
  overlay.dataset.url=item.url||item.gift_url||'';overlay.dataset.item=JSON.stringify(item);
  var num=giftNumberOf(item);
  $('eventGiftModalTitle').textContent=giftCleanName(item);
  $('eventGiftModalNumber').textContent=num?('#'+num):'';
  $('eventGiftModalDesc').textContent='Коллекционный подарок · в наличии 1 шт.';
  $('eventGiftModalPrice').textContent=price(item.price_gram||item.price_ton)+' GRAM';
  var media=$('eventGiftModalMedia');media.innerHTML='';
  var hero=document.createElement('img');hero.className='gift-hero';
  hero.src=imgSrc(item.png||item.image);hero.alt=item.name||'Подарок';
  hero.onerror=function(){this.onerror=null;this.src=imgSrc(item.image)};
  media.appendChild(hero);
  $('eventGiftAttrs').innerHTML='<div class="gift-attr-loading">Загрузка данных Fragment…</div>';
  overlay.classList.add('show');
  loadEventGiftAttrs(item);
}
function closeEventGiftModal(){var o=$('eventGiftModal');if(o)o.classList.remove('show')}

/* ── Анимация успешной покупки ─────────────────────── */
function spawnBuySparks(card){
  for(var i=0;i<18;i++){
    (function(i){
      var d=document.createElement('div');d.className='buy-spark';
      var a=(Math.PI*2/18)*i+Math.random()*.3, dist=90+Math.random()*90;
      d.style.left='50%';d.style.top='42%';
      d.style.background=['#d7b5ff','#8b5cf6','#ffd9a8','#24C38E'][i%4];
      card.appendChild(d);
      d.animate([
        {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
        {transform:'translate(calc(-50% + '+Math.cos(a)*dist+'px),calc(-50% + '+Math.sin(a)*dist+'px)) scale(1)',opacity:0}
      ],{duration:820+Math.random()*420,delay:180+i*12,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
      setTimeout(function(){d.remove()},1600);
    })(i);
  }
}
function showBuySuccess(item,text){
  var pop=$('buyGiftPop');if(!pop)return;
  var img=$('buyGiftImg');
  if(img)img.src=imgSrc((item&&(item.png||item.image))||'/static/img/gift.png');
  $('buyGiftTitle').textContent=text||'Подарок куплен';
  $('buyGiftSub').textContent=(item&&item.name?giftCleanName(item)+(giftNumberOf(item)?(' #'+giftNumberOf(item)):''):'Подарок')+' уже в вашем инвентаре';
  pop.classList.add('show');
  spawnBuySparks($('buyGiftCard'));
  try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}
}
function closeBuyPop(){var p=$('buyGiftPop');if(p)p.classList.remove('show')}
async function buyEventGift(){
  var o=$('eventGiftModal');if(!o)return;
  var item=JSON.parse(o.dataset.item||'{}');
  var initData=getTelegramInitData();
  var user=null;
  try{
    if(initData){
      var parsed=new URLSearchParams(initData).get('user');
      if(parsed)user=JSON.parse(decodeURIComponent(parsed));
    }
  }catch(e){}
  if(!user){
    try{user=await telegramAuth()}catch(e){}
  }
  try{if(!user&&window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe)user=Telegram.WebApp.initDataUnsafe.user||null}catch(e){}
  if(!user||!user.id){alert('Не удалось определить пользователя Telegram.');return}
  var btn=$('eventBuyBtn');btn.disabled=true;btn.textContent='Покупка…';
  try{
    var r=await fetch('/api/events/witch-hat-party/market/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.id,gift_url:item.url||item.gift_url,initData:initData})});
    var d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Ошибка покупки');
    closeEventGiftModal();showBuySuccess(item,'Подарок куплен');
    document.querySelectorAll('.market-card').forEach(function(card){if(card.querySelector('.market-name')&&card.querySelector('.market-name').textContent===item.name)card.remove()});
  }catch(e){alert(e.message||'Ошибка покупки')}finally{btn.disabled=false;btn.textContent='Купить'}
}

async function load(){try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{if(typeof Telegram.WebApp.requestFullscreen==='function')Telegram.WebApp.requestFullscreen()}catch(e){}}const r=await fetch('/api/events/witch-hat-party?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();eventData=d.event||{};if(eventData.name)$('eventTitle').textContent=eventData.name;if(eventData.image)$('partyMark').src=eventData.image;left=Number(eventData.remaining_seconds||0);if(!left&&eventData.ends_at){try{left=Math.max(0,Math.ceil((new Date(eventData.ends_at).getTime()-Date.now())/1000))}catch(e){}}if(eventData.loading_gif)$('loadingGif').src=resolveLoading(eventData.loading_gif);$('timer').textContent=fmt(left);if(!eventData.active){$('content').innerHTML='<section class="section"><div class="empty">Ивент сейчас не активен</div></section>'}else{renderSections(eventData.sections||[])}setTimeout(()=>$('loading').classList.add('hide'),180)}catch(e){$('content').innerHTML='<section class="section"><div class="empty error">Не удалось загрузить ивент</div></section>';setTimeout(()=>$('loading').classList.add('hide'),300)}}
setInterval(()=>{if(left>0){left--;if($('timer'))$('timer').textContent=fmt(left)}},1000);setInterval(()=>{if(document.visibilityState==='visible')load()},15000);load();
</script>
