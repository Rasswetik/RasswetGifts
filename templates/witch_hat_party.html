<style>
:root{--bg:#090d19;--panel:#0e1625;--line:rgba(112,149,191,.18);--purple:#b36cff;--cyan:#20b8ff;--text:#f7f9fd;--muted:#8e9db5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;min-height:100dvh;background:linear-gradient(180deg,#090d19,#0a0f1b);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:calc(8px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}.wrap{width:min(100%,1180px);margin:0 auto}.head{height:54px;display:flex;align-items:center;gap:12px;position:relative}.back{width:42px;height:42px;border-radius:13px;border:1px solid rgba(128,164,203,.2);background:#101a2b;color:#fff;font-size:26px;line-height:1}.title{font-size:20px;font-weight:950;letter-spacing:-.3px}.party-mark{margin-left:auto;width:46px;height:46px;border-radius:14px;object-fit:contain;background:rgba(174,99,255,.1);border:1px solid rgba(179,108,255,.24);padding:5px;filter:drop-shadow(0 6px 18px rgba(150,70,240,.25))}.loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#090d19;transition:opacity .25s ease}.loading.hide{opacity:0;pointer-events:none}.loading img{width:90px;height:90px;object-fit:contain}.loading-text{position:absolute;margin-top:135px;color:#8797b0;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.hero{position:relative;margin-top:10px;padding:26px;border-radius:25px;overflow:hidden;background:radial-gradient(circle at 75% 15%,rgba(179,108,255,.22),transparent 35%),linear-gradient(145deg,#141c2c,#0d1422);border:1px solid rgba(125,160,202,.17);box-shadow:0 20px 70px rgba(0,0,0,.28)}.hero:after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(179,108,255,.07),transparent 52%);animation:pulse 5s ease-in-out infinite;pointer-events:none}.hero h1{font-size:clamp(31px,5vw,54px);line-height:.98;font-weight:1000;letter-spacing:-1.8px;position:relative;z-index:1}.hero p{margin-top:10px;color:var(--muted);font-size:13px;font-weight:700;position:relative;z-index:1}.timer{margin-top:18px;display:flex;align-items:center;gap:10px;position:relative;z-index:1}.timer-box{min-width:110px;padding:12px 14px;border-radius:15px;background:rgba(179,108,255,.09);border:1px solid rgba(179,108,255,.2)}.timer-label{font-size:9px;color:#8e7aa8;text-transform:uppercase;letter-spacing:1.1px;font-weight:900}.timer-value{margin-top:3px;font-size:23px;font-weight:950;color:#e9d8ff;font-variant-numeric:tabular-nums}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section-title{font-size:18px;font-weight:950;letter-spacing:-.4px}.section-count{font-size:11px;color:#71829d;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.case-card,.market-card{position:relative;border-radius:20px;background:linear-gradient(145deg,#111a2a,#0c1422);border:1px solid var(--line);overflow:hidden;transition:.18s ease}.case-card{padding:15px;text-align:center;cursor:pointer}.case-card:hover,.market-card:hover{transform:translateY(-2px);border-color:rgba(179,108,255,.35)}.case-img{width:min(100%,210px);aspect-ratio:1/1;object-fit:contain;margin:0 auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.35))}.case-name{font-size:14px;font-weight:900;margin-top:3px}.case-price,.market-price{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:950}.case-price img,.market-price img{width:16px;height:16px;object-fit:contain}.market-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.market-card{padding:11px}.market-img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:13px;background:rgba(255,255,255,.025)}.market-name{font-size:11px;font-weight:850;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dbe4f1}.empty{padding:25px;border-radius:18px;text-align:center;background:rgba(255,255,255,.025);border:1px solid var(--line);color:#71829d;font-size:12px;font-weight:750}.error{color:#ff8099}.fade-up{animation:up .45s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.05);opacity:1}}
@media(max-width:700px){body{padding-top:calc(8px + 7vh + env(safe-area-inset-top));padding-left:11px;padding-right:11px}.head{height:54px}.hero{padding:21px 18px;border-radius:21px}.hero h1{font-size:32px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.case-card{padding:10px;border-radius:16px}.case-img{width:100%}.case-name{font-size:12px}.case-price{font-size:11px}.market-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.market-card{padding:9px;border-radius:16px}.market-name{font-size:10px}.market-price{font-size:11px}.timer-box{min-width:100px}}
@media(min-width:701px){.hero{padding:32px}.case-img{max-width:220px}}
</style>

<style id="event-special-mode-v4">
.special-mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.special-mode-card{position:relative;min-height:170px;border-radius:20px;overflow:hidden;border:1px solid rgba(179,108,255,.28);background:linear-gradient(145deg,#171329,#0d0b18);text-align:left;cursor:pointer;box-shadow:0 16px 38px rgba(0,0,0,.25);transition:transform .18s ease,border-color .18s ease}.special-mode-card:hover{transform:translateY(-2px);border-color:rgba(209,153,255,.5)}.special-mode-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(179,108,255,.28),transparent 42%),linear-gradient(110deg,rgba(8,5,18,.94),rgba(25,13,39,.35));z-index:0}.special-mode-card img{position:absolute;right:5%;bottom:-7px;width:175px;height:175px;object-fit:contain;z-index:1;filter:drop-shadow(0 14px 24px rgba(0,0,0,.48))}.special-mode-copy{position:absolute;left:18px;bottom:18px;z-index:2;max-width:62%}.special-mode-name{font-size:21px;font-weight:950;letter-spacing:-.4px}.special-mode-sub{margin-top:5px;font-size:10px;color:rgba(255,255,255,.52);font-weight:800;text-transform:uppercase;letter-spacing:.7px}.special-mode-badge{display:inline-flex;margin-bottom:7px;padding:5px 8px;border-radius:8px;background:rgba(179,108,255,.14);border:1px solid rgba(179,108,255,.2);color:#e6c9ff;font-size:9px;font-weight:900}@media(max-width:700px){.special-mode-grid{grid-template-columns:1fr}.special-mode-card{min-height:142px}.special-mode-card img{width:135px;height:135px}.special-mode-copy{left:14px;bottom:14px;max-width:64%}.special-mode-name{font-size:18px}}
</style>
<style id="event-interaction-v3">
.event-market-note{font-size:10px;color:rgba(255,255,255,.38);margin-top:6px}
.event-modal{position:fixed;inset:0;z-index:5000;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:.2s}
.event-modal.show{opacity:1;visibility:visible}
.event-modal-sheet{width:min(480px,100%);padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:linear-gradient(180deg,#293546,#1e2937);border:1px solid rgba(255,255,255,.08);box-shadow:0 -15px 50px rgba(0,0,0,.4)}

<body>
<div class="loading" id="loading"><img id="loadingGif" src="/static/img/loading.gif" alt=""><div class="loading-text">Загрузка</div></div>
<div class="wrap">
<header class="head"><button class="back" onclick="history.back()" aria-label="Назад">‹</button><div class="title" id="eventTitle">Witch Hat Party</div><img class="party-mark" id="partyMark" src="/static/img/witchhat.png" alt="Party"></header>
<section class="hero"><h1>Witch Hat Party</h1><p>Специальное событие</p><div class="timer"><div class="timer-box"><div class="timer-label">Ивент идёт</div><div class="timer-value" id="timer">00:00:00</div></div></div><div class="witch-hamsters" aria-hidden="true"><img class="witch-hamster witch-hamster-1" src="/static/img/hamster1.png" alt=""><img class="witch-hamster witch-hamster-2" src="/static/img/hamster2.png" alt=""></div></section>
<main id="content"></main>
</div>
<script>
const $=id=>document.getElementById(id);
let eventData=null, left=0;
function fmt(sec){sec=Math.max(0,Number(sec||0));let d=Math.floor(sec/86400);let h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return (d?d+'д ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function imgSrc(v){return v||'/static/img/gift.png'}
function price(v){return Number(v||0).toFixed(2)}
function resolveLoading(name){let n=String(name||'loading.gif').trim();if(!n)n='loading.gif';if(n.startsWith('/'))return n;if(n.includes('/'))return '/static/'+n.replace(/^\/+/, '');return '/static/img/'+n}
function caseApi(id){
  var sid=String(id);
  var url=(sid==='seasonal')?('/api/cases/by-slug/seasonal'):('/api/cases/'+encodeURIComponent(sid));
  return fetch(url,{cache:'no-store'}).then(function(r){return r.json()});
}
function casePrice(c){
  var raw=Number(c&&c.cost||0);
  if(c&&c.seasonal) return raw;
  return c&&c.cost_type==='ton' ? raw : raw/100;
}
function renderSections(sections){
  const root=$('content');root.innerHTML='';let delay=0;
  const list=Array.isArray(sections)?sections.slice():[];
  // Event page always starts with its special modes. Ghost Road is a mode of Witch Hat Party,
  // not a separate event/page.
  if(!list.some(function(x){return x&&x.type==='mode';})){
    list.unshift({id:'special_mode',title:'Особые режимы',type:'mode',items:[{id:'ghost_road_mode',name:'Ghost Road',image:'/static/img/ghost_road.png',path:'/event/witch-hat-party?mode=ghost-road',visible:true}]});
  }else{
    var modeSec=list.find(function(x){return x&&x.type==='mode'});
    if(modeSec){modeSec.title='Особые режимы';modeSec.items=Array.isArray(modeSec.items)?modeSec.items:[];
      if(!modeSec.items.some(function(x){return x&&x.id==='ghost_road_mode'})) modeSec.items.unshift({id:'ghost_road_mode',name:'Ghost Road',image:'/static/img/ghost_road.png',path:'/event/witch-hat-party?mode=ghost-road',visible:true});
    }
  }
  // Keep only the intended Event order: special modes -> cases -> market -> other configured sections.
  list.sort(function(a,b){var rank=function(x){var t=String(x&&x.type||'');return t==='mode'?0:(t==='cases'?1:(t==='market'?2:3))};return rank(a)-rank(b)});
  for(const sec of list){
    if(!sec || sec.visible===false) continue;
    const wrap=document.createElement('section');wrap.className='section fade-up';wrap.style.animationDelay=(delay++)*60+'ms';
    const h=document.createElement('div');h.className='section-head';h.innerHTML='<div class="section-title"></div>';h.querySelector('.section-title').textContent=sec.title||'Раздел';wrap.appendChild(h);
    const grid=document.createElement('div');
    if(sec.type==='mode'){
      grid.className='special-mode-grid';
      const items=(sec.items||[]).filter(function(x){return x&&x.visible!==false});
      if(!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Особые режимы пока не добавлены</div>'}
      items.forEach(function(it){
        const card=document.createElement('button');card.type='button';card.className='special-mode-card';
        card.innerHTML='<img loading="lazy"><div class="special-mode-copy"><span class="special-mode-badge">УНИКАЛЬНОЕ СОБЫТИЕ</span><div class="special-mode-name"></div><div class="special-mode-sub">Особый режим Witch Hat Party</div></div>';
        card.querySelector('img').src=imgSrc(it.image||'/static/img/ghost_road.png');card.querySelector('.special-mode-name').textContent=it.name||'Ghost Road';
        card.onclick=function(){
          const path=String(it.path||'').trim();
          if(path) location.href=path;
        };
        grid.appendChild(card);
      });
    }else if(sec.type==='cases'){
      grid.className='cards';
      const ids=(sec.case_ids||[]).map(String);
      if(!ids.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Кейсы события пока не добавлены</div>';}
      else Promise.all(ids.map(caseApi)).then(ds=>{
        grid.innerHTML='';
        ds.forEach(function(d){
          const c=d&&d.success?d.case:null;if(!c)return;
          const card=document.createElement('button');card.className='case-card';card.type='button';
          card.innerHTML='<img class="case-img" loading="lazy"><div class="case-name"></div><div class="case-price"><img src="/static/img/ton.png"><span></span> GRAM</div>';
          card.querySelector('.case-img').src=imgSrc(c.image||c.png);card.querySelector('.case-name').textContent=c.name||'Кейс';card.querySelector('.case-price span').textContent=price(casePrice(c));
          card.onclick=function(){location.href='/cases?case='+encodeURIComponent(c.slug||c.id)};
          grid.appendChild(card);
        });
        if(!grid.children.length)grid.innerHTML='<div class="empty error" style="grid-column:1/-1">Не удалось загрузить кейсы события</div>';
      }).catch(function(){grid.innerHTML='<div class="empty error" style="grid-column:1/-1">Не удалось загрузить кейсы события</div>'});
    }else if(sec.type==='market'){
      grid.className='market-grid';
      fetch('/api/events/witch-hat-party/market?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
        grid.innerHTML='';const items=d.items||[];
        if(!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Подарки пока не найдены</div>';return;}
        items.forEach(function(it){
          const card=document.createElement('button');card.type='button';card.className='market-card';
          card.innerHTML='<img class="market-img" loading="lazy"><div class="market-name"></div><div class="market-price"><img src="/static/img/ton.png"><span></span></div><div class="event-market-note">1 шт. · Подробнее</div>';
          card.querySelector('.market-img').src=imgSrc(it.image);card.querySelector('.market-name').textContent=it.name||'Подарок';card.querySelector('.market-price span').textContent=price(it.price_gram||it.price_ton)+' GRAM';
          card.onclick=function(){openEventGiftModal(it)};grid.appendChild(card);
        });
      }).catch(function(){grid.innerHTML='<div class="empty error" style="grid-column:1/-1">Не удалось загрузить маркет</div>'});
    }else{
      grid.className='market-grid';
    }
    wrap.appendChild(grid);root.appendChild(wrap);
  }
}

function openEventGiftModal(item){
  var overlay=$('eventGiftModal');if(!overlay)return;
  overlay.dataset.url=item.url||item.gift_url||'';overlay.dataset.item=JSON.stringify(item);
  $('eventGiftModalTitle').textContent=item.name||'Подарок';
  $('eventGiftModalDesc').textContent='Коллекционный подарок · в наличии 1 штука';
  $('eventGiftModalPrice').textContent=price(item.price_gram||item.price_ton)+' GRAM';
  var media=$('eventGiftModalMedia');media.innerHTML='';
  if(item.animation){var player=document.createElement('dotlottie-player');player.setAttribute('src',item.animation);player.setAttribute('background','transparent');player.setAttribute('speed','1');player.setAttribute('loop','');player.setAttribute('autoplay','');media.appendChild(player);}
  else {var im=document.createElement('img');im.src=imgSrc(item.image);media.appendChild(im)}
  overlay.classList.add('show');
}
function closeEventGiftModal(){var o=$('eventGiftModal');if(o)o.classList.remove('show')}
async function buyEventGift(){
  var o=$('eventGiftModal');if(!o)return;
  var item=JSON.parse(o.dataset.item||'{}');var user=null;
  try{user=await telegramAuth()}catch(e){}
  if(!user||!user.id){alert('Откройте приложение через Telegram');return}
  var btn=$('eventBuyBtn');btn.disabled=true;btn.textContent='Покупка…';
  try{
    var r=await fetch('/api/events/witch-hat-party/market/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.id,gift_url:item.url||item.gift_url})});
    var d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Ошибка покупки');
    closeEventGiftModal();alert('Подарок куплен и добавлен в инвентарь');
    document.querySelectorAll('.market-card').forEach(function(card){if(card.querySelector('.market-name')&&card.querySelector('.market-name').textContent===item.name)card.remove()});
  }catch(e){alert(e.message||'Ошибка покупки')}finally{btn.disabled=false;btn.textContent='Купить'}
}

async function load(){try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{if(typeof Telegram.WebApp.requestFullscreen==='function')Telegram.WebApp.requestFullscreen()}catch(e){}}const r=await fetch('/api/events/witch-hat-party?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();eventData=d.event||{};if(eventData.name)$('eventTitle').textContent=eventData.name;if(eventData.image)$('partyMark').src=eventData.image;left=Number(eventData.remaining_seconds||0);if(eventData.loading_gif)$('loadingGif').src=resolveLoading(eventData.loading_gif);$('timer').textContent=fmt(left);if(!eventData.active){$('content').innerHTML='<section class="section"><div class="empty">Ивент сейчас не активен</div></section>'}else{renderSections(eventData.sections||[])}setTimeout(()=>$('loading').classList.add('hide'),180)}catch(e){$('content').innerHTML='<section class="section"><div class="empty error">Не удалось загрузить ивент</div></section>';setTimeout(()=>$('loading').classList.add('hide'),300)}}
setInterval(()=>{if(left>0){left--;if($('timer'))$('timer').textContent=fmt(left)}},1000);load();
</script>
